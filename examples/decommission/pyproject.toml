[project]
name = "rvav-example-decommission"
version = "1.0.0"
description = "Example custom workflow for rvav: decommission an application over several days, with an approval"
requires-python = ">=3.12"
dependencies = [
    "rvav-workflows>=1.0.0",
    "temporalio>=1.34.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.uv]
package = false

[tool.uv.sources]
rvav-workflows = { path = "../../sdk/python", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = ["."]
