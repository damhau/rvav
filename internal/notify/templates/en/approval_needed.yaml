subject: |-
  {{if eq .Approval.Why "delegated"}}Approval delegated to you{{else if eq .Approval.Why "escalated"}}Approval escalated to you{{else}}Approval needed{{end}}: {{.Request.Title}} ({{.Request.Number}})
text: |-
  {{.Request.Number}} waits for your decision{{if .Approval.Name}} ({{.Approval.Name}}){{end}}.{{if .Approval.Reasons}}
  Why it needs approval: {{join .Approval.Reasons "; "}}{{end}}{{if and .Body (ne .Body (join .Approval.Reasons "; "))}}
  {{.Body}}{{end}}
html: |-
  <p><strong>{{.Request.Number}}</strong> waits for your decision{{if .Approval.Name}} ({{.Approval.Name}}){{end}}.</p>{{if .Approval.Reasons}}
  <p style="margin:8px 0">Why it needs approval:</p><ul style="margin:0;padding-left:20px">{{range .Approval.Reasons}}<li>{{.}}</li>{{end}}</ul>{{end}}{{if and .Body (ne .Body (join .Approval.Reasons "; "))}}
  <p style="margin:8px 0;color:#59636e">{{.Body}}</p>{{end}}
