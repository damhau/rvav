subject: |-
  Rejected: {{.Request.Title}} ({{.Request.Number}})
text: |-
  Your request {{.Request.Number}} was rejected. Nothing was built or changed.{{if .Body}}
  Comments: {{.Body}}{{end}}
html: |-
  <p>Your request <strong>{{.Request.Number}}</strong> was rejected. Nothing was built or changed.</p>{{if .Body}}
  <p style="margin:8px 0"><span style="color:#59636e">Comments:</span> {{.Body}}</p>{{end}}
