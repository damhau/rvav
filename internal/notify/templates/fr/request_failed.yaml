subject: |-
  Échec : {{.Request.Title}} ({{.Request.Number}})
text: |-
  {{.Request.Number}} a échoué.{{if .Body}}
  Ce qui n'a pas marché : {{.Body}}{{end}}
  Ouvrez-la pour voir l'étape en échec, puis relancez-la ou annulez ce qu'elle a fait.
html: |-
  <p><strong>{{.Request.Number}}</strong> a échoué.</p>{{if .Body}}
  <p style="margin:8px 0"><span style="color:#59636e">Ce qui n'a pas marché :</span> {{.Body}}</p>{{end}}
  <p style="margin:8px 0">Ouvrez-la pour voir l'étape en échec, puis relancez-la ou annulez ce qu'elle a fait.</p>
