# The same gate as `make check`, split into jobs that run in parallel, so
# that every push is checked in about two minutes: the end-to-end tests in
# three shards. The browser tests (browser.yml) and the images' scan
# (security.yml) run daily and by hand at the end of a milestone; the
# compose stack checks (deploy/smoke.sh, pnpm e2e:stack) run locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Commits go straight to main: check every one of them, cancel only
# superseded pull request runs.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make vet
      - run: make gen-check
      - run: make test

  e2e:
    name: End-to-end (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The S10 acceptance test runs the Python example worker (uv).
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: A third of the end-to-end tests (embedded PostgreSQL, vcsim, a Temporal dev server)
        run: make test-e2e-shard SHARD=${{ matrix.shard }} TOTAL=3

  ansible:
    name: Ansible collection
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: make test-ansible

  python:
    name: Custom workflow helpers (Python)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: make test-python

  chart:
    name: Helm chart
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: make lint-chart

  # The web image's nginx, in a real nginx: the page's Content-Security-Policy
  # follows the identity provider the API says (ADR-0030).
  nginx:
    name: Web nginx
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: make check-nginx

  spec:
    name: API spec
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: make lint-spec

  web:
    name: Web app
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated API types are current
        run: pnpm gen:api && git diff --exit-code -- src/lib/api/schema.d.ts
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      # The browser tests run daily: browser.yml.

