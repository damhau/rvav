# Connects the stack to a test AWX (deploy/awx/README.md) instead of the
# fake AWX:
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.awx.yml up --build -d
#
# rvav reaches AWX through the port it publishes on the host
# (RVAV_AWX_URL). AWX reaches rvav's API, for the rvav inventory, at
# http://rvav-api:8080: a small gateway is the only rvav container on the
# AWX's Docker network. rvav's own services stay off that network, where
# names such as "postgres" may belong to the AWX's stack.
# RVAV_AWX_TOKEN is required (deploy/.env); set RVAV_AWX_INVENTORY_SOURCE_ID
# to what `rvav awx-bootstrap` printed.
x-awx-env: &awx-env
  RVAV_FAKE_AWX: "0"
  RVAV_AWX_URL: ${RVAV_AWX_URL:-http://host.docker.internal:8052}
  RVAV_AWX_TOKEN: ${RVAV_AWX_TOKEN:?set RVAV_AWX_TOKEN to a token of the test AWX}
  RVAV_AWX_ORGANIZATION: ${RVAV_AWX_ORGANIZATION:-rvav-test}
  RVAV_AWX_INVENTORY_SOURCE_ID: ${RVAV_AWX_INVENTORY_SOURCE_ID:-0}
  RVAV_AWX_INSECURE: ${RVAV_AWX_INSECURE:-0}

networks:
  awx:
    name: ${RVAV_AWX_NETWORK:-compose_default}
    external: true

services:
  api:
    environment: *awx-env
    extra_hosts: ["host.docker.internal:host-gateway"]
  worker:
    environment: *awx-env
    extra_hosts: ["host.docker.internal:host-gateway"]
  sync:
    environment: *awx-env
    extra_hosts: ["host.docker.internal:host-gateway"]

  # Forwards to the api container by its container name, which only rvav's
  # network has.
  rvav-awx-gateway:
    image: nginx:1.27-alpine
    volumes: ["./awx/gateway.conf:/etc/nginx/conf.d/default.conf:ro"]
    networks:
      default: {}
      awx: { aliases: [rvav-api] }
    depends_on:
      api: { condition: service_healthy }
