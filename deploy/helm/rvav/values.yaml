# rvav on Kubernetes (ADR-0009, docs/operations/installation.md). Every
# setting is an environment variable: `config` for the plain ones, the
# Secret for passwords and keys (docs/operations/configuration.md lists
# them all).

image:
  # The Go processes: api, worker, sync and migrate.
  repository: ghcr.io/damhau/rvav
  tag: ""  # the chart's appVersion when empty
  pullPolicy: IfNotPresent
webImage:
  repository: ghcr.io/damhau/rvav-web
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Plain settings (a ConfigMap): those set at install only
# (configuration.md's "Set in: install"). The identity provider, vCenter,
# AWX, EfficientIP, NSX, Git, vRA and the notification channels are set in
# Administration › Integrations (ADR-0030). RVAV_AUTH_MODE is always oidc:
# dev authentication can't be enabled from the chart.
config:
  RVAV_PUBLIC_URL: https://rvav.corp.example
  RVAV_TEMPORAL_ADDRESS: temporal-frontend.temporal.svc.cluster.local:7233
  RVAV_TEMPORAL_NAMESPACE: rvav
  # An integration's variables may still be set here (and its password in
  # the Secret): each wins over Administration and locks its field.
  # RVAV_OIDC_ISSUER: https://sso.corp.example/realms/rvav
  # RVAV_VCENTER_URL: https://vc01.corp.example/sdk
  # RVAV_VCENTER_USERNAME: svc-rvav@vsphere.local
  # NSX's principal identity, from nsx.certSecret below, is set in a file:
  # RVAV_NSX_CERT_FILE: /etc/rvav/nsx/tls.crt
  # RVAV_NSX_KEY_FILE: /etc/rvav/nsx/tls.key

# Passwords and keys (a Secret). Leave `create` false and name
# `existingSecret` to use a Secret made elsewhere (sealed-secrets, External
# Secrets...) with the same keys.
secret:
  create: true
  existingSecret: ""
  env:
    RVAV_DATABASE_URL: ""
    RVAV_SECRETS_KEY: ""
    # The local administrator's first password (ADR-0030), changed at the
    # first sign-in; empty: the API generates one and logs it once.
    RVAV_ADMIN_PASSWORD: ""
    # With an integration's variables in `config`, its password or token:
    # RVAV_VCENTER_PASSWORD: ""

# NSX's principal identity (ADR-0028): a kubernetes.io/tls Secret, mounted
# read only at /etc/rvav/nsx (tls.crt, tls.key) in api, worker and sync.
nsx:
  certSecret: ""

web:
  replicas: 2
  # The browser signs in with the identity provider the API says (set in
  # Administration, or config.RVAV_OIDC_*). These win over it in the browser
  # (RVAV_WEB_OIDC_*, /config.js) and lock their fields; empty: the API's.
  oidcAuthority: ""
  oidcClientId: ""
  oidcScope: ""
  # Origins the browser may load the VM console's SDK from (the origins of
  # config.RVAV_WMKS_SDK_URLS), for the Content-Security-Policy.
  scriptSources: ""
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 128Mi }

api:
  replicas: 2
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits: { memory: 512Mi }
worker:
  replicas: 2
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits: { memory: 512Mi }
# One active, the others wait for its lock (S14.1).
sync:
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }

# Every rvav pod applies the database migrations as it starts (one at a
# time, under a lock), in an init container.
migrate:
  # Also load the demo catalogue and users (not for production).
  seed: false

ingress:
  enabled: true
  className: ""
  host: rvav.corp.example
  # For ingress-nginx: live updates unbuffered, the console's WebSocket
  # and long vRA imports kept open, vra-export files up to 64 MB. Other
  # controllers ignore these and need their own (installation.md).
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-body-size: 64m
  # The console's WebSocket stays open while used.
  tls:
    secretName: ""

podDisruptionBudget:
  enabled: true

serviceAccount:
  create: true
  name: ""

podSecurityContext:
  runAsNonRoot: true
  seccompProfile: { type: RuntimeDefault }
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: [ALL] }

nodeSelector: {}
tolerations: []
# Replicas on different nodes when they can be.
spreadAcrossNodes: true

# Prometheus metrics (S14.5): every rvav pod serves /metrics on 9090 (and
# has prometheus.io annotations). With the Prometheus operator, PodMonitors
# and the alerts as a PrometheusRule.
metrics:
  podMonitor: false
  prometheusRule: false
