# rvav on Kubernetes (ADR-0009, docs/operations/installation.md). Every
# setting is an environment variable: `config` for the plain ones, the
# Secret for passwords and keys (docs/operations/configuration.md lists
# them all).

image:
  # The Go processes: api, worker, sync and migrate.
  repository: ghcr.io/damhau/rvav
  tag: ""  # the chart's appVersion when empty
  pullPolicy: IfNotPresent
webImage:
  repository: ghcr.io/damhau/rvav-web
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Plain settings (a ConfigMap). RVAV_AUTH_MODE is always oidc: dev
# authentication can't be enabled from the chart.
config:
  RVAV_PUBLIC_URL: https://rvav.corp.example
  RVAV_OIDC_ISSUER: https://sso.corp.example/realms/rvav
  RVAV_OIDC_CLIENT_ID: rvav
  RVAV_TEMPORAL_ADDRESS: temporal-frontend.temporal.svc.cluster.local:7233
  RVAV_TEMPORAL_NAMESPACE: rvav
  RVAV_VCENTER_URL: https://vc01.corp.example/sdk
  RVAV_VCENTER_USERNAME: svc-rvav@vsphere.local
  RVAV_VCENTER_NAME: vc01.corp.example
  RVAV_EFFICIENTIP_URL: https://ipam.corp.example
  RVAV_EFFICIENTIP_USERNAME: rvav
  RVAV_EFFICIENTIP_DNS_SERVER: ns1.corp.example
  RVAV_AWX_URL: https://awx.corp.example
  RVAV_AWX_ORGANIZATION: rvav
  # The vRA the importer reads, while projects move from it (ADR-0027);
  # remove once vRA is switched off.
  # RVAV_VRA_URL: https://vra.corp.example
  # RVAV_VRA_USERNAME: svc-rvav-import
  # RVAV_VRA_DOMAIN: corp.example

# Passwords and keys (a Secret). Leave `create` false and name
# `existingSecret` to use a Secret made elsewhere (sealed-secrets, External
# Secrets...) with the same keys.
secret:
  create: true
  existingSecret: ""
  env:
    RVAV_DATABASE_URL: ""
    RVAV_SECRETS_KEY: ""
    RVAV_VCENTER_PASSWORD: ""
    RVAV_EFFICIENTIP_PASSWORD: ""
    RVAV_AWX_TOKEN: ""
    # The vRA importer's account: an API token, or a user's password.
    RVAV_VRA_TOKEN: ""
    RVAV_VRA_PASSWORD: ""

# The web app's sign-in, read by the browser at run time (/config.js).
web:
  replicas: 2
  oidcAuthority: https://sso.corp.example/realms/rvav
  oidcClientId: rvav
  oidcScope: openid profile email
  # Origins the browser may load the VM console's SDK from (the origins of
  # config.RVAV_WMKS_SDK_URLS), for the Content-Security-Policy.
  scriptSources: ""
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 128Mi }

api:
  replicas: 2
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits: { memory: 512Mi }
worker:
  replicas: 2
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits: { memory: 512Mi }
# One active, the others wait for its lock (S14.1).
sync:
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }

# Every rvav pod applies the database migrations as it starts (one at a
# time, under a lock), in an init container.
migrate:
  # Also load the demo catalogue and users (not for production).
  seed: false

ingress:
  enabled: true
  className: ""
  host: rvav.corp.example
  # For ingress-nginx: live updates unbuffered, the console's WebSocket
  # and long vRA imports kept open, vra-export files up to 64 MB. Other
  # controllers ignore these and need their own (installation.md).
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-body-size: 64m
  # The console's WebSocket stays open while used.
  tls:
    secretName: ""

podDisruptionBudget:
  enabled: true

serviceAccount:
  create: true
  name: ""

podSecurityContext:
  runAsNonRoot: true
  seccompProfile: { type: RuntimeDefault }
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: [ALL] }

nodeSelector: {}
tolerations: []
# Replicas on different nodes when they can be.
spreadAcrossNodes: true

# Prometheus metrics (S14.5): every rvav pod serves /metrics on 9090 (and
# has prometheus.io annotations). With the Prometheus operator, PodMonitors
# and the alerts as a PrometheusRule.
metrics:
  podMonitor: false
  prometheusRule: false
