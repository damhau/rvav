{{ include "rvav.deployment" (dict "root" . "component" "api") }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "rvav.labels" . | nindent 4 }}
spec:
  selector: {{- include "rvav.selector" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: http }
