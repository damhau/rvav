# rvav's API for a test AWX on its own Docker network
# (deploy/docker-compose.awx.yml). The api container is named by its
# container name, and looked up again when it is recreated.
server {
    listen 8080;
    resolver 127.0.0.11 valid=10s ipv6=off;
    location / {
        set $api http://rvav-api-1:8080;
        proxy_pass $api;
        proxy_set_header Host $host;
    }
}
