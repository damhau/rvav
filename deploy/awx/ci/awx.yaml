# AWX 24.6.1 (awx-operator 2.19.1's), its web service on node port 30080.
apiVersion: v1
kind: Secret
metadata: { name: awx-admin-password, namespace: awx }
stringData: { password: rvav-ci-only }
---
apiVersion: awx.ansible.com/v1beta1
kind: AWX
metadata: { name: awx, namespace: awx }
spec:
  service_type: nodeport
  nodeport_port: 30080
  admin_user: admin
  admin_password_secret: awx-admin-password
  # Small enough for a CI runner.
  web_resource_requirements: { requests: { cpu: 100m, memory: 256Mi } }
  task_resource_requirements: { requests: { cpu: 100m, memory: 256Mi } }
  ee_resource_requirements: { requests: { cpu: 100m, memory: 128Mi } }
