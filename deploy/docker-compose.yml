# Local development stack: docker compose -f deploy/docker-compose.yml up --build
#
#   Web app        http://localhost:3000          (dev auth by default)
#   API            http://localhost:8080/api/v1   (dev auth by default)
#   Temporal UI    http://localhost:8233
#   Keycloak       http://localhost:8081          (admin / admin, realm "rvav")
#   vcsim          https://localhost:8989/sdk     (user / pass)
#   Mailpit        http://localhost:8025          (the emails rvav sends)
#
# Image tags are pinned; check them against the registries when upgrading.
# Host ports can be changed with RVAV_*_PORT variables, in the shell or in
# deploy/.env (for example RVAV_API_PORT=18080 when 8080 is taken). They are
# published on 127.0.0.1 only: with dev authentication anyone who reaches the
# API is trusted. RVAV_BIND_ADDRESS=0.0.0.0 opens them, with RVAV_AUTH_MODE=oidc.

name: rvav

x-rvav-env: &rvav-env
  RVAV_DATABASE_URL: postgres://rvav:rvav@postgres:5432/rvav?sslmode=disable
  RVAV_AUTH_MODE: ${RVAV_AUTH_MODE:-dev}
  # Who dev sign-in is (a seeded user: lmartin, mkeller for an administrator, tnguyen, ...).
  RVAV_DEV_USER: ${RVAV_DEV_USER:-lmartin}
  # A development stack: dev authentication is allowed unless set to "" here.
  RVAV_ALLOW_DEV_AUTH: ${RVAV_ALLOW_DEV_AUTH-1}
  # Tokens carry the issuer the browser sees; the API discovers Keycloak
  # inside the compose network.
  RVAV_OIDC_ISSUER: http://localhost:${RVAV_KEYCLOAK_PORT:-8081}/realms/rvav
  RVAV_OIDC_DISCOVERY_URL: http://keycloak:8080/realms/rvav
  RVAV_OIDC_CLIENT_ID: rvav
  RVAV_CORS_ORIGINS: ${RVAV_CORS_ORIGINS:-http://localhost:5173}
  RVAV_TEMPORAL_ADDRESS: temporal:7233
  RVAV_VCENTER_URL: https://vcsim:8989/sdk
  RVAV_VCENTER_USERNAME: user
  RVAV_VCENTER_PASSWORD: pass
  RVAV_VCENTER_INSECURE: "1"
  # The efficientip service is a fake SOLIDserver; rvav talks to it with the
  # real client.
  RVAV_EFFICIENTIP_URL: http://efficientip:8080
  RVAV_EFFICIENTIP_USERNAME: rvav
  RVAV_EFFICIENTIP_PASSWORD: rvav
  RVAV_EFFICIENTIP_DNS_SERVER: ns1.corp.example
  # A fake NSX Manager (ADR-0028), the nsx service below.
  RVAV_NSX_URL: ${RVAV_NSX_URL-http://nsx:8080}
  RVAV_NSX_USERNAME: ${RVAV_NSX_USERNAME:-rvav-nsx}
  RVAV_NSX_PASSWORD: ${RVAV_NSX_PASSWORD:-nsx}
  RVAV_FAKE_AWX: "1"
  RVAV_FAKE_AWX_FAIL_TASK: ${RVAV_FAKE_AWX_FAIL_TASK:-}
  RVAV_FAKE_EFFICIENTIP_LATENCY: ${RVAV_FAKE_EFFICIENTIP_LATENCY:-}
  # A development key for stored secrets (ADR-0019); never use it elsewhere.
  RVAV_SECRETS_KEY: ${RVAV_SECRETS_KEY:-ZGV2LW9ubHktc2VjcmV0cy1rZXktMzItYnl0ZXMhISE=}
  RVAV_REST_SOURCE_HOSTS: ${RVAV_REST_SOURCE_HOSTS:-}
  RVAV_WEBHOOK_HOSTS: ${RVAV_WEBHOOK_HOSTS:-}
  # The vRA importer reads this vRA (ADR-0027); `rvav fake-vra` serves one.
  RVAV_VRA_URL: ${RVAV_VRA_URL:-}
  RVAV_VRA_TOKEN: ${RVAV_VRA_TOKEN:-}
  RVAV_VRA_USERNAME: ${RVAV_VRA_USERNAME:-}
  RVAV_VRA_PASSWORD: ${RVAV_VRA_PASSWORD:-}
  RVAV_VRA_DOMAIN: ${RVAV_VRA_DOMAIN:-}
  RVAV_VRA_INSECURE: ${RVAV_VRA_INSECURE:-}
  # Notifications (ADR-0023): emails go to Mailpit; links open the web app.
  RVAV_PUBLIC_URL: ${RVAV_PUBLIC_URL:-http://localhost:3000}
  RVAV_SMTP_HOST: ${RVAV_SMTP_HOST-mailpit}
  RVAV_SMTP_PORT: ${RVAV_SMTP_PORT:-1025}
  RVAV_SMTP_TLS: ${RVAV_SMTP_TLS:-none}
  RVAV_SMTP_FROM: ${RVAV_SMTP_FROM:-rvav <rvav@corp.example>}

services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: rvav
      POSTGRES_PASSWORD: rvav
      POSTGRES_DB: rvav
    ports: ["${RVAV_BIND_ADDRESS:-127.0.0.1}:${RVAV_POSTGRES_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rvav -d rvav"]
      interval: 2s
      retries: 30

  temporal:
    # auto-setup creates the temporal and temporal_visibility databases.
    image: temporalio/auto-setup:1.25.2
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: rvav
      POSTGRES_PWD: rvav
      POSTGRES_SEEDS: postgres
    ports: ["${RVAV_BIND_ADDRESS:-127.0.0.1}:${RVAV_TEMPORAL_PORT:-7233}:7233"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      # Ready once auto-setup has created the default namespace.
      test: ["CMD", "temporal", "operator", "namespace", "describe", "-n", "default", "--address", "temporal:7233"]
      interval: 2s
      start_period: 10s
      retries: 60

  temporal-ui:
    image: temporalio/ui:2.31.2
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports: ["${RVAV_BIND_ADDRESS:-127.0.0.1}:${RVAV_TEMPORAL_UI_PORT:-8233}:8080"]
    depends_on:
      temporal: { condition: service_healthy }

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:${RVAV_KEYCLOAK_PORT:-8081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports: ["${RVAV_BIND_ADDRESS:-127.0.0.1}:${RVAV_KEYCLOAK_PORT:-8081}:8080"]
    volumes: ["./keycloak:/opt/keycloak/data/import:ro"]
    healthcheck:
      # No curl in the image: ask the management port with bash.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 3s
      start_period: 20s
      retries: 40

  mailpit:
    # Catches the emails rvav sends: SMTP on 1025, a web UI on 8025.
    image: axllent/mailpit:v1.27.10
    ports: ["${RVAV_BIND_ADDRESS:-127.0.0.1}:${RVAV_MAILPIT_PORT:-8025}:8025"]

  vcsim:
    image: vmware/vcsim:v0.52.0
    command: ["-l", "0.0.0.0:8989"]
    ports: ["${RVAV_BIND_ADDRESS:-127.0.0.1}:${RVAV_VCSIM_PORT:-8989}:8989"]

  # One-shot jobs: schema and seed data, then the GVA inventory in vcsim.
  migrate:
    build: { context: .., dockerfile: Dockerfile }
    command: ["migrate", "-seed"]
    environment: *rvav-env
    depends_on:
      postgres: { condition: service_healthy }

  vcsim-bootstrap:
    build: { context: .., dockerfile: Dockerfile }
    command: ["vcsim-bootstrap"]
    environment: *rvav-env
    restart: on-failure
    depends_on: [vcsim]

  # A fake SOLIDserver with the subnets of the seeded network mappings.
  efficientip:
    build: { context: .., dockerfile: Dockerfile }
    command: ["fake-efficientip"]
    environment: *rvav-env
    restart: on-failure
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "rvav", "healthcheck"]
      interval: 2s
      retries: 30

  # It makes a segment's port group in vcsim, as NSX does in vCenter.
  nsx:
    build: { context: .., dockerfile: Dockerfile }
    command: ["fake-nsx"]
    environment: *rvav-env
    restart: on-failure
    depends_on:
      vcsim: { condition: service_started }
    healthcheck:
      test: ["CMD", "rvav", "healthcheck"]
      interval: 2s
      retries: 30

  api:
    build: { context: .., dockerfile: Dockerfile }
    command: ["api"]
    environment: *rvav-env
    ports: ["${RVAV_BIND_ADDRESS:-127.0.0.1}:${RVAV_API_PORT:-8080}:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      efficientip: { condition: service_healthy }
      nsx: { condition: service_healthy }
      temporal: { condition: service_healthy }
    healthcheck:
      # With Keycloak sign-in, ready once Keycloak answers too.
      test: ["CMD", "rvav", "healthcheck"]
      interval: 2s
      retries: 60

  worker:
    build: { context: .., dockerfile: Dockerfile }
    command: ["worker"]
    environment: *rvav-env
    restart: on-failure
    depends_on:
      migrate: { condition: service_completed_successfully }
      efficientip: { condition: service_healthy }
      nsx: { condition: service_healthy }
      vcsim-bootstrap: { condition: service_completed_successfully }
      temporal: { condition: service_healthy }

  sync:
    build: { context: .., dockerfile: Dockerfile }
    command: ["sync"]
    environment: *rvav-env
    restart: on-failure
    depends_on:
      migrate: { condition: service_completed_successfully }
      efficientip: { condition: service_healthy }
      nsx: { condition: service_healthy }
      vcsim-bootstrap: { condition: service_completed_successfully }

  # The web app, served by nginx, which proxies /api to the api service.
  # Sign-in follows RVAV_AUTH_MODE; it is baked in at build time, so after
  # changing it run: docker compose -f deploy/docker-compose.yml up --build web
  web:
    build:
      context: ../web
      args:
        VITE_AUTH_MODE: ${RVAV_AUTH_MODE:-dev}
        VITE_OIDC_AUTHORITY: http://localhost:${RVAV_KEYCLOAK_PORT:-8081}/realms/rvav
        VITE_OIDC_CLIENT_ID: rvav
    environment:
      RVAV_API_UPSTREAM: http://api:8080
    ports: ["${RVAV_BIND_ADDRESS:-127.0.0.1}:${RVAV_WEB_PORT:-3000}:8080"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 2s
      retries: 30

volumes:
  pgdata:
