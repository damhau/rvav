[project]
name = "rvav-workflows"
version = "1.0.0"
description = "Helpers for custom Temporal workflows run by rvav (contract rvav.v1, ADR-0022)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "temporalio>=1.34.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rvav_workflows"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
