          required: [channel, locale]
          properties:
            channel: { $ref: "#/components/schemas/TemplateChannel" }
            locale: { $ref: "#/components/schemas/TemplateLocale" }
    NotificationTemplate:
      allOf:
        - $ref: "#/components/schemas/TemplateParts"
        - type: object
          required: [kind, channel, locale, edited, default]
          properties:
            kind: { $ref: "#/components/schemas/NotificationKind" }
            channel: { $ref: "#/components/schemas/TemplateChannel" }
            locale: { $ref: "#/components/schemas/TemplateLocale" }
            edited: { type: boolean, description: "The template is an administrator's; false: it is the built-in one." }
            default: { $ref: "#/components/schemas/TemplateParts" }
            updated_at: { type: string, format: date-time }
            updated_by: { type: string }
    NotificationTemplatePreview:
      type: object
      required: [subject, text]
      properties:
        subject: { type: string }
        text: { type: string, description: "An email's whole text part; a card's or a message's text." }
        html: { type: string, description: "An email's whole HTML, its logo inline." }
        card: { type: object, additionalProperties: true, description: The Teams Adaptive Card. }
        blocks:
          type: array
          description: The Slack Block Kit blocks.
          items: { type: object, additionalProperties: true }
    LogoVariant:
      type: string
      enum: [light, dark]
      x-enum-varnames: [LogoLight, LogoDark]
    AccentPalette:
      type: object
      required: [accent, accent_fg, accent_soft]
      description: An accent and the colours that go with it in a theme.
      properties:
        accent: { type: string, description: "Links, buttons and focus rings.", examples: ["#0e6488"] }
        accent_fg: { type: string, description: Text on the accent. }
        accent_soft: { type: string, description: "A tint of the accent behind text, such as the current page in the menu." }
    Branding:
      type: object
      required: [name, light, dark]
      properties:
        name: { type: string, description: "The portal's name; rvav until one is set.", examples: [Acme Cloud] }
        accent: { type: string, description: The accent colour set; empty for rvav's own. }
        light: { $ref: "#/components/schemas/AccentPalette" }
        dark: { $ref: "#/components/schemas/AccentPalette" }
        logo_light_url: { type: string, description: "The light theme's logo, if there is one." }
        logo_dark_url: { type: string, description: "The dark theme's logo; the light one is shown when there is none." }
    BrandingWrite:
      type: object
      additionalProperties: false
      required: [name, accent]
      properties:
        name:
          type: string
          maxLength: 40
          description: >-
            Empty for rvav. Spaces, tabs and line breaks are trimmed at
            either end, and each run of them inside becomes one space. Any
            other control character, such as an escape, is refused with the
            code `invalid`.
        accent:
          type: string
          pattern: "^(#[0-9A-Fa-f]{6}|#[0-9A-Fa-f]{3})?$"
          description: "#rrggbb or #rgb; empty for rvav's own. One that isn't a colour is refused with the code `invalid`, one that doesn't read with `contrast`."
          examples: ["#5b2a86"]
    AccentCheckQuery:
      type: object
      additionalProperties: false
      required: [accent]
      properties:
        accent: { type: string, description: "#rrggbb or #rgb." }
    AccentCheck:
      type: object
      required: [ok, ratio]
      properties:
        ok: { type: boolean, description: The accent reads in both themes and can be saved. }
        ratio: { type: number, description: "Its lowest contrast in the light theme, such as 5.2 for 5.2:1." }
        message: { type: string, description: Why it can't be saved. }
        suggestion: { type: string, description: "The closest darker colour that reads, when it doesn't." }
        light: { $ref: "#/components/schemas/AccentPalette" }
        dark: { $ref: "#/components/schemas/AccentPalette" }
    Notification:
      type: object
      required: [id, kind, title, level, created_at]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/NotificationKind" }
        title: { type: string, examples: ["Approval needed: RHEL 9 server web-prd-front01"] }
        body: { type: string }
        level:
          type: string
          enum: [info, success, warning, error]
          x-enum-varnames: [LevelInfo, LevelSuccess, LevelWarning, LevelError]
        link: { type: string, description: "The page in rvav it is about, for example /approvals/apr_123." }
        created_at: { type: string, format: date-time }
        read_at: { type: string, format: date-time }
    NotificationPage:
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items, unread]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Notification" }
            unread: { type: integer, description: How many of the caller's are unread. }
    NotificationsRead:
      type: object
      additionalProperties: false
      properties:
        ids:
          type: array
          maxItems: 200
          items: { type: string }
        all: { type: boolean, description: Every notification of the caller. }
    NotificationCount:
      type: object
      required: [unread]
      properties:
        unread: { type: integer }
    NotificationRule:
      type: object
      required: [kind, channels]
      properties:
        kind: { $ref: "#/components/schemas/NotificationKind" }
        channels:
          type: array
          description: The channels besides the app.
          items: { $ref: "#/components/schemas/NotificationChannel" }
    NotificationPreferencesWrite:
      type: object
      required: [locale, rules]
      additionalProperties: false
      properties:
        locale: { type: string, enum: [en, fr], description: "The language of what is sent, and of the web app (ADR-0061)." }
        rules:
          type: array
          description: One per kind; a kind left out keeps the defaults.
          items: { $ref: "#/components/schemas/NotificationRule" }
    NotificationPreferences:
      type: object
      required: [locale, rules, channels]
      properties:
        locale: { type: string, enum: [en, fr] }
        rules:
          type: array
          description: Every kind, with the caller's choice or the defaults.
          items:
            allOf:
              - $ref: "#/components/schemas/NotificationRule"
              - type: object
                required: [default]
                properties:
                  default: { type: boolean, description: "The defaults, not the caller's choice." }
        channels:
          type: array
          description: Each channel besides the app, and whether it can reach the caller.
          items:
            type: object
            required: [channel, available]
            properties:
              channel: { $ref: "#/components/schemas/NotificationChannel" }
              available: { type: boolean }
              address: { type: string, description: "Where it goes: the email address, or the Teams or Slack user." }
              reason: { type: string, description: Why it can't reach the caller. }
    BotActivity:
      type: object
      description: A Bot Framework activity (only the fields rvav reads are listed).
      additionalProperties: true
      properties:
        type: { type: string, examples: [invoke] }
        name: { type: string, examples: [adaptiveCard/action] }
        serviceUrl: { type: string }
        from:
          type: object
          additionalProperties: true
          properties:
            id: { type: string }
            aadObjectId: { type: string }
        value: { type: object, additionalProperties: true }
    IntegrationKind:
      type: string
      enum: [oidc, vcenter, console, awx, efficientip, nsx, git, vra, ad, servicenow, smtp, teams, slack, hosts, trust]
    Integration:
      type: object
      required: [kind, configured, settings, secret_set, locked, revision, applying]
      properties:
        kind: { $ref: "#/components/schemas/IntegrationKind" }
        configured: { type: boolean }
        settings:
          type: object
          additionalProperties: true
          description: |
            oidc (the identity provider, ADR-0030): issuer, discovery_url,
            client_id, scopes, groups_claim, manager_claim; no secret (the web app is a
            public client, with PKCE).
            vcenter: url, username, insecure, name, sync_interval.
            console (ADR-0012): username, sdk_urls (the secret: the console
            account's password).
            awx: url, organization, catalog_labels, action_labels,
            inventory_source_id, insecure, sync_interval.
            efficientip: url, username, dns_server, instance_id, insecure,
            sync_interval.
            git: url, branch, dir, username, known_hosts, insecure, committer,
            sync_interval (the secret: an HTTPS token, or an SSH deploy key's
            private key; ADR-0029).
            nsx: url, username, cert_file, key_file, insecure (the secret:
            the user's password; ADR-0028).
            vra (the importer's, ADR-0027): url, username, domain, insecure
            (the secret: the user's password, or without a user a refresh
            token).
            ad (Active Directory, ADR-0064): url (ldaps://, or ldap:// for
            StartTLS), username (the service account's DN or UPN), base_dn,
            insecure, plain_ldap (ldap:// without StartTLS: everything in
            the clear), cert_sha256 (the secret: the service account's
            password).
            servicenow (ADR-0065): url (https only), auth (basic or oauth,
            the client credentials grant), username, client_id, insecure,
            cert_sha256 (the secret: the user's password, or the OAuth
            client's secret); cmdb (keep VMs as CIs), cmdb_class, data_source
            (the IRE's discovery source), projects (IDs or codes; none, every
            project), sync_interval (the reconcile's); allowed_sources (the
            addresses or CIDR ranges ServiceNow's calls may come from; none,
            any), requests_per_minute (ServiceNow's submissions, 30 by
            default).
            smtp: host, port, tls (starttls, tls, none), from, username.
            teams: app_id, tenant_id, service_url, login_url, graph_url,
            openid_url. slack: api_url.
            hosts: rest_source_hosts, webhook_hosts (no secret).
            A sync_interval is a duration (2m, 1h30m), from 30s to 24h.
            The secret is the SMTP password, the Teams app's client secret
            or the Slack bot token.
        secret_set:
          type: boolean
          description: The password or token is stored (it is never returned).
        signing_secret_set:
          type: boolean
          description: Slack only, its signing secret is stored.
        locked:
          type: array
          description: Settings an environment variable sets, which win and can't be changed here.
          items: { type: string }
        revision:
          type: integer
          format: int64
          description: The settings revision these were saved at; 0 when none are saved.
        applying:
          type: boolean
          description: |
            A process still runs with earlier settings: it drains (takes no
            new task, lets those running finish), exits and is started again
            with these (ADR-0030). Never for oidc, console, vra, smtp,
            teams, slack and hosts, read on next use.
        updated_at: { type: string, format: date-time }
        updated_by: { $ref: "#/components/schemas/UserRef" }
    Process:
      type: object
      required: [id, role, host, version, revision, state, started_at, seen_at, fips]
      properties:
        id: { type: string, example: rvav-worker-7d9f-2k4xq/worker/1f3a }
        role:
          type: string
          enum: [api, worker, sync, dev]
        host: { type: string, description: The host name (a pod's name on Kubernetes). }
        version: { type: string }
        revision:
          type: integer
          format: int64
          description: The settings revision it started with.
        state:
          type: string
          enum: [running, draining, restarting]
          description: |
            draining - it saw newer connection settings, and exits once its work is done.
            restarting - it exited for them, and its supervisor hasn't started it again yet.
        started_at: { type: string, format: date-time }
        seen_at: { type: string, format: date-time }
        fips: { $ref: "#/components/schemas/FipsStatus" }
    FipsStatus:
      type: object
      description: How a process uses Go's FIPS 140-3 module (ADR-0060), as RVAV_FIPS set it when the process started.
      required: [mode, module]
      properties:
        mode:
          type: string
          enum: ["off", "on", "only"]
          x-enum-varnames: [FipsOff, FipsOn, FipsOnly]
          description: |
            off - no FIPS 140 mode.
            on - the module's approved algorithms where rvav and Go choose.
            only - also refuses every algorithm the module doesn't approve.
        module:
          type: string
          description: |
            The version of the Go Cryptographic Module the process was built
            with: v1.0.0 in rvav's images; "latest" in a build without
            GOFIPS140, which uses its Go release's module, not a validated one.
          example: v1.0.0
    ProcessList:
      type: object
      required: [items, revision]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Process" }
        revision:
          type: integer
          format: int64
          description: The latest connection settings' revision; a process before it applies them when it starts again.
    SettingsRevision:
      type: object
      required: [kind, revision, updated_at, applies]
      properties:
        kind: { $ref: "#/components/schemas/IntegrationKind" }
        revision:
          type: integer
          format: int64
        updated_at:
          type: string
          format: date-time
        updated_by: { $ref: "#/components/schemas/UserRef" }
        applies:
          type: string
          enum: [next_use, applying, applied]
          description: |
            next_use: read when next used. applying: a process still runs
            with an earlier revision; applied: every process has it.
    InstallSetting:
      type: object
      required: [name, secret, set]
      properties:
        name:
          type: string
          description: The environment variable.
          example: RVAV_TEMPORAL_ADDRESS
        value:
          type: string
          description: The value in effect, the default when not set. Left out for a secret, but for the database URL, without its password.
        secret:
          type: boolean
        set:
          type: boolean
          description: Set in the environment; otherwise the default applies.
    System:
      type: object
      required: [version, fips, schema, revision, processes, settings, install]
      properties:
        version:
          type: string
          description: The version of the API answering.
        fips: { $ref: "#/components/schemas/FipsStatus" }
        schema:
          type: integer
          format: int64
          description: The last database migration applied.
        revision:
          type: integer
          format: int64
          description: The latest connection settings' revision.
        processes:
          type: array
          items: { $ref: "#/components/schemas/Process" }
        settings:
          type: array
          description: The settings saved in Administration, by kind.
          items: { $ref: "#/components/schemas/SettingsRevision" }
        install:
          type: array
          items: { $ref: "#/components/schemas/InstallSetting" }
    SetupStep:
      type: object
      required: [key, done, detail]
      properties:
        key:
          type: string
          enum: [password, provider, admin_group, vcenter, projects, ipam, awx, catalog_item]
          description: |
            password - the local administrator's password changed from the
            install's; provider - the identity provider set; admin_group - a
            group given access.manage for all of rvav (mapped to admin, or to
            a role of your own holding it); vcenter, ipam (EfficientIP), awx -
            the connection set; projects - an environment and a project; and
            catalog_item - an item published.
        done: { type: boolean }
        detail:
          type: string
          description: What there is now, as "2 environments, 1 project" or the connection's address.
          examples: ["https://vc01.corp.example/sdk"]
    Setup:
      type: object
      required: [steps, complete, hidden, open]
      properties:
        steps:
          type: array
          items: { $ref: "#/components/schemas/SetupStep" }
        complete: { type: boolean, description: Every step is done. }
        hidden: { type: boolean, description: An administrator hid it. }
        open:
          type: boolean
          description: "Administrators land on it: a step remains, it isn't hidden, and the install wasn't seeded."
    SetupWrite:
      type: object
      required: [hidden]
      additionalProperties: false
      properties:
        hidden: { type: boolean }
    IntegrationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Integration" }
    IntegrationWrite:
      type: object
      required: [settings]
      additionalProperties: false
      properties:
        settings: { type: object, additionalProperties: true }
        secret:
          type: string
          writeOnly: true
          description: The password or token; omit to keep the stored one.
        signing_secret:
          type: string
          writeOnly: true
          description: Slack only, the app's signing secret; omit to keep the stored one.
    IntegrationTest:
      type: object
      required: [ok, checks]
      properties:
        ok: { type: boolean }
        checks:
          type: array
          items: { $ref: "#/components/schemas/IntegrationCheck" }
        certificate:
          description: The certificate the server presented, for a connection over HTTPS.
          $ref: "#/components/schemas/ServerCertificate"
    ServerCertificate:
      type: object
      description: |
        The certificate a server presented to a connection's test, and
        whether rvav trusts it (ADR-0030): the system's CAs and the CA
        bundle's (Integrations › Trusted certificates) vouch for it, or it is
        the connection's pinned certificate.
      required: [address, subject, issuer, names, not_before, not_after, sha256, trusted, pinned, checked, pinnable,
        anchor_pem, anchor_subject, anchor_is_leaf]
      properties:
        address: { type: string, description: The host and port read., examples: ["vc01.corp.example:443"] }
        subject: { type: string, examples: [vc01.corp.example] }
        issuer: { type: string, examples: [Corp Issuing CA 2] }
        names:
          type: array
          items: { type: string }
          description: The names and addresses it is for.
        not_before: { type: string, format: date-time }
        not_after: { type: string, format: date-time }
        sha256:
          type: string
          description: Its SHA-256, as AB:CD:…; set as the connection's cert_sha256, the connection trusts it.
        trusted: { type: boolean, description: "The system's or the CA bundle's CAs vouch for it, for this host." }
        pinned: { type: boolean, description: It is the connection's pinned certificate. }
        checked: { type: boolean, description: False when the connection doesn't check certificates (insecure). }
        pinnable: { type: boolean, description: The connection takes a pinned certificate (cert_sha256). }
        problem: { type: string, description: Why the CAs don't vouch for it. }
        anchor_pem:
          type: string
          description: The last certificate the server sent, in PEM; in the CA bundle, it makes the server trusted.
        anchor_subject: { type: string, examples: [Corp Issuing CA 2] }
        anchor_is_leaf:
          type: boolean
          description: The anchor is the server's own certificate (self-signed, or sent without its CA).
    VCenter:
      type: object
      required: [name, url, username, insecure, password_set, primary]
      properties:
        name:
          type: string
          description: How the vCenter is known in rvav (inventory, placement rules, VMs), for example `vc02.corp.example`.
        url: { type: string, examples: [https://vc02.corp.example/sdk] }
        username: { type: string }
        insecure: { type: boolean, description: Its certificate isn't checked. }
        cert_sha256:
          type: string
          description: A certificate trusted for it besides those the CAs vouch for, pinned by its SHA-256.
        password_set: { type: boolean }
        primary:
          type: boolean
          description: The vCenter integration's (Integrations); changed there, not here.
        inventory:
          type: object
          description: What the inventory sync last read from it.
          properties:
            clusters: { type: integer }
            vms: { type: integer }
            synced_at: { type: [string, "null"], format: date-time }
            instance_uuid:
              type: string
              description: Its instance UUID (`ServiceContent.About.InstanceUuid`), which links to its VMs in the vSphere Client name.
    VCenterWrite:
      type: object
      required: [name, url, username]
      additionalProperties: false
      properties:
        name: { type: string, pattern: "^[a-z0-9][a-z0-9.-]{1,62}$" }
        url: { type: string, minLength: 1 }
        username: { type: string, minLength: 1 }
        password: { type: string, writeOnly: true, description: Kept when not given on a change. }
        insecure: { type: boolean }
        cert_sha256:
          type: string
          description: |
            A certificate trusted besides those the CAs vouch for, by its
            SHA-256 (with or without colons); empty, none. A new one needs the
            password again, as a new address does.
    VCenterList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/VCenter" }
    NsxManager:
      type: object
      required: [name, url, username, insecure, password_set, primary, vcenters]
      properties:
        name:
          type: string
          description: |
            How the NSX Manager is known in rvav, for example
            `nsx02.corp.example`. The NSX integration's is the host name of
            its URL.
        url: { type: string, examples: [https://nsx02.corp.example] }
        username: { type: string, description: The account rvav signs in with; empty with a principal-identity certificate. }
        cert_file:
          type: string
          description: A principal-identity certificate rvav signs in with, by its path on rvav's servers.
        key_file: { type: string, description: "The certificate's private key, by its path on rvav's servers." }
        insecure: { type: boolean, description: Its certificate isn't checked. }
        cert_sha256:
          type: string
          description: A certificate trusted for it besides those the CAs vouch for, pinned by its SHA-256.
        password_set: { type: boolean }
        primary:
          type: boolean
          description: The NSX integration's (Integrations); its settings are changed there, its vCenters here.
        vcenters:
          type: array
          description: |
            The vCenters it serves, by their names in GET /admin/vcenters:
            the segments and security groups of their VMs are made on it.
          items: { type: string }
    NsxManagerWrite:
      type: object
      required: [name, url]
      additionalProperties: false
      properties:
        name: { type: string, pattern: "^[a-z0-9][a-z0-9.-]{1,62}$" }
        url: { type: string, minLength: 1 }
        username: { type: string, description: Needed with a password. }
        password: { type: string, writeOnly: true, description: Kept when not given on a change. }
        cert_file:
          type: string
          description: A principal-identity certificate, by its path on rvav's servers; instead of a password.
        key_file: { type: string, description: "The certificate's private key, by its path on rvav's servers." }
        insecure: { type: boolean }
        cert_sha256:
          type: string
          description: |
            A certificate trusted besides those the CAs vouch for, by its
            SHA-256 (with or without colons); empty, none. A new one needs the
            password again, as a new address does.
        vcenters:
          type: array
          description: |
            The vCenters it serves; when given, they replace those it served.
            A vCenter another NSX Manager served moves to this one.
          items: { type: string }
    NsxManagerVCenters:
      type: object
      required: [vcenters]
      additionalProperties: false
      properties:
        vcenters:
          type: array
          description: |
            The vCenters it serves, by their names in GET /admin/vcenters;
            they replace those it served. A vCenter another NSX Manager
            served moves to this one.
          items: { type: string }
    NsxManagerList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/NsxManager" }
    IntegrationCheck:
      type: object
      required: [name, ok, message]
      properties:
        name: { type: string, examples: [Sign in] }
        ok: { type: boolean }
        message: { type: string }
    ServiceNowCmdb:
      type: object
      required: [enabled, class, data_source, projects, kept, retired, queued, failing, failures, orphans, orphans_total]
      properties:
        enabled:
          type: boolean
          description: The integration is set and `cmdb` is on.
        class:
          type: string
          examples: [cmdb_ci_vmware_instance]
        data_source:
          type: string
          examples: [rvav]
        projects:
          type: array
          description: The projects whose VMs are kept; none means every project's.
          items: { $ref: "#/components/schemas/ProjectRef" }
        kept:
          type: integer
          description: CIs rvav keeps, not retired.
        retired:
          type: integer
          description: CIs rvav retired, their VM gone.
        queued:
          type: integer
          description: Deployments waiting for a look.
        failing:
          type: integer
          description: Deployments ServiceNow didn't take, tried again with backoff.
        failures:
          type: array
          description: Those, the latest tried first (at most 50).
          items: { $ref: "#/components/schemas/ServiceNowFailure" }
        reconciled_at:
          type: string
          format: date-time
          description: When the last reconcile was; absent before the first.
        next_reconcile_at:
          type: string
          format: date-time
        servicenow:
          type: integer
          description: CIs of rvav's data source ServiceNow has, not retired, at the last reconcile; absent when it couldn't read them (reconcile_error).
        orphans:
          type: array
          description: CIs of rvav's data source, not retired, that rvav doesn't keep (at most 500).
          items: { $ref: "#/components/schemas/ServiceNowOrphan" }
        orphans_total:
          type: integer
        reconcile_error:
          type: string
          description: Why ServiceNow's CIs couldn't be read at the last reconcile.
    ServiceNowFailure:
      type: object
      required: [deployment_id, attempts, error, next_attempt_at]
      properties:
        deployment_id: { type: string }
        deployment_name: { type: string }
        attempts: { type: integer }
        error: { type: string }
        next_attempt_at: { type: string, format: date-time }
    ServiceNowOrphan:
      type: object
      required: [sys_id, name, url]
      properties:
        sys_id: { type: string }
        name: { type: string }
        instance_uuid: { type: string }
        updated_at:
          type: string
          description: When ServiceNow last changed it, as ServiceNow writes it (UTC).
          examples: ["2026-11-22 14:05:31"]
        url:
          type: string
          format: uri
          description: The CI in ServiceNow.
    ServiceNowRef:
      type: object
      description: The ServiceNow requested item a request was made for (ADR-0065).
      required: [sys_id, number, url, user]
      properties:
        sys_id: { type: string, examples: ["9d385017c611228701d22104cc95c371"] }
        number: { type: string, examples: [RITM0010045] }
        url:
          type: string
          format: uri
          description: The requested item in ServiceNow.
        user:
          type: string
          description: The email or user name ServiceNow named the user by.
        ordered_by:
          description: Who placed the order in ServiceNow, when it isn't the user it's for.
          $ref: "#/components/schemas/UserRef"
    ServiceNowCatalog:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ServiceNowCatalogItem" }
    ServiceNowCatalogItem:
      type: object
      required: [id, slug, name, type, version_id, version, inputs]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        category: { type: string }
        type: { type: string, examples: [vm_blueprint] }
        version_id: { type: string }
        version: { type: string, examples: ["1.2"] }
        inputs:
          type: array
          items: { $ref: "#/components/schemas/ServiceNowInput" }
    ServiceNowInput:
      type: object
      required: [name, label, type, required, dynamic]
      properties:
        name: { type: string }
        label: { type: string }
        type: { type: string, enum: [string, integer, number, boolean] }
        required: { type: boolean }
        help: { type: string }
        default:
          description: The form's initial value, taken when ServiceNow sends none.
        options:
          type: array
          description: The values it may take, when the list is fixed.
          items: { $ref: "#/components/schemas/ServiceNowChoice" }
        dynamic:
          type: boolean
          description: rvav finds its options at request time (a value source); ServiceNow leaves it to the form's initial value, or sends a value it knows.
    ServiceNowUser:
      type: object
      required: [id, name, email]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
    ServiceNowEntitlements:
      type: object
      required: [user, projects]
      properties:
        user: { $ref: "#/components/schemas/ServiceNowUser" }
        projects:
          type: array
          items: { $ref: "#/components/schemas/ServiceNowEntitlement" }
    ServiceNowEntitlement:
      type: object
      required: [project, environments, items]
      properties:
        project: { $ref: "#/components/schemas/ProjectRef" }
        environments:
          type: array
          items: { $ref: "#/components/schemas/ServiceNowChoice" }
        items:
          type: array
          description: The IDs of the items shared with the user in the project.
          items: { type: string }
    ServiceNowChoice:
      type: object
      required: [value, label]
      properties:
        value: { type: string }
        label: { type: string }
    ServiceNowRequestDraft:
      type: object
      required: [ritm_sys_id, ritm_number, user, ordered_by, catalog_item_id, project_id, environment]
      additionalProperties: false
      properties:
        ritm_sys_id: { type: string, pattern: "^[0-9a-f]{32}$" }
        ritm_number: { type: string, pattern: "^[A-Z]{2,8}[0-9]{4,12}$", examples: [RITM0010045] }
        user:
          type: string
          minLength: 1
          maxLength: 254
          description: >-
            The requested item's `requested_for`, the person the request is
            for, by email, or by user name: an rvav user's whole user name,
            their identity provider's `preferred_username`, in any case.
        ordered_by:
          type: string
          minLength: 1
          maxLength: 254
          description: >-
            The requested item's `opened_by`, the person who placed the
            order, named as `user` is. Someone else than `user` must hold
            `request.on_behalf` in the project.
        catalog_item_id: { type: string }
        project_id:
          type: string
          description: The project's ID or code.
        environment: { type: string }
        inputs:
          type: object
          additionalProperties: true
          description: >-
            The inputs; those left out take the form's initial values. A
            string is taken for an integer, a number or a boolean ("4",
            "true"), as ServiceNow's variables are strings, and an empty
            string is left out.
        deployment_name: { type: string }
        justification: { type: string, maxLength: 2000 }
        accept_warnings:
          type: boolean
          description: Submit despite soft policies' warnings, which the user then accepted in ServiceNow.
    ServiceNowRequest:
      type: object
      required: [ritm_sys_id, ritm_number, request_id, request_number, status, user, url, deployment_ids]
      properties:
        ritm_sys_id: { type: string }
        ritm_number: { type: string }
        request_id: { type: string }
        request_number: { type: string, examples: [REQ-10491] }
        status: { $ref: "#/components/schemas/RequestStatus" }
        user: { $ref: "#/components/schemas/ServiceNowUser" }
        ordered_by:
          description: Who placed the order, when it isn't the user it's for.
          $ref: "#/components/schemas/ServiceNowUser"
        url:
          type: string
          description: The request in rvav.
        deployment_ids:
          type: array
          items: { type: string }
    ServiceNowToken:
      type: object
      required: [allowed_sources, requests_per_minute]
      properties:
        token:
          description: The token made last, while it is valid.
          $ref: "#/components/schemas/ApiToken"
        allowed_sources:
          type: array
          description: The addresses ServiceNow's calls may come from; none, any.
          items: { type: string }
        requests_per_minute: { type: integer }
    ServiceNowTokenMade:
      type: object
      required: [token, secret, revoked]
      properties:
        token: { $ref: "#/components/schemas/ApiToken" }
        secret:
          type: string
          description: The token, shown this once.
        revoked:
          type: integer
          description: Earlier tokens revoked.
    InventoryToken:
      type: object
      required: [locked, source_set]
      properties:
        locked:
          type: boolean
          description: RVAV_INVENTORY_TOKEN sets the token; rvav makes none.
        source_set:
          type: boolean
          description: AWX's inventory source ID is set, so a token can be put in AWX.
        public_url:
          type: string
          description: rvav's public URL, the address used when the credential has none and none is given.
        token:
          description: The token made last, while it is valid.
          $ref: "#/components/schemas/ApiToken"
    InventoryTokenWrite:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: rvav's address as AWX reaches it; empty keeps the one the credential has.
          examples: ["http://rvav-api.rvav.svc.cluster.local:8080"]
    InventoryTokenMade:
      type: object
      required: [token, credential, url, attached]
      properties:
        token: { $ref: "#/components/schemas/ApiToken" }
        credential: { type: string, description: The AWX credential it is in., examples: [rvav API] }
        url: { type: string, description: The address AWX reads rvav at. }
        attached: { type: boolean, description: The credential was set on the inventory source now. }
        revoked: { type: integer, description: Earlier tokens revoked. }
        update:
          type: string
          description: The inventory source's sync started, or why it couldn't be.
    ApiToken:
      type: object
      required: [id, name, scope, user, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        scope:
          type: string
          enum: [all, inventory, servicenow]
          description: all acts as the user; inventory only reads the Ansible inventory; servicenow only takes ServiceNow's calls (ADR-0065).
        user: { $ref: "#/components/schemas/UserRef" }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
    ApiTokenCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        scope: { type: string, enum: [all, inventory], default: all }
        expires_at: { type: string, format: date-time }
    ApiTokenCreated:
      allOf:
        - $ref: "#/components/schemas/ApiToken"
        - type: object
          required: [token]
          properties:
            token: { type: string, description: Shown this once. }
    ApiTokenList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ApiToken" }
    AuditEvent:
      type: object
      required: [id, at, action, target_type, target_id, detail]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        actor:
          oneOf:
            - $ref: "#/components/schemas/UserRef"
            - type: "null"
          description: Null when rvav itself acted (a timeout, an auto-approval).
        action: { type: string, examples: [catalog.version.publish] }
        target_type: { type: string }
        target_id: { type: string }
        target_name:
          type: string
          description: |
            What the target was called when the event was recorded, so a
            target renamed or deleted since keeps the name it had; for an
            event recorded before rvav kept names, what it is called now.
            Left out when rvav has no name for it: a setting, an
            integration, or a target deleted before rvav kept names.
        target_exists:
          type: boolean
          description: |
            Whether rvav still keeps the target, so its page opens. A deleted
            deployment is kept, with its history. Left out for a target rvav
            doesn't keep as a record of its own, such as a setting, and for
            an event on none, such as a failed sign-in by nobody known.
        project:
          oneOf:
            - $ref: "#/components/schemas/ProjectRef"
            - type: "null"
        detail:
          type: object
          additionalProperties: true
          description: |
            What the action changed, or how it went. The `auth.*` events'
            holds `method` (`local`, `oidc`, `device`, `dev` or `token`)
            and, as the request came, `ip` and `user_agent`:
            - `auth.sign_in`: reported by the web app or rvavctl, `client`,
              with `roles` and `groups` from the identity provider; the
              local administrator's, `password_change_required`.
            - `auth.sign_in_failed`: `reason`, such as `wrong password`,
              `unknown username` (its `username` is then `unknown`, never
              what was typed), `state mismatch`, `provider refused`,
              `token exchange failed`, `token refused` or `token_expired`.
              The local administrator's adds `failures_in_a_row`; one a
              client reported, `client`, `stage`, `error`, `description`
              and `reported_by: client`.
            - `auth.sign_out`; `auth.password_changed`, with
              `sessions_ended` and `tokens_revoked`; `auth.token_used`, the
              API token's `name`, on its first use of the day.
            - `auth.password_reset` (`rvav admin reset-password`): `by`,
              `sessions_ended` and `tokens_revoked`;
              `auth.local_admin_created`: `password`, `generated` or
              `RVAV_ADMIN_PASSWORD`.
    AuditEventPage:
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/AuditEvent" }

    # ── Audit forwarding and sign-ins (ADR-0058) ──
    AuditCategory:
      type: string
      description: |
        What an audit event is about, by its action's first word:
        `sign_in` (`auth.*`), `token` (`token.*`, `awx.inventory_token`),
        `access` (projects, members, environments, roles and group mappings),
        `catalog`, `policy` (policies and naming), `infrastructure`
        (placement, networks, templates, sizes, vCenters, IP ranges, Active
        Directory placement), `extensibility` (subscriptions, workflows,
        resource types, day-2 actions and forms, shared variables),
        `settings` (settings, secrets, integrations, vRA import), `request`
        (requests, deployments, approvals, schedules, the console,
        onboarding) and `other` for anything else.
      enum: [sign_in, token, access, catalog, policy, infrastructure, extensibility, settings, request, other]
      x-enum-varnames: [AuditCategorySignIn, AuditCategoryToken, AuditCategoryAccess, AuditCategoryCatalog, AuditCategoryPolicy,
        AuditCategoryInfrastructure, AuditCategoryExtensibility, AuditCategorySettings, AuditCategoryRequest, AuditCategoryOther]
    SyslogTransport:
      type: string
      description: |
        `tls` (when left out): RFC 5425, octet-counting framing; `tcp`: the
        same framing in clear; `udp`: RFC 5426, one event per datagram.
        `tcp` and `udp` are for labs. Over TCP and TLS, an event longer
        than 64 KB is set aside; over UDP, one longer than 8 KB goes
        without its detail.
      enum: [tls, tcp, udp]
      x-enum-varnames: [SyslogTLS, SyslogTCP, SyslogUDP]
    SyslogFacility:
      type: string
      description: The RFC 5424 facility; `audit` is "log audit" (13), `alert` "log alert" (14). `local0` when left out.
      enum: [kern, user, mail, daemon, auth, syslog, lpr, news, uucp, cron, authpriv, ftp, ntp, audit, alert, clock,
        local0, local1, local2, local3, local4, local5, local6, local7]
      x-enum-varnames: [FacilityKern, FacilityUser, FacilityMail, FacilityDaemon, FacilityAuth, FacilitySyslog, FacilityLpr,
        FacilityNews, FacilityUucp, FacilityCron, FacilityAuthpriv, FacilityFtp, FacilityNtp, FacilityAudit, FacilityAlert,
        FacilityClock, FacilityLocal0, FacilityLocal1, FacilityLocal2, FacilityLocal3, FacilityLocal4, FacilityLocal5,
        FacilityLocal6, FacilityLocal7]
    AuditSyslog:
      type: object
      additionalProperties: false
      required: [host]
      properties:
        host: { type: string, minLength: 1, maxLength: 253, description: The syslog server's name or address. }
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: 6514 for TLS, 514 otherwise, when left out.
        transport: { $ref: "#/components/schemas/SyslogTransport" }
        facility: { $ref: "#/components/schemas/SyslogFacility" }
        app_name:
          type: string
          minLength: 1
          maxLength: 48
          pattern: "^[!-~]+$"
          description: The APP-NAME field; rvav when left out.
        ca_certificate:
          type: string
          description: The CAs (PEM) that sign the server's certificate, trusted besides the system's and the CA bundle's. TLS only.
        client_certificate:
          type: string
          description: The certificate (PEM) rvav presents when the server asks for one. TLS only, with `client_key_secret`.
        client_key_secret:
          type: string
          description: The stored secret (Catalog items › Secrets) that holds the client certificate's private key, in PEM.
    AuditWebhook:
      type: object
      additionalProperties: false
      required: [url, secret]
      properties:
        url:
          type: string
          description: |
            An HTTPS (or HTTP) URL on one of the hosts webhooks may call
            (Administration › Integrations › Allowed hosts), without a user
            name or password: `auth_header` carries a credential. Reads
            show each value of its query as `REDACTED`; a URL sent back so
            keeps the values stored.
        secret:
          type: string
          description: The stored secret each body is signed with, in `X-Rvav-Signature` as subscriptions' webhooks are.
        auth_header:
          type: string
          maxLength: 64
          pattern: "^[!#$%&'*+.^_`|~0-9A-Za-z-]+$"
          description: |
            A header sent with each call, such as `Authorization` or
            `DD-API-KEY`, with `auth_value` as its value. Not one rvav sets
            itself: `Content-Type`, `Content-Length`, `Host`, `User-Agent`
            or an `X-Rvav-` one. Left out on a change, the header goes with
            its value.
        auth_value:
          type: string
          writeOnly: true
          maxLength: 4096
          description: |
            The header's value, such as `Bearer …`, sealed as integrations'
            passwords are and never shown. Kept when not given on a change,
            unless the URL's scheme, host or port changes.
    AuditDestinationWrite:
      type: object
      additionalProperties: false
      description: A syslog server or a webhook, exactly one.
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        enabled: { type: boolean, description: "Off: no event is queued for it or sent. On when left out." }
        categories:
          type: array
          uniqueItems: true
          description: Only the events of these categories; every event when empty or left out.
          items: { $ref: "#/components/schemas/AuditCategory" }
        syslog: { $ref: "#/components/schemas/AuditSyslog" }
        webhook: { $ref: "#/components/schemas/AuditWebhook" }
    AuditDeliveryState:
      type: object
      required: [backlog, set_aside, delivered, failures]
      properties:
        backlog: { type: integer, description: "Events waiting to be sent, without those set aside." }
        delivered: { type: integer, format: int64, description: Events sent since the destination was made. }
        failures: { type: integer, description: Failed attempts in a row since the last success. }
        last_success_at: { type: string, format: date-time }
        last_error: { type: string, description: "Why the last attempt failed, while it hasn't succeeded since." }
        last_error_at: { type: string, format: date-time }
        next_attempt_at:
          type: string
          format: date-time
          description: When the events waiting are tried again, after a failure.
        set_aside:
          type: integer
          description: |
            Events the destination refuses for good, such as a webhook's
            413 or an event too long for syslog: they wait aside, and the
            events after them go. Saving the destination tries them again.
        set_aside_reason: { type: string, description: Why the last event set aside was. }
    AuditDestination:
      type: object
      required: [id, name, enabled, kind, categories, state, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        enabled: { type: boolean }
        kind:
          type: string
          enum: [syslog, webhook]
          x-enum-varnames: [AuditDestinationSyslog, AuditDestinationWebhook]
        categories:
          type: array
          items: { $ref: "#/components/schemas/AuditCategory" }
        syslog: { $ref: "#/components/schemas/AuditSyslog" }
        webhook: { $ref: "#/components/schemas/AuditWebhook" }
        state: { $ref: "#/components/schemas/AuditDeliveryState" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AuditDestinationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditDestination" }
    AuditDestinationTest:
      type: object
      required: [ok, message, duration_ms]
      properties:
        ok: { type: boolean }
        message: { type: string, description: "What the server answered, or why it couldn't be reached." }
        duration_ms: { type: integer }

    SignInReport:
      type: object
      additionalProperties: false
      required: [client, method]
      properties:
        client:
          type: string
          enum: [web, rvavctl]
          x-enum-varnames: [SignInClientWeb, SignInClientRvavctl]
        method:
          type: string
          description: How the client signed in at the provider (`oidc` in the browser, `device` with a code on another device), in development mode (`dev`), or with an API token (`token`).
          enum: [oidc, device, dev, token]
          x-enum-varnames: [SignInMethodOidc, SignInMethodDevice, SignInMethodDev, SignInMethodToken]
        failure: { $ref: "#/components/schemas/SignInFailure" }
    SignInFailure:
      type: object
      additionalProperties: false
      required: [stage]
      description: The sign-in failed before there was a token to send.
      properties:
        stage:
          type: string
          description: "`state`: the browser came back from another sign-in, or with no sign-in under way; `provider`: the identity provider refused (an unknown or disabled user, consent refused); `token`: the code or device code couldn't be exchanged for a token."
          enum: [state, provider, token]
          x-enum-varnames: [SignInStageState, SignInStageProvider, SignInStageToken]
        error:
          type: string
          maxLength: 64
          pattern: "^[ -~]*$"
          description: "The provider's error code, such as access_denied or invalid_grant: printable ASCII."
        description: { type: string, maxLength: 500, description: "The provider's error_description, or the client's message." }

    # ── Events and subscriptions (ADR-0021) ──
    EventTopicKey:
      type: string
      description: "Request topics (ADR-0021); a VM's own topics, `compute.*` and `network.configure`, one event per VM; a request's approval levels; and projects (ADR-0049); a custom resource's, `custom.*`, one event per resource (ADR-0056)."
      enum: [request.submitted, approval.requested, approval.decided, provisioning.pre, compute.allocation.pre, network.configure,
        compute.provision.pre, compute.provision.post, custom.create.pre, custom.create.post, provisioning.post, day2.pre, day2.post,
        delete.pre, custom.delete.pre, custom.delete.post, compute.removal.pre, compute.removal.post, delete.post, lease.expiring,
        lease.expired, project.created, project.updated]
    EventTopicGroup:
      type: string
      description: "What a topic's events are about: a request, one of its approval levels, one of its VMs, one of its custom resources, a deployment's lease, or a project."
      enum: [request, approval, machine, custom, lease, project]
    EventTopic:
      type: object
      required: [key, group, description, may_block, may_change, sample]
      properties:
        key: { $ref: "#/components/schemas/EventTopicKey" }
        group: { $ref: "#/components/schemas/EventTopicGroup" }
        description: { type: string }
        may_block: { type: boolean, description: "Whether blocking subscriptions are allowed: provisioning.pre, compute.allocation.pre, network.configure, day2.pre and delete.pre (ADR-0054)." }
        may_change:
          type: array
          description: "What a blocking subscription's answer may change besides stopping the request: the deployment's properties on provisioning.pre, the VM's name and placement on compute.allocation.pre, its adapters' networks and addresses on network.configure (ADR-0054)."
          items: { $ref: "#/components/schemas/SubscriptionChange" }
        sample: { $ref: "#/components/schemas/IntegrationEvent" }
    EventTopicList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/EventTopic" }
    IntegrationEvent:
      type: object
      description: |
        What subscribers receive (`rvav.event.v1`). Within v1, fields are only
        added: receivers ignore those they don't know. Webhooks get it as the
        body, signed in `X-Rvav-Signature`; AWX templates as the extra
        variable `rvav_event`; custom workflows in their context's `event`.
      required: [id, topic, contract, occurred_at, data]
      properties:
        id: { type: string, description: "Stable across retries: receivers ignore an ID they already have." }
        topic: { $ref: "#/components/schemas/EventTopicKey" }
        contract: { type: string, examples: [rvav.event.v1] }
        occurred_at: { type: string, format: date-time }
        data:
          type: object
          description: "request, item, project, environment, requester, owner, deployment, deployments, resources, inputs and vm; null where they don't apply. A VM's topics add `machine`: its name, size, placement, networks, address and moref; approval topics add `approval`: the level, who may decide it and how it was decided; custom resource topics add `custom_resource`: its ID, type, key, name, deployment, inputs and properties (ADR-0056); project topics have `project` with its settings and admins, `actor` and `changes`, and no request (ADR-0049)."
          additionalProperties: true
    SubscriptionTarget:
      type: object
      description: Exactly one of `webhook`, `awx` and `workflow`.
      additionalProperties: false
      properties:
        webhook:
          type: object
          required: [url, secret]
          additionalProperties: false
          properties:
            url: { type: string, description: "An https URL on a host webhooks may call (Allowed hosts, or RVAV_WEBHOOK_HOSTS)." }
            secret: { type: string, description: "The stored secret (`/admin/secrets`) the body is signed with." }
        awx:
          type: object
          additionalProperties: false
          properties:
            template_id: { type: integer, description: The job template's AWX ID. }
            job_template: { type: string, description: "Its name, when no ID is given." }
        workflow:
          type: object
          required: [key]
          additionalProperties: false
          properties:
            key: { type: string, description: "A registered custom workflow allowed as a subscription target." }
    SubscriptionOnFailure:
      type: string
      description: "What a blocking subscription does when its target fails, doesn't answer in time, or answers with a change rvav refuses (ADR-0054)."
      enum: [stop_request, continue_request]
    SubscriptionChange:
      type: string
      description: "What a blocking answer may change: `properties` (`properties`), `name` and `placement` (`machine.name`, `machine.placement`), `networks` (`machine.networks`)."
      enum: [properties, name, placement, networks]
      x-enum-varnames: [ChangeProperties, ChangeName, ChangePlacement, ChangeNetworks]
    MachineChange:
      type: object
      description: |
        What a blocking subscription's answer changed on its VM (ADR-0054), as
        the answer's `machine` gave it: on compute.allocation.pre its name
        and placement, on network.configure its adapters' networks and
        addresses. rvav checks each change again before building.
      properties:
        name: { type: string }
        placement:
          type: object
          properties:
            cluster: { type: string }
            datastore: { type: string }
            resource_pool: { type: string }
            folder: { type: string }
        networks:
          type: array
          items:
            type: object
            required: [index]
            properties:
              index: { type: integer, description: "The adapter: 0 for the first, as in the event's `machine.networks`." }
              network: { type: string }
              address: { type: string }
    SubscriptionWrite:
      type: object
      required: [name, topic, target]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 500 }
        topic: { $ref: "#/components/schemas/EventTopicKey" }
        condition:
          type: string
          description: "A CEL expression over the event's data (`environment` is the key, `production` a boolean); empty: every event."
          examples: ['environment == "prd" && item.slug == "rhel9-server"']
        blocking: { type: boolean, default: false, description: "Only on the topics that may block (`EventTopic.may_block`): the request waits for the answer, which may stop it or change what `EventTopic.may_change` says." }
        on_failure: { $ref: "#/components/schemas/SubscriptionOnFailure" }
        priority: { type: integer, default: 100, description: Lower first. }
        timeout_seconds: { type: integer, minimum: 1, maximum: 3600, default: 30 }
        enabled: { type: boolean, default: true }
        target: { $ref: "#/components/schemas/SubscriptionTarget" }
        recovery:
          $ref: "#/components/schemas/SubscriptionTarget"
          description: "A blocking subscription's recovery target (ADR-0054): told once when the subscription fails, with the event and `recovery.reason`. Its answer's outcome, if it gives one, decides whether the request goes on; otherwise `on_failure` does."
    Subscription:
      allOf:
        - $ref: "#/components/schemas/SubscriptionWrite"
        - type: object
          required: [id, condition, blocking, on_failure, priority, timeout_seconds, enabled, created_at, runs]
          properties:
            id: { type: string }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
            runs:
              type: object
              description: Its runs of the last 30 days, by status.
              required: [delivered, failed, pending]
              properties:
                delivered: { type: integer }
                failed: { type: integer }
                pending: { type: integer }
            last_run_at: { type: string, format: date-time }
    SubscriptionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Subscription" }
    SubscriptionRunStatus:
      type: string
      description: "`queued` waits for its next attempt; `blocked` is a blocking run that stopped its request."
      enum: [queued, delivering, delivered, failed, blocked]
    SubscriptionRun:
      type: object
      required: [id, subscription_id, event_id, topic, status, blocking, recovery, test, attempts, created_at]
      properties:
        id: { type: string }
        subscription_id: { type: string }
        event_id: { type: string }
        topic: { $ref: "#/components/schemas/EventTopicKey" }
        status: { $ref: "#/components/schemas/SubscriptionRunStatus" }
        blocking: { type: boolean }
        recovery: { type: boolean, description: "A run of the subscription's recovery target, after the subscription failed on the same event (ADR-0054)." }
        test: { type: boolean, description: Made with Test. }
        request:
          type: object
          description: The request it belongs to (blocking runs, and runs of request events).
          required: [id, number]
          properties:
            id: { type: string }
            number: { type: string }
        attempts:
          type: integer
          description: |
            The calls rvav made to the target, each counted as it began:
            retries included, whether the dispatcher's, a blocking run's
            second try, or a call made again after a worker restart or a
            Retry of the request. A call whose answer was never recorded is
            in `history` as failed, with the error "Interrupted before its
            answer was recorded."
        next_attempt_at: { type: string, format: date-time }
        outcome:
          type: string
          description: |
            A blocking run's answer: continue or stop. None for a recovery
            target that answered without one: the subscription's
            `on_failure` decided.
        reason: { type: string, description: "Why it stopped the request, or why it failed." }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    SubscriptionRunAttempt:
      type: object
      required: [at, ok, duration_ms]
      properties:
        at: { type: string, format: date-time }
        ok: { type: boolean }
        status_code: { type: integer, description: The webhook's HTTP status. }
        job_id: { type: integer, description: The AWX job launched. }
        workflow_id: { type: string, description: The custom workflow's Temporal ID. }
        response: { type: string, description: "What came back, its first 4 KB." }
        error: { type: string }
        duration_ms: { type: integer }
    SubscriptionRunDetail:
      allOf:
        - $ref: "#/components/schemas/SubscriptionRun"
        - type: object
          required: [payload, history]
          properties:
            payload: { $ref: "#/components/schemas/IntegrationEvent" }
            properties:
              type: object
              description: Properties a blocking run set on the deployment.
              additionalProperties: { type: string }
            changes: { $ref: "#/components/schemas/MachineChange" }
            history:
              type: array
              description: Its calls, oldest first.
              items: { $ref: "#/components/schemas/SubscriptionRunAttempt" }
    SubscriptionRunPage:
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/SubscriptionRun" }

    # ── Custom workflows (ADR-0022) ──
    WorkflowUsage:
      type: string
      enum: [catalog_item, day2_action, subscription_target, composite_step, resource_type]
    WorkflowDay2:
      type: object
      description: "How it is offered as the day-2 action `wf.<key>`."
      required: [name, types]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80, examples: [Decommission] }
        types:
          type: array
          minItems: 1
          items: { type: string, enum: [vsphere.vm, deployment] }
        condition: { type: string, description: "CEL over the day-2 policy variables; empty: everywhere." }
        offered: { type: boolean, default: false }
    WorkflowRegistrationWrite:
      type: object
      required: [title, workflow_type, task_queue, usages]
      additionalProperties: false
      properties:
        key:
          type: string
          pattern: "^[a-z][a-z0-9-]{1,40}$"
          description: "Its name in rvav, set when registering (ignored on update)."
        title: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 2000 }
        workflow_type:
          type: string
          pattern: "^[A-Za-z][A-Za-z0-9_.-]*\\.v[0-9]+$"
          description: "The Temporal workflow type, ending with its major version."
          examples: [decommission.v1]
        task_queue: { type: string, minLength: 1 }
        input_schema:
          type: object
          description: "JSON Schema of its inputs: the form when people start it."
          additionalProperties: true
        timeout_seconds: { type: integer, minimum: 60, default: 2592000 }
        project_ids:
          type: array
          description: The projects that may use it; empty for all.
          items: { type: string }
        usages:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/WorkflowUsage" }
        day2: { $ref: "#/components/schemas/WorkflowDay2" }
        enabled: { type: boolean, default: true }
    WorkflowRegistration:
      allOf:
        - $ref: "#/components/schemas/WorkflowRegistrationWrite"
        - type: object
          required: [key, input_schema, timeout_seconds, project_ids, enabled, running, used_by, created_at]
          properties:
            running: { type: integer, description: Its runs not ended. }
            used_by:
              type: array
              description: "What uses it: items, subscriptions and composite steps."
              items: { type: string }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    WorkflowRegistrationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/WorkflowRegistration" }

    # ── Custom resource types (ADR-0056) ──
    ResourceTypeDriver:
      type: object
      description: What runs one step of a custom resource's life.
      required: [kind, name]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [workflow, awx]
          x-enum-varnames: [ResourceDriverWorkflow, ResourceDriverAwx]
          description: "`workflow`: a custom workflow registered for resource types; `awx`: an AWX job template."
        name:
          type: string
          minLength: 1
          description: The custom workflow's key, or the AWX job template's name.
          examples: [lb-create, Create load balancer]
    VariableValue:
      description: Text, a number, true or false, a list or an object; never null.
      examples: [["10.20.0.53", "10.20.0.54"]]
    VariableCreate:
      type: object
      required: [group, name, value]
      additionalProperties: false
      properties:
        group:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,40}$"
          description: "Lower-case letters, digits and underscores, starting with a letter: steps read `vars.<group>.<name>`."
          examples: [network]
        name:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,40}$"
          description: Lower-case letters, digits and underscores, starting with a letter.
          examples: [dns_servers]
        value: { $ref: "#/components/schemas/VariableValue" }
        description: { type: string, maxLength: 500 }
    VariableUpdate:
      type: object
      required: [value]
      additionalProperties: false
      properties:
        value: { $ref: "#/components/schemas/VariableValue" }
        description: { type: string, maxLength: 500 }
    Variable:
      type: object
      required: [key, group, name, value, description, used_by, created_at, updated_at]
      properties:
        key: { type: string, description: "`<group>.<name>`, as the API names it.", examples: [network.dns_servers] }
        group: { type: string, examples: [network] }
        name: { type: string, examples: [dns_servers] }
        value: { $ref: "#/components/schemas/VariableValue" }
        description: { type: string }
        used_by:
          type: array
          description: "The items whose draft or published version reads it (`item <slug>`), and the requests to run or running whose deprecated version does (`request <number>`): it can't be removed while one does. A failed request isn't one: its Retry fails on the step that reads a variable removed."
          items: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string, description: Who changed it last. }
    VariableList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Variable" }
    ResourceTypeWrite:
      type: object
      required: [title, create, delete]
      additionalProperties: false
      properties:
        key:
          type: string
          pattern: "^[a-z][a-z0-9-]{1,40}$"
          description: "Its name in blueprints (`resources[].type`) and composite steps (`resource.type`), set when it is defined (ignored on update)."
          examples: [load-balancer]
        title: { type: string, minLength: 1, maxLength: 80, examples: [Load balancer] }
        description: { type: string, maxLength: 2000 }
        create: { $ref: "#/components/schemas/ResourceTypeDriver" }
        delete: { $ref: "#/components/schemas/ResourceTypeDriver" }
        update: { $ref: "#/components/schemas/ResourceTypeDriver" }
        read: { $ref: "#/components/schemas/ResourceTypeDriver" }
        property_schema:
          type: object
          description: |
            JSON Schema of its properties: what create returns (a custom
            workflow's result, an AWX job's artifacts). Blueprints and later
            steps may read the properties it lists; their titles label them
            on the deployment page.
          additionalProperties: true
        actions:
          type: array
          description: "The day-2 actions offered on its resources: custom workflows (`wf.<key>`) and AWX actions (`awx.<template>`)."
          items: { type: string, examples: [wf.lb-drain] }
        enabled:
          type: boolean
          description: "Items may use it. A disabled type's resources are still deleted. Left out, it is true: a change that leaves it out turns the type on, so send `false` to keep it off."
    ResourceType:
      allOf:
        - $ref: "#/components/schemas/ResourceTypeWrite"
        - type: object
          required: [key, property_schema, actions, enabled, resources, used_by, created_at, updated_at]
          properties:
            resources: { type: integer, description: How many resources of it deployments have. }
            used_by:
              type: array
              description: The items whose published or draft versions use it.
              items: { type: string }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    ResourceTypeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ResourceType" }
