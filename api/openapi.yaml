    LeasePolicy:
      type: object
      required: [environment, max_extensions, grace_days, expiry_action]
      properties:
        environment: { $ref: "#/components/schemas/EnvironmentKey" }
        project_id:
          type: [string, "null"]
          description: A project's override of the environment's policy; null for the environment's own.
        default_days: { type: [integer, "null"], minimum: 1, description: Null for no lease. }
        max_days: { type: [integer, "null"], minimum: 1 }
        max_extensions: { type: integer, minimum: 0 }
        grace_days: { type: integer, minimum: 0 }
        expiry_action: { $ref: "#/components/schemas/LeaseExpiryAction" }
        enforcement:
          $ref: "#/components/schemas/PolicyEnforcement"
          description: |
            Hard (when absent): a request beyond `max_days` is refused, and
            an extension beyond it or `max_extensions` asks the project's
            approvers. Soft: both warn the requester, who may go on. A
            project admin's override of a hard policy stays hard.
        max_lifetime_days:
          type: [integer, "null"]
          minimum: 1
          description: |
            How long a deployment lives in all, in days from its creation
