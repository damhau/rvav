      summary: A subscription's runs, newest first
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/SubscriptionRunStatus" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: A page of runs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionRunPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/subscription-runs/{id}:
    parameters:
      - { $ref: "#/components/parameters/IdPath" }
    get:
      tags: [admin]
      operationId: getSubscriptionRun
      summary: One run, with its payload and every attempt
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionRunDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/subscription-runs/{id}/retry:
    parameters:
      - { $ref: "#/components/parameters/IdPath" }
    post:
      tags: [admin]
      operationId: retrySubscriptionRun
      summary: Deliver a failed run again (not blocking runs, which belonged to their request)
      responses:
        "200":
          description: The run, waiting to be delivered again
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionRun" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/workflows:
    get:
      tags: [admin]
      operationId: listWorkflows
