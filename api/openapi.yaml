        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApiTokenCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiTokenCreated" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /tokens/{id}:
    parameters:
      - { $ref: "#/components/parameters/IdPath" }
    delete:
      tags: [identity]
      operationId: revokeApiToken
      summary: Revoke a token (one's own, or anyone's for administrators)
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /audit:
    get:
      tags: [admin]
      operationId: listAuditEvents
      summary: The audit log, newest first
      description: Administrators and auditors see everything; project admins see their projects' events.
      parameters:
        - { $ref: "#/components/parameters/Search" }
        - name: actor
          in: query
          description: A user ID.
          schema: { type: string }
        - name: action
          in: query
          description: An action or a prefix ending in `.`, for example `catalog.`.
          schema: { type: string }
        - { $ref: "#/components/parameters/ProjectIdQuery" }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: format
          in: query
          description: csv answers every matching event as a CSV file.
          schema: { type: string, enum: [json, csv], default: json }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventPage" }
            text/csv:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /events:
    get:
      tags: [events]
      operationId: streamEvents
      summary: Live updates as Server-Sent Events
      description: |
        One stream per browser tab. Each SSE message has `id`, `event` (the
        event type) and `data` (the JSON `Event` below). The server sends a
        `heartbeat` event every 15 seconds. On reconnect, send
        `Last-Event-ID` to receive what was missed; if that is too old, the
        server sends `resync` and the client should refetch its queries.

        Only events the caller is allowed to see are sent.
      parameters:
        - name: topics
          in: query
          required: true
          description: |
            Comma-separated topics: `requests`, `deployments`, `notifications`,
            `approvals` (approvals the caller may decide), or a single object
            such as `request:<id>` or `deployment:<id>`. `requests` and
            `deployments` are limited to `project_id`.
          schema: { type: string, examples: ["requests,deployments,notifications"] }
        - { $ref: "#/components/parameters/ProjectIdQuery" }
        - name: Last-Event-ID
          in: header
          schema: { type: string }
      responses:
        "200":
          description: An open event stream
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/Event" }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: |
        An OIDC access token (JWT) from the organisation's identity provider,
        or an rvav API token (prefix `rvav_pat_`) for automation.

  parameters:
    ProjectIdPath:
      name: projectId
      in: path
      required: true
      schema: { type: string }
    ProjectIdQuery:
      name: project_id
      in: query
      schema: { type: string }
    ProjectIdQueryRequired:
      name: project_id
      in: query
      required: true
      schema: { type: string }
    ItemIdPath:
      name: itemId
      in: path
      required: true
      description: Catalog item ID or slug.
      schema: { type: string }
    VersionIdPath:
      name: versionId
      in: path
      required: true
      description: Catalog item version ID.
      schema: { type: string }
    DeploymentIdPath:
      name: deploymentId
      in: path
      required: true
      schema: { type: string }
    ApprovalIdPath:
      name: approvalId
      in: path
      required: true
      schema: { type: string }
    RequestIdPath:
      name: requestId
      in: path
      required: true
      description: Request ID or number (for example `REQ-10491`).
      schema: { type: string }
    UserIdPath:
      name: userId
      in: path
      required: true
      schema: { type: string }
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string }
    KeyPath:
      name: key
      in: path
      required: true
      schema: { type: string }
    IntegrationKindPath:
      name: kind
      in: path
      required: true
      schema: { $ref: "#/components/schemas/IntegrationKind" }
    Search:
      name: q
      in: query
      description: Free-text search.
      schema: { type: string, maxLength: 200 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` from the previous page.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        A client-generated UUID. Retrying with the same key and body returns
        the original response; the same key with a different body returns 409.
        Keys are kept for 24 hours.
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: The request is malformed
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Missing or invalid token
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: The caller is not allowed to do this
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Not found, or not visible to the caller
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: The current state does not allow this, or an idempotency key was reused with a different body
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ValidationFailed:
      description: One or more inputs are invalid. See `errors`.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UpstreamError:
      description: vCenter, EfficientIP or AWX did not answer or returned an error
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    # ── Ansible ───────────────────────────────────────────────────────────
    AnsibleInventory:
      type: object
      description: "`_meta.hostvars`, `all.children`, and one object per group with its `hosts`."
      required: [_meta, all]
      additionalProperties: true
      properties:
        _meta:
          type: object
          required: [hostvars]
          properties:
            hostvars:
              type: object
              additionalProperties: { type: object, additionalProperties: true }
        all:
          type: object
          required: [children]
          properties:
            children:
              type: array
              items: { type: string }

    # ── Admin ─────────────────────────────────────────────────────────────
    AwxTemplateList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AwxTemplate" }
    AwxTemplate:
      type: object
      required: [template_id, name, workflow, survey_changed, survey_diff, warnings, gone, synced_at]
      properties:
        template_id: { type: integer, description: The template's ID in AWX. }
        name: { type: string }
        workflow: { type: boolean }
        item_id: { type: string, description: The catalog item made from it. }
        item_name: { type: string }
        survey_changed:
          type: boolean
          description: The survey changed in AWX since the item's form was made from it.
        survey_diff:
          type: array
          items: { type: string }
          example: ["listen_port: maximum 65535 → 32767", "scrape_interval added (integer)"]
        warnings:
          type: array
          description: Launch settings or survey questions rvav can't use as meant.
          items: { type: string }
        gone:
          type: boolean
          description: AWX no longer has it, or it lost the label; the item stays.
        modified_at: { type: string, format: date-time, description: When AWX last changed it. }
        synced_at: { type: string, format: date-time }
    AwxActionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AwxAction" }
    AwxAction:
      type: object
      required: [key, name, description, template_id, template, workflow, types, condition, enabled, warnings, gone, synced_at]
      properties:
        key: { type: string, description: "The day-2 action's key: `awx.` and the template's name.", examples: [awx.install-monitoring-agent] }
        name: { type: string, examples: [Install monitoring agent] }
        description: { type: string, description: The template's description in AWX. }
        template_id: { type: integer, description: The template's ID in AWX. }
        template: { type: string, description: The template's name in AWX. }
        workflow: { type: boolean }
        types:
          type: array
          description: What it runs on.
          items: { type: string, enum: [vsphere.vm, deployment] }
        condition:
          type: string
          description: |
            A CEL expression over the day-2 policy variables (`resource`,
            `deployment`, `project`, `environment`, `user`); the action is
            offered only where it is true. Empty: everywhere.
          examples: ["resource.os_family == 'linux'"]
        enabled: { type: boolean, description: Offered on deployments. }
        fields:
          type: array
          description: The form's fields, from the survey.
          items: { type: string }
        warnings:
          type: array
          description: Launch settings or survey questions rvav can't use as meant.
          items: { type: string }
        gone:
          type: boolean
          description: AWX no longer has it, or it lost the label; it is no longer offered.
        synced_at: { type: string, format: date-time }
    AwxActionUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        types:
          type: array
          minItems: 1
          items: { type: string, enum: [vsphere.vm, deployment] }
        condition: { type: string, maxLength: 2000 }
        enabled: { type: boolean }
    # ── Catalog administration (ADR-0019) ─────────────────────────────────
    AdminCatalogItemPage:
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/AdminCatalogItem" }
    AdminCatalogItem:
      type: object
      required: [id, slug, name, summary, description_md, category, type, icon, tags, featured, source, versions, entitlements, requested, created_at]
      properties:
        id: { type: string }
        slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,62}$" }
        name: { type: string }
        summary: { type: string }
        description_md: { type: string }
        category: { type: string }
        type: { $ref: "#/components/schemas/CatalogItemType" }
        icon: { type: string }
        tags:
          type: array
          items: { type: string }
        featured: { type: boolean }
        source:
          type: object
          required: [kind]
          properties:
            kind: { type: string, enum: [native, awx] }
            awx_template_id: { type: integer }
            awx_template_name: { type: string }
        published_version: { $ref: "#/components/schemas/CatalogItemVersion" }
        draft_version: { $ref: "#/components/schemas/CatalogItemVersion" }
        versions:
          type: array
          description: Every version, newest first.
          items: { $ref: "#/components/schemas/CatalogItemVersion" }
        entitlements: { $ref: "#/components/schemas/CatalogEntitlements" }
        requested:
          type: boolean
          description: Requests were made from it, so it can't be deleted.
        created_at: { type: string, format: date-time }
    CatalogItemVersion:
      type: object
      required: [id, number, state, changelog, created_at, deployments, revision]
      properties:
        id: { type: string }
        number: { type: string, examples: ["1.1"] }
        revision:
          type: integer
          description: |
            Goes up each time a draft is saved. A save that names the
            revision it started from (`base_revision`) is refused with 409
            when the draft changed since.
        state: { type: string, enum: [draft, published, deprecated] }
        changelog: { type: string }
        created_at: { type: string, format: date-time }
        created_by: { $ref: "#/components/schemas/UserRef" }
        published_at: { type: string, format: date-time }
        deprecated_at: { type: string, format: date-time }
        deployments:
          type: integer
          description: Deployments made from this version and not deleted.
    CatalogItemVersionDetail:
      allOf:
        - $ref: "#/components/schemas/CatalogItemVersion"
        - type: object
          required: [definition]
          properties:
            definition: { $ref: "#/components/schemas/CatalogVersionDefinition" }
    CatalogVersionDefinition:
      type: object
      required: [form_schema, ui_schema, initial_values, blueprint]
      properties:
        form_schema:
          type: object
          description: JSON Schema (draft 2020-12) of the inputs.
          additionalProperties: true
        ui_schema: { $ref: "#/components/schemas/UiSchema" }
        initial_values:
          type: object
          additionalProperties: true
        blueprint:
          type: object
          description: What the request builds or runs, for the item's type (docs/service-catalog.md).
          additionalProperties: true
    CatalogItemCreate:
      type: object
      required: [slug, name, summary, category, type]
      additionalProperties: false
      properties:
        slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,62}$" }
        name: { type: string, minLength: 1, maxLength: 80 }
        summary: { type: string, minLength: 1, maxLength: 200 }
        description_md: { type: string, maxLength: 20000 }
        category: { type: string }
        type:
          $ref: "#/components/schemas/CatalogItemType"
          description: "`composite` and `workflow` items are defined in their blueprint (ADR-0022)."
        icon: { type: string, description: "One of `/admin/catalog/icons`." }
        tags:
          type: array
          items: { type: string, maxLength: 40 }
        featured: { type: boolean }
        definition: { $ref: "#/components/schemas/CatalogVersionDefinition" }
    CatalogItemUpdate:
      type: object
      additionalProperties: false
      properties:
        slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,62}$" }
        name: { type: string, minLength: 1, maxLength: 80 }
        summary: { type: string, minLength: 1, maxLength: 200 }
        description_md: { type: string, maxLength: 20000 }
        category: { type: string }
        icon: { type: string }
        tags:
          type: array
          items: { type: string, maxLength: 40 }
        featured: { type: boolean }
    CatalogItemVersionCreate:
      type: object
      additionalProperties: false
      properties:
        from_version_id:
          type: string
          description: Copy this version's definition. The published version when neither this nor `definition` is given.
        definition: { $ref: "#/components/schemas/CatalogVersionDefinition" }
        number: { type: string, maxLength: 20, description: "Default: the next number after the newest version's." }
        changelog: { type: string, maxLength: 2000 }
    CatalogItemVersionUpdate:
      type: object
      required: [definition]
      additionalProperties: false
      properties:
        definition: { $ref: "#/components/schemas/CatalogVersionDefinition" }
        number: { type: string, maxLength: 20 }
        changelog: { type: string, maxLength: 2000 }
        base_revision:
          type: integer
          description: The revision this save started from; 409 when the draft changed since.
    CatalogItemVersionPublish:
      type: object
      additionalProperties: false
      properties:
        changelog: { type: string, maxLength: 2000, description: Replaces a draft's changelog. }
    CatalogVersionDiff:
      type: object
      required: [from, to, changes]
      properties:
        from: { $ref: "#/components/schemas/CatalogItemVersion" }
        to: { $ref: "#/components/schemas/CatalogItemVersion" }
        changes:
          type: array
          items: { $ref: "#/components/schemas/CatalogVersionChange" }
    CatalogVersionChange:
      type: object
      required: [area, path, change, summary]
      properties:
        area: { type: string, enum: [form_schema, ui_schema, initial_values, blueprint] }
        path: { type: string, description: JSON pointer in the area., examples: [/properties/size/enum] }
        change: { type: string, enum: [added, removed, changed] }
        summary: { type: string, examples: ["size: XL added"] }
        from: { description: The old value. }
        to: { description: The new value. }
    CatalogEntitlements:
      type: object
      required: [all_projects, project_ids]
      properties:
        all_projects:
          type: boolean
          description: Open to every project, those made later included.
        project_ids:
          type: array
          description: The projects it is open to when not all of them.
          items: { type: string }
        projects:
          type: array
          readOnly: true
          description: Every project, to choose from.
          items:
            type: object
            required: [id, code, name]
            properties:
              id: { type: string }
              code: { type: string }
              name: { type: string }
    CatalogImportResult:
      type: object
      required: [item_id, created, versions]
      properties:
        item_id: { type: string }
        created: { type: boolean, description: A new item was made. }
        versions:
          type: array
          items: { $ref: "#/components/schemas/CatalogItemVersion" }
    AdminCatalogCategoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminCatalogCategory" }
    AdminCatalogCategory:
      type: object
      required: [key, name]
      properties:
        key: { type: string, pattern: "^[a-z][a-z0-9-]{1,30}$" }
        name: { type: string, minLength: 1, maxLength: 60 }
        sort_order: { type: integer }
        items: { type: integer, readOnly: true, description: Items in the category. }
    AdminCatalogCategoryUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        sort_order: { type: integer }
    DesignerPreviewQuery:
      type: object
      required: [project_id, inputs]
      properties:
        project_id: { type: string }
        environment: { $ref: "#/components/schemas/EnvironmentKey" }
        as_user_id:
          type: string
          description: Preview as this user (their roles and groups in the project). Default the caller.
        inputs:
          type: object
          additionalProperties: true
    DesignerPreview:
      type: object
      required: [form, fields, errors]
      properties:
        form: { $ref: "#/components/schemas/RequestForm" }
        fields: { $ref: "#/components/schemas/FieldStates" }
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
    FieldStates:
      type: object
      description: |
        Each input's rule results (UiRules) for the current inputs, as the
        server evaluated them; the form shows them instead of evaluating
        CEL itself.
      additionalProperties: { $ref: "#/components/schemas/FieldState" }
    FieldState:
      type: object
      required: [visible, required, read_only]
      properties:
        visible: { type: boolean }
        required: { type: boolean }
        read_only: { type: boolean }
        value: { description: The value a `value` rule computed. }
        error: { type: string, description: "A rule that could not be evaluated (for the designer)." }
    SecretList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Secret" }
    Secret:
      type: object
      required: [name, kind, description, created_at, updated_at]
      description: A stored secret. Its value is never returned.
      properties:
        name: { type: string, pattern: "^[a-z][a-z0-9-]{1,62}$" }
        kind: { type: string, enum: [token, basic, header] }
        description: { type: string }
        username: { type: string, description: For `basic`. }
        header: { type: string, description: "For `header`: the header's name." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        used_by:
          type: array
          description: Items whose versions use it.
          items: { type: string }
    SecretWrite:
      type: object
      required: [name, kind, value]
      additionalProperties: false
      properties:
        name: { type: string, pattern: "^[a-z][a-z0-9-]{1,62}$" }
        kind: { type: string, enum: [token, basic, header] }
        description: { type: string, maxLength: 200 }
        username: { type: string }
        header: { type: string }
        value: { type: string, minLength: 1, writeOnly: true }
    IpamReconcile:
      type: object
      required: [checked_at, managed_addresses, managed_records, orphan_addresses, orphan_records, missing]
      properties:
        checked_at: { type: string, format: date-time }
        managed_addresses:
          type: integer
          description: Addresses in EfficientIP with rvav_managed=1.
        managed_records:
          type: integer
          description: DNS records in EfficientIP with rvav_managed=1.
        orphan_addresses:
          type: array
          items: { $ref: "#/components/schemas/IpamOrphanAddress" }
        orphan_records:
          type: array
          items: { $ref: "#/components/schemas/IpamOrphanRecord" }
        missing:
          type: array
          description: What deployments own that EfficientIP no longer has.
          items: { $ref: "#/components/schemas/IpamMissing" }
    IpamOrphanAddress:
      type: object
      required: [efficientip_id, ip, name, subnet]
      properties:
        efficientip_id: { type: string }
        ip: { type: string }
        name: { type: string }
        subnet: { type: string, description: "The subnet, as a CIDR (its name when EfficientIP doesn't give its range).", example: 10.31.10.0/24 }
    IpamOrphanRecord:
      type: object
      required: [efficientip_id, fqdn, type, value]
      properties:
        efficientip_id: { type: string }
        fqdn: { type: string }
        type: { type: string, example: A }
        value: { type: string }
    IpamMissing:
      type: object
      required: [resource_id, deployment_id, deployment_name, type, name]
      properties:
        resource_id: { type: string }
        deployment_id: { type: string }
        deployment_name: { type: string }
        type: { type: string, enum: [ipam.address, dns.record] }
        name: { type: string, example: A web-dev-app001.corp.example }
        efficientip_id: { type: string }

    # ── Common ────────────────────────────────────────────────────────────
    Problem:
      description: RFC 9457 problem details.
      type: object
      required: [type, title, status, request_id]
      properties:
        type:
          type: string
          description: A URI identifying the problem type, for example `https://rvav.dev/problems/quota-exceeded`.
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        request_id:
          type: string
          description: Correlation ID, also in the `X-Request-Id` response header. Quote it to support.
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: JSON pointer into the submitted inputs, for example `/inputs/memory_gb`. Empty for form-level errors.
        code:
          type: string
          description: Stable machine code, for example `required`, `maximum`, `name_taken`, `quota_exceeded`.
        message: { type: string }

    PageInfo:
      type: object
      properties:
        next_cursor:
          type: [string, "null"]
          description: Null on the last page.

    UserRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }

    # ── Identity and projects ─────────────────────────────────────────────
    Me:
      type: object
      required: [user, global_roles, projects]
      properties:
        user: { $ref: "#/components/schemas/UserRef" }
        title: { type: string, description: Job title from the identity provider. }
        global_roles:
          type: array
          items:
            type: string
            enum: [admin, catalog-admin, auditor, user]
        projects:
          type: array
          description: |
            Projects the caller works in: their memberships, and every project
            for administrators (as project-admin) and auditors (as viewer).
            Empty for someone who only approves.
          items:
            type: object
            required: [project, role]
            properties:
              project: { $ref: "#/components/schemas/ProjectRef" }
              role: { $ref: "#/components/schemas/ProjectRole" }

    ProjectRole:
      type: string
      enum: [project-admin, member, viewer]

    EnvironmentKey:
      type: string
      pattern: "^[a-z][a-z0-9]{1,9}$"
      examples: [dev, tst, prd]

    Environment:
      type: object
      required: [key, name, production, order]
      properties:
        key: { $ref: "#/components/schemas/EnvironmentKey" }
        name: { type: string, examples: [Production] }
        production:
          type: boolean
          description: Production environments are highlighted in the UI and usually carry stricter policies.
        order: { type: integer, description: Display order. }

    ProjectRef:
      type: object
      required: [id, code, name]
      properties:
        id: { type: string }
        code:
          type: string
          description: Short code used in names, for example `web` in `web-prd-front001`.
          pattern: "^[a-z][a-z0-9]{1,7}$"
        name: { type: string }

    Project:
      allOf:
        - $ref: "#/components/schemas/ProjectRef"
        - type: object
          required: [environments]
          properties:
            description: { type: string }
            cost_center: { type: string }
            environments:
              type: array
              description: Environments this project may deploy to.
              items: { $ref: "#/components/schemas/EnvironmentKey" }
            my_role:
              oneOf:
                - $ref: "#/components/schemas/ProjectRole"
                - type: "null"

    ProjectPage:
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Project" }

    QuotaResource:
      type: string
      enum: [vcpu, memory_gb, storage_gb, vm_count]

    QuotaUsage:
      type: object
      required: [project_id, lines]
      properties:
        project_id: { type: string }
        environment:
          oneOf:
            - $ref: "#/components/schemas/EnvironmentKey"
            - type: "null"
        lines:
          type: array
          items:
            type: object
            required: [resource, used, reserved]
            properties:
              resource: { $ref: "#/components/schemas/QuotaResource" }
              limit:
                type: [integer, "null"]
                description: Null when unlimited.
              used: { type: integer, description: Allocated by existing deployments. }
              reserved: { type: integer, description: Held by requests that are approved or running but not finished. }
              enforcement: { type: string, enum: [hard, soft] }

    # ── Catalog ───────────────────────────────────────────────────────────
    CatalogItemType:
      type: string
      enum: [vm_blueprint, awx_job_template, awx_workflow, composite, workflow]

    CatalogCategory:
      type: object
      required: [key, name, item_count]
      properties:
        key: { type: string }
        name: { type: string }
        item_count: { type: integer }

    ApprovalHint:
      type: string
      description: |
        Shown on catalog cards. `conditional` means some inputs (for example a
        production environment) trigger an approval policy. The exact path is
        returned by `/requests/preview`.
      enum: [never, conditional, always]

    CatalogItem:
      type: object
      required: [id, slug, name, summary, category, type, icon, version, approval, favourite, source]
      properties:
        id: { type: string }
        slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,62}$" }
        name: { type: string }
        summary: { type: string, maxLength: 200 }
        description_md: { type: string, description: Markdown. }
        category: { type: string, description: Category key. }
        type: { $ref: "#/components/schemas/CatalogItemType" }
        icon: { type: string, description: "Icon name from the UI icon set, or `upload:<id>` for a custom SVG." }
        tags:
          type: array
          items: { type: string }
        version: { $ref: "#/components/schemas/CatalogItemVersionRef" }
        typical_duration_seconds:
          type: [integer, "null"]
          description: Median duration of the last 30 successful requests.
        approval: { $ref: "#/components/schemas/ApprovalHint" }
        favourite: { type: boolean }
        featured: { type: boolean }
        requests_last_30_days: { type: integer }
        source:
          type: object
          required: [kind]
          properties:
            kind: { type: string, enum: [native, awx] }
            awx_template_id: { type: integer }
            awx_template_name: { type: string }

    CatalogItemVersionRef:
      type: object
      required: [id, number]
      properties:
        id: { type: string }
        number:
          type: string
          description: Display version, for example `3.2`, or `AWX #47` for an imported template.
        published_at: { type: string, format: date-time }

    CatalogItemPage:
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/CatalogItem" }

    # ── Forms ─────────────────────────────────────────────────────────────
    RequestForm:
      type: object
      required: [item_id, version_id, schema, ui_schema, initial_values]
      properties:
        item_id: { type: string }
        version_id: { type: string }
        schema:
          type: object
          description: JSON Schema (draft 2020-12) of `inputs`. The server validates against it on preview and submit.
          additionalProperties: true
        ui_schema: { $ref: "#/components/schemas/UiSchema" }
        initial_values:
          type: object
          description: Defaults, including values computed for this user and project.
          additionalProperties: true
        one_deployment:
          type: boolean
          description: |
            The item builds one deployment however many VMs (a blueprint with
            components, ADR-0024): how many of each is in the form, and the
            request's `count` stays 1.

    UiSchema:
      type: object
      required: [layout, fields]
      properties:
        layout:
          type: object
          required: [kind, sections]
          properties:
            kind: { type: string, enum: [page, wizard] }
            sections:
              type: array
              items: { $ref: "#/components/schemas/UiSection" }
        fields:
          type: object
          description: Presentation and behaviour per input, keyed by the input's name in `schema`.
          additionalProperties: { $ref: "#/components/schemas/UiField" }

    UiSection:
      type: object
      required: [key, title, fields]
      properties:
        key: { type: string }
        title: { type: string }
        description: { type: string }
        columns: { type: integer, minimum: 1, maximum: 4, default: 2 }
        fields:
          type: array
          description: Input names, in display order.
          items: { type: string }

    UiWidget:
      type: string
      enum:
        - text
        - textarea
        - number
        - slider
        - toggle
        - select
        - multiselect
        - segmented
        - radio_cards
        - checklist
        - date
        - datetime
        - tags
        - key_value
        - datagrid
        - secret
        - info
        - computed
        - vsphere_cluster
        - vsphere_datastore
        - vsphere_network
        - vsphere_template
        - vsphere_folder
        - vsphere_vm
        - ipam_subnet
        - ipam_address
        - dns_zone
        - awx_inventory
        - awx_credential
        - project
        - user
        - deployment

    UiField:
      type: object
      required: [widget, label]
      properties:
        widget: { $ref: "#/components/schemas/UiWidget" }
        label: { type: string }
        help: { type: string }
        placeholder: { type: string }
        options:
          type: array
          description: Static options. Ignored when `value_source` is set.
          items: { $ref: "#/components/schemas/Option" }
        value_source: { $ref: "#/components/schemas/ValueSource" }
        depends_on:
          type: array
          description: Inputs whose change re-resolves this field's value source and rules.
          items: { type: string }
        rules: { $ref: "#/components/schemas/UiRules" }
        secret:
          type: boolean
          description: Stored encrypted, never returned by the API, passed to AWX only at launch.
        expose_to_inventory:
          type: boolean
          description: Published as a host variable in the AWX dynamic inventory.
        approver_editable:
          type: boolean
          description: Approvers may change this input, within its schema, when they approve.

    UiRules:
      type: object
      description: |
        CEL expressions over `inputs`, `project`, `user` and `environment`.
        The server evaluates them on preview and submit and returns the
        results in `fields`; the UI shows those.
      properties:
        visible: { type: string, examples: ['inputs.environment != "prd"'] }
        required: { type: string }
        read_only: { type: string }
        value:
          type: string
          description: Computed value. The field becomes read-only.

    ValueSource:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [builtin, rest, cel]
        name:
          type: string
          description: |
            For `builtin`: `vsphere.clusters`, `vsphere.datastores`,
            `vsphere.networks`, `vsphere.templates`, `vsphere.folders`,
            `ipam.subnets`, `ipam.next_free_address`, `dns.zones`,
            `awx.inventories`, `awx.credentials`, `naming.preview`, and
            `rvav.templates` and `rvav.sizes` (what is offered to the
            project and environment; ADR-0020).
          examples: [vsphere.datastores]
        params:
          type: object
          description: |
            Source parameters. String values may reference inputs, for example `${inputs.cluster}`.
            For `rest`: `url` (a host of RVAV_REST_SOURCE_HOSTS), `method` (GET or POST), `body`,
            `secret` (a stored secret's name), `items` (JSONPath to the list), `value`, `label`
            and `meta` (JSONPath in each item), `cache_seconds`. For `cel`: `options` (an
            expression giving a list of strings or of {value, label, meta}) or `value`.
          additionalProperties: true

    Option:
      type: object
      required: [value, label]
      properties:
        value: { type: string }
        label: { type: string }
        meta:
          type: string
          description: Secondary text, for example `18.4 TB free`.
        description:
          type: string
          description: A longer explanation, shown under the option (checklists, radio cards).
        disabled: { type: boolean }
        disabled_reason: { type: string }

    FieldValuesQuery:
      type: object
      required: [version_id, project_id, field, inputs]
      properties:
        version_id: { type: string }
        project_id: { type: string }
        environment:
          $ref: "#/components/schemas/EnvironmentKey"
          description: |
            Target environment of the draft. Sources such as `vsphere.clusters`,
            `vsphere.networks` and `naming.preview` depend on it. A field whose
            `depends_on` lists `$environment` must be re-resolved when it changes.
        field: { type: string, description: Input name. }
        inputs:
          type: object
          description: Current form values.
          additionalProperties: true
        search:
          type: string
          description: Text typed in a searchable select.
        as_user_id:
          type: string
          description: |
            Catalog admins only: resolve as this user would (the form
            designer's "preview as"), for any version of any item.

    FieldValues:
      type: object
      required: [field]
      properties:
        field: { type: string }
        options:
          type: array
          items: { $ref: "#/components/schemas/Option" }
        value:
          description: For computed fields and sources such as `naming.preview` or `ipam.next_free_address`.
        default:
          type: string
          description: Suggested option value when the current value is empty or no longer valid.
        cache_seconds:
          type: integer
          description: How long the client may reuse this answer for the same inputs.

    # ── Requests ──────────────────────────────────────────────────────────
    RequestDraft:
      type: object
      required: [catalog_item_id, version_id, project_id, environment, inputs]
      properties:
        catalog_item_id: { type: string }
        version_id: { type: string }
        project_id: { type: string }
        environment: { $ref: "#/components/schemas/EnvironmentKey" }
        inputs:
          type: object
          additionalProperties: true
        count:
          type: integer
          minimum: 1
          maximum: 20
          default: 1
          description: Number of identical deployments to create.
        on_behalf_of:
          type: string
          description: User ID of the future owner. Needs the project-admin role.
        justification:
          type: string
          maxLength: 2000
          description: Shown to approvers.
        lease_days:
          type: [integer, "null"]
          minimum: 1
          description: Null for the policy default, or no lease where the policy allows it.
        scheduled_at:
          type: string
          format: date-time
          description: Start later instead of now. Approval, if needed, still happens first.

    SavedDraftWrite:
      type: object
      required: [draft]
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 120, description: "Shown in the list; the item's name when empty." }
        draft: { $ref: "#/components/schemas/RequestDraft" }
    SavedDraft:
      type: object
      required: [id, name, draft, catalog_item, project, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        draft: { $ref: "#/components/schemas/RequestDraft" }
        catalog_item:
          type: object
          required: [id, slug, name]
          properties:
            id: { type: string }
            slug: { type: string }
            name: { type: string }
        project: { $ref: "#/components/schemas/ProjectRef" }
        on_behalf_of:
          $ref: "#/components/schemas/UserRef"
          description: Who the draft's `on_behalf_of` is.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SavedDraftList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SavedDraft" }

    RequestPreview:
      type: object
      required: [valid, errors, quota, approval]
      properties:
        valid: { type: boolean }
        fields: { $ref: "#/components/schemas/FieldStates" }
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
        names:
          type: array
          description: VM names the naming policy would give, one per VM.
          items: { type: string }
        addresses:
          type: array
          description: Next free IP addresses, as a hint only. Reserved when the request starts.
          items: { type: string }
        placement:
          type: object
          properties:
            cluster: { type: string }
            datastore: { type: string }
            folder: { type: string }
            network: { type: string }
            subnet: { type: string }
        quota:
          type: array
          items: { $ref: "#/components/schemas/QuotaImpact" }
        approval: { $ref: "#/components/schemas/ApprovalPreview" }
        lease:
          type: object
          properties:
            default_days: { type: [integer, "null"] }
            max_days: { type: [integer, "null"] }
            expires_at: { type: [string, "null"], format: date-time }
        components:
          type: array
          description: |
            What each component of a VM item builds (ADR-0024), in its
            order; a single-VM item has one, `vm`. Absent for other items,
            composites with VM steps among them.
          items: { $ref: "#/components/schemas/PreviewComponent" }

    PreviewComponent:
      type: object
      required: [key, title, count, names, vcpu, memory_gb, storage_gb, disks, nics, anti_affinity]
      properties:
        key: { type: string, examples: [web] }
        title: { type: string, examples: [Web servers] }
        count: { type: integer, description: How many VMs it builds. }
        names:
          type: array
          description: The names its VMs would get.
          items: { type: string }
        vcpu: { type: integer, description: Per VM. }
        memory_gb: { type: integer, description: Per VM. }
        storage_gb: { type: integer, description: "Per VM, every disk." }
        os_family: { type: string, enum: [linux, windows] }
        template: { type: string }
        placement:
          type: object
          properties:
            vcenter: { type: string }
            cluster: { type: string }
            datastore: { type: string }
            folder: { type: string }
            storage_policy: { type: string }
            chosen:
              type: boolean
              description: rvav chose the cluster or datastore (they weren't given).
        disks:
          type: array
          description: Every disk, the template's first.
          items:
            type: object
            required: [size_gb]
            properties:
              size_gb: { type: integer }
              datastore: { type: string }
              storage_policy: { type: string }
        nics:
          type: array
          description: Every network adapter, the template's first.
          items:
            type: object
            required: [key, network, ipam]
            properties:
              key: { type: string }
              network: { type: string }
              ipam: { type: string, enum: [efficientip, dhcp] }
              subnet: { type: string }
              address: { type: string, description: "The next free address, as a hint only." }
        tags:
          type: array
          items: { type: string }
        anti_affinity: { type: boolean, description: Its VMs are kept on separate hosts. }

    QuotaImpact:
      type: object
      required: [resource, used, adding, exceeds]
      properties:
        resource: { $ref: "#/components/schemas/QuotaResource" }
        environment:
          $ref: "#/components/schemas/EnvironmentKey"
          description: Set for a limit of one environment; absent for the project-wide one.
        limit: { type: [integer, "null"] }
        used: { type: integer, description: Used plus reserved. }
        adding: { type: integer }
        exceeds: { type: boolean }
        enforcement: { type: string, enum: [hard, soft] }

    ApprovalPreview:
      type: object
      required: [required, policies]
      properties:
        required: { type: boolean }
        policies:
          type: array
          description: Matching approval policies, in the order their levels run.
          items:
            type: object
            required: [policy_id, name, reason, levels]
            properties:
              policy_id: { type: string }
              name: { type: string }
              reason:
                type: string
                description: Plain-language reason, for example `Production VM above 32 GB RAM`.
              levels:
                type: array
                items:
                  type: object
                  required: [approvers]
                  properties:
                    name: { type: string, examples: [Infrastructure leads] }
                    approvers:
                      type: array
                      items: { $ref: "#/components/schemas/UserRef" }
                    mode: { type: string, enum: [any, all], default: any }
        typical_wait_seconds:
          type: [integer, "null"]
          description: Median approval time for these policies over the last 30 days.

    RequestStatus:
      type: string
      enum: [pending_approval, scheduled, queued, running, succeeded, failed, rejected, cancelling, cancelled]

    RequestKind:
      type: string
      description: "`provision`: from the catalog. `day2`: an action on a deployment (ADR-0013)."
      enum: [provision, day2]

    Request:
      type: object
      required: [id, number, kind, title, status, catalog_item, version, project, environment, requester, submitted_at, progress]
      properties:
        id: { type: string }
        number: { type: string, examples: [REQ-10491] }
        kind: { $ref: "#/components/schemas/RequestKind" }
        action:
          type: object
          description: The day-2 action this request runs.
          required: [key, name]
          properties:
            key: { type: string, examples: [snapshot_create] }
            name: { type: string, examples: [Take a snapshot] }
        deployment_id:
          type: string
          description: The deployment a day-2 request acts on.
        resource:
          type: object
          description: The resource a day-2 request acts on, when it acts on one.
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        title:
          type: string
          description: For example `RHEL 9 server · web-dev-app007`.
        status: { $ref: "#/components/schemas/RequestStatus" }
        catalog_item:
          type: object
          required: [id, slug, name, type]
          properties:
            id: { type: string }
            slug: { type: string }
            name: { type: string }
            type: { $ref: "#/components/schemas/CatalogItemType" }
        version: { $ref: "#/components/schemas/CatalogItemVersionRef" }
        project: { $ref: "#/components/schemas/ProjectRef" }
        environment: { $ref: "#/components/schemas/EnvironmentKey" }
        requester: { $ref: "#/components/schemas/UserRef" }
        on_behalf_of: { $ref: "#/components/schemas/UserRef" }
        inputs:
          type: object
          description: Submitted inputs. Secret fields are replaced by `"••••"`.
          additionalProperties: true
        count: { type: integer }
        justification: { type: string }
        submitted_at: { type: string, format: date-time }
        scheduled_at: { type: [string, "null"], format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        deployment_ids:
          type: array
          items: { type: string }
        current_step:
          oneOf:
            - type: object
              required: [id, title]
              properties:
                id: { type: string }
                title: { type: string }
            - type: "null"
        progress:
          type: object
          required: [done, total]
          properties:
            done: { type: integer }
            total: { type: integer }
        error:
          oneOf:
            - type: object
              required: [step_id, message]
              properties:
                step_id: { type: string }
                message: { type: string }
            - type: "null"

    RequestPage:
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Request" }

    ApprovalStatus:
      type: string
      description: "`waiting`: an earlier level is not decided yet. `pending`: waiting for a decision."
      enum: [waiting, pending, approved, rejected, cancelled]

    ApprovalSummary:
      type: object
      required: [id, request, project, environment, requester, submitted_at, level, reasons, status, overdue, can_decide]
      properties:
        id: { type: string }
        request:
          type: object
          required: [id, number, title, status]
          properties:
            id: { type: string }
            number: { type: string }
            title: { type: string }
            status: { $ref: "#/components/schemas/RequestStatus" }
        project: { $ref: "#/components/schemas/ProjectRef" }
        environment: { $ref: "#/components/schemas/EnvironmentKey" }
        requester: { $ref: "#/components/schemas/UserRef" }
        submitted_at: { type: string, format: date-time }
        level:
          type: object
          required: [index, count, name]
          properties:
            index: { type: integer, minimum: 1, description: "1 for the first level." }
            count: { type: integer, minimum: 1 }
            name: { type: string, examples: [Infrastructure leads] }
        reasons:
          type: array
          description: Plain-language reasons from the policies, for example `Production VM above 32 GB RAM`.
          items: { type: string }
        status: { $ref: "#/components/schemas/ApprovalStatus" }
        due_at:
          type: [string, "null"]
          format: date-time
          description: When the level times out. Null when it has no timeout or is decided.
        overdue: { type: boolean }
        escalated: { type: boolean }
        can_decide:
          type: boolean
          description: Whether the caller may approve or reject this level now.

    Approval:
      allOf:
        - $ref: "#/components/schemas/ApprovalSummary"
        - type: object
          required: [rules, facts, editable_fields, approvers, mode, votes, delegates]
          properties:
            rules:
              type: array
              description: The CEL conditions that matched, for approvers who want the detail.
              items: { type: string }
            justification: { type: string, description: "The requester's reason." }
            facts:
              type: array
              description: What will be created, in a few lines (size, placement, network, quota after).
              items:
                type: object
                required: [label, value]
                properties:
                  label: { type: string }
                  value: { type: string }
            editable_fields:
              type: array
              description: Inputs the caller may change when approving. Empty unless `can_decide`.
              items: { $ref: "#/components/schemas/ApprovalEditableField" }
            group:
              type: [string, "null"]
              description: OIDC group whose members may decide.
            approvers:
              type: array
              description: Users who may decide (named, members of the group seen so far, and delegates).
              items: { $ref: "#/components/schemas/UserRef" }
            mode:
              type: string
              enum: [any, all]
              description: "`any`: one approval decides. `all`: every named approver must approve."
            votes:
              type: array
              items: { $ref: "#/components/schemas/ApprovalVote" }
            delegates:
              type: array
              items: { $ref: "#/components/schemas/UserRef" }
            on_timeout:
              type: [string, "null"]
              enum: [approve, reject, escalate, null]
            escalate_to:
              type: [array, "null"]
              items: { $ref: "#/components/schemas/UserRef" }
            decided_at: { type: [string, "null"], format: date-time }
            outcome:
              type: [string, "null"]
              description: "How the level ended, for example `Approved by Marc Keller`, or `Approved automatically: no answer within 48 h`."

    ApprovalEditableField:
      type: object
      required: [field, label, value]
      properties:
        field: { type: string, examples: [size] }
        label: { type: string }
        value: { description: The current value. }
        options:
          type: array
          description: Allowed values, for enumerated fields.
          items: { $ref: "#/components/schemas/Option" }
        minimum: { type: number }
        maximum: { type: number }

    ApprovalVote:
      type: object
      required: [user, decision, decided_at, changes]
      properties:
        user: { $ref: "#/components/schemas/UserRef" }
        decision: { type: string, enum: [approve, reject] }
        comment: { type: string }
        changes:
          type: array
          description: Inputs the approver changed.
          items:
            type: object
            required: [field, label, from, to]
            properties:
              field: { type: string }
              label: { type: string }
              from: { description: Value before. }
              to: { description: Value after. }
        decided_at: { type: string, format: date-time }

    ApprovalDecision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, reject] }
        comment:
          type: string
          maxLength: 2000
          description: Sent to the requester. Required to reject.
        inputs:
          type: object
          additionalProperties: true
          description: New values for `approver_editable` fields only.

    ApprovalDelegation:
      type: object
      required: [user_id]
      properties:
        user_id: { type: string }
        comment: { type: string, maxLength: 2000 }

    ApprovalPage:
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items, total]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/ApprovalSummary" }
            total:
              type: integer
              description: Number of approvals matching the filters, on all pages (the sidebar badge).

    Day2Action:
      type: object
      required: [key, name, group, enabled, destructive, approval]
      properties:
        key: { type: string, examples: [power_off, snapshot_create, delete] }
        name: { type: string, examples: [Power off] }
        group:
          type: string
          enum: [power, configuration, snapshots, automation, access, lifecycle]
          description: "`automation` holds the actions backed by AWX templates (ADR-0018)."
        resource_id:
          type: [string, "null"]
          description: The resource it acts on; null for actions on the whole deployment.
        resource_name: { type: string }
        enabled: { type: boolean }
        disabled_reason:
          type: string
          description: Why it can't run now, for example `The VM is already powered off.`
        destructive: { type: boolean }
        approval:
          type: object
          required: [required, reasons]
          properties:
            required: { type: boolean }
            reasons:
              type: array
              items: { type: string }
        confirm:
          type: object
          required: [message]
          properties:
            message: { type: string }
            type_to_confirm:
              type: string
              description: Text the user must type to confirm, for example the VM name.
        form: { $ref: "#/components/schemas/ActionForm" }

    ActionForm:
      type: object
      required: [schema, ui_schema, initial_values]
      properties:
        schema:
          type: object
          description: JSON Schema of `inputs`.
          additionalProperties: true
        ui_schema: { $ref: "#/components/schemas/UiSchema" }
        initial_values:
          type: object
          additionalProperties: true

    Day2Draft:
      type: object
      required: [action, inputs]
      properties:
        action: { type: string }
        resource_id: { type: string }
        inputs:
          type: object
          additionalProperties: true
        justification: { type: string, maxLength: 2000 }

    ConsoleSession:
      type: object
      required: [vmrc_url]
      properties:
        vmrc_url:
          type: string
          description: Opens VMware Remote Console. Valid once, for a few minutes.
        web:
          type: object
          description: Present when the web console is configured.
          required: [url, expires_at, sdk_urls]
          properties:
            url:
              type: string
              description: Path of the console's WebSocket on rvav; open it with `wss://` on the same host.
              examples: [/api/v1/console/Zm9v]
            expires_at: { type: string, format: date-time }
            sdk_urls:
              type: array
              description: Scripts of VMware's HTML console client (WMKS) to load, in order, for example jQuery, jQuery UI and `wmks.min.js`.
              items: { type: string }

    StepStatus:
      type: string
      enum: [pending, running, done, failed, skipped, cancelled]

    Step:
      type: object
      required: [id, key, title, status, children, has_log]
      properties:
        id: { type: string }
        key:
          type: string
          description: Stable step type, for example `ipam.reserve`, `vsphere.clone`, `awx.job`, `awx.task`.
        title: { type: string }
        detail: { type: string }
        system:
          type: string
          enum: [rvav, policy, vcenter, efficientip, awx]
        status: { $ref: "#/components/schemas/StepStatus" }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        error: { type: string, description: Present when `status` is `failed`. }
        external_ref:
          type: object
          description: The object in the external system, for linking out.
          required: [kind, id]
          properties:
            kind:
              type: string
              enum: [awx_job, awx_workflow_job, awx_inventory_update, vcenter_task, vcenter_vm, ipam_address, dns_record]
            id: { type: string }
            url: { type: string, format: uri }
        has_log: { type: boolean }
        children:
          type: array
          description: For AWX jobs, one child per task.
          items: { $ref: "#/components/schemas/Step" }

    LogChunk:
      type: object
      required: [step_id, offset, next_offset, complete, lines]
      properties:
        step_id: { type: string }
        offset: { type: integer }
        next_offset: { type: integer }
        complete:
          type: boolean
          description: True when the step has finished and no more lines will come.
        lines:
          type: array
          items:
            type: object
            required: [n, text]
            properties:
              n: { type: integer, description: "Line number, from 0." }
              text: { type: string, description: "Plain text, ANSI codes removed." }
              kind:
                type: string
                description: Hint for colouring Ansible output.
                enum: [plain, header, ok, changed, failed, skipped, unreachable, recap]

    # ── Deployments ───────────────────────────────────────────────────────
    DeploymentStatus:
      type: string
      enum: [provisioning, ready, updating, failed, deleting, deleted]

    Deployment:
      type: object
      required: [id, name, status, project, environment, catalog_item, version, owner, created_at, lease, vm_count, vms_powered_on, sync_state]
      properties:
        id: { type: string }
        name: { type: string }
        status: { $ref: "#/components/schemas/DeploymentStatus" }
        project: { $ref: "#/components/schemas/ProjectRef" }
        environment: { $ref: "#/components/schemas/EnvironmentKey" }
        catalog_item:
          type: object
          required: [id, slug, name]
          properties:
            id: { type: string }
            slug: { type: string }
            name: { type: string }
        version: { $ref: "#/components/schemas/CatalogItemVersionRef" }
        owner: { $ref: "#/components/schemas/UserRef" }
        created_at: { type: string, format: date-time }
        created_by_request_id: { type: string }
        lease: { $ref: "#/components/schemas/Lease" }
        vm_count: { type: integer }
        vms_powered_on: { type: integer }
        primary_address:
          oneOf:
            - type: object
              required: [ip]
              properties:
                ip: { type: string }
                fqdn: { type: string }
            - type: "null"
        sync_state: { $ref: "#/components/schemas/SyncState" }

    Lease:
      type: object
      required: [expires_at]
      properties:
        expires_at:
          type: [string, "null"]
          format: date-time
          description: Null when the deployment does not expire.
        extensions_used: { type: integer }
        extensions_max:
          type: [integer, "null"]
          description: Extensions the owner may make without approval.
        max_days:
          type: [integer, "null"]
          description: The longest lease one may extend to without approval, in days from now.
        grace_days:
          type: integer
          description: Days between powering off at expiry and deleting.
        expired_at:
          type: [string, "null"]
          format: date-time
          description: When the lease's expiry powered the VMs off; the deployment is deleted after the grace period.
        deletes_at:
          type: [string, "null"]
          format: date-time
          description: When the deployment will be deleted, once its lease expired.
        expiry_action: { $ref: "#/components/schemas/LeaseExpiryAction" }

    SyncState:
      type: string
      description: |
        `drifted`: changed in vCenter outside rvav. `missing`: no longer found
        in vCenter.
      enum: [in_sync, drifted, missing]

    DeploymentDetail:
      allOf:
        - $ref: "#/components/schemas/Deployment"
        - type: object
          required: [inputs, resources]
          properties:
            inputs:
              type: object
              description: Inputs of the creating request. Secret fields are replaced by `"••••"`.
              additionalProperties: true
            resources:
              type: array
              items: { $ref: "#/components/schemas/Resource" }

    DeploymentPage:
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Deployment" }

    Resource:
      oneOf:
        - $ref: "#/components/schemas/VmResource"
        - $ref: "#/components/schemas/IpAddressResource"
        - $ref: "#/components/schemas/DnsRecordResource"
        - $ref: "#/components/schemas/DrsRuleResource"
      discriminator:
        propertyName: type
        mapping:
          vsphere.vm: "#/components/schemas/VmResource"
          ipam.address: "#/components/schemas/IpAddressResource"
          dns.record: "#/components/schemas/DnsRecordResource"
          vsphere.drs_rule: "#/components/schemas/DrsRuleResource"

    ResourceBase:
      type: object
      required: [id, type, name, sync_state]
      properties:
        id: { type: string }
        type: { type: string }
        name: { type: string }
        sync_state: { $ref: "#/components/schemas/SyncState" }

    VmResource:
      allOf:
        - $ref: "#/components/schemas/ResourceBase"
        - type: object
          required: [type, vm]
          properties:
            type: { const: vsphere.vm }
            vm: { $ref: "#/components/schemas/VmProperties" }

    VmProperties:
      type: object
      required: [moref, instance_uuid, vcenter, power_state, guest_state, cpu_count, memory_mb, disks, nics]
      properties:
        moref: { type: string, examples: [vm-48217] }
        instance_uuid: { type: string, format: uuid }
        vcenter: { type: string, examples: [vc01.corp.example] }
        power_state: { type: string, enum: [on, off, suspended] }
        guest_state: { type: string, enum: [running, not_running, unknown] }
        guest_os: { type: string }
        cpu_count: { type: integer }
        memory_mb: { type: integer }
        disks:
          type: array
          items:
            type: object
            required: [label, capacity_gb]
            properties:
              label: { type: string, examples: [Hard disk 1] }
              capacity_gb: { type: integer }
              datastore: { type: string }
        nics:
          type: array
          items:
            type: object
            required: [network]
            properties:
              label: { type: string, examples: [Network adapter 1] }
              network: { type: string }
              mac: { type: string }
              ip_addresses:
                type: array
                items: { type: string }
        cpu_hot_add: { type: boolean, description: CPUs can be added while the VM runs. }
        memory_hot_add: { type: boolean, description: Memory can be added while the VM runs. }
        snapshots:
          type: array
          items:
            type: object
            required: [name, created_at]
            properties:
              name: { type: string }
              description: { type: string }
              created_at: { type: string, format: date-time }
        iso:
          type: string
          description: The ISO image mounted in the CD-ROM drive, for example `[nfs-iso] rhel-9.4.iso`.
        fqdn: { type: string }
        cluster: { type: string }
        host: { type: string }
        folder: { type: string }
        template: { type: string }
        component:
          type: string
          description: The blueprint component the VM belongs to (ADR-0024), for example `web`; `vm` for a single-VM item.
        snapshot_count: { type: integer }
        usage:
          type: object
          description: Quick stats from vCenter, refreshed at each full read of the inventory (every 2 minutes by default).
          properties:
            cpu_pct: { type: number }
            memory_pct: { type: number }
            sampled_at: { type: string, format: date-time }

    IpAddressResource:
      allOf:
        - $ref: "#/components/schemas/ResourceBase"
        - type: object
          required: [type, address, subnet]
          properties:
            type: { const: ipam.address }
            address: { type: string }
            subnet: { type: string, examples: [10.21.10.0/24] }
            efficientip_id: { type: string }

    DnsRecordResource:
      allOf:
        - $ref: "#/components/schemas/ResourceBase"
        - type: object
          required: [type, fqdn, record_type, value]
          properties:
            type: { const: dns.record }
            fqdn: { type: string }
            record_type: { type: string, enum: [A, AAAA, PTR, CNAME] }
            value: { type: string }
            zone: { type: string }

    DrsRuleResource:
      description: A DRS rule keeping a component's VMs on separate hosts (ADR-0024).
      allOf:
        - $ref: "#/components/schemas/ResourceBase"
        - type: object
          required: [type, rule]
          properties:
            type: { const: vsphere.drs_rule }
            rule:
              type: object
              required: [kind, cluster, vcenter, component, vms]
              properties:
                kind: { type: string, enum: [vm_anti_affinity] }
                cluster: { type: string }
                vcenter: { type: string }
                component: { type: string }
                vms:
                  type: array
                  description: The names of the VMs it keeps apart.
                  items: { type: string }

    # ── Events ────────────────────────────────────────────────────────────
    Event:
      oneOf:
        - $ref: "#/components/schemas/RequestUpdatedEvent"
        - $ref: "#/components/schemas/RequestStepEvent"
        - $ref: "#/components/schemas/RequestLogEvent"
        - $ref: "#/components/schemas/DeploymentUpdatedEvent"
        - $ref: "#/components/schemas/ResourceUpdatedEvent"
        - $ref: "#/components/schemas/NotificationEvent"
        - $ref: "#/components/schemas/ApprovalUpdatedEvent"
        - $ref: "#/components/schemas/ControlEvent"
      discriminator:
        propertyName: type
        mapping:
          request.updated: "#/components/schemas/RequestUpdatedEvent"
          request.step: "#/components/schemas/RequestStepEvent"
          request.log: "#/components/schemas/RequestLogEvent"
          deployment.updated: "#/components/schemas/DeploymentUpdatedEvent"
          resource.updated: "#/components/schemas/ResourceUpdatedEvent"
          notification: "#/components/schemas/NotificationEvent"
          approval.updated: "#/components/schemas/ApprovalUpdatedEvent"
          heartbeat: "#/components/schemas/ControlEvent"
          resync: "#/components/schemas/ControlEvent"

    EventBase:
      type: object
      required: [id, type, at]
      properties:
        id: { type: string, description: Same as the SSE `id`. }
        type: { type: string }
        at: { type: string, format: date-time }

    RequestUpdatedEvent:
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [type, data]
          properties:
            type: { const: request.updated }
            data: { $ref: "#/components/schemas/Request" }

    RequestStepEvent:
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [type, data]
          properties:
            type: { const: request.step }
            data:
              type: object
              required: [request_id, step]
              properties:
                request_id: { type: string }
                parent_step_id: { type: [string, "null"] }
                step: { $ref: "#/components/schemas/Step" }

    RequestLogEvent:
      description: New log lines are available. Fetch them with `getStepLog` from your last offset.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [type, data]
          properties:
            type: { const: request.log }
            data:
              type: object
              required: [request_id, step_id, next_offset]
              properties:
                request_id: { type: string }
                step_id: { type: string }
                next_offset: { type: integer }

    DeploymentUpdatedEvent:
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [type, data]
          properties:
            type: { const: deployment.updated }
            data: { $ref: "#/components/schemas/Deployment" }

    ResourceUpdatedEvent:
      description: A resource changed, for example a power state or IP reported by vCenter.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [type, data]
          properties:
            type: { const: resource.updated }
            data:
              type: object
              required: [deployment_id, resource]
              properties:
                deployment_id: { type: string }
                resource: { $ref: "#/components/schemas/Resource" }

    NotificationEvent:
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [type, data]
          properties:
            type: { const: notification }
            data:
              type: object
              required: [id, title, level]
              properties:
                id: { type: string }
                title: { type: string }
                body: { type: string }
                level: { type: string, enum: [info, success, warning, error] }
                link:
                  type: string
                  description: App path to open, for example `/requests/REQ-10491`.

    ApprovalUpdatedEvent:
      description: An approval the receiver may decide was opened, decided or changed. Refetch it.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [type, data]
          properties:
            type: { const: approval.updated }
            data:
              type: object
              required: [approval_id, request_id, status]
              properties:
                approval_id: { type: string }
                request_id: { type: string }
                status: { $ref: "#/components/schemas/ApprovalStatus" }

    ControlEvent:
      description: "`heartbeat` keeps the connection open. `resync` means missed events were dropped: refetch."
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [type]
          properties:
            type: { type: string, enum: [heartbeat, resync] }

    # ── Administration (S9, ADR-0020) ─────────────────────────────────────
    UserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/UserRef" }
    AdminProject:
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          required: [archived, created_at, members, deployments]
          properties:
            archived: { type: boolean }
            archived_at: { type: string, format: date-time }
            created_at: { type: string, format: date-time }
            members: { type: integer, description: "Members, direct or through a group." }
            deployments: { type: integer, description: Deployments not deleted. }
    AdminProjectList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminProject" }
    AdminProjectCreate:
      type: object
      required: [code, name, environments]
      additionalProperties: false
      properties:
        code: { type: string, pattern: "^[a-z][a-z0-9]{1,7}$", description: In VM names; it can't change later. }
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 500 }
        cost_center: { type: string, maxLength: 40 }
        environments:
          type: array
          items: { $ref: "#/components/schemas/EnvironmentKey" }
        project_admins:
          type: array
          description: Users made project admins of it.
          items: { type: string }
    AdminProjectUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 500 }
        cost_center: { type: string, maxLength: 40 }
        environments:
          type: array
          items: { $ref: "#/components/schemas/EnvironmentKey" }
        archived: { type: boolean }
    ProjectMember:
      type: object
      required: [user, role, direct, groups]
      properties:
        user: { $ref: "#/components/schemas/UserRef" }
        role: { $ref: "#/components/schemas/ProjectRole" }
        direct:
          type: boolean
          description: A member of the project itself (else only through groups).
        direct_role:
          $ref: "#/components/schemas/ProjectRole"
        groups:
          type: array
          description: OIDC groups that make them a member, at their last sign-in.
          items: { type: string }
    ProjectMemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ProjectMember" }
    ProjectMemberWrite:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role: { $ref: "#/components/schemas/ProjectRole" }
    GroupMapping:
      type: object
      required: [id, oidc_group, role]
      properties:
        id: { type: string }
        oidc_group: { type: string }
        project:
          oneOf:
            - $ref: "#/components/schemas/ProjectRef"
            - type: "null"
        role:
          type: string
          description: "A project role with a project (project-admin, member, viewer); a global role without (admin, catalog-admin, auditor)."
        users:
          type: integer
          description: Users in the group at their last sign-in.
    GroupMappingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GroupMapping" }
    GroupMappingWrite:
      type: object
      required: [oidc_group, role]
      additionalProperties: false
      properties:
        oidc_group: { type: string, minLength: 1, maxLength: 200 }
        project_id: { type: string }
        role: { type: string, description: "project-admin, member or viewer with a project; admin, catalog-admin or auditor without." }
    AdminEnvironment:
      allOf:
        - $ref: "#/components/schemas/Environment"
        - type: object
          required: [snapshot_max_count]
          properties:
            snapshot_max_count: { type: integer, minimum: 0, description: Snapshots kept per VM. }
            snapshot_max_age_days:
              type: [integer, "null"]
              minimum: 1
              description: Snapshots older are deleted; null keeps them.
            projects: { type: integer, readOnly: true, description: Projects that deploy to it. }
            deployments: { type: integer, readOnly: true, description: "Deployments in it, not deleted." }
    AdminEnvironmentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminEnvironment" }
    AdminEnvironmentUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        production: { type: boolean }
        order: { type: integer }
        snapshot_max_count: { type: integer, minimum: 0 }
        snapshot_max_age_days: { type: integer, minimum: 0, description: 0 keeps snapshots of any age. }
    PlacementRule:
      type: object
      required: [id, project, environment, priority, clusters, datastores, networks, folder, cluster_tags, datastore_tags, storage_policy, vcenter]
      properties:
        id: { type: string }
        project: { $ref: "#/components/schemas/ProjectRef" }
        environment: { $ref: "#/components/schemas/EnvironmentKey" }
        priority: { type: integer, description: Lower first. }
        clusters:
          type: array
          description: Cluster or resource pool names; `*` matches any text (GVA-DEV-*).
          items: { type: string }
        datastores:
          type: array
          items: { type: string }
        networks:
          type: array
          items: { type: string }
        folder: { type: string, examples: [/GVA/vm/rvav/web/dev] }
        cluster_tags:
          type: array
          description: vSphere tags (`category/tag`) a cluster must carry, all of them.
          items: { type: string }
        datastore_tags:
          type: array
          items: { type: string }
        storage_policy:
          type: string
          description: The storage policy (SPBM) of VMs placed by the rule, unless their blueprint names one (ADR-0024); empty for none.
        vcenter:
          type: string
          description: The vCenter its clusters are in; empty for any (ADR-0024). Needed when a cluster's name is in two vCenters.
    PlacementRuleWrite:
      type: object
      required: [project_id, environment, clusters, datastores, networks, folder]
      additionalProperties: false
      properties:
        project_id: { type: string }
        environment: { $ref: "#/components/schemas/EnvironmentKey" }
        priority: { type: integer, default: 100 }
        clusters: { type: array, items: { type: string } }
        datastores: { type: array, items: { type: string } }
        networks: { type: array, items: { type: string } }
        folder: { type: string }
        cluster_tags: { type: array, items: { type: string } }
        datastore_tags: { type: array, items: { type: string } }
        storage_policy: { type: string }
        vcenter: { type: string }
    PlacementRuleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PlacementRule" }
    PlacementPreview:
      type: object
      required: [clusters, datastores, networks, folder, problems]
      properties:
        clusters:
          type: array
          items: { $ref: "#/components/schemas/PreviewCluster" }
        datastores:
          type: array
          items: { $ref: "#/components/schemas/PreviewDatastore" }
        networks:
          type: array
          items: { $ref: "#/components/schemas/PreviewNetwork" }
        folder: { type: string }
        problems:
          type: array
          description: What stops a request here, for example a network with no subnet.
          items: { type: string }
    PreviewCluster:
      type: object
      required: [name, hosts, tags]
      properties:
        name: { type: string }
        hosts: { type: integer }
        tags: { type: array, items: { type: string } }
    PreviewDatastore:
      type: object
      required: [name, free_gb, clusters, tags]
      properties:
        name: { type: string }
        free_gb: { type: integer }
        clusters: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string } }
    PreviewNetwork:
      type: object
      required: [name, clusters]
      properties:
        name: { type: string }
        clusters: { type: array, items: { type: string } }
        subnet: { type: string, description: Empty when no mapping gives it a subnet. }
        dns_zone: { type: string }
        source: { type: string, enum: [manual, efficientip] }
    NetworkMapping:
      type: object
      required: [network, subnet, gateway, dns_zone, dns_servers, source]
      properties:
        network: { type: string }
        subnet: { type: string, examples: [10.31.10.0/24] }
        gateway: { type: string }
        dns_zone: { type: string }
        dns_servers: { type: array, items: { type: string } }
        source: { type: string, enum: [manual, efficientip] }
        subnet_name: { type: string, description: The subnet's name in EfficientIP. }
        synced_at: { type: string, format: date-time }
    NetworkMappingWrite:
      type: object
      required: [subnet, gateway, dns_zone]
      additionalProperties: false
      properties:
        subnet: { type: string }
        gateway: { type: string }
        dns_zone: { type: string }
        dns_servers: { type: array, items: { type: string } }
    NetworkMappingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/NetworkMapping" }
    Offer:
      type: object
      description: Where something is offered; a null project or environment means all.
      properties:
        project_id: { type: [string, "null"] }
        environment:
          oneOf:
            - $ref: "#/components/schemas/EnvironmentKey"
            - type: "null"
    VmTemplate:
      type: object
      required: [key, label, vcenter_template, content_library, os_family, customization, description, offers, in_inventory]
      properties:
        key: { type: string, pattern: "^[a-z][a-z0-9-]{1,40}$" }
        label: { type: string, examples: [RHEL 9.4] }
        vcenter_template:
          type: string
          description: A template's name in vCenter, or an item's name in `content_library`.
        content_library:
          type: string
          description: A content library whose item (VM template or OVF) `vcenter_template` is (ADR-0024); empty for a VM template.
        os_family: { type: string, enum: [linux, windows] }
        customization:
          type: string
          description: "A vCenter customization specification's name, the base of the guest customization (ADR-0024); when empty, rvav's own (hostname, network, time zone)."
        description: { type: string }
        offers:
          type: array
          items: { $ref: "#/components/schemas/Offer" }
        in_inventory: { type: boolean, readOnly: true, description: vCenter has it now. }
    VmTemplateWrite:
      type: object
      required: [key, label, vcenter_template, os_family]
      additionalProperties: false
      properties:
        key: { type: string, pattern: "^[a-z][a-z0-9-]{1,40}$" }
        label: { type: string, minLength: 1, maxLength: 80 }
        vcenter_template: { type: string, minLength: 1 }
        content_library: { type: string }
        os_family: { type: string, enum: [linux, windows] }
        customization: { type: string }
        description: { type: string, maxLength: 500 }
        offers: { type: array, items: { $ref: "#/components/schemas/Offer" } }
    VmTemplateList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/VmTemplate" }
    SizePreset:
      type: object
      required: [key, label, vcpu, memory_gb, disk_gb, offers]
      properties:
        key: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9-]{0,15}$", examples: [M] }
        label: { type: string, examples: [Medium] }
        vcpu: { type: integer, minimum: 1, maximum: 128 }
        memory_gb: { type: integer, minimum: 1, maximum: 2048 }
        disk_gb: { type: integer, minimum: 1, maximum: 65536 }
        offers: { type: array, items: { $ref: "#/components/schemas/Offer" } }
    SizePresetWrite:
      type: object
      required: [key, label, vcpu, memory_gb, disk_gb]
      additionalProperties: false
      properties:
        key: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9-]{0,15}$" }
        label: { type: string, minLength: 1, maxLength: 40 }
        vcpu: { type: integer, minimum: 1, maximum: 128 }
        memory_gb: { type: integer, minimum: 1, maximum: 2048 }
        disk_gb: { type: integer, minimum: 1, maximum: 65536 }
        offers: { type: array, items: { $ref: "#/components/schemas/Offer" } }
    SizePresetList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SizePreset" }
    NamingPolicy:
      type: object
      required: [id, name, template, counter, offers]
      properties:
        id: { type: string }
        name: { type: string }
        template:
          type: string
          description: |
            `{project}`, `{environment}`, `{role}` (an input), `{seq:03}` (the
            counter, zero-padded) and any input as `{inputs.x}`.
          examples: ["{project}-{environment}-{role}{seq:03}"]
        counter:
          type: string
          enum: [prefix, policy]
          description: One counter per name prefix (web-dev-app), or one for everything the policy names.
        offers:
          type: array
          description: Where it applies; the most specific one wins (project and environment, project, environment, all).
          items: { $ref: "#/components/schemas/Offer" }
    NamingPolicyWrite:
      type: object
      required: [name, template]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        template: { type: string, minLength: 1, maxLength: 120 }
        counter: { type: string, enum: [prefix, policy], default: prefix }
        offers: { type: array, items: { $ref: "#/components/schemas/Offer" } }
    NamingPolicyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/NamingPolicy" }
    NamingPreviewQuery:
      type: object
      required: [template, project_id, environment]
      additionalProperties: false
      properties:
        template: { type: string }
        counter: { type: string, enum: [prefix, policy], default: prefix }
        policy_id: { type: string, description: "The policy being edited, for its counter." }
        project_id: { type: string }
        environment: { $ref: "#/components/schemas/EnvironmentKey" }
        inputs: { type: object, additionalProperties: true }
        count: { type: integer, minimum: 1, maximum: 10, default: 3 }
    NamingPreview:
      type: object
      required: [names, skipped]
      properties:
        names:
          type: array
          description: The next names, nothing reserved.
          items: { type: string }
        skipped:
          type: array
          description: Names passed over because they are taken.
          items: { $ref: "#/components/schemas/NamingSkipped" }
        problem: { type: string }
    NamingSkipped:
      type: object
      required: [name, taken_in]
      properties:
        name: { type: string }
        taken_in: { type: string, enum: [vcenter, dns, rvav] }
    QuotaLimit:
      type: object
      required: [environment, resource, limit, enforcement]
      properties:
        environment:
          type: string
          description: An environment's key, or empty for the project as a whole.
        resource: { $ref: "#/components/schemas/QuotaResource" }
        limit: { type: [integer, "null"], minimum: 0, description: Null for no limit. }
        enforcement: { type: string, enum: [hard, soft] }
    QuotaLimitList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/QuotaLimit" }
    LeasePolicy:
      type: object
      required: [environment, max_extensions, grace_days, expiry_action]
      properties:
        environment: { $ref: "#/components/schemas/EnvironmentKey" }
        project_id:
          type: [string, "null"]
          description: A project's override of the environment's policy; null for the environment's own.
        default_days: { type: [integer, "null"], minimum: 1, description: Null for no lease. }
        max_days: { type: [integer, "null"], minimum: 1 }
        max_extensions: { type: integer, minimum: 0 }
        grace_days: { type: integer, minimum: 0 }
        expiry_action: { $ref: "#/components/schemas/LeaseExpiryAction" }
    LeaseExpiryAction:
      type: string
      description: "At the end of a lease: power off, then delete after the grace period; delete; or only tell the owner."
      enum: [power_off_then_delete, delete, notify_only]
    LeasePolicyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LeasePolicy" }
    ApprovalLevel:
      type: object
      required: [name]
      properties:
        name: { type: string }
        group: { type: string, description: An OIDC group whose members approve. }
        approvers: { type: array, items: { type: string }, description: User IDs. }
        mode: { type: string, enum: [any, all], default: any }
        timeout: { type: string, description: "A Go duration, for example 48h; empty for none.", examples: [48h] }
        on_timeout: { type: string, enum: [escalate, approve, reject] }
        escalate_to:
          type: object
          properties:
            group: { type: string }
            approvers: { type: array, items: { type: string } }
    ApprovalPolicyWrite:
      type: object
      required: [name, condition, levels]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        reason: { type: string, description: What the requester is told. }
        condition: { type: string, description: "CEL over inputs, environment, project, item, vm, user and quota." }
        item_type:
          oneOf:
            - $ref: "#/components/schemas/CatalogItemType"
            - type: "null"
        project_id: { type: [string, "null"] }
        levels: { type: array, items: { $ref: "#/components/schemas/ApprovalLevel" } }
        priority: { type: integer, default: 100 }
        enabled: { type: boolean, default: true }
        auto_approve: { type: [string, "null"], description: CEL; when true the policy is met without anyone. }
    ApprovalPolicy:
      allOf:
        - $ref: "#/components/schemas/ApprovalPolicyWrite"
        - type: object
          required: [id, priority, enabled, reason]
          properties:
            id: { type: string }
    ApprovalPolicyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ApprovalPolicy" }
    Day2PolicyWrite:
      type: object
      required: [name, effect]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        reason: { type: string }
        priority: { type: integer, default: 100 }
        actions:
          type: array
          description: Action keys or patterns (delete, snapshot_*, awx.*, *).
          items: { type: string }
        roles:
          type: array
          description: owner, viewer, member, project-admin, admin; empty for anyone.
          items: { type: string }
        condition: { type: string, default: "true" }
        effect: { type: string, enum: [allow, deny, approval] }
        levels: { type: array, items: { $ref: "#/components/schemas/ApprovalLevel" } }
        project_id: { type: [string, "null"] }
        enabled: { type: boolean, default: true }
    Day2Policy:
      allOf:
        - $ref: "#/components/schemas/Day2PolicyWrite"
        - type: object
          required: [id, priority, actions, roles, condition, enabled, reason]
          properties:
            id: { type: string }
    Day2PolicyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Day2Policy" }
    PolicyExplainQuery:
      type: object
      required: [project_id, environment]
      additionalProperties: false
      properties:
        project_id: { type: string }
        environment: { $ref: "#/components/schemas/EnvironmentKey" }
        item_id: { type: string, description: "A catalog item, for approval policies." }
        action: { type: string, description: "A day-2 action key, for day-2 policies." }
        inputs: { type: object, additionalProperties: true, description: Sample inputs for the conditions. }
        as_user_id: { type: string, description: Whose roles the day-2 policies see; default the caller. }
    PolicyDecision:
      type: object
      required: [decided_by, considered]
      properties:
        decided_by:
          type: [string, "null"]
          description: The policy that decides, by name; null when none applies.
        outcome: { type: string, description: "What it means here, in words." }
        considered:
          type: array
          items: { $ref: "#/components/schemas/PolicyConsidered" }
    PolicyConsidered:
      type: object
      required: [id, name, applies, why]
      properties:
        id: { type: string }
        name: { type: string }
        applies: { type: boolean }
        why: { type: string }
    PolicyExplanation:
      type: object
      required: [lease, quota, naming]
      properties:
        approval: { $ref: "#/components/schemas/PolicyDecision" }
        day2: { $ref: "#/components/schemas/PolicyDecision" }
        lease: { $ref: "#/components/schemas/PolicyDecision" }
        naming: { $ref: "#/components/schemas/PolicyDecision" }
        quota:
          type: array
          items: { $ref: "#/components/schemas/PolicyQuotaLine" }
    PolicyQuotaLine:
      type: object
      required: [resource, scope, used, reserved, enforcement]
      properties:
        resource: { $ref: "#/components/schemas/QuotaResource" }
        scope: { type: string, description: "The environment the limit is for, or empty for the project as a whole." }
        limit: { type: [integer, "null"] }
        enforcement: { type: string, enum: [hard, soft] }
        used: { type: integer }
        reserved: { type: integer, description: Held by requests not done yet. }
    NotificationKind:
      type: string
      description: What a notification is about (ADR-0023).
      enum: [request_submitted, approval_needed, request_approved, request_rejected, request_succeeded,
        request_failed, request_rolled_back, lease_expiring, lease_expired, owner_changed]
      x-enum-varnames: [KindRequestSubmitted, KindApprovalNeeded, KindRequestApproved, KindRequestRejected,
        KindRequestSucceeded, KindRequestFailed, KindRequestRolledBack, KindLeaseExpiring, KindLeaseExpired,
        KindOwnerChanged]
    NotificationChannel:
      type: string
      description: In the app is always on; the others are chosen per kind.
      enum: [in_app, email, teams, slack]
      x-enum-varnames: [ChannelInApp, ChannelEmail, ChannelTeams, ChannelSlack]
    Notification:
      type: object
      required: [id, kind, title, level, created_at]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/NotificationKind" }
        title: { type: string, examples: ["Approval needed: RHEL 9 server web-prd-front01"] }
        body: { type: string }
        level:
          type: string
          enum: [info, success, warning, error]
          x-enum-varnames: [LevelInfo, LevelSuccess, LevelWarning, LevelError]
        link: { type: string, description: "The page in rvav it is about, for example /approvals/apr_123." }
        created_at: { type: string, format: date-time }
        read_at: { type: string, format: date-time }
    NotificationPage:
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items, unread]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Notification" }
            unread: { type: integer, description: How many of the caller's are unread. }
    NotificationsRead:
      type: object
      additionalProperties: false
      properties:
        ids:
          type: array
          maxItems: 200
          items: { type: string }
        all: { type: boolean, description: Every notification of the caller. }
    NotificationCount:
      type: object
      required: [unread]
      properties:
        unread: { type: integer }
    NotificationRule:
      type: object
      required: [kind, channels]
      properties:
        kind: { $ref: "#/components/schemas/NotificationKind" }
        channels:
          type: array
          description: The channels besides the app.
          items: { $ref: "#/components/schemas/NotificationChannel" }
    NotificationPreferencesWrite:
      type: object
      required: [locale, rules]
      additionalProperties: false
      properties:
        locale: { type: string, enum: [en, fr], description: The language of what is sent. }
        rules:
          type: array
          description: One per kind; a kind left out keeps the defaults.
          items: { $ref: "#/components/schemas/NotificationRule" }
    NotificationPreferences:
      type: object
      required: [locale, rules, channels]
      properties:
        locale: { type: string, enum: [en, fr] }
        rules:
          type: array
          description: Every kind, with the caller's choice or the defaults.
          items:
            allOf:
              - $ref: "#/components/schemas/NotificationRule"
              - type: object
                required: [default]
                properties:
                  default: { type: boolean, description: "The defaults, not the caller's choice." }
        channels:
          type: array
          description: Each channel besides the app, and whether it can reach the caller.
          items:
            type: object
            required: [channel, available]
            properties:
              channel: { $ref: "#/components/schemas/NotificationChannel" }
              available: { type: boolean }
              address: { type: string, description: "Where it goes: the email address, or the Teams or Slack user." }
              reason: { type: string, description: Why it can't reach the caller. }
    BotActivity:
      type: object
      description: A Bot Framework activity (only the fields rvav reads are listed).
      additionalProperties: true
      properties:
        type: { type: string, examples: [invoke] }
        name: { type: string, examples: [adaptiveCard/action] }
        serviceUrl: { type: string }
        from:
          type: object
          additionalProperties: true
          properties:
            id: { type: string }
            aadObjectId: { type: string }
        value: { type: object, additionalProperties: true }
    IntegrationKind:
      type: string
      enum: [vcenter, awx, efficientip, smtp, teams, slack]
    Integration:
      type: object
      required: [kind, configured, settings, secret_set, locked, restart_needed]
      properties:
        kind: { $ref: "#/components/schemas/IntegrationKind" }
        configured: { type: boolean }
        settings:
          type: object
          additionalProperties: true
          description: |
            vcenter: url, username, insecure, name. awx: url, organization,
            catalog_labels, action_labels, inventory_source_id, insecure.
            efficientip: url, username, dns_server, instance_id, insecure.
            smtp: host, port, tls (starttls, tls, none), from, username.
            teams: app_id, tenant_id. slack: (none besides its secrets).
            The secret is the SMTP password, the Teams app's client secret
            or the Slack bot token.
        secret_set:
          type: boolean
          description: The password or token is stored (it is never returned).
        signing_secret_set:
          type: boolean
          description: Slack only, its signing secret is stored.
        locked:
          type: array
          description: Settings an environment variable sets, which win and can't be changed here.
          items: { type: string }
        restart_needed:
          type: boolean
          description: Saved settings differ from what rvav's processes started with.
        updated_at: { type: string, format: date-time }
        updated_by: { $ref: "#/components/schemas/UserRef" }
    IntegrationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Integration" }
    IntegrationWrite:
      type: object
      required: [settings]
      additionalProperties: false
      properties:
        settings: { type: object, additionalProperties: true }
        secret:
          type: string
          writeOnly: true
          description: The password or token; omit to keep the stored one.
        signing_secret:
          type: string
          writeOnly: true
          description: Slack only, the app's signing secret; omit to keep the stored one.
    IntegrationTest:
      type: object
      required: [ok, checks]
      properties:
        ok: { type: boolean }
        checks:
          type: array
          items: { $ref: "#/components/schemas/IntegrationCheck" }
    VCenter:
      type: object
      required: [name, url, username, insecure, password_set, primary]
      properties:
        name:
          type: string
          description: How the vCenter is known in rvav (inventory, placement rules, VMs), for example `vc02.corp.example`.
        url: { type: string, examples: [https://vc02.corp.example/sdk] }
        username: { type: string }
        insecure: { type: boolean, description: Its certificate isn't checked. }
        password_set: { type: boolean }
        primary:
          type: boolean
          description: The vCenter integration's (Integrations); changed there, not here.
        inventory:
          type: object
          description: What the inventory sync last read from it.
          properties:
            clusters: { type: integer }
            vms: { type: integer }
            synced_at: { type: [string, "null"], format: date-time }
    VCenterWrite:
      type: object
      required: [name, url, username]
      additionalProperties: false
      properties:
        name: { type: string, pattern: "^[a-z0-9][a-z0-9.-]{1,62}$" }
        url: { type: string, minLength: 1 }
        username: { type: string, minLength: 1 }
        password: { type: string, writeOnly: true, description: Kept when not given on a change. }
        insecure: { type: boolean }
    VCenterList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/VCenter" }
    IntegrationCheck:
      type: object
      required: [name, ok, message]
      properties:
        name: { type: string, examples: [Sign in] }
        ok: { type: boolean }
        message: { type: string }
    ApiToken:
      type: object
      required: [id, name, scope, user, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        scope:
          type: string
          enum: [all, inventory]
          description: all acts as the user; inventory only reads the Ansible inventory.
        user: { $ref: "#/components/schemas/UserRef" }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
    ApiTokenCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        scope: { type: string, enum: [all, inventory], default: all }
        expires_at: { type: string, format: date-time }
    ApiTokenCreated:
      allOf:
        - $ref: "#/components/schemas/ApiToken"
        - type: object
          required: [token]
          properties:
            token: { type: string, description: Shown this once. }
    ApiTokenList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ApiToken" }
    AuditEvent:
      type: object
      required: [id, at, action, target_type, target_id, detail]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        actor:
          oneOf:
            - $ref: "#/components/schemas/UserRef"
            - type: "null"
          description: Null when rvav itself acted (a timeout, an auto-approval).
        action: { type: string, examples: [catalog.version.publish] }
        target_type: { type: string }
        target_id: { type: string }
        project:
          oneOf:
            - $ref: "#/components/schemas/ProjectRef"
            - type: "null"
        detail: { type: object, additionalProperties: true }
    AuditEventPage:
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/AuditEvent" }

    # ── Events and subscriptions (ADR-0021) ──
    EventTopicKey:
      type: string
      enum: [request.submitted, provisioning.pre, provisioning.post, day2.pre, day2.post, delete.pre, delete.post, lease.expiring, lease.expired]
    EventTopic:
      type: object
      required: [key, description, may_block, sample]
      properties:
        key: { $ref: "#/components/schemas/EventTopicKey" }
        description: { type: string }
        may_block: { type: boolean, description: Whether blocking subscriptions are allowed (the `.pre` topics). }
        sample: { $ref: "#/components/schemas/IntegrationEvent" }
    EventTopicList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/EventTopic" }
    IntegrationEvent:
      type: object
      description: |
        What subscribers receive (`rvav.event.v1`). Within v1, fields are only
        added: receivers ignore those they don't know. Webhooks get it as the
        body, signed in `X-Rvav-Signature`; AWX templates as the extra
        variable `rvav_event`; custom workflows in their context's `event`.
      required: [id, topic, contract, occurred_at, data]
      properties:
        id: { type: string, description: "Stable across retries: receivers ignore an ID they already have." }
        topic: { $ref: "#/components/schemas/EventTopicKey" }
        contract: { type: string, examples: [rvav.event.v1] }
        occurred_at: { type: string, format: date-time }
        data:
          type: object
          description: "request, item, project, environment, requester, owner, deployment, resources, inputs, vm and lease; null where they don't apply."
          additionalProperties: true
    SubscriptionTarget:
      type: object
      description: Exactly one of `webhook`, `awx` and `workflow`.
      additionalProperties: false
      properties:
        webhook:
          type: object
          required: [url, secret]
          additionalProperties: false
          properties:
            url: { type: string, description: "An https URL on a host in RVAV_WEBHOOK_HOSTS." }
            secret: { type: string, description: "The stored secret (`/admin/secrets`) the body is signed with." }
        awx:
          type: object
          additionalProperties: false
          properties:
            template_id: { type: integer, description: The job template's AWX ID. }
            job_template: { type: string, description: "Its name, when no ID is given." }
        workflow:
          type: object
          required: [key]
          additionalProperties: false
          properties:
            key: { type: string, description: "A registered custom workflow allowed as a subscription target." }
    SubscriptionOnFailure:
      type: string
      description: "What a blocking subscription does when its target fails or doesn't answer in time."
      enum: [stop_request, continue_request]
    SubscriptionWrite:
      type: object
      required: [name, topic, target]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 500 }
        topic: { $ref: "#/components/schemas/EventTopicKey" }
        condition:
          type: string
          description: "A CEL expression over the event's data (`environment` is the key, `production` a boolean); empty: every event."
          examples: ['environment == "prd" && item.slug == "rhel9-server"']
        blocking: { type: boolean, default: false, description: "Only on `.pre` topics: the request waits for the answer and may be stopped." }
        on_failure: { $ref: "#/components/schemas/SubscriptionOnFailure" }
        priority: { type: integer, default: 100, description: Lower first. }
        timeout_seconds: { type: integer, minimum: 1, maximum: 3600, default: 30 }
        enabled: { type: boolean, default: true }
        target: { $ref: "#/components/schemas/SubscriptionTarget" }
    Subscription:
      allOf:
        - $ref: "#/components/schemas/SubscriptionWrite"
        - type: object
          required: [id, condition, blocking, on_failure, priority, timeout_seconds, enabled, created_at, runs]
          properties:
            id: { type: string }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
            runs:
              type: object
              description: Its runs of the last 30 days, by status.
              required: [delivered, failed, pending]
              properties:
                delivered: { type: integer }
                failed: { type: integer }
                pending: { type: integer }
            last_run_at: { type: string, format: date-time }
    SubscriptionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Subscription" }
    SubscriptionRunStatus:
      type: string
      description: "`queued` waits for its next attempt; `blocked` is a blocking run that stopped its request."
      enum: [queued, delivering, delivered, failed, blocked]
    SubscriptionRun:
      type: object
      required: [id, subscription_id, event_id, topic, status, blocking, test, attempts, created_at]
      properties:
        id: { type: string }
        subscription_id: { type: string }
        event_id: { type: string }
        topic: { $ref: "#/components/schemas/EventTopicKey" }
        status: { $ref: "#/components/schemas/SubscriptionRunStatus" }
        blocking: { type: boolean }
        test: { type: boolean, description: Made with Test. }
        request:
          type: object
          description: The request it belongs to (blocking runs, and runs of request events).
          required: [id, number]
          properties:
            id: { type: string }
            number: { type: string }
        attempts: { type: integer }
        next_attempt_at: { type: string, format: date-time }
        outcome: { type: string, description: "A blocking run's answer: continue or stop." }
        reason: { type: string, description: "Why it stopped the request, or why it failed." }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    SubscriptionRunAttempt:
      type: object
      required: [at, ok, duration_ms]
      properties:
        at: { type: string, format: date-time }
        ok: { type: boolean }
        status_code: { type: integer, description: The webhook's HTTP status. }
        job_id: { type: integer, description: The AWX job launched. }
        workflow_id: { type: string, description: The custom workflow's Temporal ID. }
        response: { type: string, description: "What came back, its first 4 KB." }
        error: { type: string }
        duration_ms: { type: integer }
    SubscriptionRunDetail:
      allOf:
        - $ref: "#/components/schemas/SubscriptionRun"
        - type: object
          required: [payload, history]
          properties:
            payload: { $ref: "#/components/schemas/IntegrationEvent" }
            properties:
              type: object
              description: Properties a blocking run set on the deployment.
              additionalProperties: { type: string }
            history:
              type: array
              items: { $ref: "#/components/schemas/SubscriptionRunAttempt" }
    SubscriptionRunPage:
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/SubscriptionRun" }

    # ── Custom workflows (ADR-0022) ──
    WorkflowUsage:
      type: string
      enum: [catalog_item, day2_action, subscription_target, composite_step]
    WorkflowDay2:
      type: object
      description: "How it is offered as the day-2 action `wf.<key>`."
      required: [name, types]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80, examples: [Decommission] }
        types:
          type: array
          minItems: 1
          items: { type: string, enum: [vsphere.vm, deployment] }
        condition: { type: string, description: "CEL over the day-2 policy variables; empty: everywhere." }
        offered: { type: boolean, default: false }
    WorkflowRegistrationWrite:
      type: object
      required: [title, workflow_type, task_queue, usages]
      additionalProperties: false
      properties:
        key:
          type: string
          pattern: "^[a-z][a-z0-9-]{1,40}$"
          description: "Its name in rvav, set when registering (ignored on update)."
        title: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 2000 }
        workflow_type:
          type: string
          pattern: "^[A-Za-z][A-Za-z0-9_.-]*\\.v[0-9]+$"
          description: "The Temporal workflow type, ending with its major version."
          examples: [decommission.v1]
        task_queue: { type: string, minLength: 1 }
        input_schema:
          type: object
          description: "JSON Schema of its inputs: the form when people start it."
          additionalProperties: true
        timeout_seconds: { type: integer, minimum: 60, default: 2592000 }
        project_ids:
          type: array
          description: The projects that may use it; empty for all.
          items: { type: string }
        usages:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/WorkflowUsage" }
        day2: { $ref: "#/components/schemas/WorkflowDay2" }
        enabled: { type: boolean, default: true }
    WorkflowRegistration:
      allOf:
        - $ref: "#/components/schemas/WorkflowRegistrationWrite"
        - type: object
          required: [key, input_schema, timeout_seconds, project_ids, enabled, running, used_by, created_at]
          properties:
            running: { type: integer, description: Its runs not ended. }
            used_by:
              type: array
              description: "What uses it: items, subscriptions and composite steps."
              items: { type: string }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    WorkflowRegistrationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/WorkflowRegistration" }
