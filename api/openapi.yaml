        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentLimitPolicyList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      operationId: createDeploymentLimitPolicy
      summary: Add a deployment limit policy
      description: |
        A global policy needs `policies.manage`. A project's, that or
        `project.policies.manage` in the project (project admins).
        Audited. Each limit is decided on its own: the policies are tried
        by priority, the global and the project's together, and the first
        that sets the limit decides. When it is a project's, the first
        global policy that sets it still decides if it is hard and
        stricter: a project's policy can't loosen a hard global one
        (ADR-0045, ADR-0047).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeploymentLimitPolicyWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentLimitPolicy" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/deployment-limit-policies/{id}:
    parameters:
      - { $ref: "#/components/parameters/IdPath" }
    put:
      tags: [admin]
      operationId: updateDeploymentLimitPolicy
      summary: Change a deployment limit policy
      description: |
        As adding one; a project's policy an administrator set
        (`set_by_admin`) is refused (403) to its project admins. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeploymentLimitPolicyWrite" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentLimitPolicy" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [admin]
      operationId: deleteDeploymentLimitPolicy
      summary: Remove a deployment limit policy
      description: |
        As changing it: `policies.manage`, or `project.policies.manage` in
        its project unless an administrator set it (`set_by_admin`).
        Audited.
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/policies/explain:
    post:
      tags: [admin]
      operationId: explainPolicies
      summary: Which policies decide for a project, environment, item or action, and why
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolicyExplainQuery" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyExplanation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/integrations:
    get:
      tags: [admin]
      operationId: getIntegrations
      summary: The identity provider, connections and notification channels (secrets never returned)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/processes:
    get:
      tags: [admin]
      operationId: listProcesses
      summary: rvav's processes and the settings revision each runs with
      description: |
        Each API, worker and sync process records itself every few seconds
        (ADR-0030). One that saw newer connection settings is draining,
        before it exits and its supervisor starts it again; restarting
        once it has exited, until it has been started again (its successor,
        of the same role and host, recorded) or for 10 minutes. Processes
        not seen for 30 seconds are left out, but those restarting.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcessList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/system:
    get:
      tags: [admin]
      operationId: getSystem
      summary: rvav's version, processes, settings revisions and install settings
      description: |
        Read only (ADR-0030). The install settings are those set in the
        environment only, as the API answering reads them: changed there,
        then each process restarted. A secret's value is never sent, only
        whether it is set; the database URL is sent without its password.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/System" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/branding:
    put:
      tags: [admin]
      operationId: setBranding
      summary: Set the portal's name and accent colour
      description: |
        `system.manage`; audited (`settings.branding.update`). An empty name or
        accent is rvav's own. The accent is the light theme's: one text
        doesn't read on at 4.5:1 against the light theme's backgrounds is
        refused, with the closest darker colour that reads. The dark
        theme's accent is derived from it, lightened until it reads.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrandingWrite" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branding" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/branding/accent-check:
    post:
      tags: [admin]
      operationId: checkBrandingAccent
      summary: How an accent colour reads in both themes, before it is saved
      description: "`system.manage`. Saves nothing."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccentCheckQuery" }
      responses:
        "200":
          description: The check
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccentCheck" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/branding/logos/{variant}:
    put:
      tags: [admin]
      operationId: setBrandingLogo
      summary: Upload the logo for the light or the dark theme
      description: |
        `system.manage`; audited (`settings.branding_logo.set`). The body is the
        picture as it is: PNG, JPEG or SVG, 256 KB and 2048 pixels a side
        at most. An SVG with a script, an event handler, a foreign object,
        a link or a reference outside itself, or a DOCTYPE is refused (422):
        the picture is kept as it was sent, never rewritten. Emails show the
        light theme's logo when it is a PNG or JPEG one. A variant other
        than `light` or `dark` is 400.
      parameters:
        - { name: variant, in: path, required: true, schema: { $ref: "#/components/schemas/LogoVariant" } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branding" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [admin]
      operationId: deleteBrandingLogo
      summary: Remove the logo for the light or the dark theme
      description: "`system.manage`; audited (`settings.branding_logo.remove`). A variant other than `light` or `dark` is 400."
      parameters:
        - { name: variant, in: path, required: true, schema: { $ref: "#/components/schemas/LogoVariant" } }
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branding" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/notification-templates:
    get:
      tags: [admin]
      operationId: listNotificationTemplates
      summary: Every kind whose templates administrators edit, with its variables
      description: |
        `system.manage`. Each kind has a template per channel and language;
        those edited replace the built-in ones (ADR-0059).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationTemplateCatalog" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/notification-templates/{kind}:
    parameters:
      - { name: kind, in: path, required: true, schema: { $ref: "#/components/schemas/NotificationKind" } }
    get:
      tags: [admin]
      operationId: getNotificationTemplate
      summary: A kind's template for a channel and language, and its built-in one
      description: "`system.manage`. A kind that isn't one is 404; a channel or a locale that isn't one, 400."
      parameters:
        - { $ref: "#/components/parameters/TemplateChannelQuery" }
        - { $ref: "#/components/parameters/TemplateLocaleQuery" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationTemplate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [admin]
      operationId: setNotificationTemplate
      summary: Save a kind's template for a channel and language
      description: |
        `system.manage`; audited (`settings.notification_template.update`). A Go
        template: refused (422, per part) when it doesn't parse, names a
        variable its kind doesn't have, defines or calls other templates,
        or fails on the kind's sample data. Notifications sent from then on
        use it. A kind that isn't one is 404; a channel or a locale that
        isn't one, 422.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationTemplateWrite" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationTemplate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [admin]
      operationId: resetNotificationTemplate
      summary: Go back to the built-in template
      description: |
        `system.manage`; audited (`settings.notification_template.reset`)
        when it was edited. A kind that isn't one is 404; a channel or a
        locale that isn't one, 400.
      parameters:
        - { $ref: "#/components/parameters/TemplateChannelQuery" }
        - { $ref: "#/components/parameters/TemplateLocaleQuery" }
      responses:
        "200":
          description: The built-in template, now used
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationTemplate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/notification-templates/{kind}/preview:
    post:
      tags: [admin]
      operationId: previewNotificationTemplate
      summary: A template written with its kind's sample data, as it would be sent
      description: |
        `system.manage`. Saves nothing. An email's HTML, a Teams card's
        JSON or Slack's blocks, with the portal's branding; a template
        that can't be saved is 422, per part. A kind that isn't one is
        404.
      parameters:
        - { name: kind, in: path, required: true, schema: { $ref: "#/components/schemas/NotificationKind" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationTemplateWrite" }
      responses:
        "200":
          description: The preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationTemplatePreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/setup:
    get:
      tags: [admin]
      operationId: getSetup
      summary: The setup checklist
      description: |
        The steps that set rvav up from its UI (ADR-0030), each done or not,
        with what is there now. An administrator lands on it (`open`) while
        a step remains, unless it was hidden or the install was seeded.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Setup" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [admin]
      operationId: setSetup
      summary: Hide the setup checklist, or have it open at sign-in again
      description: Hidden, it stays in Administration; audited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupWrite" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Setup" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/integrations/{kind}:
    parameters:
      - { $ref: "#/components/parameters/IntegrationKindPath" }
    put:
      tags: [admin]
      operationId: setIntegration
      summary: Save a connection's settings
      description: |
        Fields set by environment variables can't be changed here (ADR-0020).
        Saved settings apply without a restart by hand (ADR-0030): the
        identity provider and notifications on next use; a connection when
        each process holding it has drained and been started again by its
        supervisor (`applying` until then).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntegrationWrite" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Integration" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/integrations/{kind}/test:
    parameters:
      - { $ref: "#/components/parameters/IntegrationKindPath" }
    post:
      tags: [admin]
      operationId: testIntegration
      summary: Test a connection, with the saved settings or the ones given
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntegrationWrite" }
      responses:
        "200":
          description: The checks, passed or not
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationTest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/integrations/awx/inventory-token:
    get:
      tags: [admin]
      operationId: getInventoryToken
      summary: The token AWX's inventory source reads rvav with
      description: |
        rvav's inventory in AWX is filled by an inventory source (the AWX
        integration's inventory_source_id) that reads GET /ansible/inventory
        with an rvav API token, kept in an AWX credential of the rvav API
        type. This says which token rvav made for it, if any. Locked when
        RVAV_INVENTORY_TOKEN sets the token (rvav awx-bootstrap puts that one
        in AWX).
      responses:
        "200":
          description: The token, if one was made
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryToken" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      operationId: makeInventoryToken
      summary: Make a token for AWX's inventory source and put it in AWX
      description: |
        Makes an API token that only reads the inventory, for rvav's AWX
        inventory user (an auditor that can't sign in), valid a year. It goes
        in the source's rvav API credential, or one of that name made in its
        organisation and set on the source, with rvav's address as AWX
        reaches it: the url given, or else the one the credential has, or
        else rvav's public URL. Then the earlier tokens are revoked and the
        source is synced. Audited.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InventoryTokenWrite" }
      responses:
        "201":
          description: Made and in AWX
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryTokenMade" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "502": { $ref: "#/components/responses/UpstreamError" }

  /admin/integrations/servicenow/cmdb:
    get:
      tags: [admin]
      operationId: getServiceNowCmdb
      summary: The CIs rvav keeps in ServiceNow, and what the last reconcile found
      description: |
        With the ServiceNow integration's `cmdb` on, each VM of the projects
        chosen is a CI, sent through the IRE and retired when the VM goes
        (ADR-0065). This counts the CIs kept and retired and the deployments
        queued, lists those ServiceNow didn't take with why, and the CIs of
        rvav's data source that rvav doesn't keep, as the last reconcile
        found them.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceNowCmdb" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/integrations/servicenow/cmdb/reconcile:
    post:
      tags: [admin]
      operationId: reconcileServiceNowCmdb
      summary: Reconcile ServiceNow's CMDB at the next pass, within seconds
      description: |
        Every deployment in scope is looked at again and ServiceNow's CIs of
        rvav's data source are read, as every `sync_interval` does. The
        report is in GET /admin/integrations/servicenow/cmdb once done.
        Audited.
      responses:
        "202":
          description: Asked for
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceNowCmdb" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /servicenow/catalog:
    get:
      tags: [servicenow]
      operationId: listServiceNowCatalog
      summary: Every item ServiceNow's catalog may offer, with its inputs
      description: |
        Each catalog item with a published version, shared in at least one
        project, with the inputs of that version that a ServiceNow variable
        can hold: strings, numbers, booleans and choices from a fixed list.
        Inputs it can't hold (objects, lists, files, secrets) are left out;
        those with options rvav finds at request time say `dynamic`. An
        input ServiceNow doesn't send takes the form's initial value.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceNowCatalog" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /servicenow/entitlements:
    get:
      tags: [servicenow]
      operationId: getServiceNowEntitlements
      summary: Where a user may request, and what
      description: |
        The projects the user may request in, with their environments and
        the items shared with the user there: what ServiceNow's catalog
        form offers them. The user is named as in a request. A user whose
        last sign-in to rvav is older than `RVAV_SCHEDULE_OWNER_IDLE_DAYS`
        answers 422, as their request would.
      parameters:
        - name: user
          in: query
          required: true
          description: The user's email, or ServiceNow's user name, which must be an rvav user's whole user name, in any case.
          schema: { type: string, minLength: 1, maxLength: 254 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceNowEntitlements" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /servicenow/requests:
    post:
      tags: [servicenow]
      operationId: submitServiceNowRequest
      summary: Request on a user's behalf, for a requested item
      description: |
        Submitted as the user would submit it, with their entitlements,
        quotas, approval policies and lease rules, never more: an item the
        user can't request in that project answers 404. The request keeps
        the requested item's number and `sys_id`; a second submission for
        the same `sys_id` answers the request already made, 200. Audited
        as `servicenow.request`, a refusal as `servicenow.request_refused`.
        rvav writes the request's progress to the requested item's work
        notes and state.

        When `ordered_by` is someone other than `user`, they must be an
        rvav user who holds `request.on_behalf` in the project, as in
        rvav: 422 on `/ordered_by` otherwise. An approval policy then
        applies when its condition holds for either person, and approves
        automatically only when its `auto_approve` holds for both. A user
        or an orderer whose last sign-in is older than
        `RVAV_SCHEDULE_OWNER_IDLE_DAYS` is refused, 422, as their groups
        may have changed since.

        The body is checked against the schema: a field it doesn't list
        answers 400, a `sys_id`, number or name out of its pattern or
        length 422. A submission made already is counted as a read, not
        against `requests_per_minute`. A 409 with `retry` (the
        connection isn't set yet, or requests placed at the same moment
        took the room) may succeed later; any other 409 is final.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceNowRequestDraft" }
      responses:
        "200":
          description: Made already, for this requested item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceNowRequest" }
        "202":
          description: Submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceNowRequest" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/UpstreamError" }

  /servicenow/requests/{ritmSysId}:
    parameters:
      - name: ritmSysId
        in: path
        required: true
        description: The requested item's `sys_id`.
        schema: { type: string, pattern: "^[0-9a-f]{32}$" }
    get:
      tags: [servicenow]
      operationId: getServiceNowRequest
      summary: The request made for a requested item, and where it is
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceNowRequest" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /admin/integrations/servicenow/token:
    get:
      tags: [admin]
      operationId: getServiceNowToken
      summary: The token ServiceNow calls rvav with
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceNowToken" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      operationId: makeServiceNowToken
      summary: Make ServiceNow's token, and revoke the earlier one
      description: |
        For rvav's user `usr_rvav-servicenow`, with the scope `servicenow`:
        it requests on users' behalf under /servicenow/ and nowhere else.
        Valid a year; shown this once, to put in ServiceNow's credential.
        The earlier token stops working at once. Audited.
      responses:
        "201":
          description: Made
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceNowTokenMade" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [admin]
      operationId: revokeServiceNowToken
      summary: Revoke ServiceNow's token, cutting ServiceNow off
      description: Audited.
      responses:
        "204": { description: "Revoked, or there was none" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/integrations/oidc/trial:
    post:
      tags: [admin]
      operationId: trialIdentityProvider
      summary: Check a token from a trial sign-in against the provider settings given
      description: |
        The web app signs in at the provider in a new window, with the
        settings given (not saved yet), and sends the access token here.
        rvav checks it as it would a request's (signature, issuer, audience,
        expiry), and says which claims it carries, the groups it reads from
        them, and the roles the group mappings give. Nothing is saved: no
        user is made.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OidcTrialRequest" }
      responses:
        "200":
          description: What rvav reads from the token, accepted or not
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OidcTrial" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/onboarding/vms:
    get:
      tags: [admin]
      operationId: listOnboardingVms
      summary: VMs in vCenter that rvav doesn't manage, to adopt into deployments (S13.3)
      parameters:
        - { name: vcenter, in: query, schema: { type: string } }
        - { name: cluster, in: query, schema: { type: string } }
        - { name: power_state, in: query, schema: { $ref: "#/components/schemas/VmPowerState" } }
        - name: q
          in: query
          description: Part of the VM's name, address or guest host name.
          schema: { type: string, maxLength: 200 }
        - name: folder
          in: query
          description: A VM folder's path, such as /GVA/vm/legacy. VMs in it and in the folders below it.
          schema: { type: string, maxLength: 500 }
        - name: tag
          in: query
          description: A vSphere tag the VM has, as category/tag.
          schema: { type: string, maxLength: 200 }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingVmPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/onboarding:
    post:
      tags: [admin]
      operationId: adoptVms
      summary: Adopt existing VMs into deployments, with their addresses and DNS records from EfficientIP
      description: |
        Each VM becomes a deployment of its own, named after it, or all go
        into one. Nothing changes in vCenter or EfficientIP: rvav records the
        VMs, and the addresses and records EfficientIP has for them, as it
        would have built them. Deleting the deployment later deletes the VMs
        and releases those addresses and records.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardingDraft" }
      responses:
        "200":
          description: Adopted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /admin/onboarding/into:
    post:
      tags: [admin]
      operationId: adoptVmsInto
      summary: Adopt existing VMs into a deployment rvav has, as VMs of one of its components (X1.5)
      description: |
        The VMs take the deployment's project, environment, owner, item and
        lease. They must fit its blueprint: a component that takes them
        (its count, raised in the deployment's inputs when an input sets
        it), their OS family, names its other VMs don't have. What doesn't
        fit is refused per VM with the reason, and nothing is adopted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardingIntoDraft" }
      responses:
        "200":
          description: Adopted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /admin/onboarding/plans:
    get:
      tags: [admin]
      operationId: listOnboardingPlans
      summary: Saved onboarding plans, with how many VMs each matches now and its last run (X1.5)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingPlanList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      operationId: createOnboardingPlan
      summary: Save an onboarding plan, a filter and where what it matches goes
      description: |
        A plan runs by hand, and on its schedule when it has one. Each run
        adopts the VMs its filter matches that no deployment has, and
        skips the others with the reason.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardingPlanWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingPlan" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /admin/onboarding/plans/{planId}:
    parameters:
      - { name: planId, in: path, required: true, schema: { type: string } }
    get:
      tags: [admin]
      operationId: getOnboardingPlan
      summary: An onboarding plan
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingPlan" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [admin]
      operationId: updateOnboardingPlan
      summary: Change an onboarding plan; its next runs follow it
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardingPlanWrite" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingPlan" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [admin]
      operationId: deleteOnboardingPlan
      summary: Delete an onboarding plan and its run history; what it adopted stays
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /admin/onboarding/plans/{planId}/runs:
    parameters:
      - { name: planId, in: path, required: true, schema: { type: string } }
    get:
      tags: [admin]
      operationId: listOnboardingRuns
      summary: A plan's runs, the latest first (the last 20 are kept)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingRunList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [admin]
      operationId: runOnboardingPlan
      summary: Run a plan now, in the background
      description: |
        The run is a Temporal workflow: follow it with `GET
        /admin/onboarding/runs/{runId}`. A plan runs once at a time: 409
        while a run of it goes on.
      responses:
        "202":
          description: Started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingRun" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /admin/onboarding/runs/{runId}:
    parameters:
      - { name: runId, in: path, required: true, schema: { type: string } }
    get:
      tags: [admin]
      operationId: getOnboardingRun
      summary: A run of a plan, with what it did to each VM it matched
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingRun" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/vra:
    get:
      tags: [admin]
      operationId: getVraImport
      summary: The vRA importer (P2.5) - whether rvav can read vRA, and the estate it last read
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VraImportStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/vra/snapshots:
    post:
      tags: [admin]
      operationId: readVra
      summary: Read vRA, or take the file vra-export wrote
      description: |
        Without a body, rvav reads the vRA of its configuration
        (`RVAV_VRA_URL`). With the JSON `rvav vra-export` wrote, it takes
        that. What was read becomes the estate the plan and the import work
        from. Nothing in vRA changes.
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: true, description: What rvav vra-export wrote. }
      responses:
        "201":
          description: Read
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VraSnapshot" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /admin/vra/plan:
    get:
      tags: [admin]
      operationId: getVraPlan
      summary: The dry run - what importing the estate last read would create, change or leave; nothing is written
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VraPlan" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/vra/projects/{vraProjectId}:
    put:
      tags: [admin]
      operationId: mapVraProject
      summary: Map a vRA project to an rvav project, or clear its mapping (it then maps by name)
      parameters:
        - { name: vraProjectId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VraProjectMapping" }
      responses:
        "204": { description: Mapped }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /admin/vra/projects/{vraProjectId}/cutover:
    put:
      tags: [admin]
      operationId: setVraCutover
      summary: Mark a vRA project moved to rvav, or not (P2.6)
      description: |
        Moved means new requests go to rvav: vRA's administrators stop
        offering the project's items in vRA (the cutover runbook), and the
        next read of vRA checks they did. vRA keeps the project's
        deployments not adopted yet. Nothing in rvav or vRA changes; the
        project must be mapped.
      parameters:
        - { name: vraProjectId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VraCutoverWrite" }
      responses:
        "204": { description: Recorded }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /admin/vra/import:
    post:
      tags: [admin]
      operationId: importVra
      summary: Import the estate last read - catalog items as drafts with their sharing, and deployments adopted
      description: |
        It can run again: each vRA object is linked to what it became, so
        a template already imported gets a new draft only when what it maps
        to changed, sharing is only ever added, and a deployment rvav
        manages is not adopted twice. Nothing is published, and nothing in
        vRA changes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VraImportRequest" }
      responses:
        "200":
          description: Imported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VraImportResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /admin/vra/triage:
    get:
      tags: [admin]
      operationId: getVroTriage
      summary: The vRO triage report of the estate last read, as Markdown (ADR-0007's groups)
      responses:
        "200":
          description: OK
          content:
            text/markdown:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/vcenters:
    get:
      tags: [admin]
      operationId: listVCenters
      summary: The vCenters rvav manages (ADR-0024); the first is the vCenter integration's
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VCenterList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      operationId: createVCenter
      summary: Add a vCenter
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VCenterWrite" }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VCenter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/vcenters/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    put:
      tags: [admin]
      operationId: updateVCenter
      summary: Change a vCenter (the password is kept when not given)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VCenterWrite" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VCenter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [admin]
      operationId: deleteVCenter
      summary: Stop managing a vCenter; refused while deployments have VMs there or placement rules name it
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/vcenters/{name}/test:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    post:
      tags: [admin]
      operationId: testVCenter
      summary: Test a vCenter, with its saved settings or the ones given
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VCenterWrite" }
      responses:
        "200":
          description: The checks, passed or not
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationTest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/nsx-managers:
    get:
      tags: [admin]
      operationId: listNsxManagers
      summary: The NSX Managers rvav manages, and the vCenters each serves; the first is the NSX integration's
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NsxManagerList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      operationId: createNsxManager
      summary: Add an NSX Manager
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NsxManagerWrite" }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NsxManager" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/nsx-managers/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    put:
      tags: [admin]
      operationId: updateNsxManager
      summary: Change an added NSX Manager (the password is kept when not given)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NsxManagerWrite" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NsxManager" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [admin]
      operationId: deleteNsxManager
      summary: Stop managing an added NSX Manager; refused while deployments have segments or groups there
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/nsx-managers/{name}/vcenters:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    put:
      tags: [admin]
      operationId: setNsxManagerVCenters
      summary: Link vCenters to an NSX Manager, the NSX integration's too; a vCenter linked to another moves
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NsxManagerVCenters" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NsxManager" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/nsx-managers/{name}/test:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    post:
      tags: [admin]
      operationId: testNsxManager
      summary: Test an NSX Manager, with its saved settings or, for an added one, the ones given
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NsxManagerWrite" }
      responses:
        "200":
          description: The checks, passed or not
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationTest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/event-topics:
    get:
      tags: [admin]
      operationId: listEventTopics
      summary: The topics subscriptions can use, with a sample event of each (ADR-0021)
      responses:
        "200":
          description: The topics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventTopicList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/subscriptions:
    get:
      tags: [admin]
      operationId: listSubscriptions
      summary: Event subscriptions, by topic and priority (`extensibility.read`)
      responses:
        "200":
          description: The subscriptions
          content:
            application/json:
