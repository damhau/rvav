        in projects (project admins), the global policies and those of
        these projects (ADR-0045).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Day2PolicyList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      operationId: createDay2Policy
      summary: Add a day-2 policy
      description: |
        A global policy needs `policies.manage`. A project's, that or
        `project.policies.manage` in the project (project admins), unless
        an administrator set it (`set_by_admin`); anything else is refused
        (403). Audited. Policies are tried by priority, the
        global and the project's together; when a project's policy matches
