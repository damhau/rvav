openapi: 3.1.0
info:
  title: rvav API
  version: 1.0.0
  summary: Self-service portal for VMware vSphere, with AWX for automation.
  description: |
    The rvav API: identity, projects and quota, the service catalog and its
    forms, requests and approvals, deployments and their day-2 actions,
    notifications, reports, and administration (catalog, policies, projects,
    integrations, subscriptions, custom workflows). Live updates arrive on
    `/events`. Every rvav serves this document at `/openapi.json`.

    Conventions (IDs, units, pagination, errors, idempotency, live events) are
    described in `api/README.md`.
servers:
  - url: /api/v1
security:
  - bearer: []
tags:
  - name: identity
    description: Who is calling and what they may do.
  - name: meta
    description: This API's own description.
  - name: projects
    description: Projects, environments and quota.
  - name: catalog
    description: Items users can request.
  - name: forms
    description: Request forms and their dynamic values.
  - name: requests
    description: Submitting requests and following their progress.
  - name: approvals
    description: Requests waiting for a decision, and the decisions taken.
  - name: deployments
    description: What requests created, with live state from vCenter.
  - name: events
    description: Live updates over Server-Sent Events.
  - name: admin
    description: Checks and settings of rvav, each for the roles that hold its permission (ADR-0034).
  - name: catalog-admin
    description: Building and publishing catalog items (`catalog.manage`, held by catalog admins and administrators).
  - name: ansible
    description: What AWX reads from rvav.
  - name: notifications
    description: What concerns the caller, in the app and on their channels (ADR-0023).
  - name: reports
    description: How the platform is used (S13.4).
  - name: servicenow
    description: |
      What ServiceNow calls (ADR-0065): rvav's catalog, a user's
      entitlements, and requests on a user's behalf. Only ServiceNow's
      token (scope `servicenow`, made in Administration › Integrations ›
      ServiceNow) is taken here, and it is taken nowhere else.

paths:
  /openapi.json:
    get:
      tags: [meta]
      operationId: getOpenApi
      summary: This API's description (OpenAPI 3.1), for tools and generated clients
      description: |
        The document this rvav serves, so a client is generated for the
        version it talks to. The reference built from it is attached to
        each release (`api-reference.html`, S14.10).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me:
    get:
      tags: [identity]
      operationId: getMe
      summary: The signed-in user, what they may do for all of rvav and in each project
      description: |
        What the web app shows and hides is read from `permissions`: those
        held for all of rvav here, and in each project those held there
        (ADR-0034). The server decides again on every call.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/locale:
    put:
      tags: [identity]
      operationId: setMyLocale
      summary: Choose the language of the web app and of what rvav sends
      description: |
        One setting for both (ADR-0061): it is the `locale` of the
        notification preferences too, and the other preferences stay as
        they are. Until someone chooses, the web app follows their
        browser and messages are sent in English.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MyLocale" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyLocale" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /auth/sign-in:
    post:
      tags: [identity]
      operationId: signIn
      summary: Sign in with the local administrator's username and password
      description: |
        The local administrator (ADR-0030): the way in at first start and
        when the identity provider is down. Sets the `rvav_session` cookie;
        the provider's users sign in with it instead. From the third failure
        in a row, attempts are refused for a while (`429`). A username or
        password longer than allowed is a failed sign-in (`401`), as a
        wrong one is. In FIPS 140-only mode a password still kept as an
        argon2id hash is refused (`409`) until `rvav admin reset-password`
        sets it again (ADR-0060).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignInRequest" }
      responses:
        "200":
          description: Signed in; the session is in the `rvav_session` cookie
          headers:
            Set-Cookie:
              description: The session (HttpOnly, SameSite=Strict).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignInResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/password:
    post:
      tags: [identity]
      operationId: changePassword
      summary: Change the local administrator's password
      description: |
        Needed at the first sign-in and after a reset; the session may do
        nothing else until then. Ends the account's other sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChange" }
      responses:
        "204": { description: Changed }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/sign-out:
    post:
      tags: [identity]
      operationId: signOut
      summary: End the local session, if there is one, and record the sign-out
      description: |
        Deletes the session and clears its cookie. The provider's users sign
        out at the provider: the web app and `rvavctl logout` call this
        first with their access token, so that the sign-out is audited
        (`auth.sign_out`). With a session, it needs `X-Requested-With`,
        as every change does.
      security: []
      responses:
        "204": { description: Signed out }
        "403": { $ref: "#/components/responses/Forbidden" }

  /auth/sign-ins:
    post:
      tags: [identity]
      operationId: reportSignIn
      summary: Record a sign-in at the identity provider, or why it failed, in the audit log
      description: |
        The web app and rvavctl sign in at the identity provider themselves
        (ADR-0010, ADR-0051), so they tell rvav how it went (ADR-0058):
        - **Signed in:** send the new access token (or API token) in the
          `Authorization` header and no `failure`. rvav checks it, and
          records `auth.sign_in` with who, from where and how; a token it
          refuses is recorded as `auth.sign_in_failed`, with why, and
          answers `401`. In development mode, no header: the dev user.
        - **Failed before there was a token:** send `failure`, without a
          token. rvav records `auth.sign_in_failed`, as the client says it
          happened; at most 10 a minute from one address are kept.

        Never send the authorization code, the state or a token in the
        body. The body is sent as `application/json`, which a form on
        another site can't send without the browser asking first.

        `AuditEvent` lists what the events' `detail` holds.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignInReport" }
      responses:
        "204": { description: Recorded }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "415":
          description: The body isn't sent as `application/json`
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "503":
          description: The identity provider can't be reached to check the token; nothing was recorded
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /auth/options:
    get:
      tags: [identity]
      operationId: getAuthOptions
      summary: How to sign in, for the web app's sign-in page (ADR-0030)
      description: |
        The identity provider the browser signs in with, as saved in
        Administration or set by `RVAV_OIDC_*`; none until one is set (the
        local administrator signs in). Read on each page load, so a change
        applies without a restart.

        `X-Rvav-Idp-Origins` lists the origins the page may reach for
        sign-in: the provider's, and for ten minutes after a provider's test
        the origin tried, so its trial sign-in works before it is saved.
        nginx copies them into the page's Content-Security-Policy.
        `X-Rvav-Script-Origins` lists where the console's SDK set in
        Administration is served from, which nginx adds to its
        `script-src`.
      security: []
      responses:
        "200":
          description: The sign-in options
          headers:
            X-Rvav-Idp-Origins:
              description: Space-separated origins (scheme, host and port only).
              schema: { type: string }
            X-Rvav-Script-Origins:
              description: Space-separated origins of the console's SDK (scheme, host and port only).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthOptions" }

  /branding:
    get:
      tags: [identity]
      operationId: getBranding
      summary: The portal's name, accent colours and logos (ADR-0059)
      description: |
        For anyone, signed in or not: the sign-in page shows it. The accent
        comes for the light and the dark theme, each with the colour of
        text on it and its tint, all reading at 4.5:1 at least where the
        web app puts them. Empty fields are rvav's own.

        Answered with an `ETag`: sent back in `If-None-Match`, the answer
        is 304 while the branding is the same.
      security: []
      parameters:
        - name: If-None-Match
          in: header
          description: The `ETag` of the branding the caller has.
          schema: { type: string }
      responses:
        "200":
          description: The branding
          headers:
            ETag:
              description: Changes when the branding does.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branding" }
        "304": { description: The branding is the one the ETag names. }

  /branding/logos/{variant}:
    get:
      tags: [identity]
      operationId: getBrandingLogo
      summary: The logo for the light or the dark theme
      description: |
        For anyone: a PNG, JPEG or SVG picture, an SVG checked to hold
        nothing that runs or fetches when it was saved. Its URL in
        `Branding` changes with it. It is sent with a
        `Content-Security-Policy` that runs nothing and fetches nothing,
        and `X-Content-Type-Options: nosniff`: the web app shows logos in
        `<img>` elements only.

        Answered with an `ETag`: sent back in `If-None-Match`, the answer
        is 304 while the logo is the same.
      security: []
      parameters:
        - { name: variant, in: path, required: true, schema: { $ref: "#/components/schemas/LogoVariant" } }
        - name: v
          in: query
          description: |
            The version `Branding` names in the logo's URL: the answer is
            cached for good while it is the logo's.
          schema: { type: string, maxLength: 64 }
        - name: If-None-Match
          in: header
          description: The `ETag` of the logo the caller has.
          schema: { type: string }
      responses:
        "200":
          description: The logo
          headers:
            ETag:
              description: Changes when the logo does.
              schema: { type: string }
          content:
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/svg+xml:
              schema: { type: string, format: binary }
        "304": { description: The logo is the one the ETag names. }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: The caller's notifications, newest first
      parameters:
        - name: unread
          in: query
          description: Only those not read yet.
          schema: { type: boolean, default: false }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/notifications/read:
    post:
      tags: [notifications]
      operationId: markNotificationsRead
      summary: Mark notifications read, the ones given or all of them
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationsRead" }
      responses:
        "200":
          description: How many are left unread
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationCount" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /me/notification-preferences:
    get:
      tags: [notifications]
      operationId: getNotificationPreferences
      summary: The channels the caller chose per kind, and which can reach them
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPreferences" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [notifications]
      operationId: setNotificationPreferences
      summary: Choose the channels per kind and the language of what is sent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationPreferencesWrite" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPreferences" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /me/notification-preferences/test:
    post:
      tags: [notifications]
      operationId: testNotificationChannel
      summary: Send the caller a test message on a channel, now
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel]
              additionalProperties: false
              properties:
                channel: { $ref: "#/components/schemas/NotificationChannel" }
      responses:
        "200":
          description: Sent, or why not
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationCheck" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /integrations/teams/messages:
    post:
      tags: [notifications]
      operationId: teamsMessages
      summary: Microsoft Teams' calls to rvav's bot (Approve and Reject on a card)
      description: |
        Authenticated by the Bot Framework token in `Authorization`, not by
        an rvav token (ADR-0023). An `invoke` activity named
        `adaptiveCard/action` decides an approval as the user the card was
        sent to and answers with the card updated; other activities are
        acknowledged.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BotActivity" }
      responses:
        "200":
          description: The invoke response (an Adaptive Card)
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "202":
          description: Acknowledged
        "401": { $ref: "#/components/responses/Unauthorized" }

  /integrations/git/webhook:
    post:
      tags: [catalog-admin]
      operationId: gitWebhook
      summary: The Git server's call when the catalog's repository changes
      description: |
        Asks rvav to read the catalog's repository now (ADR-0029).
        Authenticated by the secret of `RVAV_GIT_WEBHOOK_SECRET`, not by an
        rvav token: GitHub's and Gitea's `X-Hub-Signature-256` (or Gitea's
        `X-Gitea-Signature`) over the body, or GitLab's `X-Gitlab-Token`.
      security: []
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "202": { description: The repository will be read }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /integrations/slack/interactions:
    post:
      tags: [notifications]
      operationId: slackInteractions
      summary: Slack's calls when someone presses Approve or Reject, or sends the reject dialog
      description: |
        Authenticated by Slack's `X-Slack-Signature` over the body and
        `X-Slack-Request-Timestamp`, not by an rvav token (ADR-0023).
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [payload]
              properties:
                payload: { type: string, description: "The interaction, as JSON." }
      responses:
        "200":
          description: Done; for a dialog, its errors when the comment is missing
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/drafts:
    get:
      tags: [requests]
      operationId: listRequestDrafts
      summary: The caller's saved request drafts, last changed first
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedDraftList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [requests]
      operationId: createRequestDraft
      summary: Save a request to finish later
      description: |
        A draft is the request as filled so far, unchecked; it is only the
        caller's. Values of secret fields are not kept. An item not shared
        with the caller in the draft's project answers 422 at
        `/draft/catalog_item_id`, as one that doesn't exist.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SavedDraftWrite" }
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedDraft" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /me/drafts/{id}:
    parameters:
      - { $ref: "#/components/parameters/IdPath" }
    get:
      tags: [requests]
      operationId: getRequestDraft
      summary: A saved draft, to resume it
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedDraft" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [requests]
      operationId: updateRequestDraft
      summary: Save a draft again
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SavedDraftWrite" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedDraft" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [requests]
      operationId: deleteRequestDraft
      summary: Discard a draft (done once it is submitted)
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/views:
    get:
      tags: [deployments]
      operationId: listSavedViews
      summary: The caller's saved views of a list, by name
      description: |
        A saved view is a list's filters, sort and layout under a name: the
        query of the list's address. It is only the caller's; to share one,
        share its address, which shows each person what they may see.
      parameters:
        - name: list
          in: query
          required: true
          schema: { $ref: "#/components/schemas/ViewList" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedViewList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [deployments]
      operationId: createSavedView
      summary: Save a list's filters, sort and layout under a name
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SavedViewWrite" }
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /me/views/{id}:
    parameters:
      - { $ref: "#/components/parameters/IdPath" }
    put:
      tags: [deployments]
      operationId: updateSavedView
      summary: Rename a saved view, or save the list's current query in it
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SavedViewWrite" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [deployments]
      operationId: deleteSavedView
      summary: Delete a saved view
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /environments:
    get:
      tags: [projects]
      operationId: listEnvironments
      summary: Environments defined by administrators (for example dev, tst, prd)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Environment" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /projects:
    get:
      tags: [projects]
      operationId: listProjects
      summary: Projects the caller sees (`project.see`), all of them when it is held for all of rvav
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /projects/{projectId}:
    parameters:
      - { $ref: "#/components/parameters/ProjectIdPath" }
    get:
      tags: [projects]
      operationId: getProject
      summary: One project
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{projectId}/deployment-sharing:
    parameters:
      - { $ref: "#/components/parameters/ProjectIdPath" }
    put:
      tags: [projects]
      operationId: setDeploymentSharing
      summary: Who sees the project's deployments (`project.members.manage` there)
      description: |
        `all_members`, every project's default: whoever sees the project sees
        its deployments and requests. `owner_only`: each member sees the
        deployments they own and the requests they made or own, a
        deployment's requests among them; whoever
        holds `deployments.read_all` there (project admins, supervisors,
        auditors and administrators) still sees all of them (ADR-0045).
        Audited as `project.sharing.set`; open event streams end with
        resync.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeploymentSharingWrite" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /projects/{projectId}/quota:
    parameters:
      - { $ref: "#/components/parameters/ProjectIdPath" }
    get:
      tags: [projects]
      operationId: getProjectQuota
      summary: Quota limits and usage, for the whole project or one environment
      parameters:
        - name: environment
          in: query
          description: Environment key. Omit for the project-wide quota.
          schema: { $ref: "#/components/schemas/EnvironmentKey" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuotaUsage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /catalog/categories:
    get:
      tags: [catalog]
      operationId: listCatalogCategories
      summary: Categories with the number of items the caller can request in a project
      parameters:
        - { $ref: "#/components/parameters/ProjectIdQueryRequired" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CatalogCategory" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /catalog/items:
    get:
      tags: [catalog]
      operationId: listCatalogItems
      summary: Catalog items shared with the caller in a project, in their published version
      description: |
        An item shared with the project's chosen users, groups or roles only
        is listed to those it names (ADR-0019, Sharing).
      parameters:
        - { $ref: "#/components/parameters/ProjectIdQueryRequired" }
        - name: category
          in: query
          schema: { type: string }
        - name: type
          in: query
          schema: { $ref: "#/components/schemas/CatalogItemType" }
        - name: favourite
          in: query
          description: Only the caller's favourites.
          schema: { type: boolean }
        - { $ref: "#/components/parameters/Search" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogItemPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /catalog/items/{itemId}:
    parameters:
      - { $ref: "#/components/parameters/ItemIdPath" }
    get:
      tags: [catalog]
      operationId: getCatalogItem
      summary: One catalog item
      parameters:
        - { $ref: "#/components/parameters/ProjectIdQueryRequired" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /catalog/items/{itemId}/favourite:
    parameters:
      - { $ref: "#/components/parameters/ItemIdPath" }
    put:
      tags: [catalog]
      operationId: addFavourite
      summary: Add an item to the caller's favourites
      description: |
        An item shared with the caller in none of the projects they see
        answers 404, as one that doesn't exist (ADR-0019).
      responses:
        "204": { description: Added (or already a favourite) }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [catalog]
      operationId: removeFavourite
      summary: Remove an item from the caller's favourites
      responses:
        "204": { description: Removed (or was not a favourite) }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /catalog/items/{itemId}/form:
    parameters:
      - { $ref: "#/components/parameters/ItemIdPath" }
    get:
      tags: [forms]
      operationId: getRequestForm
      summary: The request form for an item version, ready to render
      parameters:
        - { $ref: "#/components/parameters/ProjectIdQueryRequired" }
        - name: version_id
          in: query
          description: |
            A version to request: one of the item's requestable versions
            (`CatalogItem.versions` when it offers several, else
            `CatalogItem.version`). Defaults to the newest, `CatalogItem.version`.
            Catalog administrators may name any version, drafts included.
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestForm" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /forms/values:
    post:
      tags: [forms]
      operationId: resolveFieldValues
      summary: Resolve a field's dynamic options or computed value
      description: |
        Called by the form renderer for fields with a `value_source`, again
        whenever a field listed in `depends_on` changes. The server resolves
        the source (vCenter inventory cache, EfficientIP, AWX, naming policy,
        REST, CEL) and applies the project's placement rules, so the browser
        never talks to those systems and never sees their credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FieldValuesQuery" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FieldValues" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/UpstreamError" }

  /forms/files:
    post:
      tags: [forms]
      operationId: uploadFormFile
      summary: Attach a file to a form's file field, before the request is submitted
      description: |
        The body is the file's content as it is. rvav checks it against the
        field: its size, its name's extension and what its content is, read
        from its first bytes. The file waits a day for a request: submit
        one with the returned record as the field's value, and it is kept
        with that request. Someone may have 20 files waiting at most.
      parameters:
        - { name: version_id, in: query, required: true, schema: { type: string } }
        - { name: project_id, in: query, required: true, schema: { type: string } }
        - { name: field, in: query, required: true, description: The file field's input name., schema: { type: string } }
        - { name: name, in: query, required: true, description: The file's name., schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Kept, waiting for its request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileRef" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  /files/{fileId}:
    get:
      tags: [requests]
      operationId: downloadFile
      summary: Download a file attached to a request
      description: |
        For the requester and the request's owner, its approvers, and its
        project's admins; a file still waiting for its request, for the
        one who attached it. Always a download, never shown in the browser.
      parameters:
        - { name: fileId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The file
          headers:
            Content-Disposition:
              description: "`attachment`, with the file's name."
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /forms/images/{imageId}:
    get:
      tags: [forms]
      operationId: getFormImage
      summary: An image uploaded for forms, which an image field shows as upload:<id>
      description: |
        For anyone signed in: forms show it to everyone who may request
        their item. A PNG, JPEG, GIF or WebP picture, never anything a
        browser runs.
      parameters:
        - { name: imageId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The image
          content:
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/gif:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /requests/preview:
    post:
      tags: [requests]
      operationId: previewRequest
      summary: Validate a draft and show what it would do, without creating anything
      description: |
        Drives the summary panel of the request form: validation errors,
        generated names, quota impact, the approval path, placement and lease.
        Nothing is reserved; the real request may still differ (for example a
        name taken in the meantime).
      parameters:
        - name: validate
          in: query
          description: |
            Also run the item's validations (`UiSchema.validations`), as
            submit does: the wizard's review step asks this before the
            requester submits. They run once the inputs pass the form's own
            checks; their messages are in `errors`, and a validation that
            couldn't run is an error too.
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequestDraft" }
      responses:
        "200":
          description: The preview. Check `valid` and `errors`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestPreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /requests:
    get:
      tags: [requests]
      operationId: listRequests
      summary: Requests visible to the caller
      description: |
        Those of every project the caller sees, and those they made or own:
        made for them, or that built or changed a deployment they own. In a
        project whose deployments show to their owners only, those they made
        or own unless they hold `deployments.read_all` there.
      parameters:
        - { $ref: "#/components/parameters/ProjectIdQuery" }
        - name: status
          in: query
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: "#/components/schemas/RequestStatus" }
        - name: requester
          in: query
          description: "`me`, or a user ID."
          schema: { type: string }
        - { $ref: "#/components/parameters/Search" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [requests]
      operationId: createRequest
      summary: Submit a request
      description: |
        Validates the draft again on the server, checks sharing and quota,
        then starts the workflow. An item the project's catalog doesn't
        offer is 404; one shared there with others only (chosen users,
        groups or roles) is 403. The response is sent before any external
        system is called; follow progress with `/requests/{requestId}/steps`
        and the `request.*` events.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequestDraft" }
      responses:
        "202":
          description: Accepted
          headers:
            Location:
              description: URL of the new request
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Request" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /requests/{requestId}:
    parameters:
      - { $ref: "#/components/parameters/RequestIdPath" }
    get:
      tags: [requests]
      operationId: getRequest
      summary: One request
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Request" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /requests/{requestId}/steps:
    parameters:
      - { $ref: "#/components/parameters/RequestIdPath" }
    get:
      tags: [requests]
      operationId: listRequestSteps
      summary: The request timeline, as a tree of steps
      responses:
        "200":
          description: Top-level steps in execution order, each with its children
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Step" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /requests/{requestId}/topology:
    parameters:
      - { $ref: "#/components/parameters/RequestIdPath" }
    get:
      tags: [requests]
      operationId: getRequestTopology
      summary: What the requested version builds, for the request's page to draw its run on
      description: |
        The topology of the catalog item version the request was made from,
        not the item's latest (ADR-0032): the projection the request form
        gets as `RequestForm.topology`, so nothing a requester doesn't see
        (guest settings, secrets, sizes, naming, placement, tags,
        variables). A composite's steps run as `step:<key>`, the key the
        canvas gives the step's node. Whoever may read the request may read
        it; it doesn't change, so it can be cached.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestTopology" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /requests/{requestId}/steps/{stepId}/data:
    parameters:
      - { $ref: "#/components/parameters/RequestIdPath" }
      - name: stepId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [requests]
      operationId: getStepData
      summary: What a step was given and what it gave (ADR-0057)
      description: |
        A step's inputs as it ran with them and its outputs, as later steps
        of a composite read them (`steps.<key>`). Secrets are masked: a
        secret input reads `••••`, a stored secret its `${secret.<name>}`,
        and a secret input's value inside a text reads `[removed]`. The
        answer of a wait for a person is read only by those it asks and
        those who read every approval; others get `outputs_hidden`. It
        needs `catalog.manage` for all of rvav, as a blueprint's literals
        do (ADR-0033), or `extensibility.read` (auditors): a requester reads
        the step's status, not its data.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StepData" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /requests/{requestId}/steps/{stepId}/log:
    parameters:
      - { $ref: "#/components/parameters/RequestIdPath" }
      - name: stepId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [requests]
      operationId: getStepLog
      summary: Output of a step, such as an AWX job's stdout, read incrementally
      parameters:
        - name: offset
          in: query
          description: The `next_offset` from the previous chunk. Start at 0.
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          description: Maximum number of lines.
          schema: { type: integer, minimum: 1, maximum: 5000, default: 1000 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogChunk" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /requests/{requestId}/cancel:
    parameters:
      - { $ref: "#/components/parameters/RequestIdPath" }
    post:
      tags: [requests]
      operationId: cancelRequest
      summary: Cancel a request that is waiting or running
      description: |
        A pending or scheduled request is cancelled at once. A running request
        stops after its current step and rolls back what it created, following
        the catalog item's rollback policy.
      responses:
        "202":
          description: Cancellation accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Request" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /requests/{requestId}/signal/{name}:
    parameters:
      - { $ref: "#/components/parameters/RequestIdPath" }
      - name: name
        in: path
        required: true
        description: The signal a composite step waits for, as its `signal.name` says.
        schema: { type: string, pattern: "^[a-z0-9][a-z0-9_.-]{0,62}$" }
    post:
      tags: [requests]
      operationId: signalRequest
      summary: Send the signal a composite step waits for
      description: |
        The step that waits for this signal goes on, the body as its outputs,
        which later steps read as `steps.<key>`. Those with
        `request.manage` in the request's project send it; the requester
        can't, so a wait the item puts in their way stays there. The body
        goes into the request's history: send no secret (ADR-0057).

        A signal sent before the step waits, or after it took one, is
        refused with 409 and not kept: send it again once the step waits.
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "202":
          description: The step has it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignalReceipt" }
        "400":
          description: The body isn't a JSON object.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: |
            The body is over 64 KiB of JSON: `too_large`, its `field` the
            empty pointer, which names the whole body.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /requests/{requestId}/retry:
    parameters:
      - { $ref: "#/components/parameters/RequestIdPath" }
    post:
      tags: [requests]
      operationId: retryRequest
      summary: Run a failed request again from its failed step
      description: Steps that completed are kept; the failed step and the ones after it run again.
      responses:
        "202":
          description: Running again
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Request" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /requests/{requestId}/rollback:
    parameters:
      - { $ref: "#/components/parameters/RequestIdPath" }
    post:
      tags: [requests]
      operationId: rollbackRequest
      summary: Undo what a failed provisioning request created
      description: Deletes the VMs, DNS records and IP addresses it created, and marks its deployments deleted.
      responses:
        "202":
          description: Rolling back
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Request" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /requests/{requestId}/approvals:
    parameters:
      - { $ref: "#/components/parameters/RequestIdPath" }
    get:
      tags: [approvals]
      operationId: listRequestApprovals
      summary: The approval levels of a request, with their decisions
      responses:
        "200":
          description: Levels in the order they run; empty when no approval was needed
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Approval" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /schedules:
    get:
      tags: [requests]
      operationId: listSchedules
      summary: Recurring schedules visible to the caller (ADR-0057)
      description: |
        Those the caller owns, and those of the projects where they hold
        `request.manage` or `deployments.read_all`. Each with its next runs
        and its last.
      parameters:
        - { $ref: "#/components/parameters/ProjectIdQuery" }
      responses:
        "200":
          description: The schedules, the newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [requests]
      operationId: createSchedule
      summary: Run an item on a recurring schedule, as the caller
      description: |
        For an item that makes no deployment: a custom workflow, an AWX
        template, a composite without VM steps. Each run is a request of
        the caller's, submitted as `POST /requests` submits one: policies,
        approvals and quota apply to each, and a run they refuse is kept
        with why. A run is skipped while the run before it hasn't finished.
        The inputs are checked as a request's are when the schedule is
        made; a secret input can't be kept.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleWrite" }
      responses:
        "201":
          description: Made, with its next runs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "502": { $ref: "#/components/responses/UpstreamError" }

  /schedules/{scheduleId}:
    parameters:
      - { $ref: "#/components/parameters/ScheduleIdPath" }
    get:
      tags: [requests]
      operationId: getSchedule
      summary: One schedule, with its last runs
      responses:
        "200":
          description: The schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [requests]
      operationId: deleteSchedule
      summary: Delete a schedule
      description: |
        No run starts after; the requests it started stay, and still name
        it. Its owner, or `request.manage` in its project.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/UpstreamError" }

  /schedules/{scheduleId}/pause:
    parameters:
      - { $ref: "#/components/parameters/ScheduleIdPath" }
    post:
      tags: [requests]
      operationId: pauseSchedule
      summary: Pause a schedule
      description: No run starts until it is resumed. Its owner, or `request.manage` in its project.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchedulePause" }
      responses:
        "200":
          description: Paused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/UpstreamError" }

  /schedules/{scheduleId}/resume:
    parameters:
      - { $ref: "#/components/parameters/ScheduleIdPath" }
    post:
      tags: [requests]
      operationId: resumeSchedule
      summary: Resume a paused schedule
      description: |
        Runs start again from its next time: those missed while it was
        paused don't. Its owner, or `request.manage` in its project.
      responses:
        "200":
          description: Resumed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/UpstreamError" }

  /approvals:
    get:
      tags: [approvals]
      operationId: listApprovals
      summary: Approvals waiting for the caller, or decided by them
      description: |
        `view=mine` (default) lists the open levels the caller may decide (they
        are named in it, in its group, or it was delegated to them) and, for
        other statuses, the levels they voted on. `view=all` lists every
        approval and needs the admin or auditor role.
      parameters:
        - name: view
          in: query
          schema: { type: string, enum: [mine, all], default: mine }
        - name: status
          in: query
          style: form
          explode: false
          description: Defaults to `pending`.
          schema:
            type: array
            items: { $ref: "#/components/schemas/ApprovalStatus" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: Pending ones oldest first (the most urgent on top); others newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /approvals/{approvalId}:
    parameters:
      - { $ref: "#/components/parameters/ApprovalIdPath" }
    get:
      tags: [approvals]
      operationId: getApproval
      summary: One approval level, with what an approver needs to decide
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /approvals/{approvalId}/decision:
    parameters:
      - { $ref: "#/components/parameters/ApprovalIdPath" }
    post:
      tags: [approvals]
      operationId: decideApproval
      summary: Approve or reject
      description: |
        Only an approver of the level may decide, and never the requester.
        Rejecting needs a comment, which is sent to the requester. When
        approving, `inputs` may change fields marked `approver_editable`,
        within their limits; the request is evaluated again with them.
        With mode `all`, the level is approved once every named approver has
        approved; any rejection rejects it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalDecision" }
      responses:
        "200":
          description: The level after the decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /approvals/{approvalId}/delegate:
    parameters:
      - { $ref: "#/components/parameters/ApprovalIdPath" }
    post:
      tags: [approvals]
      operationId: delegateApproval
      summary: Let another user decide this level
      description: Only an approver of a pending level may delegate it. The delegate becomes an approver of this level only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalDelegation" }
      responses:
        "200":
          description: The level with its new approver
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /deployments:
    get:
      tags: [deployments]
      operationId: listDeployments
      summary: Deployments visible to the caller
      description: |
        Without `project_id`, the deployments of every project the caller
        sees (`project.see`), and those they own wherever they are. In a
        project whose deployments show to their owners only, the caller's
        own unless they hold `deployments.read_all` there (ADR-0045).
        Filters with several values match any of them;
        different filters must all match. Deleted deployments are left out
        unless `status` names `deleted`.
      parameters:
        - name: project_id
          in: query
          description: One project's deployments. Omit it for every project the caller sees.
          schema: { type: string }
        - name: status
          in: query
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: "#/components/schemas/DeploymentStatusFilter" }
        - name: environment
          in: query
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: "#/components/schemas/EnvironmentKey" }
        - name: item
          in: query
          description: Catalog items, by ID or slug.
          style: form
          explode: false
          schema:
            type: array
            maxItems: 20
            items: { type: string }
        - name: template
          in: query
          description: "VM templates, by name in vCenter (a VM's `template`): deployments with a VM cloned from one."
          style: form
          explode: false
          schema:
            type: array
            maxItems: 20
            items: { type: string }
        - name: owner
          in: query
          description: "`me`, or a user ID."
          schema: { type: string }
        - name: lease_expires_before
          in: query
          schema: { type: string, format: date-time }
        - name: q
          in: query
          description: Part of the deployment's name, its owner's name, or a VM's name, address or FQDN.
          schema: { type: string, maxLength: 200 }
        - name: sort
          in: query
          description: |
            A field, descending with a leading `-`. `owner`, `item` and
            `project` sort by name; a deployment with no lease sorts after
            every lease end. Ties are broken by name.
          schema:
            type: string
            enum: [name, -name, created_at, -created_at, lease_expires_at, -lease_expires_at, status, -status,
              environment, -environment, owner, -owner, item, -item, project, -project, vm_count, -vm_count]
            x-enum-varnames: [Name, MinusName, CreatedAt, MinusCreatedAt, LeaseExpiresAt, MinusLeaseExpiresAt,
              DeploymentSortStatus, DeploymentSortMinusStatus, DeploymentSortEnvironment, DeploymentSortMinusEnvironment,
              DeploymentSortOwner, DeploymentSortMinusOwner, DeploymentSortItem, DeploymentSortMinusItem,
              DeploymentSortProject, DeploymentSortMinusProject, DeploymentSortVmCount, DeploymentSortMinusVmCount]
            default: name
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /deployments/facets:
    get:
      tags: [deployments]
      operationId: getDeploymentFacets
      summary: The values the caller's deployments have, to filter them by
      description: |
        The catalog items, VM templates and environments of the deployments
        `listDeployments` would list with this `project_id`, deleted ones
        left out: a filter offers only what matches something.
      parameters:
        - name: project_id
          in: query
          description: One project's deployments. Omit it for every project the caller sees.
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentFacets" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /resources/vms:
    get:
      tags: [deployments]
      operationId: listVms
      summary: The VMs of the deployments the caller sees, across deployments
      description: |
        Each VM of a deployment that isn't deleted, in the projects the
        caller sees (`project.see`), with its deployment, project and
        environment. Its disks and network adapters are in `vm`. Filters
        with several values match any of them; different filters must all
        match.
      parameters:
        - name: project_id
          in: query
          description: One project's VMs. Omit it for every project the caller sees.
          schema: { type: string }
        - name: environment
          in: query
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: "#/components/schemas/EnvironmentKey" }
        - name: power_state
          in: query
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: "#/components/schemas/VmPowerState" }
        - { name: vcenter, in: query, description: Its vCenter's name., schema: { type: string } }
        - { name: cluster, in: query, description: Its cluster's name., schema: { type: string } }
        - name: network
          in: query
          description: A network (port group) one of its adapters is on.
          schema: { type: string }
        - name: q
          in: query
          description: Part of the VM's name or FQDN, or of one of its addresses.
          schema: { type: string, maxLength: 200 }
        - name: sort
          in: query
          description: A field, descending with a leading `-`. `deployment` and `project` sort by name; ties are broken by name.
          schema:
            type: string
            enum: [name, -name, deployment, -deployment, project, -project, environment, -environment,
              power_state, -power_state, cpu_count, -cpu_count, memory_mb, -memory_mb, disk_gb, -disk_gb]
            x-enum-varnames: [VmSortName, VmSortMinusName, VmSortDeployment, VmSortMinusDeployment, VmSortProject,
              VmSortMinusProject, VmSortEnvironment, VmSortMinusEnvironment, VmSortPowerState, VmSortMinusPowerState,
              VmSortCpuCount, VmSortMinusCpuCount, VmSortMemoryMb, VmSortMinusMemoryMb, VmSortDiskGb, VmSortMinusDiskGb]
            default: name
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VmPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /resources/vms/facets:
    get:
      tags: [deployments]
      operationId: getVmFacets
      summary: The vCenters, clusters and networks of the caller's VMs, to filter them by
      parameters:
        - name: project_id
          in: query
          description: One project's VMs. Omit it for every project the caller sees.
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VmFacets" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /deployments/{deploymentId}:
    parameters:
      - name: deploymentId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [deployments]
      operationId: getDeployment
      summary: One deployment with its resources
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /deployments/{deploymentId}/actions:
    parameters:
      - { $ref: "#/components/parameters/DeploymentIdPath" }
    get:
      tags: [deployments]
      operationId: listDeploymentActions
      summary: The day-2 actions available on a deployment and its resources
      description: |
        Every action that applies, with whether the caller may run it now
        (day-2 policies and the resource's state) and why not.
      responses:
        "200":
          description: Grouped by resource, then by action group
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Day2Action" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [deployments]
      operationId: runDeploymentAction
      summary: Run a day-2 action
      description: |
        Creates a request of kind `day2` and starts it, or waits for approval
        when a day-2 policy asks for one. Follow it like any request.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Day2Draft" }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Request" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "502": { $ref: "#/components/responses/UpstreamError" }

  /deployments/{deploymentId}/actions/preview:
    parameters:
      - { $ref: "#/components/parameters/DeploymentIdPath" }
    post:
      tags: [deployments]
      operationId: previewDeploymentAction
      summary: An action's form for these inputs, its rules worked out
      description: |
        For an action whose form an administrator designed (ADR-0050,
        `ActionForm.designed`): each field's rule results and default for
        the inputs given, on the target, and what is wrong with them, as
        `previewRequest` does for a request form. The form shows them and
        `runDeploymentAction` applies them. Defaults may read the target
        (`resource`, `deployment`). Value sources that check a value against
        a system are left to the run.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Day2FormQuery" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Day2FormPreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /deployments/{deploymentId}/actions/values:
    parameters:
      - { $ref: "#/components/parameters/DeploymentIdPath" }
    post:
      tags: [deployments]
      operationId: resolveDeploymentActionValues
      summary: Resolve a field's dynamic options or computed value in an action's form
      description: |
        `resolveFieldValues` for the form of a day-2 action, on its target:
        the server resolves the field's value source for the caller in the
        deployment's project and environment. For whoever may run the
        action there.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Day2FieldValuesQuery" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FieldValues" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "502": { $ref: "#/components/responses/UpstreamError" }

  /deployments/{deploymentId}/history:
    parameters:
      - { $ref: "#/components/parameters/DeploymentIdPath" }
    get:
      tags: [deployments]
      operationId: listDeploymentHistory
      summary: The requests that created and changed a deployment
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /deployments/{deploymentId}/update:
    parameters:
      - { $ref: "#/components/parameters/DeploymentIdPath" }
    post:
      tags: [deployments]
      operationId: updateDeployment
      summary: Update a deployment to its item's version and new inputs
      description: |
        Creates a request of kind `update` (ADR-0042) and starts it, or waits
        for approval as a new request would. It changes the deployment's VMs
        as `previewDeploymentUpdate` plans: resizes, disks and adapters, VMs
        added or removed, AWX jobs new to the version. A failed deployment
        can be updated too: its VMs never built are built. An update with a
        change rvav can't make in place is refused (422, `refused`), and so
        is one that changes nothing (`no_change`). Follow the request like
        any other; when it succeeds, the deployment has the new version and
        inputs.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateDraft" }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Request" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "502": { $ref: "#/components/responses/UpstreamError" }

  /deployments/{deploymentId}/update/preview:
    parameters:
      - { $ref: "#/components/parameters/DeploymentIdPath" }
    post:
      tags: [deployments]
      operationId: previewDeploymentUpdate
      summary: What an update would change, before asking for it
      description: |
        Compares the deployment's item version and inputs with the draft's
        and says what an update would do, what it refuses and why, its
        quota and its approval. Nothing is reserved or changed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateDraft" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdatePreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /deployments/{deploymentId}/private-key:
    parameters:
      - { $ref: "#/components/parameters/DeploymentIdPath" }
    post:
      tags: [deployments]
      operationId: downloadPrivateKey
      summary: Download the private key rvav made for the deployment, once (ADR-0039)
      description: |
        Only the deployment's owner may, and only once: rvav forgets the
        private key as it returns it. Recorded in the audit log, without
        the key. 404 when the deployment has no generated key; 409 when it
        was downloaded, or forgotten when the deployment was deleted.
      responses:
        "200":
          description: OK
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateKey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /deployments/{deploymentId}/resources/{resourceId}/console:
    parameters:
      - { $ref: "#/components/parameters/DeploymentIdPath" }
      - name: resourceId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [deployments]
      operationId: openConsole
      summary: Open a VM's console (ADR-0012)
      description: |
        Returns a VMRC link with a fresh clone ticket and, when the web
        console is configured, a single-use WebSocket URL valid for one
        minute. Allowed by the `console` day-2 policy; recorded in the audit log.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsoleSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/UpstreamError" }

  /console/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [deployments]
      operationId: consoleStream
      summary: The web console's WebSocket, proxied to the ESXi host
      description: Upgrades to WebSocket. The token comes from `openConsole` and works once.
      security: []
      responses:
        "101":
          description: Switching protocols
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/UpstreamError" }

  /ansible/inventory:
    get:
      tags: [ansible]
      operationId: getAnsibleInventory
      summary: The Ansible inventory of rvav's VMs
      description: |
        In the format of `ansible-inventory --list`, for the `rvav.platform.rvav`
        inventory plugin AWX uses (ADR-0017): every VM of a deployment that is
        not being deleted, `ansible_host` its reserved address, groups `rvav`,
        `project_<code>`, `env_<key>`, `item_<slug>`, `tag_<item tag>` and
        `os_<family>`, and host variables `rvav_deployment_id`,
        `rvav_deployment`, `rvav_deployment_status`, `rvav_project`,
        `rvav_environment`, `rvav_item`, `rvav_owner`, `rvav_fqdn`,
        `rvav_moref`, `rvav_power_state`, `rvav_os_family` and `rvav_inputs`
        (the inputs whose field is marked `expose_to_inventory`, never secret
        ones). For an API token of a user with the auditor (or admin) role.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnsibleInventory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/ipam/reconcile:
    get:
      tags: [admin]
      operationId: reconcileIpam
      summary: Compare EfficientIP and rvav's IP ranges with what rvav recorded
      description: |
        Addresses and DNS records EfficientIP has with the class parameter
        `rvav_managed=1` that no deployment owns (orphans, for example left by
        a failed run), and addresses and records a deployment owns that
        EfficientIP no longer has. Nothing is changed. A request running
        while the check runs may show its newest objects as orphans.
        Also, and without EfficientIP (`efficientip` is then false), the
        addresses rvav's IP ranges gave to VMs no deployment has any more,
        once the request that took them ended, and the inventory's VMs whose
        address is in a range that didn't give it to them.
        Needs `infrastructure.manage` (administrators).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IpamReconcile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/UpstreamError" }

  /admin/awx/templates:
    get:
      tags: [admin]
      operationId: listAwxTemplates
      summary: AWX templates imported into the catalog
      description: |
        The templates chosen by organisation and label (ADR-0016), each with
        the item made from it, whether its survey changed since the item's
        form was made (and what changed), and warnings about its launch
        settings. Needs `catalog.manage` (catalog admins and administrators).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AwxTemplateList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/awx/templates/sync:
    post:
      tags: [admin]
      operationId: syncAwxTemplates
      summary: Import the AWX templates now, instead of waiting for the next sync
      responses:
        "200":
          description: The templates after the sync
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AwxTemplateList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/UpstreamError" }

  /admin/awx/actions:
    get:
      tags: [admin]
      operationId: listAwxActions
      summary: AWX templates offered as day-2 actions
      description: |
        The templates of the organisation with a label of
        `RVAV_AWX_ACTION_LABELS` (`day2`), synced with the catalog's
        (ADR-0018): each is a day-2 action with its form from the survey,
        on the resource types and under the condition administrators
        choose. Needs `extensibility.manage` (administrators).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AwxActionList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/awx/actions/{key}:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string, examples: [awx.install-monitoring-agent] }
    patch:
      tags: [admin]
      operationId: updateAwxAction
      summary: Choose where an AWX action is offered, its name, or turn it off
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AwxActionUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AwxAction" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/day2-forms:
    get:
      tags: [admin]
      operationId: listDay2Forms
      summary: The forms designed for custom day-2 actions
      description: |
        One per AWX (`awx.*`) or workflow (`wf.*`) day-2 action an
        administrator designed a form for (ADR-0050), whether in use or
        not. The other actions ask for their survey's or input schema's
        form. Needs `extensibility.manage` (administrators).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Day2FormList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/day2-forms/{action}:
    parameters:
      - { $ref: "#/components/parameters/Day2ActionPath" }
    get:
      tags: [admin]
      operationId: getDay2Form
      summary: The form designed for a custom day-2 action
      description: |
        The designed form, or, before one is saved (`revision` 0), the
        survey's or input schema's form to start from.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Day2FormDesign" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [admin]
      operationId: saveDay2Form
      summary: Save the form designed for a custom day-2 action
      description: |
        Checked as a catalog item's form is: an inactive form may be
        incomplete, as a draft; an active one (`active`) must be complete,
        as a published version, and the action asks for it from its next
        run. A form saved elsewhere since `base_revision` is refused (409).
        Not every field fits an action's form: no file uploads, no secret
        fields (`not_allowed`: a run keeps its inputs with the request as
        they are, so the secret stays in AWX or in rvav's secrets, named),
        and no wizard (the form shows in a dialog).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Day2FormWrite" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Day2FormDesign" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [admin]
      operationId: deleteDay2Form
      summary: Drop a designed form, so the action asks for its survey's or schema's again
      responses:
        "204": { description: Dropped (or there was none) }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/day2-forms/{action}/preview:
    parameters:
      - { $ref: "#/components/parameters/Day2ActionPath" }
    post:
      tags: [admin]
      operationId: previewDay2Form
      summary: The saved designed form on a deployment or one of its VMs, as its users would get it
      description: |
        The form designer's preview: `previewDeploymentAction` for the form
        as saved, active or not, on any deployment, as the administrator.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Day2FormDesignerQuery" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Day2FormPreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/day2-forms/{action}/values:
    parameters:
      - { $ref: "#/components/parameters/Day2ActionPath" }
    post:
      tags: [admin]
      operationId: resolveDay2FormValues
      summary: Resolve a field's value source in the saved designed form, for the designer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Day2FormDesignerValuesQuery" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FieldValues" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "502": { $ref: "#/components/responses/UpstreamError" }

  /admin/catalog/items:
    get:
      tags: [catalog-admin]
      operationId: listAdminCatalogItems
      summary: Every catalog item, in any state, for catalog admins
      description: Needs `catalog.manage`, held by catalog admins and administrators (ADR-0019).
      parameters:
        - { $ref: "#/components/parameters/Search" }
        - name: category
          in: query
          schema: { type: string }
        - name: source
          in: query
          schema: { type: string, enum: [native, awx] }
        - name: state
          in: query
          description: "`published`: requestable now; `unpublished`: no published version."
          schema: { type: string, enum: [published, unpublished] }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCatalogItemPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [catalog-admin]
      operationId: createCatalogItem
      summary: Create an item with a first draft version
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogItemCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCatalogItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/catalog/items/{itemId}:
    parameters:
      - { $ref: "#/components/parameters/ItemIdPath" }
    get:
      tags: [catalog-admin]
      operationId: getAdminCatalogItem
      summary: One item, with its versions and entitlements
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCatalogItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [catalog-admin]
      operationId: updateCatalogItem
      summary: Change an item's name, summary, description, category, icon, tags or slug
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogItemUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCatalogItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [catalog-admin]
      operationId: deleteCatalogItem
      summary: Delete an item that was never requested
      description: An item with requests is unpublished (deprecate its version) instead; deleting it is refused with 409.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/catalog/items/{itemId}/versions:
    parameters:
      - { $ref: "#/components/parameters/ItemIdPath" }
    post:
      tags: [catalog-admin]
      operationId: createCatalogItemVersion
      summary: Start a draft, as a copy of a version or from a definition
      description: An item has at most one draft; a second one is refused with 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogItemVersionCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogItemVersionDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/catalog/items/{itemId}/versions/{versionId}:
    parameters:
      - { $ref: "#/components/parameters/ItemIdPath" }
      - { $ref: "#/components/parameters/VersionIdPath" }
    get:
      tags: [catalog-admin]
      operationId: getCatalogItemVersion
      summary: One version with its definition
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogItemVersionDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [catalog-admin]
      operationId: updateCatalogItemVersion
      summary: Save a draft
      description: |
        Only drafts change. The definition is checked as a whole: the JSON
        Schema compiles, every UI field is an input of the schema and every
        section names existing fields, CEL rules and value sources are
        valid, and the blueprint parses for the item's type. Problems are
        422 with pointers under `/definition`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogItemVersionUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogItemVersionDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [catalog-admin]
      operationId: deleteCatalogItemVersion
      summary: Discard a draft
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/catalog/items/{itemId}/versions/{versionId}/publish:
    parameters:
      - { $ref: "#/components/parameters/ItemIdPath" }
      - { $ref: "#/components/parameters/VersionIdPath" }
    post:
      tags: [catalog-admin]
      operationId: publishCatalogItemVersion
      summary: Publish a draft, or publish an older version again (roll back)
      description: |
        The version becomes requestable. The versions requestable until now
        are deprecated, unless `keep_published` keeps them requestable too
        (ADR-0046). The item's newest requestable version is its default,
        `published_version`, which requesters get unless they pick another.
        Deployments and requests already made keep their version.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogItemVersionPublish" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCatalogItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/catalog/git:
    get:
      tags: [catalog-admin]
      operationId: catalogGitStatus
      summary: The catalog's Git repository, as rvav last read it, and its files
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogGitStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/catalog/git/read:
    post:
      tags: [catalog-admin]
      operationId: readCatalogGit
      summary: Read the catalog's repository now, and commit what waits
      description: |
        Waits for the read, at most a minute; a read that fails is in the
        status's `error`.
      responses:
        "200":
          description: Read
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogGitStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/catalog/items/{itemId}/git:
    parameters:
      - { $ref: "#/components/parameters/ItemIdPath" }
    get:
      tags: [catalog-admin]
      operationId: catalogItemGit
      summary: The item's file in the repository, and how it differs from rvav's
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogItemGitDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/catalog/items/{itemId}/git/resolve:
    parameters:
      - { $ref: "#/components/parameters/ItemIdPath" }
    post:
      tags: [catalog-admin]
      operationId: resolveCatalogItemGit
      summary: Settle a conflict of the item's file
      description: |
        `rvav` commits rvav's file over the repository's change; `repository`
        makes a draft of the repository's file, discarding rvav's open draft.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [take]
              properties:
                take: { type: string, enum: [rvav, repository] }
      responses:
        "200":
          description: Settled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCatalogItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/catalog/items/{itemId}/versions/{versionId}/deprecate:
    parameters:
      - { $ref: "#/components/parameters/ItemIdPath" }
      - { $ref: "#/components/parameters/VersionIdPath" }
    post:
      tags: [catalog-admin]
      operationId: deprecateCatalogItemVersion
      summary: Retire a requestable version, or withdraw the item
      description: |
        Nobody can request the version any more; its deployments keep it,
        and can be updated to a version still requestable. When it was the
        default, the newest requestable version left becomes the default.
        With `withdraw`, every requestable version is retired: the item can
        no longer be requested, as when its last one is.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogItemVersionDeprecate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCatalogItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/catalog/items/{itemId}/versions/{versionId}/preview:
    parameters:
      - { $ref: "#/components/parameters/ItemIdPath" }
      - { $ref: "#/components/parameters/VersionIdPath" }
    post:
      tags: [catalog-admin]
      operationId: previewCatalogItemVersion
      summary: The form of any version as a chosen user and project would get it
      description: |
        For the form designer: initial values, rule results and the
        evaluation's errors, as `as_user_id` (default: the caller) in the
        project, whatever the version's state or the item's entitlements.
        Value sources of the version are resolved through `/forms/values`
        with the same `as_user_id`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DesignerPreviewQuery" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesignerPreview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/catalog/preview-users:
    get:
      tags: [catalog-admin]
      operationId: listPreviewUsers
      summary: The members of a project, to preview a form as one of them
      parameters:
        - { $ref: "#/components/parameters/ProjectIdQueryRequired" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, name, email, role]
                      properties:
                        id: { type: string }
                        name: { type: string }
                        email: { type: string, description: "Tells apart people with the same name." }
                        role:
                          type: string
                          description: The names of the roles they hold in the project.
                          examples: [Member]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/catalog/items/{itemId}/compare:
    parameters:
      - { $ref: "#/components/parameters/ItemIdPath" }
    get:
      tags: [catalog-admin]
      operationId: compareCatalogItemVersions
      summary: What changed between two versions
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string }
        - name: to
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogVersionDiff" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/catalog/items/{itemId}/entitlements:
    parameters:
      - { $ref: "#/components/parameters/ItemIdPath" }
    get:
      tags: [catalog-admin]
      operationId: getCatalogItemEntitlements
      summary: The projects that may request an item
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogEntitlements" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [catalog-admin]
      operationId: setCatalogItemEntitlements
      summary: Share an item with every project or chosen projects, and with whom in each
      description: |
        A project of `project_ids` that `audiences` leaves out is shared
        with all its members. Without `audiences`, each project keeps the
        audience it had (all members for one added); without `everywhere`,
        every project keeps its audience while `all_projects` stays on.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogEntitlements" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogEntitlements" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/catalog/items/{itemId}/entitlements/requesters:
    parameters:
      - { $ref: "#/components/parameters/ItemIdPath" }
    post:
      tags: [catalog-admin]
      operationId: previewCatalogRequesters
      summary: Who could request an item in a project, shared with this audience
      description: |
        Changes nothing: the sharing editor shows who its audience lets
        request, before it is saved. The project's requesters are those
        given a role holding `request.submit` there, themselves or through
        a group whose members rvav has seen. Shares add up: when the item
        is shared with every project, its saved every-project share covers
        people too (`everywhere`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogProjectAudience" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogRequesters" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/catalog/items/{itemId}/export:
    parameters:
      - { $ref: "#/components/parameters/ItemIdPath" }
    get:
      tags: [catalog-admin]
      operationId: exportCatalogItem
      summary: The item as YAML, with one version or all of them
      parameters:
        - name: version_id
          in: query
          description: One version. All of them when absent.
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/yaml:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/catalog/images:
    post:
      tags: [catalog-admin]
      operationId: uploadFormImage
      summary: Upload an image that image fields show
      description: |
        The body is the picture's content as it is: PNG, JPEG, GIF or WebP,
        2 MB at most, its content read from its first bytes and matching
        its name's extension. An image field shows it with the returned
        `url`, `upload:<id>`. Images are kept in rvav's database, and
        anyone signed in may read them.
      parameters:
        - { name: name, in: query, required: true, description: The picture's file name., schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Kept
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FormImage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  /admin/catalog/import:
    post:
      tags: [catalog-admin]
      operationId: importCatalogItem
      summary: Import an item from YAML, as a new item or as a new draft of one
      description: |
        The YAML of `export`. Without `item_id`, the item is created (its
        slug must be free) with its versions as drafts and deprecated
        versions, nothing published. With `item_id`, the YAML's last
        version becomes that item's draft. Problems are 422 with the YAML
        line in the message.
      parameters:
        - name: item_id
          in: query
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/yaml:
            schema: { type: string }
      responses:
        "200":
          description: Imported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogImportResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/catalog/categories:
    get:
      tags: [catalog-admin]
      operationId: listAdminCatalogCategories
      summary: Every category, with its number of items
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCatalogCategoryList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [catalog-admin]
      operationId: createCatalogCategory
      summary: Add a category
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCatalogCategory" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCatalogCategory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/catalog/categories/{key}:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [catalog-admin]
      operationId: updateCatalogCategory
      summary: Rename or reorder a category
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCatalogCategoryUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCatalogCategory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [catalog-admin]
      operationId: deleteCatalogCategory
      summary: Remove an empty category
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/catalog/icons:
    get:
      tags: [catalog-admin]
      operationId: listCatalogIcons
      summary: The icons an item may have
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { type: string, examples: [server] }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/catalog/composite-steps:
    get:
      tags: [catalog-admin]
      operationId: listCompositeStepTargets
      summary: What a composite item's steps can run, with their inputs and outputs
      description: |
        For the composite designer (ADR-0022, ADR-0032): the published items
        a step may request (VM, AWX and custom workflow items: composites
        don't nest; a workflow item only while its custom workflow is
        registered for catalog items and enabled), the AWX templates
        imported from AWX, the custom workflows registered for composite
        steps and enabled, and the resource types turned on (ADR-0056).
        Each says the inputs its step's `with` binds (from the item's form,
        the template's survey, the workflow's input schema, or a resource
        type's create step's), the outputs later steps read as
        `steps.<key>.<name>`, and
        the projects it is offered to when not all of them. A step may also
        name an AWX template not listed (any template AWX has): its inputs
        are then the author's. Needs `catalog.manage` (catalog admins and administrators).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompositeStepTargetList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/secrets:
    get:
      tags: [catalog-admin]
      operationId: listSecrets
      summary: Stored secrets, without their values
      description: Needs `catalog.manage` (catalog admins and administrators). Value sources refer to secrets by name (ADR-0019).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [catalog-admin]
      operationId: createSecret
      summary: Store a secret, encrypted
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Secret" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/secrets/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
      - name: project_id
        in: query
        description: The project whose own secret this is; none for the global one.
        schema: { type: string }
    put:
      tags: [catalog-admin]
      operationId: updateSecret
      summary: Replace a secret's value
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretWrite" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Secret" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [catalog-admin]
      operationId: deleteSecret
      summary: Delete a secret nothing uses
      description: A project's own secret may be deleted while used when a global secret of the same name remains.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/property-groups:
    get:
      tags: [catalog-admin]
      operationId: listPropertyGroups
      summary: Property groups, at their latest version
      description: |
        Needs `catalog.manage`. A property group is a reusable set of inputs
        and constants (ADR-0038): an item's blueprint names a version of it
        in `property_groups`, its inputs join the item's form when the item
        is saved, and its constants are read as `propgroup.<key>.<name>`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PropertyGroupList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [catalog-admin]
      operationId: createPropertyGroup
      summary: Add a property group, as its version 1
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PropertyGroupWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PropertyGroup" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/property-groups/{key}:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [catalog-admin]
      operationId: getPropertyGroup
      summary: A property group, at its latest version or the one asked
      parameters:
        - name: version
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PropertyGroup" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [catalog-admin]
      operationId: updatePropertyGroup
      summary: Save a property group as its next version
      description: Versions never change. Items keep the version they name until a new version of theirs names another.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PropertyGroupWrite" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PropertyGroup" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [catalog-admin]
      operationId: deletePropertyGroup
      summary: Delete a property group no saved version uses
      description: Refused while a published or earlier version of an item names it; drafts that do are refused when next saved.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/form-library:
    get:
      tags: [catalog-admin]
      operationId: listFormLibrary
      summary: The form library's entries, at their latest version
      description: |
        Needs `catalog.manage`. The form library (ADR-0043) holds value
        sources and validations, `rest` or `cel`, that any item's form
        names by key and version: a field's `value_source` of kind
        `library`, an entry of `UiSchema.validations` of kind `library`.
        An entry takes parameters, which the form gives as CEL.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FormLibraryList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [catalog-admin]
      operationId: createFormLibraryEntry
      summary: Add an entry to the form library, as its version 1
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FormLibraryEntryWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FormLibraryEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/form-library/test:
    post:
      tags: [catalog-admin]
      operationId: testFormLibraryEntry
      summary: Run an entry, saved or not, with parameters
      description: |
        A source gives its options or its value; a validation, what it
        says of the parameters. Calls a REST entry's URL, as a form would.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FormLibraryTest" }
      responses:
        "200":
          description: What the entry gave
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FormLibraryTestResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "502": { $ref: "#/components/responses/UpstreamError" }

  /admin/form-library/{key}:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [catalog-admin]
      operationId: getFormLibraryEntry
      summary: An entry of the form library, at its latest version or the one asked
      parameters:
        - name: version
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FormLibraryEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [catalog-admin]
      operationId: updateFormLibraryEntry
      summary: Save an entry as its next version, and give the items that use it a draft naming it
      description: |
        Versions never change. Each item whose draft or published version
        names an earlier version of the entry gets a draft that names the
        new one: its draft changed, or a new draft made from its published
        version. `drafts` in the answer lists them; the items keep using
        what they published until a draft is published.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FormLibraryEntryWrite" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FormLibraryEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [catalog-admin]
      operationId: deleteFormLibraryEntry
      summary: Delete an entry no saved version uses
      description: Refused while a published or earlier version of an item names it; drafts that do are refused when next saved.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ── Administration (S9, ADR-0020) ─────────────────────────────────────
  /users:
    get:
      tags: [identity]
      operationId: searchUsers
      summary: People rvav knows, by name or email, for pickers
      description: |
        Everyone who has signed in at least once (or was seeded). Any signed-in
        user may search: approvers delegate to people outside their projects.
        By name; someone the identity provider gave a new subject has a record
        per subject, and the one seen last comes first. `q` matches part of
        a name or email, or a whole user ID, so a page that holds an ID in
        its address can name the person.
      parameters:
        - { $ref: "#/components/parameters/Search" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/projects:
    get:
      tags: [admin]
      operationId: listAdminProjects
      summary: Every project, archived ones on request, with member counts
      description: With `project.settings.read` or `placement.manage` for all of rvav.
      parameters:
        - { $ref: "#/components/parameters/Search" }
        - name: archived
          in: query
          description: Archived projects too.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProjectList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      operationId: createProject
      summary: Create a project (`project.create`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminProjectCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/projects/{projectId}:
    parameters:
      - { $ref: "#/components/parameters/ProjectIdPath" }
    get:
      tags: [admin]
      operationId: getAdminProject
      summary: A project with its settings
      description: |
        With `project.settings.read` or `placement.manage` in the project:
        the page of its placement is the project's.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [admin]
      operationId: updateProject
      summary: Change a project, or archive it (`project.update` there)
      description: |
        An archived project can't request anything new; its deployments,
        leases and day-2 actions go on. Unarchiving gives it back.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminProjectUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/project-names:
    get:
      tags: [admin]
      operationId: listProjectNames
      summary: Every project's ID, code and name, for the pages that pick projects
      description: |
        Every project by name, archived ones on request: its ID, code and
        name, and whether it is archived, never its settings. For whoever
        holds, for all of rvav, a permission whose Administration pages
        pick or name projects: `project.settings.read`, `access.read`,
        `audit.read`, `infrastructure.read`, `infrastructure.manage`,
        `policies.read`, `policies.manage`, `extensibility.read`,
        `extensibility.manage` or `import.manage`. Listing projects with
        their settings (`listAdminProjects`) takes `project.settings.read`
        or `placement.manage`.
      parameters:
        - name: archived
          in: query
          description: Archived projects too.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectNameList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /projects/{projectId}/members:
    parameters:
      - { $ref: "#/components/parameters/ProjectIdPath" }
    get:
      tags: [projects]
      operationId: listProjectMembers
      summary: A project's members, direct and through OIDC groups
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectMemberList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{projectId}/assignable-roles:
    parameters:
      - { $ref: "#/components/parameters/ProjectIdPath" }
    get:
      tags: [projects]
      operationId: listAssignableRoles
      summary: The roles the caller may give the project's members (`project.members.manage` there)
      description: |
        As setting a member checks them: with `access.manage`, every role
        that can be given in a project; otherwise those whose permissions
        the caller holds in the project. A project admin gets viewer, member
        and project-admin, and custom roles holding no more than they do.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssignableRoleList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{projectId}/members/{userId}:
    parameters:
      - { $ref: "#/components/parameters/ProjectIdPath" }
      - { $ref: "#/components/parameters/UserIdPath" }
    put:
      tags: [projects]
      operationId: setProjectMember
      summary: Add a member or change their roles (`project.members.manage`, or `access.manage`)
      description: |
        Sets the roles the user holds in the project themselves, exactly
        (`roles`), or one role (`role`, as before). Each role added or taken
        away must be one the caller may give: with `access.manage`, any role
        that can be given in a project; with `project.members.manage` there,
        a role whose permissions the caller holds in the project. A project
        keeps someone holding `project.members.manage` from a role given in
        it (409).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectMemberWrite" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectMember" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [projects]
      operationId: removeProjectMember
      summary: Take away every role a user holds in the project themselves
      description: |
        As `setProjectMember`: the caller may give each of their roles, and the
        project keeps someone holding `project.members.manage` from a role
        given in it (409). Members through a group are removed from the group
        mapping.
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/group-mappings:
    get:
      tags: [admin]
      operationId: listGroupMappings
      summary: OIDC groups mapped to roles, in a project or for all of rvav (`access.read`)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupMappingList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      operationId: createGroupMapping
      summary: Map an OIDC group to any role, in a project or for all of rvav (`access.manage`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupMappingWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupMapping" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/group-mappings/{id}:
    parameters:
      - { $ref: "#/components/parameters/IdPath" }
    delete:
      tags: [admin]
      operationId: deleteGroupMapping
      summary: Remove a group mapping (`access.manage`)
      description: |
        Not the last way anyone holds `access.manage`, nor the last way a
        project has someone holding `project.members.manage` given in it
        (409).
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /permissions:
    get:
      tags: [identity]
      operationId: listPermissions
      summary: The permissions roles are made of, and the day-2 actions they can allow
      description: |
        The catalogue (ADR-0034): each permission's stable identifier,
        where it can be given and what it allows, as the role editor shows
        it. Day-2 actions have their own: `day2.<group>` allows every action
        of the group, those added later included, and `day2.<group>:<action>`
        one action. Any signed-in user may read it, to understand what they
        may do.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PermissionCatalogue" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/roles:
    get:
      tags: [admin]
      operationId: listRoles
      summary: The built-in roles and those made here, with who holds them (`access.read`)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      operationId: createRole
      summary: Make a role (`access.manage`)
      description: |
        A role holds at least one permission, and `project.see` when it
        holds one given in a project: every check in a project starts by
        seeing it. Its key can't change once made.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/roles/{key}:
    parameters:
      - { $ref: "#/components/parameters/KeyPath" }
    get:
      tags: [admin]
      operationId: getRole
      summary: One role (`access.read`)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [admin]
      operationId: updateRole
      summary: Change a role's name, description or permissions (`access.manage`)
      description: |
        A change applies at the next request of everyone holding the role.
        Built-in roles can't be changed (409). A permission given for all of
        rvav only can't be added while the role is given in a project (422,
        naming where), and taking away `access.manage` or
        `project.members.manage` is checked as removing an assignment is
        (409).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [admin]
      operationId: deleteRole
      summary: Delete a role nobody holds and no policy names (`access.manage`)
      description: Built-in roles, and a role someone holds or a policy names (a day-2 policy's roles, or an approval or day-2 policy's levels), can't be deleted (409, saying which).
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/role-assignments:
    get:
      tags: [admin]
      operationId: listRoleAssignments
      summary: The roles users hold for all of rvav (`access.read`)
      description: |
        Those given here, and those rvav sets itself (the local
        administrator's, the system users', the seed's), which can't be taken
        away (`fixed`). Every user signed in through the identity provider
        holds `user`, which isn't listed. Roles from groups are in the group
        mappings.
      parameters:
        - name: role
          in: query
          description: Only this role's.
          schema: { type: string }
        - name: user_id
          in: query
          description: Only this user's.
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleAssignmentList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      operationId: createRoleAssignment
      summary: Give a user a role for all of rvav (`access.manage`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleAssignmentWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleAssignment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/role-assignments/{id}:
    parameters:
      - { $ref: "#/components/parameters/IdPath" }
    delete:
      tags: [admin]
      operationId: deleteRoleAssignment
      summary: Take a role for all of rvav away from a user (`access.manage`)
      description: Not the last way anyone holds `access.manage` (409).
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/access/explain:
    get:
      tags: [admin]
      operationId: explainAccess
      summary: What a user may do, and which of their roles allows it (`access.read`, or about oneself)
      description: |
        For a user, in a project or for all of rvav: every permission of the
        catalogue, held or not, with the roles granting it and where each
        comes from (given to them, set by rvav, or through a group of the
        identity provider), then the day-2 permissions their roles hold. A
        permission no role grants has none. As they hold them when signed
        in, with the groups of their last sign-in: an API token acts with
        their own roles only. Anyone may ask about themselves, in the
        projects they see; about someone else takes `access.read`.
      parameters:
        - name: user_id
          in: query
          required: true
          schema: { type: string }
        - name: project_id
          in: query
          description: In this project (its ID or code); without it, for all of rvav.
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessExplanation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/environments:
    post:
      tags: [admin]
      operationId: createEnvironment
      summary: Add an environment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminEnvironment" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminEnvironment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    get:
      tags: [admin]
      operationId: listAdminEnvironments
      summary: Environments with their settings and use
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminEnvironmentList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/environments/{key}:
    parameters:
      - { $ref: "#/components/parameters/KeyPath" }
    patch:
      tags: [admin]
      operationId: updateEnvironment
      summary: Rename, reorder or flag an environment; its snapshot retention
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminEnvironmentUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminEnvironment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [admin]
      operationId: deleteEnvironment
      summary: Remove an environment nothing uses
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/placement-rules:
    get:
      tags: [admin]
      operationId: listPlacementRules
      summary: Placement rules, of a project or all
      description: With `project.settings.read` or `placement.manage` in the project, or for all of rvav without project_id.
      parameters:
        - { $ref: "#/components/parameters/ProjectIdQuery" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlacementRuleList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      operationId: createPlacementRule
      summary: Add a placement rule for a project and environment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlacementRuleWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlacementRule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/placement-rules/{id}:
    parameters:
      - { $ref: "#/components/parameters/IdPath" }
    put:
      tags: [admin]
      operationId: updatePlacementRule
      summary: Change a placement rule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlacementRuleWrite" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlacementRule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [admin]
      operationId: deletePlacementRule
      summary: Remove a placement rule
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/ad-placements:
    get:
      tags: [admin]
      operationId: listAdPlacements
      summary: Where VMs' computer objects go in Active Directory
      description: |
        With project_id, the rows that may apply to the project: its own and
        those for every project, by environment or in any. Without it, every
        row (ADR-0064). With `project.settings.read` or `placement.manage` in
        the project, or for all of rvav without project_id.
      parameters:
        - { $ref: "#/components/parameters/ProjectIdQuery" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdPlacementList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [admin]
      operationId: createAdPlacement
      summary: Give a project, an environment or both an OU for computer objects
      description: |
        Those who manage placement for all of rvav save any row. Those who
        manage it in a project only save that project's rows: the OU under
        the OU of the row for every project (in the row's environment,
        else in any), and each group under the row's own OU or one of that
        row's groups; an OU or group the row already had stays. Once the
        Active Directory integration is set, the OU and groups must be in
        the directory; one that can't be reached answers 502 (ADR-0064).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdPlacementWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdPlacement" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "502": { $ref: "#/components/responses/UpstreamError" }

  /admin/ad-placements/{id}:
    parameters:
      - { $ref: "#/components/parameters/IdPath" }
    put:
      tags: [admin]
      operationId: updateAdPlacement
      summary: Change an OU, its groups, or whether blueprints may choose theirs
      description: Held to the rules of createAdPlacement.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdPlacementWrite" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdPlacement" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "502": { $ref: "#/components/responses/UpstreamError" }
    delete:
      tags: [admin]
      operationId: deleteAdPlacement
      summary: Stop making computer objects there
      description: Objects already made stay, and are deleted with their VMs.
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/placement-preview:
    get:
      tags: [admin]
      operationId: previewPlacement
      summary: What a project and environment can use now
      description: The clusters, datastores, networks (with their subnets) and folder its rules select in the inventory, and what is missing. With `project.settings.read` or `placement.manage` in the project.
      parameters:
        - { $ref: "#/components/parameters/ProjectIdQueryRequired" }
        - name: environment
          in: query
          required: true
          schema: { $ref: "#/components/schemas/EnvironmentKey" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlacementPreview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/inventory:
    get:
      tags: [admin]
      operationId: getVsphereInventory
      summary: The clusters, datastores and networks of every vCenter, with their tags
      description: What the last inventory sync read. Placement rules and blueprints' constraints choose by these tags, as category/tag (ADR-0035).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VsphereInventory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/network-mappings:
    get:
      tags: [admin]
      operationId: listNetworkMappings
      summary: vSphere networks and their subnets, set by hand, from EfficientIP or from rvav's IP ranges
      description: |
        A network with IP ranges in a vCenter is listed once more for that
        vCenter, with source `rvav`: its VMs there take their addresses from
        the ranges, whatever its other mapping says (ADR-0063).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetworkMappingList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/network-mappings/{network}:
    parameters:
      - name: network
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [admin]
      operationId: setNetworkMapping
      summary: Set a network's subnet by hand; it wins over EfficientIP's
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NetworkMappingWrite" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetworkMapping" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [admin]
      operationId: deleteNetworkMapping
      summary: Remove a mapping set by hand (EfficientIP's comes back at the next sync)
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/ip-ranges:
    get:
      tags: [admin]
      operationId: listIpRanges
      summary: IP ranges rvav hands addresses from, for networks without EfficientIP
      description: |
        A network (a port group or an NSX segment's, in one vCenter) with
        at least one range takes its VMs' addresses from rvav's ranges
        instead of EfficientIP (ADR-0063); every other network keeps
        EfficientIP. rvav writes no DNS record for an address it hands
        from a range. Each range says how many addresses it has, how many
        are given and how many are free. Needs `infrastructure.read`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IpRangeList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      operationId: createIpRange
      summary: Add an IP range to a network
      description: |
        The network must be in the vCenter's inventory. Ranges of one
        network share its subnet, gateway, DNS servers, search domains and
        DNS domain, and ranges of one vCenter don't overlap: either is
        refused (422) naming the other range. The first range of a network
        moves its new VMs from EfficientIP to rvav; VMs already built keep
        their addresses. Needs `infrastructure.manage`. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IpRangeWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IpRange" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/ip-ranges/{id}:
    parameters:
      - { $ref: "#/components/parameters/IdPath" }
    get:
      tags: [admin]
      operationId: getIpRange
      summary: An IP range and its usage
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IpRange" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [admin]
      operationId: updateIpRange
      summary: Change an IP range
      description: |
        As adding one. While the range has given addresses, its vCenter,
        network, subnet and gateway can't change, and a new start, end or
        exclusion that would leave a given address out is refused (422).
        Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IpRangeWrite" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IpRange" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [admin]
      operationId: deleteIpRange
      summary: Remove an IP range that gives no address
      description: |
        Refused (409) while a VM holds an address from it. When it was the
        network's last range, the network's new VMs take their addresses
        from EfficientIP again. Audited.
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/ip-ranges/{id}/allocations:
    parameters:
      - { $ref: "#/components/parameters/IdPath" }
    get:
      tags: [admin]
      operationId: listIpAllocations
      summary: The addresses a range gave, and who holds each
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IpAllocationList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/ip-ranges/{id}/allocations/{address}:
    parameters:
      - { $ref: "#/components/parameters/IdPath" }
      - name: address
        in: path
        required: true
        schema: { type: string, examples: [10.51.0.10] }
    delete:
      tags: [admin]
      operationId: releaseIpAllocation
      summary: Give back an address a range gave a VM rvav no longer has
      description: |
