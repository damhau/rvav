        deployments_per_project:
          type: [integer, "null"]
          minimum: 0
          description: How many deployments the project may have, counted as for each user.
        vcpu_per_deployment:
          type: [integer, "null"]
          minimum: 1
          description: The most vCPU a deployment may have, all its VMs together.
        memory_gb_per_deployment:
          type: [integer, "null"]
