            it, is refused or asks the project's approvers, or warns when
            the policy is soft. Null for no limit. Not shorter than `max_days`.
        set_by_admin:
          type: boolean
          readOnly: true
          description: |
            An administrator (`policies.manage`) wrote it last: a project's
            admins read the override but don't change or remove it
            (ADR-0045).
    LeaseRuleWrite:
      type: object
      description: |
        As a request body, an unknown field is refused (400): a misspelt
        one would otherwise leave the field it meant empty.
      required: [name, condition, max_extensions, grace_days, expiry_action]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        condition:
          type: string
          description: |
            CEL over what approval conditions read: inputs, environment,
            project, item, vm, vms, user, quota, request and update. On
            submit, a condition that can't be evaluated applies the rule
            when it gives no more than the lease without it.
        environment:
          description: Null for every environment.
          oneOf:
            - $ref: "#/components/schemas/EnvironmentKey"
            - type: "null"
        project_id:
          type: [string, "null"]
          description: A project's rule; null for every project.
        priority:
          type: integer
          description: Lower first; 100 when absent. On a tie, global rules first, then by name.
        default_days: { type: [integer, "null"], minimum: 1, description: Null for no lease. }
        max_days: { type: [integer, "null"], minimum: 1 }
        max_extensions: { type: integer, minimum: 0 }
        grace_days: { type: integer, minimum: 0 }
        expiry_action: { $ref: "#/components/schemas/LeaseExpiryAction" }
        enforcement: { $ref: "#/components/schemas/PolicyEnforcement" }
        max_lifetime_days:
          type: [integer, "null"]
          minimum: 1
          description: |
            How long a deployment lives in all, in days from its creation
            (ADR-0048). A request for a longer lease, or an extension past
            it, is refused or asks the project's approvers, or warns when
            the policy is soft. Null for no limit. Not shorter than `max_days`.
    LeaseRule:
      allOf:
        - $ref: "#/components/schemas/LeaseRuleWrite"
        - type: object
          required: [id, priority, enforcement, set_by_admin]
          properties:
            id: { type: string }
            set_by_admin:
              type: boolean
              description: |
                An administrator (`policies.manage`) wrote it last: a
                project's admins read it but don't change or remove it
                (ADR-0045). False for a project admin's own.
    LeaseRuleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LeaseRule" }
    PolicyEnforcement:
      type: string
      enum: [hard, soft]
    PolicyWarning:
      type: object
      description: What a soft policy warns about (ADR-0045).
      required: [id, policy, message]
      properties:
        id:
          type: string
          maxLength: 64
          description: |
            Names the warning: the same while its policy and message are.
            `accepted_warnings` lists it.
        policy: { type: string, description: "The policy's name.", examples: [Lease in Development] }
        message: { type: string, examples: ["Leases in Development should be at most 90 days."] }
    LeaseExpiryAction:
      type: string
      description: "At the end of a lease: power off, then delete after the grace period; delete; or only tell the owner."
      enum: [power_off_then_delete, delete, notify_only]
    PreviewLease:
      type: object
      description: The lease a request gets.
      properties:
        default_days: { type: [integer, "null"] }
        max_days: { type: [integer, "null"] }
        expires_at: { type: [string, "null"], format: date-time }
        enforcement:
          $ref: "#/components/schemas/PolicyEnforcement"
          description: Soft when a longer lease than `max_days` only warns (ADR-0045).
        policy:
          type: [string, "null"]
          description: |
            What decides the lease, by name: a lease rule, the
            project's override or the environment's lease policy
            (ADR-0048). Null without a lease policy.
        max_extensions: { type: integer, description: Extensions the owner may make without approval. }
        max_lifetime_days: { type: [integer, "null"], description: How long the deployment may live in all; null for no limit. }
    LeasePolicyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LeasePolicy" }
    ApprovalLevel:
      type: object
      required: [name]
      properties:
        name: { type: string }
        group: { type: string, description: An OIDC group whose members approve. }
        approvers:
          type: array
          items: { type: string }
          description: User IDs. The policy lists give their names in `users`.
        roles:
          type: array
          items: { type: string }
          description: |
            Roles given in projects, built-in or custom, by key (ADR-0041):
