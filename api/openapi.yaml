      operationId: deleteLeaseRule
      summary: Remove a lease rule (its deployments get the environment's or project's lease)
      description: |
        As changing it: `policies.manage`, or `project.policies.manage` in
        its project unless an administrator set it (`set_by_admin`).
        Audited.
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

