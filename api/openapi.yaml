      summary: Import an item from YAML, as a new item or as a new draft of one
      description: |
        The YAML of `export`. Without `item_id`, the item is created (its
        slug must be free) with its versions as drafts and deprecated
        versions, nothing published. With `item_id`, the YAML's last
        version becomes that item's draft. Problems are 422 with the YAML
        line in the message.
      parameters:
        - name: item_id
          in: query
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/yaml:
            schema: { type: string }
      responses:
        "200":
          description: Imported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogImportResult" }
