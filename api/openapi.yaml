    parameters:
      - { $ref: "#/components/parameters/ProjectIdPath" }
    get:
      tags: [admin]
      operationId: getProjectUserQuotas
      summary: What each member of a project may take there
      description: |
        With `project.settings.read` in the project. A line limits what each
        member owns in the project, their deployments and running requests,
        those made for them included. It applies besides the project's own
        quota and rvav's (ADR-0047).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserQuotaList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [admin]
      operationId: setProjectUserQuotas
      summary: Replace what each member of a project may take there
      description: |
        With `project.quotas.manage` in the project, any limit: the lines
        it adds or changes are marked `set_by_admin`. With
        `project.policies.manage` (project admins), limits within the
        project's own quota (refused with the code `looser` above it),
        keeping the lines marked `set_by_admin` as they are (403
        otherwise). Audited as `policy.quota.user.set` (ADR-0047).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserQuotaWriteList" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserQuotaList" }
