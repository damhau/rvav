    ApprovalPolicyList:
      type: object
      required: [items, level_roles, users]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ApprovalPolicy" }
        level_roles:
          type: array
          description: The roles a level may name, those given in projects.
          items: { $ref: "#/components/schemas/RoleRef" }
        users:
          type: array
          description: |
            The users the listed levels name, as approvers or to escalate
