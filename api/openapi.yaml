openapi: 3.1.0
info:
  title: rvav API
  version: 0.1.0
  summary: Self-service portal for VMware vSphere, with AWX for automation.
  description: |
    Slice 1 of the rvav API: identity, projects and quota, the service catalog,
    request forms with dynamic values, submitting and following requests, and
    deployments with their resources. Live updates arrive on `/events`.

    Conventions (IDs, units, pagination, errors, idempotency, live events) are
    described in `api/README.md`.

    Not in this slice yet: approvals, day-2 actions, leases and policies admin,
    catalog administration, AWX content sources.
servers:
  - url: /api/v1
security:
  - bearer: []
tags:
  - name: identity
    description: Who is calling and what they may do.
  - name: projects
    description: Projects, environments and quota.
  - name: catalog
    description: Items users can request.
  - name: forms
    description: Request forms and their dynamic values.
  - name: requests
    description: Submitting requests and following their progress.
  - name: approvals
    description: Requests waiting for a decision, and the decisions taken.
  - name: deployments
    description: What requests created, with live state from vCenter.
  - name: events
    description: Live updates over Server-Sent Events.
  - name: admin
    description: Checks and settings for administrators.
  - name: catalog-admin
    description: Building and publishing catalog items (catalog admins and administrators).
  - name: ansible
    description: What AWX reads from rvav.
  - name: notifications
    description: What concerns the caller, in the app and on their channels (ADR-0023).

paths:
  /me:
    get:
      tags: [identity]
      operationId: getMe
      summary: The signed-in user, their global roles and project memberships
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: The caller's notifications, newest first
      parameters:
        - name: unread
          in: query
          description: Only those not read yet.
          schema: { type: boolean, default: false }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/notifications/read:
    post:
      tags: [notifications]
      operationId: markNotificationsRead
      summary: Mark notifications read, the ones given or all of them
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationsRead" }
      responses:
        "200":
          description: How many are left unread
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationCount" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /me/notification-preferences:
    get:
      tags: [notifications]
      operationId: getNotificationPreferences
      summary: The channels the caller chose per kind, and which can reach them
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPreferences" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [notifications]
      operationId: setNotificationPreferences
      summary: Choose the channels per kind and the language of what is sent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationPreferencesWrite" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPreferences" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /me/notification-preferences/test:
    post:
      tags: [notifications]
      operationId: testNotificationChannel
      summary: Send the caller a test message on a channel, now
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel]
              additionalProperties: false
              properties:
                channel: { $ref: "#/components/schemas/NotificationChannel" }
      responses:
        "200":
          description: Sent, or why not
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationCheck" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /integrations/teams/messages:
    post:
      tags: [notifications]
      operationId: teamsMessages
      summary: Microsoft Teams' calls to rvav's bot (Approve and Reject on a card)
      description: |
        Authenticated by the Bot Framework token in `Authorization`, not by
        an rvav token (ADR-0023). An `invoke` activity named
        `adaptiveCard/action` decides an approval as the user the card was
        sent to and answers with the card updated; other activities are
        acknowledged.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BotActivity" }
      responses:
        "200":
          description: The invoke response (an Adaptive Card)
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "202":
          description: Acknowledged
        "401": { $ref: "#/components/responses/Unauthorized" }

  /integrations/slack/interactions:
    post:
      tags: [notifications]
      operationId: slackInteractions
      summary: Slack's calls when someone presses Approve or Reject, or sends the reject dialog
      description: |
        Authenticated by Slack's `X-Slack-Signature` over the body and
        `X-Slack-Request-Timestamp`, not by an rvav token (ADR-0023).
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [payload]
              properties:
                payload: { type: string, description: "The interaction, as JSON." }
      responses:
        "200":
          description: Done; for a dialog, its errors when the comment is missing
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/drafts:
    get:
      tags: [requests]
      operationId: listRequestDrafts
      summary: The caller's saved request drafts, last changed first
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedDraftList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [requests]
      operationId: createRequestDraft
      summary: Save a request to finish later
      description: |
        A draft is the request as filled so far, unchecked; it is only the
        caller's. Values of secret fields are not kept.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SavedDraftWrite" }
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedDraft" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /me/drafts/{id}:
    parameters:
      - { $ref: "#/components/parameters/IdPath" }
    get:
      tags: [requests]
      operationId: getRequestDraft
      summary: A saved draft, to resume it
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedDraft" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [requests]
      operationId: updateRequestDraft
      summary: Save a draft again
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SavedDraftWrite" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedDraft" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [requests]
      operationId: deleteRequestDraft
      summary: Discard a draft (done once it is submitted)
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /environments:
    get:
      tags: [projects]
      operationId: listEnvironments
      summary: Environments defined by administrators (for example dev, tst, prd)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Environment" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /projects:
    get:
      tags: [projects]
      operationId: listProjects
      summary: Projects the caller is a member of (all projects for administrators)
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /projects/{projectId}:
    parameters:
      - { $ref: "#/components/parameters/ProjectIdPath" }
    get:
      tags: [projects]
      operationId: getProject
      summary: One project
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{projectId}/quota:
    parameters:
      - { $ref: "#/components/parameters/ProjectIdPath" }
    get:
      tags: [projects]
      operationId: getProjectQuota
      summary: Quota limits and usage, for the whole project or one environment
      parameters:
        - name: environment
          in: query
          description: Environment key. Omit for the project-wide quota.
          schema: { $ref: "#/components/schemas/EnvironmentKey" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuotaUsage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /catalog/categories:
    get:
      tags: [catalog]
      operationId: listCatalogCategories
      summary: Categories with the number of items the caller can request in a project
      parameters:
        - { $ref: "#/components/parameters/ProjectIdQueryRequired" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CatalogCategory" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /catalog/items:
    get:
      tags: [catalog]
      operationId: listCatalogItems
      summary: Catalog items shared with a project, in their published version
      parameters:
        - { $ref: "#/components/parameters/ProjectIdQueryRequired" }
        - name: category
          in: query
          schema: { type: string }
        - name: type
          in: query
          schema: { $ref: "#/components/schemas/CatalogItemType" }
        - name: favourite
          in: query
          description: Only the caller's favourites.
          schema: { type: boolean }
        - { $ref: "#/components/parameters/Search" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogItemPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /catalog/items/{itemId}:
    parameters:
      - { $ref: "#/components/parameters/ItemIdPath" }
    get:
      tags: [catalog]
      operationId: getCatalogItem
      summary: One catalog item
      parameters:
        - { $ref: "#/components/parameters/ProjectIdQueryRequired" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /catalog/items/{itemId}/favourite:
    parameters:
      - { $ref: "#/components/parameters/ItemIdPath" }
    put:
      tags: [catalog]
      operationId: addFavourite
      summary: Add an item to the caller's favourites
      responses:
        "204": { description: Added (or already a favourite) }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [catalog]
      operationId: removeFavourite
      summary: Remove an item from the caller's favourites
      responses:
        "204": { description: Removed (or was not a favourite) }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /catalog/items/{itemId}/form:
    parameters:
      - { $ref: "#/components/parameters/ItemIdPath" }
    get:
      tags: [forms]
      operationId: getRequestForm
      summary: The request form for an item version, ready to render
      parameters:
        - { $ref: "#/components/parameters/ProjectIdQueryRequired" }
        - name: version_id
          in: query
          description: A specific version. Defaults to the published version.
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestForm" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /forms/values:
    post:
      tags: [forms]
      operationId: resolveFieldValues
      summary: Resolve a field's dynamic options or computed value
      description: |
        Called by the form renderer for fields with a `value_source`, again
        whenever a field listed in `depends_on` changes. The server resolves
        the source (vCenter inventory cache, EfficientIP, AWX, naming policy,
        REST, CEL) and applies the project's placement rules, so the browser
        never talks to those systems and never sees their credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FieldValuesQuery" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FieldValues" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/UpstreamError" }

  /requests/preview:
    post:
      tags: [requests]
      operationId: previewRequest
      summary: Validate a draft and show what it would do, without creating anything
      description: |
        Drives the summary panel of the request form: validation errors,
        generated names, quota impact, the approval path, placement and lease.
        Nothing is reserved; the real request may still differ (for example a
        name taken in the meantime).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequestDraft" }
      responses:
        "200":
          description: The preview. Check `valid` and `errors`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestPreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /requests:
    get:
      tags: [requests]
      operationId: listRequests
      summary: Requests visible to the caller
      parameters:
        - { $ref: "#/components/parameters/ProjectIdQuery" }
        - name: status
          in: query
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: "#/components/schemas/RequestStatus" }
        - name: requester
          in: query
          description: "`me`, or a user ID."
          schema: { type: string }
        - { $ref: "#/components/parameters/Search" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [requests]
      operationId: createRequest
      summary: Submit a request
      description: |
        Validates the draft again on the server, checks entitlement and quota,
        then starts the workflow. The response is sent before any external
        system is called; follow progress with `/requests/{requestId}/steps`
        and the `request.*` events.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequestDraft" }
      responses:
        "202":
          description: Accepted
          headers:
            Location:
              description: URL of the new request
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Request" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /requests/{requestId}:
    parameters:
      - { $ref: "#/components/parameters/RequestIdPath" }
    get:
      tags: [requests]
      operationId: getRequest
      summary: One request
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Request" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /requests/{requestId}/steps:
    parameters:
      - { $ref: "#/components/parameters/RequestIdPath" }
    get:
      tags: [requests]
      operationId: listRequestSteps
      summary: The request timeline, as a tree of steps
      responses:
        "200":
          description: Top-level steps in execution order, each with its children
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Step" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /requests/{requestId}/steps/{stepId}/log:
    parameters:
      - { $ref: "#/components/parameters/RequestIdPath" }
      - name: stepId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [requests]
      operationId: getStepLog
      summary: Output of a step, such as an AWX job's stdout, read incrementally
      parameters:
        - name: offset
          in: query
          description: The `next_offset` from the previous chunk. Start at 0.
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          description: Maximum number of lines.
          schema: { type: integer, minimum: 1, maximum: 5000, default: 1000 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogChunk" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /requests/{requestId}/cancel:
    parameters:
      - { $ref: "#/components/parameters/RequestIdPath" }
    post:
      tags: [requests]
      operationId: cancelRequest
      summary: Cancel a request that is waiting or running
      description: |
        A pending or scheduled request is cancelled at once. A running request
        stops after its current step and rolls back what it created, following
        the catalog item's rollback policy.
      responses:
        "202":
          description: Cancellation accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Request" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /requests/{requestId}/retry:
    parameters:
      - { $ref: "#/components/parameters/RequestIdPath" }
    post:
      tags: [requests]
      operationId: retryRequest
      summary: Run a failed request again from its failed step
      description: Steps that completed are kept; the failed step and the ones after it run again.
      responses:
        "202":
          description: Running again
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Request" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /requests/{requestId}/rollback:
    parameters:
      - { $ref: "#/components/parameters/RequestIdPath" }
    post:
      tags: [requests]
      operationId: rollbackRequest
      summary: Undo what a failed provisioning request created
      description: Deletes the VMs, DNS records and IP addresses it created, and marks its deployments deleted.
      responses:
        "202":
          description: Rolling back
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Request" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /requests/{requestId}/approvals:
    parameters:
      - { $ref: "#/components/parameters/RequestIdPath" }
    get:
      tags: [approvals]
      operationId: listRequestApprovals
      summary: The approval levels of a request, with their decisions
      responses:
        "200":
          description: Levels in the order they run; empty when no approval was needed
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Approval" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /approvals:
    get:
      tags: [approvals]
      operationId: listApprovals
      summary: Approvals waiting for the caller, or decided by them
      description: |
        `view=mine` (default) lists the open levels the caller may decide (they
        are named in it, in its group, or it was delegated to them) and, for
        other statuses, the levels they voted on. `view=all` lists every
        approval and needs the admin or auditor role.
      parameters:
        - name: view
          in: query
          schema: { type: string, enum: [mine, all], default: mine }
        - name: status
          in: query
          style: form
          explode: false
          description: Defaults to `pending`.
          schema:
            type: array
            items: { $ref: "#/components/schemas/ApprovalStatus" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: Pending ones oldest first (the most urgent on top); others newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /approvals/{approvalId}:
    parameters:
      - { $ref: "#/components/parameters/ApprovalIdPath" }
    get:
      tags: [approvals]
      operationId: getApproval
      summary: One approval level, with what an approver needs to decide
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /approvals/{approvalId}/decision:
    parameters:
      - { $ref: "#/components/parameters/ApprovalIdPath" }
    post:
      tags: [approvals]
      operationId: decideApproval
      summary: Approve or reject
      description: |
        Only an approver of the level may decide, and never the requester.
        Rejecting needs a comment, which is sent to the requester. When
        approving, `inputs` may change fields marked `approver_editable`,
        within their limits; the request is evaluated again with them.
        With mode `all`, the level is approved once every named approver has
        approved; any rejection rejects it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalDecision" }
      responses:
        "200":
          description: The level after the decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /approvals/{approvalId}/delegate:
    parameters:
      - { $ref: "#/components/parameters/ApprovalIdPath" }
    post:
      tags: [approvals]
      operationId: delegateApproval
      summary: Let another user decide this level
      description: Only an approver of a pending level may delegate it. The delegate becomes an approver of this level only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalDelegation" }
      responses:
        "200":
          description: The level with its new approver
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /deployments:
    get:
      tags: [deployments]
      operationId: listDeployments
      summary: Deployments visible to the caller
      parameters:
        - { $ref: "#/components/parameters/ProjectIdQuery" }
        - name: status
          in: query
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: "#/components/schemas/DeploymentStatus" }
        - name: environment
          in: query
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: "#/components/schemas/EnvironmentKey" }
        - name: owner
          in: query
          description: "`me`, or a user ID."
          schema: { type: string }
        - name: lease_expires_before
          in: query
          schema: { type: string, format: date-time }
        - { $ref: "#/components/parameters/Search" }
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, -name, created_at, -created_at, lease_expires_at, -lease_expires_at]
            default: name
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /deployments/{deploymentId}:
    parameters:
      - name: deploymentId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [deployments]
      operationId: getDeployment
      summary: One deployment with its resources
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /deployments/{deploymentId}/actions:
    parameters:
      - { $ref: "#/components/parameters/DeploymentIdPath" }
    get:
      tags: [deployments]
      operationId: listDeploymentActions
      summary: The day-2 actions available on a deployment and its resources
      description: |
        Every action that applies, with whether the caller may run it now
        (day-2 policies and the resource's state) and why not.
      responses:
        "200":
          description: Grouped by resource, then by action group
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Day2Action" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [deployments]
      operationId: runDeploymentAction
      summary: Run a day-2 action
      description: |
        Creates a request of kind `day2` and starts it, or waits for approval
        when a day-2 policy asks for one. Follow it like any request.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Day2Draft" }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Request" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "502": { $ref: "#/components/responses/UpstreamError" }

  /deployments/{deploymentId}/history:
    parameters:
      - { $ref: "#/components/parameters/DeploymentIdPath" }
    get:
      tags: [deployments]
      operationId: listDeploymentHistory
      summary: The requests that created and changed a deployment
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /deployments/{deploymentId}/resources/{resourceId}/console:
    parameters:
      - { $ref: "#/components/parameters/DeploymentIdPath" }
      - name: resourceId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [deployments]
      operationId: openConsole
      summary: Open a VM's console (ADR-0012)
      description: |
        Returns a VMRC link with a fresh clone ticket and, when the web
        console is configured, a single-use WebSocket URL valid for one
        minute. Allowed by the `console` day-2 policy; recorded in the audit log.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsoleSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/UpstreamError" }

  /console/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [deployments]
      operationId: consoleStream
      summary: The web console's WebSocket, proxied to the ESXi host
      description: Upgrades to WebSocket. The token comes from `openConsole` and works once.
      security: []
      responses:
        "101":
          description: Switching protocols
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/UpstreamError" }

  /ansible/inventory:
    get:
      tags: [ansible]
      operationId: getAnsibleInventory
      summary: The Ansible inventory of rvav's VMs
      description: |
        In the format of `ansible-inventory --list`, for the `rvav.platform.rvav`
        inventory plugin AWX uses (ADR-0017): every VM of a deployment that is
        not being deleted, `ansible_host` its reserved address, groups `rvav`,
        `project_<code>`, `env_<key>`, `item_<slug>`, `tag_<item tag>` and
        `os_<family>`, and host variables `rvav_deployment_id`,
        `rvav_deployment`, `rvav_deployment_status`, `rvav_project`,
        `rvav_environment`, `rvav_item`, `rvav_owner`, `rvav_fqdn`,
        `rvav_moref`, `rvav_power_state`, `rvav_os_family` and `rvav_inputs`
        (the inputs whose field is marked `expose_to_inventory`, never secret
        ones). For an API token of a user with the auditor (or admin) role.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnsibleInventory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/ipam/reconcile:
    get:
      tags: [admin]
      operationId: reconcileIpam
      summary: Compare EfficientIP with what rvav recorded
      description: |
        Addresses and DNS records EfficientIP has with the class parameter
        `rvav_managed=1` that no deployment owns (orphans, for example left by
        a failed run), and addresses and records a deployment owns that
        EfficientIP no longer has. Nothing is changed. A request running
        while the check runs may show its newest objects as orphans.
        Administrators only.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IpamReconcile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/UpstreamError" }

  /admin/awx/templates:
    get:
      tags: [admin]
      operationId: listAwxTemplates
      summary: AWX templates imported into the catalog
      description: |
        The templates chosen by organisation and label (ADR-0016), each with
        the item made from it, whether its survey changed since the item's
        form was made (and what changed), and warnings about its launch
        settings. Catalog admins and administrators.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AwxTemplateList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/awx/templates/sync:
    post:
      tags: [admin]
      operationId: syncAwxTemplates
      summary: Import the AWX templates now, instead of waiting for the next sync
      responses:
        "200":
          description: The templates after the sync
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AwxTemplateList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/UpstreamError" }

  /admin/awx/actions:
    get:
      tags: [admin]
      operationId: listAwxActions
      summary: AWX templates offered as day-2 actions
      description: |
        The templates of the organisation with a label of
        `RVAV_AWX_ACTION_LABELS` (`day2`), synced with the catalog's
        (ADR-0018): each is a day-2 action with its form from the survey,
        on the resource types and under the condition administrators
        choose. Administrators.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AwxActionList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/awx/actions/{key}:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string, examples: [awx.install-monitoring-agent] }
    patch:
      tags: [admin]
      operationId: updateAwxAction
      summary: Choose where an AWX action is offered, its name, or turn it off
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AwxActionUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AwxAction" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/catalog/items:
    get:
      tags: [catalog-admin]
      operationId: listAdminCatalogItems
      summary: Every catalog item, in any state, for catalog admins
      description: Catalog admins and administrators (ADR-0019).
      parameters:
        - { $ref: "#/components/parameters/Search" }
        - name: category
          in: query
          schema: { type: string }
        - name: source
          in: query
          schema: { type: string, enum: [native, awx] }
        - name: state
          in: query
          description: "`published`: requestable now; `unpublished`: no published version."
          schema: { type: string, enum: [published, unpublished] }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCatalogItemPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [catalog-admin]
      operationId: createCatalogItem
      summary: Create an item with a first draft version
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogItemCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCatalogItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/catalog/items/{itemId}:
    parameters:
      - { $ref: "#/components/parameters/ItemIdPath" }
    get:
      tags: [catalog-admin]
      operationId: getAdminCatalogItem
      summary: One item, with its versions and entitlements
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCatalogItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [catalog-admin]
      operationId: updateCatalogItem
      summary: Change an item's name, summary, description, category, icon, tags or slug
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogItemUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCatalogItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [catalog-admin]
      operationId: deleteCatalogItem
      summary: Delete an item that was never requested
      description: An item with requests is unpublished (deprecate its version) instead; deleting it is refused with 409.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/catalog/items/{itemId}/versions:
    parameters:
      - { $ref: "#/components/parameters/ItemIdPath" }
    post:
      tags: [catalog-admin]
      operationId: createCatalogItemVersion
      summary: Start a draft, as a copy of a version or from a definition
      description: An item has at most one draft; a second one is refused with 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogItemVersionCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogItemVersionDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/catalog/items/{itemId}/versions/{versionId}:
    parameters:
      - { $ref: "#/components/parameters/ItemIdPath" }
      - { $ref: "#/components/parameters/VersionIdPath" }
    get:
      tags: [catalog-admin]
      operationId: getCatalogItemVersion
      summary: One version with its definition
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogItemVersionDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [catalog-admin]
      operationId: updateCatalogItemVersion
      summary: Save a draft
      description: |
        Only drafts change. The definition is checked as a whole: the JSON
        Schema compiles, every UI field is an input of the schema and every
        section names existing fields, CEL rules and value sources are
        valid, and the blueprint parses for the item's type. Problems are
        422 with pointers under `/definition`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogItemVersionUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogItemVersionDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [catalog-admin]
      operationId: deleteCatalogItemVersion
      summary: Discard a draft
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/catalog/items/{itemId}/versions/{versionId}/publish:
    parameters:
      - { $ref: "#/components/parameters/ItemIdPath" }
      - { $ref: "#/components/parameters/VersionIdPath" }
    post:
      tags: [catalog-admin]
      operationId: publishCatalogItemVersion
      summary: Publish a draft, or publish an older version again (roll back)
      description: |
        The version becomes the one users request; the version published
        until now is deprecated. Deployments and requests already made keep
        their version.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogItemVersionPublish" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCatalogItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/catalog/items/{itemId}/versions/{versionId}/deprecate:
    parameters:
      - { $ref: "#/components/parameters/ItemIdPath" }
      - { $ref: "#/components/parameters/VersionIdPath" }
    post:
      tags: [catalog-admin]
      operationId: deprecateCatalogItemVersion
      summary: Withdraw the published version; the item can no longer be requested
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCatalogItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/catalog/items/{itemId}/versions/{versionId}/preview:
    parameters:
      - { $ref: "#/components/parameters/ItemIdPath" }
      - { $ref: "#/components/parameters/VersionIdPath" }
    post:
      tags: [catalog-admin]
      operationId: previewCatalogItemVersion
      summary: The form of any version as a chosen user and project would get it
      description: |
        For the form designer: initial values, rule results and the
        evaluation's errors, as `as_user_id` (default: the caller) in the
        project, whatever the version's state or the item's entitlements.
        Value sources of the version are resolved through `/forms/values`
        with the same `as_user_id`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DesignerPreviewQuery" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesignerPreview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/catalog/preview-users:
    get:
      tags: [catalog-admin]
      operationId: listPreviewUsers
      summary: The members of a project, to preview a form as one of them
      parameters:
        - { $ref: "#/components/parameters/ProjectIdQueryRequired" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, name, email, role]
                      properties:
                        id: { type: string }
                        name: { type: string }
                        email: { type: string, description: "Tells apart people with the same name." }
                        role: { type: string, examples: [member] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/catalog/items/{itemId}/compare:
    parameters:
      - { $ref: "#/components/parameters/ItemIdPath" }
    get:
      tags: [catalog-admin]
      operationId: compareCatalogItemVersions
      summary: What changed between two versions
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string }
        - name: to
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogVersionDiff" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/catalog/items/{itemId}/entitlements:
    parameters:
      - { $ref: "#/components/parameters/ItemIdPath" }
    get:
      tags: [catalog-admin]
      operationId: getCatalogItemEntitlements
      summary: The projects that may request an item
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogEntitlements" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [catalog-admin]
      operationId: setCatalogItemEntitlements
      summary: Open an item to every project, or to chosen projects
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogEntitlements" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogEntitlements" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/catalog/items/{itemId}/export:
    parameters:
      - { $ref: "#/components/parameters/ItemIdPath" }
    get:
      tags: [catalog-admin]
