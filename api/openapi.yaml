        manager:
          type: boolean
          description: |
            The requester's manager approves (ADR-0041): the user the
            identity provider's manager claim names, by email or subject, as
            stored at the requester's last sign-in. Without one, the level
            asks only its other approvers.
        mode: { type: string, enum: [any, all], default: any }
        timeout: { type: string, description: "A Go duration, for example 48h; empty for none.", examples: [48h] }
        on_timeout: { type: string, enum: [escalate, approve, reject] }
        escalate_to:
          type: object
          properties:
            group: { type: string }
            approvers: { type: array, items: { type: string } }
    ApprovalPolicyWrite:
      type: object
      required: [name, condition, levels]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        reason: { type: string, description: What the requester is told. }
        condition: { type: string, description: "CEL over inputs, environment, project, item, vm, user and quota." }
        item_type:
          oneOf:
            - $ref: "#/components/schemas/CatalogItemType"
            - type: "null"
        project_id: { type: [string, "null"] }
        levels: { type: array, items: { $ref: "#/components/schemas/ApprovalLevel" } }
        priority: { type: integer, default: 100 }
        enabled: { type: boolean, default: true }
        auto_approve: { type: [string, "null"], description: CEL; when true the policy is met without anyone. }
    ApprovalPolicy:
      allOf:
        - $ref: "#/components/schemas/ApprovalPolicyWrite"
        - type: object
          required: [id, priority, enabled, reason, set_by_admin]
          properties:
            id: { type: string }
            set_by_admin:
              type: boolean
              description: |
                An administrator (`policies.manage`) wrote it last: a
                project's admins read it but don't change or remove it
