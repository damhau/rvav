        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [admin]
      operationId: updateWorkflow
      summary: Change a registration (its name stays)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkflowRegistrationWrite" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowRegistration" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [admin]
      operationId: deleteWorkflow
      summary: Remove a registration nothing uses (else disable it)
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/resource-types:
    get:
      tags: [admin]
      operationId: listResourceTypes
      summary: Custom resource types (ADR-0056)
      description: |
        Each type with how many resources it has and what uses it. Needs
        `extensibility.read` (administrators and auditors).
      responses:
        "200":
          description: The types, by key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceTypeList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      operationId: createResourceType
      summary: Define a custom resource type
      description: |
        A custom workflow or an AWX template creates its resources and
        another deletes them; one may update them and one read them again.
        Needs `extensibility.manage` (administrators).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResourceTypeWrite" }
      responses:
        "201":
          description: Defined
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceType" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/resource-types/{key}:
    parameters:
      - { $ref: "#/components/parameters/KeyPath" }
    get:
      tags: [admin]
      operationId: getResourceType
      summary: One custom resource type
      responses:
        "200":
          description: The type
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceType" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [admin]
      operationId: updateResourceType
      summary: Change a custom resource type (its key stays)
      description: |
        Resources made before keep their properties: the type's workflows
        and templates as they are now delete, update and read them.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResourceTypeWrite" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceType" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [admin]
      operationId: deleteResourceType
      summary: Remove a type no item uses and no deployment has (else disable it)
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/variables:
    get:
      tags: [admin]
      operationId: listVariables
      summary: Shared variables (ADR-0057)
      description: |
        Named values that aren't secret, which composite steps and conditions
        read as `vars.<group>.<name>` each time they run, as vRO's
        configuration elements: written so, not by index nor a group whole,
        which saving refuses. Each with the items that read it. Reading them
        needs `catalog.manage` or `extensibility.read` (auditors) for all of
        rvav; changing them, `catalog.manage`.
      responses:
        "200":
          description: The variables, by group and name
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VariableList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      operationId: createVariable
      summary: Add a shared variable
      description: |
        Not for passwords, tokens or keys: a group or a name that says it
        holds a password, a passphrase, a secret, a token, a credential, or a
        private, SSH or API key is refused (`secret`), and those are stored
        as secrets. Audited with its value. Needs `catalog.manage` for all of
        rvav.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VariableCreate" }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Variable" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/variables/{key}:
    parameters:
      - name: key
        in: path
        required: true
        description: The variable as `<group>.<name>`.
        schema: { type: string, examples: [network.dns_servers] }
    get:
      tags: [admin]
      operationId: getVariable
      summary: One shared variable
      responses:
        "200":
          description: The variable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Variable" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [admin]
      operationId: updateVariable
      summary: Change a shared variable's value (its group and name stay)
      description: |
        Steps that run from then on read the new value, in requests already
        running too. Audited with the value it had.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VariableUpdate" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Variable" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [admin]
      operationId: deleteVariable
      summary: Remove a shared variable no item or running request reads
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /tokens:
    get:
      tags: [identity]
      operationId: listApiTokens
      summary: The caller's API tokens (everyone's with all=true, for `tokens.manage`)
      parameters:
        - name: all
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiTokenList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [identity]
      operationId: createApiToken
      summary: Create an API token; its value is shown once
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApiTokenCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiTokenCreated" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /tokens/{id}:
    parameters:
      - { $ref: "#/components/parameters/IdPath" }
    delete:
      tags: [identity]
      operationId: revokeApiToken
      summary: Revoke a token (one's own, or anyone's with `tokens.manage`)
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /audit:
    get:
      tags: [admin]
      operationId: listAuditEvents
      summary: The audit log, newest first
      description: |
        With `audit.read` for all of rvav (administrators and auditors),
        every event; with it in projects (project admins), those projects'
        events.
      parameters:
        - { $ref: "#/components/parameters/Search" }
        - name: actor
          in: query
          description: A user ID.
          schema: { type: string }
        - name: action
          in: query
          description: An action or a prefix ending in `.`, for example `catalog.`.
          schema: { type: string }
        - { $ref: "#/components/parameters/ProjectIdQuery" }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: format
          in: query
          description: |
            csv answers every matching event as a CSV file, with the columns
            `at`, `actor`, `action`, `target_type`, `target_id`, `project`,
            `detail` and `target_name`.
          schema: { type: string, enum: [json, csv], default: json }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventPage" }
            text/csv:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/audit-destinations:
    get:
      tags: [admin]
      operationId: listAuditDestinations
      summary: Where audit events are sent, with each one's delivery state (`integrations.manage`, or `audit.read` for all of rvav)
      description: |
        Each destination gets the audit events written after it was made,
        of its categories (every category when it names none), as a syslog
        server (RFC 5424) or a webhook. Events wait in the database until
        they are delivered: `state` says how many wait, and how the last
        attempt went (ADR-0058).
      responses:
        "200":
          description: The destinations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditDestinationList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      operationId: createAuditDestination
      summary: Send audit events to a syslog server or a webhook (`integrations.manage`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuditDestinationWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditDestination" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/audit-destinations/{id}:
    parameters:
      - { $ref: "#/components/parameters/IdPath" }
    get:
      tags: [admin]
      operationId: getAuditDestination
      summary: One destination, with its delivery state
      responses:
        "200":
          description: The destination
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditDestination" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [admin]
      operationId: updateAuditDestination
      summary: Change a destination; the events waiting for it, and those set aside, are tried again at once
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuditDestinationWrite" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditDestination" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [admin]
      operationId: deleteAuditDestination
      summary: Stop sending audit events there; those waiting are dropped (the audit log keeps them)
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/audit-destinations/{id}/test:
    parameters:
      - { $ref: "#/components/parameters/IdPath" }
    post:
      tags: [admin]
      operationId: testAuditDestination
      summary: Send a made-up event there now, once, and say how it went (`integrations.manage`)
      description: |
        The test event's action is `settings.audit_destination.test` and its
        ID `test`. It isn't queued: a failure changes nothing of the
        destination's state.
      responses:
        "200":
          description: How it went
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditDestinationTest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: This rvav process can't send audit events (no forwarder runs in it)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /reports:
    get:
      tags: [reports]
      operationId: getReport
      summary: How the platform is used (S13.4)
      description: |
        Requests over time and their success rate, provisioning time,
        approval lead time, usage against quota and the leases ending in the
        next 30 days. With `project.see` for all of rvav (administrators and
        auditors), every project; else the projects the caller sees.
      parameters:
        - name: from
          in: query
          description: The first day (UTC); by default 29 days before `to`, so 30 days in all.
          schema: { type: string, format: date }
        - name: to
          in: query
          description: The last day (UTC), included; today by default.
          schema: { type: string, format: date }
        - { $ref: "#/components/parameters/ProjectIdQuery" }
        - { name: environment, in: query, schema: { type: string } }
        - name: interval
          in: query
          description: The period requests are counted by.
          schema: { type: string, enum: [day, week, month], default: day }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /reports/export:
    get:
      tags: [reports]
      operationId: exportReport
      summary: A section of the report as CSV, one row per request, approval level, quota line or lease
      parameters:
        - name: section
          in: query
          required: true
          schema: { type: string, enum: [requests, approvals, quota, leases] }
        - name: from
          in: query
          description: The first day (UTC); by default 29 days before `to`, so 30 days in all.
          schema: { type: string, format: date }
        - name: to
          in: query
          description: The last day (UTC), included; today by default.
          schema: { type: string, format: date }
        - { $ref: "#/components/parameters/ProjectIdQuery" }
        - { name: environment, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            text/csv:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /events:
    get:
      tags: [events]
      operationId: streamEvents
      summary: Live updates as Server-Sent Events
      description: |
        One stream per browser tab. Each SSE message has `id`, `event` (the
        event type) and `data` (the JSON `Event` below). The server sends a
        `heartbeat` event every 15 seconds. On reconnect, send
        `Last-Event-ID` to receive what was missed; if that is too old, the
        server sends `resync` and the client should refetch its queries.

        Only events the caller is allowed to see are sent. When roles,
        assignments or group mappings change, every stream ends with
        `resync`: the client connects again, with what the caller now holds,
        and refetches, `/me` included. A stream reads the caller's roles
        once subscribed, so a change while it opens is in them or ends it;
        a `Last-Event-ID` from before a change gets `resync` instead of the
        missed events.
      parameters:
        - name: topics
          in: query
          required: true
          description: |
            Comma-separated topics: `requests`, `deployments`, `notifications`,
            `approvals` (approvals the caller may decide), or a single object
            such as `request:<id>` or `deployment:<id>`. `requests` and
            `deployments` are limited to `project_id`.
          schema: { type: string, examples: ["requests,deployments,notifications"] }
        - { $ref: "#/components/parameters/ProjectIdQuery" }
        - name: Last-Event-ID
          in: header
          schema: { type: string }
      responses:
        "200":
          description: An open event stream
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/Event" }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: |
        An OIDC access token (JWT) from the organisation's identity provider,
        or an rvav API token (prefix `rvav_pat_`) for automation.

  parameters:
    TemplateChannelQuery:
      name: channel
      in: query
      required: true
      schema: { $ref: "#/components/schemas/TemplateChannel" }
    TemplateLocaleQuery:
      name: locale
      in: query
      required: true
      schema: { $ref: "#/components/schemas/TemplateLocale" }
    ProjectIdPath:
      name: projectId
      in: path
      required: true
      schema: { type: string }
    ScheduleIdPath:
      name: scheduleId
      in: path
      required: true
      schema: { type: string }
    ProjectIdQuery:
      name: project_id
      in: query
      schema: { type: string }
    ProjectIdQueryRequired:
      name: project_id
      in: query
      required: true
      schema: { type: string }
    ItemIdPath:
      name: itemId
      in: path
      required: true
      description: Catalog item ID or slug.
      schema: { type: string }
    VersionIdPath:
      name: versionId
      in: path
      required: true
      description: Catalog item version ID.
      schema: { type: string }
    DeploymentIdPath:
      name: deploymentId
      in: path
      required: true
      schema: { type: string }
    Day2ActionPath:
      name: action
      in: path
      required: true
      description: A custom day-2 action's key, an AWX template's (`awx.*`) or a workflow's (`wf.*`).
      schema: { type: string, examples: [awx.install-monitoring-agent] }
    ApprovalIdPath:
      name: approvalId
      in: path
      required: true
      schema: { type: string }
    RequestIdPath:
      name: requestId
      in: path
      required: true
      description: Request ID or number (for example `REQ-10491`).
      schema: { type: string }
    UserIdPath:
      name: userId
      in: path
      required: true
      schema: { type: string }
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string }
    KeyPath:
      name: key
      in: path
      required: true
      schema: { type: string }
    IntegrationKindPath:
      name: kind
      in: path
      required: true
      schema: { $ref: "#/components/schemas/IntegrationKind" }
    Search:
      name: q
      in: query
      description: Free-text search.
      schema: { type: string, maxLength: 200 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` from the previous page.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        A client-generated UUID. Retrying with the same key and body returns
        the original response; the same key with a different body returns 409.
        Keys are kept for 24 hours.
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: The request is malformed
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Missing or invalid token
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: The caller is not allowed to do this
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Not found, or not visible to the caller
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: The current state does not allow this, or an idempotency key was reused with a different body
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: Too many attempts; try again after `Retry-After` seconds
      headers:
        Retry-After:
          description: Seconds to wait.
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ValidationFailed:
      description: One or more inputs are invalid. See `errors`.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UpstreamError:
      description: vCenter, EfficientIP or AWX did not answer or returned an error
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PayloadTooLarge:
      description: The request body is larger than the operation takes
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

    UnsupportedMediaType:
      description: The file is of a type the operation doesn't take, or its content isn't what its name says
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    # ── Ansible ───────────────────────────────────────────────────────────
    AnsibleInventory:
      type: object
      description: "`_meta.hostvars`, `all.children`, and one object per group with its `hosts`."
      required: [_meta, all]
      additionalProperties: true
      properties:
        _meta:
          type: object
          required: [hostvars]
          properties:
            hostvars:
              type: object
              additionalProperties: { type: object, additionalProperties: true }
        all:
          type: object
          required: [children]
          properties:
            children:
              type: array
              items: { type: string }

    # ── Admin ─────────────────────────────────────────────────────────────
    AwxTemplateList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AwxTemplate" }
    AwxTemplate:
      type: object
      required: [template_id, name, workflow, survey_changed, survey_diff, warnings, gone, synced_at]
      properties:
        template_id: { type: integer, description: The template's ID in AWX. }
        name: { type: string }
        workflow: { type: boolean }
        item_id: { type: string, description: The catalog item made from it. }
        item_name: { type: string }
        survey_changed:
          type: boolean
          description: The survey changed in AWX since the item's form was made from it.
        survey_diff:
          type: array
          items: { type: string }
          example: ["listen_port: maximum 65535 → 32767", "scrape_interval added (integer)"]
        warnings:
          type: array
          description: Launch settings or survey questions rvav can't use as meant.
          items: { type: string }
        gone:
          type: boolean
          description: AWX no longer has it, or it lost the label; the item stays.
        modified_at: { type: string, format: date-time, description: When AWX last changed it. }
        synced_at: { type: string, format: date-time }
    AwxActionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AwxAction" }
    AwxAction:
      type: object
      required: [key, name, description, template_id, template, workflow, types, condition, enabled, warnings, gone, synced_at]
      properties:
        key: { type: string, description: "The day-2 action's key: `awx.` and the template's name.", examples: [awx.install-monitoring-agent] }
        name: { type: string, examples: [Install monitoring agent] }
        description: { type: string, description: The template's description in AWX. }
        template_id: { type: integer, description: The template's ID in AWX. }
        template: { type: string, description: The template's name in AWX. }
        workflow: { type: boolean }
        types:
          type: array
          description: What it runs on.
          items: { type: string, enum: [vsphere.vm, deployment] }
        condition:
          type: string
          description: |
            A CEL expression over the day-2 policy variables (`resource`,
            `deployment`, `project`, `environment`, `user`); the action is
            offered only where it is true. Empty: everywhere.
          examples: ["resource.os_family == 'linux'"]
        enabled: { type: boolean, description: Offered on deployments. }
        fields:
          type: array
          description: The form's fields, from the survey.
          items: { type: string }
        warnings:
          type: array
          description: Launch settings or survey questions rvav can't use as meant.
          items: { type: string }
        gone:
          type: boolean
          description: AWX no longer has it, or it lost the label; it is no longer offered.
        synced_at: { type: string, format: date-time }
    AwxActionUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        types:
          type: array
          minItems: 1
          items: { type: string, enum: [vsphere.vm, deployment] }
        condition: { type: string, maxLength: 2000 }
        enabled: { type: boolean }
    # ── Catalog administration (ADR-0019) ─────────────────────────────────
    AdminCatalogItemPage:
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/AdminCatalogItem" }
    AdminCatalogItem:
      type: object
      required: [id, slug, name, summary, description_md, category, type, icon, tags, featured, source, versions, entitlements, requested, created_at]
      properties:
        id: { type: string }
        slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,62}$" }
        name: { type: string }
        summary: { type: string }
        description_md: { type: string }
        category: { type: string }
        type: { $ref: "#/components/schemas/CatalogItemType" }
        icon: { type: string }
        tags:
          type: array
          items: { type: string }
        featured: { type: boolean }
        source:
          type: object
          required: [kind]
          properties:
            kind: { type: string, enum: [native, awx] }
            awx_template_id: { type: integer }
            awx_template_name: { type: string }
        published_version:
          description: |
            The default version: the newest of the requestable ones, which
            `versions` marks `published`.
          allOf: [{ $ref: "#/components/schemas/CatalogItemVersion" }]
        draft_version: { $ref: "#/components/schemas/CatalogItemVersion" }
        versions:
          type: array
          description: Every version, newest first.
          items: { $ref: "#/components/schemas/CatalogItemVersion" }
        entitlements: { $ref: "#/components/schemas/CatalogEntitlements" }
        requested:
          type: boolean
          description: Requests were made from it, so it can't be deleted.
        created_at: { type: string, format: date-time }
        git: { $ref: "#/components/schemas/CatalogItemGit" }
    CatalogItemGit:
      type: object
      description: >
        The item's file in the catalog's Git repository (ADR-0029), when rvav
        keeps its catalog in Git.
      required: [path, state, attempts]
      properties:
        path: { type: string, examples: ["catalog/rhel9.yaml"] }
        state:
          type: string
          enum: [synced, waiting, failing, draft, conflict, refused, deleted]
          description: >
            synced: the repository has what rvav has. waiting: rvav's change
            waits to be committed. failing: committing it failed; it is tried
            again. draft: the repository's change is a draft in rvav.
            conflict: rvav and the repository both changed it. refused: the
            import refused the repository's file. deleted: the file was
            deleted in the repository.
        error: { type: string, description: Why the last commit failed. }
        attempts: { type: integer, description: Failed commits of the change. }
        next_attempt_at: { type: string, format: date-time }
        note: { type: string }
        last_commit: { $ref: "#/components/schemas/GitCommit" }
        draft_version_id:
          type: string
          description: The draft made of the repository's change (state draft).
        problems:
          type: array
          description: Why the import refused the repository's file (state refused).
          items: { $ref: "#/components/schemas/FieldError" }
    CatalogGitFile:
      allOf:
        - { $ref: "#/components/schemas/CatalogItemGit" }
        - type: object
          properties:
            item: { $ref: "#/components/schemas/ItemRef" }
    ItemRef:
      type: object
      required: [id, slug, name]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
    CatalogGitStatus:
      type: object
      required: [configured, files]
      properties:
        configured: { type: boolean, description: rvav keeps its catalog in Git. }
        url: { type: string }
        branch: { type: string }
        dir: { type: string }
        head: { type: string, description: The branch's commit as last read. }
        read_at: { type: string, format: date-time }
        error: { type: string, description: Why the last read failed. }
        read_requested: { type: boolean, description: A read was asked for and hasn't run yet. }
        files:
          type: array
          description: Every file rvav keeps track of, by path; those of no item too (a new file the import refused).
          items: { $ref: "#/components/schemas/CatalogGitFile" }
    CatalogItemGitDetail:
      type: object
      required: [file, diff]
      properties:
        file: { $ref: "#/components/schemas/CatalogItemGit" }
        rvav:
          type: string
          description: The item's file as rvav commits it (its published version, or the one deprecated last).
        repository:
          type: string
          description: >
            The repository's file rvav didn't take (conflict, refused), or the
            draft made of it (draft).
        diff:
          type: array
          description: The lines from rvav's file to the repository's.
          items: { $ref: "#/components/schemas/DiffLine" }
    DiffLine:
      type: object
      required: [op, text]
      properties:
        op: { type: string, enum: [same, added, removed] }
        text: { type: string }
    GitCommit:
      type: object
      required: [sha, message, author, when]
      properties:
        sha: { type: string }
        message: { type: string }
        author: { type: string }
        email: { type: string }
        when: { type: string, format: date-time }
    CatalogItemVersion:
      type: object
      required: [id, number, state, changelog, created_at, deployments, revision]
      properties:
        id: { type: string }
        number: { type: string, examples: ["1.1"] }
        revision:
          type: integer
          description: |
            Goes up each time a draft is saved. A save that names the
            revision it started from (`base_revision`) is refused with 409
            when the draft changed since.
        state: { type: string, enum: [draft, published, deprecated] }
        changelog: { type: string }
        created_at: { type: string, format: date-time }
        created_by: { $ref: "#/components/schemas/UserRef" }
        published_at: { type: string, format: date-time }
        deprecated_at: { type: string, format: date-time }
        deployments:
          type: integer
          description: Deployments made from this version and not deleted.
    CatalogItemVersionDetail:
      allOf:
        - $ref: "#/components/schemas/CatalogItemVersion"
        - type: object
          required: [definition]
          properties:
            definition: { $ref: "#/components/schemas/CatalogVersionDefinition" }
            warnings:
              type: array
              description: "What may not work as meant, without stopping a save or a publish: a blueprint's constraint naming a tag (`unknown_tag`) that no cluster, datastore or network of the inventory carries (ADR-0035). Pointers as in a validation error's."
              items: { $ref: "#/components/schemas/FieldError" }
    CatalogVersionDefinition:
      type: object
      required: [form_schema, ui_schema, initial_values, blueprint]
      properties:
        form_schema:
          type: object
          description: |
            JSON Schema (draft 2020-12) of the inputs. Formats are checked
            (`date-time` with a time zone, `date`), and `formatMinimum` and
            `formatMaximum` bound a `date-time` or `date` input.
          additionalProperties: true
        ui_schema: { $ref: "#/components/schemas/UiSchema" }
        initial_values:
          type: object
          additionalProperties: true
        blueprint:
          type: object
          description: What the request builds or runs, for the item's type (docs/service-catalog.md).
          additionalProperties: true
    CompositeStepTargetList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Items first, then AWX templates, then custom workflows, each by title.
          items: { $ref: "#/components/schemas/CompositeStepTarget" }
    CompositeStepTarget:
      type: object
      description: Something a composite's step can run (ADR-0022).
      required: [kind, ref, title, runs, planned, inputs, outputs, open_outputs]
      properties:
        kind:
          type: string
          enum: [item, awx, workflow, resource]
          x-enum-varnames: [StepTargetItem, StepTargetAwx, StepTargetWorkflow, StepTargetResource]
          description: |
            How a step names it: `item` (another item, by slug), `awx`
            (`awx.job_template`, a template's name), `workflow` (a custom
            workflow registered for composite steps, by key) or `resource`
            (`resource.type`, a resource type's key: a custom resource in
            the deployment of a VM step before it, ADR-0056).
        ref:
          type: string
          description: |
            The name a step gives it, under `kind`. A job template and a
            workflow template may have the same name: `awx_workflow` (and
            `awx_id`) tell them apart.
          examples: [db-user]
        title: { type: string, examples: [Create database user] }
        summary: { type: string }
        item_type: { $ref: "#/components/schemas/CatalogItemType" }
        awx_workflow:
          type: boolean
          description: An AWX workflow template, named `awx.job_template` with `awx.workflow` true.
        awx_id:
          type: integer
          description: |
            An AWX template's ID in AWX (a job template's or a workflow
            template's: they are numbered apart). A step writes it as
            `awx.template_id`, beside the name: it is then launched by ID,
            whatever the template is called since (ADR-0016).
          examples: [47]
        project_ids:
          type: array
          description: |
            The projects it is offered to, when not every project: a custom
            workflow registered for some projects, or a workflow item whose
            workflow is. A request of the composite from another project is
            refused. Absent when every project may use it.
          items: { type: string }
        runs:
          type: string
          enum: [vm, awx, workflow, resource]
          x-enum-varnames: [StepRunsVm, StepRunsAwx, StepRunsWorkflow, StepRunsResource]
          description: |
            What it runs, which says its outputs and whether it is planned:
            `resource` makes a custom resource, whose properties are its
            outputs.
        planned:
          type: boolean
          description: |
            It builds VMs, planned with the request when it is submitted: its
            inputs come from the form only, not from earlier steps, and it
            has no condition or undo.
        inputs:
          type: array
          description: What `with` binds, in its form's order; read-only fields left out.
          items: { $ref: "#/components/schemas/CompositeStepInput" }
        outputs:
          type: array
          description: What later steps read as `steps.<key>.<name>`.
          items: { $ref: "#/components/schemas/CompositeStepOutput" }
        open_outputs:
          type: boolean
          description: "Its outputs are whatever it returns (a custom workflow's result, a custom resource's properties): fields not listed may be read too."
    CompositeStepInput:
      type: object
      required: [name, title, type, required]
      properties:
        name: { type: string, examples: [role_name] }
        title: { type: string, examples: [Role name] }
        type:
          type: string
          description: Its JSON Schema type (string, integer, number, boolean, array, object), empty when it has none.
        required: { type: boolean }
        description: { type: string }
        enum:
          type: array
          description: The values it takes, when it has a list.
          items: {}
    CompositeStepOutput:
      type: object
      required: [name, type, description]
      properties:
        name: { type: string, examples: [fqdn] }
        type: { type: string, examples: [string] }
        description: { type: string, examples: ["The first VM's FQDN"] }
    CatalogItemCreate:
      type: object
      required: [slug, name, summary, category, type]
      additionalProperties: false
      properties:
        slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,62}$" }
        name: { type: string, minLength: 1, maxLength: 80 }
        summary: { type: string, minLength: 1, maxLength: 200 }
        description_md: { type: string, maxLength: 20000 }
        category: { type: string }
        type:
          $ref: "#/components/schemas/CatalogItemType"
          description: "`composite` and `workflow` items are defined in their blueprint (ADR-0022)."
        icon: { type: string, description: "One of `/admin/catalog/icons`." }
        tags:
          type: array
          items: { type: string, maxLength: 40 }
        featured: { type: boolean }
        definition: { $ref: "#/components/schemas/CatalogVersionDefinition" }
    CatalogItemUpdate:
      type: object
      additionalProperties: false
      properties:
        slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,62}$" }
        name: { type: string, minLength: 1, maxLength: 80 }
        summary: { type: string, minLength: 1, maxLength: 200 }
        description_md: { type: string, maxLength: 20000 }
        category: { type: string }
        icon: { type: string }
        tags:
          type: array
          items: { type: string, maxLength: 40 }
        featured: { type: boolean }
    CatalogItemVersionCreate:
      type: object
      additionalProperties: false
      properties:
        from_version_id:
          type: string
          description: Copy this version's definition. The published version when neither this nor `definition` is given.
        definition: { $ref: "#/components/schemas/CatalogVersionDefinition" }
        number: { type: string, maxLength: 20, description: "Default: the next number after the newest version's." }
        changelog: { type: string, maxLength: 2000 }
    CatalogItemVersionUpdate:
      type: object
      required: [definition]
      additionalProperties: false
      properties:
        definition: { $ref: "#/components/schemas/CatalogVersionDefinition" }
        number: { type: string, maxLength: 20 }
        changelog: { type: string, maxLength: 2000 }
        base_revision:
          type: integer
          description: The revision this save started from; 409 when the draft changed since.
    CatalogItemVersionPublish:
      type: object
      additionalProperties: false
      properties:
        changelog: { type: string, maxLength: 2000, description: Replaces a draft's changelog. }
        keep_published:
          type: boolean
          description: |
            Keep the versions requestable now requestable too, rather than
            deprecate them: requesters pick one, the newest by default.
    CatalogItemVersionDeprecate:
      type: object
      additionalProperties: false
      properties:
        withdraw:
          type: boolean
          description: Retire every requestable version of the item, not only this one.
    CatalogVersionDiff:
      type: object
      required: [from, to, changes]
      properties:
        from: { $ref: "#/components/schemas/CatalogItemVersion" }
        to: { $ref: "#/components/schemas/CatalogItemVersion" }
        changes:
          type: array
          items: { $ref: "#/components/schemas/CatalogVersionChange" }
    CatalogVersionChange:
      type: object
      required: [area, path, change, summary]
      properties:
        area: { type: string, enum: [form_schema, ui_schema, initial_values, blueprint] }
        path: { type: string, description: JSON pointer in the area., examples: [/properties/size/enum] }
        change: { type: string, enum: [added, removed, changed] }
        summary: { type: string, examples: ["size: XL added"] }
        from: { description: The old value. }
        to: { description: The new value. }
    CatalogEntitlements:
      type: object
      description: |
        Who may request an item (ADR-0019, Sharing): in every project,
        those made later included, or in chosen projects; in each, all its
        members, or the users, OIDC groups and project roles an audience
        names. Someone requests it in a project when one of these covers
        them there, and when they may request in that project.
      required: [all_projects, project_ids]
      properties:
        all_projects:
          type: boolean
          description: Shared with every project, those made later included.
        project_ids:
          type: array
          description: The projects it is shared with, besides every project when `all_projects`.
          items: { type: string }
        everywhere:
          $ref: "#/components/schemas/CatalogAudience"
          description: With `all_projects`, who may request it in each project.
        audiences:
          type: array
          description: |
            Who may request it in projects of `project_ids`, when not all
            their members: one per project at most.
          items: { $ref: "#/components/schemas/CatalogProjectAudience" }
        projects:
          type: array
          readOnly: true
          description: Every project, to choose from.
          items:
            type: object
            required: [id, code, name]
            properties:
              id: { type: string }
              code: { type: string }
              name: { type: string }
        roles:
          type: array
          readOnly: true
          description: The roles given in projects, built-in or custom, to choose from.
          items: { $ref: "#/components/schemas/RoleRef" }
        users:
          type: array
          readOnly: true
          description: The users the audiences name.
          items: { $ref: "#/components/schemas/UserRef" }
    CatalogAudience:
      type: object
      description: |
        Who may request an item in a project: all its members when it names
        nobody. With `all_projects`, `everywhere` applies in each project.
      required: [user_ids, groups, roles]
      properties:
        user_ids:
          type: array
          description: Users, by ID.
          items: { type: string }
        groups:
          type: array
          description: OIDC groups, by name, as the identity provider's token gives them.
          items: { type: string }
        roles:
          type: array
          description: Project roles, by key, held in the project themselves or through a group.
          items: { type: string }
    CatalogProjectAudience:
      type: object
      description: Who may request an item in one project; all its members when it names nobody.
      required: [project_id, user_ids, groups, roles]
      properties:
        project_id: { type: string }
        user_ids:
          type: array
          items: { type: string }
        groups:
          type: array
          items: { type: string }
        roles:
          type: array
          items: { type: string }
    CatalogRequesters:
      type: object
      description: Who an audience lets request in a project, as rvav knows them now.
      required: [project, people, left_out, not_requesters, groups]
      properties:
        project: { $ref: "#/components/schemas/ProjectRef" }
        people:
          type: array
          description: The project's requesters it covers, by name, with why.
          items: { $ref: "#/components/schemas/CatalogRequester" }
        left_out:
          type: array
          description: The project's requesters it doesn't cover.
          items: { $ref: "#/components/schemas/UserRef" }
        not_requesters:
          type: array
          description: Users it names who may not request in the project.
          items: { $ref: "#/components/schemas/UserRef" }
        groups:
          type: array
          description: Its groups, with how many people rvav has seen in each.
          items: { $ref: "#/components/schemas/CatalogRequesterGroup" }
        everywhere:
          description: |
            The item's saved every-project share, which adds to the
            audience in this project. Absent when the item isn't shared
            with every project.
          $ref: "#/components/schemas/CatalogAudience"
    CatalogRequester:
      type: object
      required: [user, named, groups, roles, everywhere]
      properties:
        user: { $ref: "#/components/schemas/UserRef" }
        named: { type: boolean, description: The audience names them. }
        everywhere:
          type: boolean
          description: The item's every-project share covers them, whatever the audience says.
        groups:
          type: array
          description: The audience's groups they were in at their last sign-in.
          items: { type: string }
        roles:
          type: array
          description: The audience's roles they hold in the project.
          items: { $ref: "#/components/schemas/RoleRef" }
    CatalogRequesterGroup:
      type: object
      required: [name, seen]
      properties:
        name: { type: string }
        seen: { type: integer, description: "The people rvav has seen in it, at their last sign-in." }
    CatalogImportResult:
      type: object
      required: [item_id, created, versions]
      properties:
        item_id: { type: string }
        created: { type: boolean, description: A new item was made. }
        versions:
          type: array
          items: { $ref: "#/components/schemas/CatalogItemVersion" }
    AdminCatalogCategoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminCatalogCategory" }
    AdminCatalogCategory:
      type: object
      required: [key, name]
      properties:
        key: { type: string, pattern: "^[a-z][a-z0-9-]{1,30}$" }
        name: { type: string, minLength: 1, maxLength: 60 }
        sort_order: { type: integer }
        items: { type: integer, readOnly: true, description: Items in the category. }
    AdminCatalogCategoryUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        sort_order: { type: integer }
    DesignerPreviewQuery:
      type: object
      required: [project_id, inputs]
      properties:
        project_id: { type: string }
        environment: { $ref: "#/components/schemas/EnvironmentKey" }
        as_user_id:
          type: string
          description: Preview as this user (their roles and groups in the project). Default the caller.
        inputs:
          type: object
          additionalProperties: true
    DesignerPreview:
      type: object
      required: [form, fields, errors]
      properties:
        form: { $ref: "#/components/schemas/RequestForm" }
        fields: { $ref: "#/components/schemas/FieldStates" }
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
    FieldStates:
      type: object
      description: |
        Each input's rule results (UiRules) for the current inputs, as the
        server evaluated them; the form shows them instead of evaluating
        CEL itself.
      additionalProperties: { $ref: "#/components/schemas/FieldState" }
    FieldState:
      type: object
      required: [visible, required, read_only]
      properties:
        visible: { type: boolean }
        required: { type: boolean }
        read_only: { type: boolean }
        value: { description: "The value a `value` rule, or a `computed` field's value source, worked out: the input's value." }
        default:
          description: |
            The field's default, from its `default` rule or its value
            source: the form shows it while the field has no value, and a
            request without the input gets it.
        error: { type: string, description: "A rule, or a value source giving a default or a value, that could not be worked out (for the designer)." }
    SecretList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Secret" }
        projects:
          type: array
          readOnly: true
          description: Every project, those a secret may belong to.
          items:
            type: object
            required: [id, code, name]
            properties:
              id: { type: string }
              code: { type: string }
              name: { type: string }
    Secret:
      type: object
      required: [name, kind, description, created_at, updated_at]
      description: A stored secret. Its value is never returned.
      properties:
        name: { type: string, pattern: "^[a-z][a-z0-9-]{1,62}$" }
        project_id:
          type: string
          description: "The project it belongs to (ADR-0038): that project's requests open it rather than the global secret of the same name, and other projects never do. Absent for a global secret."
        kind: { type: string, enum: [token, basic, header] }
        description: { type: string }
        username: { type: string, description: For `basic`. }
        header: { type: string, description: "For `header`: the header's name." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        used_by:
          type: array
          description: "Items whose versions name it, by slug, and templates whose user data reads it, as template:<key>."
          items: { type: string }
    SecretWrite:
      type: object
      required: [name, kind, value]
      additionalProperties: false
      properties:
        name: { type: string, pattern: "^[a-z][a-z0-9-]{1,62}$" }
        project_id:
          type: string
          description: "When creating: the project it belongs to, none for a global secret. A replacement names its project in the query instead."
        kind: { type: string, enum: [token, basic, header] }
        description: { type: string, maxLength: 200 }
        username: { type: string }
        header: { type: string }
        value: { type: string, minLength: 1, writeOnly: true }
    PropertyGroupList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PropertyGroup" }
    PropertyGroupInput:
      type: object
      required: [name, label, type]
      additionalProperties: false
      description: An input a property group adds to the forms of the items naming it.
      properties:
        name: { type: string, pattern: "^[A-Za-z][A-Za-z0-9_]{0,62}$", description: "The input's name, as the item's own inputs: inputs.<name>." }
        label: { type: string, minLength: 1, maxLength: 100 }
        type: { type: string, enum: [string, integer, number, boolean] }
        required: { type: boolean }
        secret: { type: boolean, description: "A string kept as a secret input (S14.6): shown masked, never returned." }
        default: { description: "Its first value: of its type, one of its options when it has some." }
        options:
          type: array
          description: The values a string input is chosen from.
          items: { type: string }
        help: { type: string, maxLength: 300 }
        expose_to_inventory:
          type: boolean
          description: "Puts its value in the host variables of the AWX inventory's hosts, as a form field's expose_to_inventory does. Not with secret."
    PropertyGroupWrite:
      type: object
      required: [name, inputs, constants]
      additionalProperties: false
      properties:
        key:
          type: string
          pattern: "^[A-Za-z][A-Za-z0-9_]{1,62}$"
          description: "When creating: how blueprints name it and bindings read it, propgroup.<key>.<name>."
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        inputs:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/PropertyGroupInput" }
        constants:
          type: object
          description: "Values bindings read as propgroup.<key>.<name>: text, numbers or booleans."
          additionalProperties: true
    PropertyGroup:
      type: object
      required: [key, name, description, version, versions, inputs, constants, used_by, updated_at]
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string }
        version: { type: integer, description: The version shown. }
        versions:
          type: array
          description: Every version, the latest last.
          items: { type: integer }
        inputs:
          type: array
          items: { $ref: "#/components/schemas/PropertyGroupInput" }
        constants:
          type: object
          additionalProperties: true
        used_by:
          type: array
          description: "Items whose saved versions name it, by slug (drafts aside): it can't be deleted while one does."
          items: { type: string }
        updated_at: { type: string, format: date-time }
    FormLibraryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FormLibraryEntry" }
    FormLibraryPurpose:
      type: string
      enum: [source, validation]
      description: "`source`: a field's choices or value. `validation`: a check of the whole form on submit."
    FormLibraryParameter:
      type: object
      required: [name, label]
      additionalProperties: false
      description: A parameter the entry takes, which each form using it gives as CEL.
      properties:
        name: { type: string, pattern: "^[A-Za-z][A-Za-z0-9_]{0,62}$", description: "Read as ${params.<name>} in templates, params.<name> in expressions." }
        label: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 300 }
        required: { type: boolean, description: "A form must give it to publish; the entry is not run without it." }
    FormLibraryEntryWrite:
      type: object
      required: [name, use, kind, params, parameters]
      additionalProperties: false
      properties:
        key:
          type: string
          pattern: "^[A-Za-z][A-Za-z0-9_]{1,62}$"
          description: When creating, how forms name it.
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        use: { $ref: "#/components/schemas/FormLibraryPurpose" }
        kind:
          $ref: "#/components/schemas/ValueSourceKind"
          description: "`rest` or `cel`."
        params:
          type: object
          additionalProperties: true
          description: |
            A source's as a `rest` or `cel` value source's, a validation's
            as a `rest` or `cel` validation's (`FormValidation`), reading
            the entry's parameters as `${params.x}` and `params.x` (not the
            form's inputs), and in expressions `environment`, `project`,
            `user` and, for a source, `search`.
        search:
          type: boolean
          description: For a source, as a value source's `search`.
        parameters:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/FormLibraryParameter" }
        message:
          type: string
          maxLength: 500
          description: For a validation, what a refusal without its own message says.
    FormLibraryItemUse:
      type: object
      required: [item_id, slug, name, version_id, number, state, entry_version]
      properties:
        item_id: { type: string }
        slug: { type: string }
        name: { type: string }
        version_id: { type: string }
        number: { type: string }
        state: { type: string, description: "The item version's: draft, published, deprecated or retired." }
        entry_version: { type: integer, description: The entry's version it names. }
    FormLibraryDraft:
      type: object
      required: [item_id, slug, name, number, created]
      description: An item given a draft naming the entry's new version.
      properties:
        item_id: { type: string }
        slug: { type: string }
        name: { type: string }
        number: { type: string, description: The draft's number. }
        created: { type: boolean, description: "Made from its published version; false when its draft changed." }
        problem: { type: string, description: "Why it got none: the draft would not pass the designer's checks, or was changed at the same time." }
    FormLibraryEntry:
      type: object
      required: [key, name, description, use, kind, params, search, parameters, version, versions, used_by, updated_at]
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string }
        use: { $ref: "#/components/schemas/FormLibraryPurpose" }
        kind: { $ref: "#/components/schemas/ValueSourceKind" }
        params: { type: object, additionalProperties: true }
        search: { type: boolean }
        parameters:
          type: array
          items: { $ref: "#/components/schemas/FormLibraryParameter" }
        message: { type: string }
        version: { type: integer, description: The version shown. }
        versions:
          type: array
          description: Every version, the latest last.
          items: { type: integer }
        used_by:
          type: array
          description: "The items' versions naming the entry, any version of it: it can't be deleted while one that isn't a draft does."
          items: { $ref: "#/components/schemas/FormLibraryItemUse" }
        drafts:
          type: array
          description: On save, the items given a draft naming this version.
          items: { $ref: "#/components/schemas/FormLibraryDraft" }
        updated_at: { type: string, format: date-time }
    FormLibraryTest:
      type: object
      required: [entry, params]
      properties:
        entry: { $ref: "#/components/schemas/FormLibraryEntryWrite" }
        params:
          type: object
          additionalProperties: true
          description: The parameters' values.
        search: { type: string, description: "For a source with `search`, the text typed." }
        project_id: { type: string, description: "The project whose secret of that name a REST entry opens, before the global one." }
        environment: { $ref: "#/components/schemas/EnvironmentKey" }
    FormLibraryTestResult:
      type: object
      properties:
        options:
          type: array
          items: { $ref: "#/components/schemas/Option" }
        value: { description: What a source gives a field that takes one value. }
        valid: { type: boolean, description: "For a validation, whether it passed." }
        messages:
          type: array
          description: For a validation, what it says, on a parameter or on the form (no field).
          items:
            type: object
            required: [message]
            properties:
              field: { type: string }
              message: { type: string }
    IpamReconcile:
      type: object
      required: [checked_at, efficientip, managed_addresses, managed_records, orphan_addresses, orphan_records, missing,
        orphan_allocations, unallocated]
      properties:
        checked_at: { type: string, format: date-time }
        efficientip:
          type: boolean
          description: Whether EfficientIP was compared; false when none is set, and its counts and lists are then empty.
        managed_addresses:
          type: integer
          description: Addresses in EfficientIP with rvav_managed=1.
        managed_records:
          type: integer
          description: DNS records in EfficientIP with rvav_managed=1.
        orphan_addresses:
          type: array
          items: { $ref: "#/components/schemas/IpamOrphanAddress" }
        orphan_records:
          type: array
          items: { $ref: "#/components/schemas/IpamOrphanRecord" }
        missing:
          type: array
          description: What deployments own that EfficientIP no longer has.
          items: { $ref: "#/components/schemas/IpamMissing" }
        orphan_allocations:
          type: array
          description: Addresses rvav's IP ranges gave to VMs no deployment has any more (ADR-0063).
          items: { $ref: "#/components/schemas/IpamOrphanAllocation" }
        unallocated:
          type: array
          description: The inventory's VMs whose address is in an IP range that didn't give it to them.
          items: { $ref: "#/components/schemas/IpamUnallocated" }
    IpamOrphanAllocation:
      type: object
      required: [range_id, range_name, vcenter, network, address, hostname, allocated_at]
      properties:
        range_id: { type: string }
        range_name: { type: string }
        vcenter: { type: string }
        network: { type: string }
        address: { type: string }
        hostname: { type: string, description: The VM's name. }
        adapter: { type: string, description: "The adapter's key in the blueprint; absent for the VM's first." }
        deployment_id: { type: string }
        deployment_name: { type: string, description: Absent once the deployment is gone. }
        request_id: { type: string }
        allocated_at: { type: string, format: date-time }
    IpamUnallocated:
      type: object
      required: [vm, vcenter, address, range_id, range_name, network]
      properties:
        vm: { type: string }
        vcenter: { type: string }
        address: { type: string, description: The address vCenter reports for the VM. }
        range_id: { type: string }
        range_name: { type: string }
        network: { type: string, description: The range's network. }
        deployment_id: { type: string, description: "The deployment that has the VM, when rvav manages it." }
        deployment_name: { type: string }
        held_by: { type: string, description: "The VM the range gave the address to, when it gave it to another." }
    IpamOrphanAddress:
      type: object
      required: [efficientip_id, ip, name, subnet]
      properties:
        efficientip_id: { type: string }
        ip: { type: string }
        name: { type: string }
        subnet: { type: string, description: "The subnet, as a CIDR (its name when EfficientIP doesn't give its range).", example: 10.31.10.0/24 }
    IpamOrphanRecord:
      type: object
      required: [efficientip_id, fqdn, type, value]
      properties:
        efficientip_id: { type: string }
        fqdn: { type: string }
        type: { type: string, example: A }
        value: { type: string }
    IpamMissing:
      type: object
      required: [resource_id, deployment_id, deployment_name, type, name]
      properties:
        resource_id: { type: string }
        deployment_id: { type: string }
        deployment_name: { type: string }
        type: { type: string, enum: [ipam.address, dns.record] }
        name: { type: string, example: A web-dev-app001.corp.example }
        efficientip_id: { type: string }

    # ── Common ────────────────────────────────────────────────────────────
    Problem:
      description: RFC 9457 problem details.
      type: object
      required: [type, title, status, request_id]
      properties:
        type:
          type: string
          description: A URI identifying the problem type, for example `https://rvav.dev/problems/quota-exceeded`.
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        request_id:
          type: string
          description: Correlation ID, also in the `X-Request-Id` response header. Quote it to support.
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
        retry:
          type: boolean
          description: >-
            On a 409, true when the same call may succeed later, unchanged:
            requests placed at the same moment took the room this one
            counted on, or a setting it needs isn't made yet. A 409 without
            it is final.

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: JSON pointer into the submitted inputs, for example `/inputs/memory_gb`. Empty for form-level errors.
        code:
          type: string
          description: |
            Stable machine code, for example `required`, `maximum`,
            `too_long`, `taken`, `naming`, `no_deployment`,
            `quota_exceeded`, `limit_exceeded`, `looser`, `stale_version`,
            `not_member`.
        message: { type: string }
        warning:
          $ref: "#/components/schemas/PolicyWarning"
          description: With the code `warning`, the warning to accept (ADR-0045).

    PageInfo:
      type: object
      properties:
        next_cursor:
          type: [string, "null"]
          description: Null on the last page.

    UserRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }

    # ── Identity and projects ─────────────────────────────────────────────
    Me:
      type: object
      required: [user, permissions, roles, projects]
      properties:
        user: { $ref: "#/components/schemas/UserRef" }
        title: { type: string, description: Job title from the identity provider. }
        local:
          type: boolean
          description: Signed in with the local administrator's account (ADR-0030), not through the identity provider.
        password_change_required:
          type: boolean
          description: |
            The local administrator must change the password before doing
            anything else (first sign-in, or after a reset).
        locale:
          type: string
          enum: [en, fr]
          description: |
            The language the caller chose for the web app and what rvav
            sends (`setMyLocale`, or the notification preferences). Absent
            until they choose: the web app then follows the browser.
        permissions:
          type: array
          description: The permissions held for all of rvav, by any role.
          items: { $ref: "#/components/schemas/Permission" }
        roles:
          type: array
          description: The roles held for all of rvav, built-in and custom.
          items: { $ref: "#/components/schemas/RoleRef" }
        projects:
          type: array
          description: |
            The projects the caller sees (`project.see`): every one, up to
            200, when it is held for all of rvav. Empty for someone who only
            approves.
          items: { $ref: "#/components/schemas/MeProject" }

    MyLocale:
      type: object
      required: [locale]
      additionalProperties: false
      properties:
        locale: { type: string, enum: [en, fr] }

    MeProject:
      type: object
      required: [project, roles, permissions]
      properties:
        project: { $ref: "#/components/schemas/ProjectRef" }
        roles:
          type: array
          description: The roles given in this project, directly or through a group.
          items: { $ref: "#/components/schemas/RoleRef" }
        permissions:
          type: array
          description: The permissions held here, those held for all of rvav included.
          items: { $ref: "#/components/schemas/Permission" }

    ProjectRole:
      type: string
      enum: [project-admin, member, viewer]

    AuthOptions:
      type: object
      properties:
        provider: { $ref: "#/components/schemas/AuthProvider" }
    AuthProvider:
      type: object
      required: [authority, client_id, scope]
      properties:
        authority:
          type: string
          description: The issuer, as the browser reaches it.
          examples: [https://login.microsoftonline.com/0f1e2d3c-0000-4000-8000-000000000000/v2.0]
        client_id: { type: string }
        scope:
          type: string
          description: Space-separated scopes the web app asks for.
          examples: ["openid profile email api://rvav/access"]
    OidcTrialRequest:
      type: object
      required: [settings, access_token]
      additionalProperties: false
      properties:
        settings:
          type: object
          additionalProperties: true
          description: The provider settings tried, over the saved ones (environment variables still win).
        access_token: { type: string, minLength: 1, writeOnly: true }
    OidcTrial:
      type: object
      required: [accepted, claims, groups, global_roles, project_roles]
      description: "`global_roles` and `project_roles` are every role the group mappings give, built-in or custom, by key."
      properties:
        accepted:
          type: boolean
          description: rvav accepts the token with these settings.
        message:
          type: string
          description: Why it doesn't, when it doesn't.
        subject: { type: string }
        name: { type: string }
        email: { type: string }
        claims:
          type: object
          additionalProperties: true
          description: The access token's claims, read even when it isn't accepted.
        groups_claim: { type: string }
        groups:
          type: array
          description: The groups or roles read from the groups claim.
          items: { type: string }
        manager_claim: { type: string }
        manager:
          type: string
          description: The manager read from the manager claim, as rvav stores it; absent without one.
        global_roles:
          type: array
          items: { type: string }
        project_roles:
          type: array
          items: { $ref: "#/components/schemas/OidcTrialProjectRole" }
    OidcTrialProjectRole:
      type: object
      required: [project, role]
      properties:
        project: { $ref: "#/components/schemas/ProjectRef" }
        role: { type: string }
    SignInRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, maxLength: 64, description: The local account's name (`admin`). }
        password: { type: string, maxLength: 256 }

    SignInResult:
      type: object
      required: [password_change_required]
      properties:
        password_change_required:
          type: boolean
          description: The password must be changed before anything else.

    PasswordChange:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string, maxLength: 256 }
        new_password:
          type: string
          minLength: 12
          maxLength: 256
          description: At least 12 characters, other than the current password and the username.

    EnvironmentKey:
      type: string
      pattern: "^[a-z][a-z0-9]{1,9}$"
      examples: [dev, tst, prd]

    Environment:
      type: object
      required: [key, name, production, order]
      properties:
        key: { $ref: "#/components/schemas/EnvironmentKey" }
        name: { type: string, examples: [Production] }
        production:
          type: boolean
          description: Production environments are highlighted in the UI and usually carry stricter policies.
        order: { type: integer, description: Display order. }

    ProjectRef:
      type: object
      required: [id, code, name]
      properties:
        id: { type: string }
        code:
          type: string
          description: Short code used in names, for example `web` in `web-prd-front001`.
          pattern: "^[a-z][a-z0-9]{1,7}$"
        name: { type: string }

    ProjectName:
      allOf:
        - $ref: "#/components/schemas/ProjectRef"
        - type: object
          required: [archived]
          properties:
            archived: { type: boolean }

    ProjectNameList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ProjectName" }

    Project:
      allOf:
        - $ref: "#/components/schemas/ProjectRef"
        - type: object
          required: [environments]
          properties:
            description: { type: string }
            cost_center: { type: string }
            environments:
              type: array
              description: Environments this project may deploy to.
              items: { $ref: "#/components/schemas/EnvironmentKey" }
            my_permissions:
              type: array
              description: The permissions the caller holds in this project, those held for all of rvav included.
              items: { $ref: "#/components/schemas/Permission" }
            deployment_sharing: { $ref: "#/components/schemas/DeploymentSharing" }

    DeploymentSharing:
      type: string
      enum: [all_members, owner_only]
      description: |
        Who sees the project's deployments: every member who sees the
        project, or each its own, with whoever holds `deployments.read_all`
        there (ADR-0045).
    DeploymentSharingWrite:
      type: object
      required: [deployment_sharing]
      additionalProperties: false
      properties:
        deployment_sharing: { $ref: "#/components/schemas/DeploymentSharing" }

    ProjectPage:
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Project" }

    QuotaResource:
      type: string
      enum: [vcpu, memory_gb, storage_gb, vm_count]

    QuotaUsage:
      type: object
      required: [project_id, lines]
      properties:
        project_id: { type: string }
        environment:
          oneOf:
            - $ref: "#/components/schemas/EnvironmentKey"
            - type: "null"
        lines:
          type: array
          items:
            type: object
            required: [resource, used, reserved]
            properties:
              resource: { $ref: "#/components/schemas/QuotaResource" }
              limit:
                type: [integer, "null"]
                description: Null when unlimited.
              used: { type: integer, description: Allocated by existing deployments. }
              reserved: { type: integer, description: Held by requests that are approved or running but not finished. }
              enforcement: { type: string, enum: [hard, soft] }

    # ── Catalog ───────────────────────────────────────────────────────────
    CatalogItemType:
      type: string
      enum: [vm_blueprint, awx_job_template, awx_workflow, composite, workflow]

    CatalogCategory:
      type: object
      required: [key, name, item_count]
      properties:
        key: { type: string }
        name: { type: string }
        item_count: { type: integer }

    ApprovalHint:
      type: string
      description: |
        Shown on catalog cards. `conditional` means some inputs (for example a
        production environment) trigger an approval policy. The exact path is
        returned by `/requests/preview`.
      enum: [never, conditional, always]

    CatalogItem:
      type: object
      required: [id, slug, name, summary, category, type, icon, version, approval, favourite, source]
      properties:
        id: { type: string }
        slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,62}$" }
        name: { type: string }
        summary: { type: string, maxLength: 200 }
        description_md: { type: string, description: Markdown. }
        category: { type: string, description: Category key. }
        type: { $ref: "#/components/schemas/CatalogItemType" }
        icon: { type: string, description: "Icon name from the UI icon set, or `upload:<id>` for a custom SVG." }
        tags:
          type: array
          items: { type: string }
        version:
          description: The version a request gets unless it names another, the newest requestable one.
          allOf: [{ $ref: "#/components/schemas/CatalogItemVersionRef" }]
        versions:
          type: array
          description: |
            The versions a request may name, newest first, `version` among
            them. Given when an administrator keeps more than one
            requestable (ADR-0046).
          items: { $ref: "#/components/schemas/CatalogItemVersionRef" }
        typical_duration_seconds:
          type: [integer, "null"]
          description: Median duration of the last 30 successful requests.
        approval: { $ref: "#/components/schemas/ApprovalHint" }
        favourite: { type: boolean }
        featured: { type: boolean }
        requests_last_30_days: { type: integer }
        source:
          type: object
          required: [kind]
          properties:
            kind: { type: string, enum: [native, awx] }
            awx_template_id: { type: integer }
            awx_template_name: { type: string }

    CatalogItemVersionRef:
      type: object
      required: [id, number]
      properties:
        id: { type: string }
        number:
          type: string
          description: Display version, for example `3.2`, or `AWX #47` for an imported template.
        published_at: { type: string, format: date-time }

    CatalogItemPage:
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/CatalogItem" }

    # ── Forms ─────────────────────────────────────────────────────────────
    RequestForm:
      type: object
      required: [item_id, version_id, schema, ui_schema, initial_values]
      properties:
        item_id: { type: string }
        version_id: { type: string }
        schema:
          type: object
          description: JSON Schema (draft 2020-12) of `inputs`. The server validates against it on preview and submit.
          additionalProperties: true
        ui_schema: { $ref: "#/components/schemas/UiSchema" }
        initial_values:
          type: object
          description: |
            What the form starts with: the version's initial values and, for
            an input without one, the `default` its schema gives. A request
            that leaves an input out gets this value (ADR-0055).
          additionalProperties: true
        one_deployment:
          type: boolean
          description: |
            The item builds one deployment however many VMs (a blueprint with
            components, ADR-0024): how many of each is in the form, and the
            request's `count` stays 1.
        names_deployments:
          type: boolean
          description: |
            The item makes deployments (a VM item, or a composite with a VM
            step), so a request may give their `deployment_name` and
            `deployment_description`.
        topology:
          type: object
          additionalProperties: true
          description: |
            What the item builds, for the request form to draw (ADR-0032): the
            part of the version's blueprint the canvas shows, in the
            blueprint's own shape, lists keeping their positions. A VM item's
            `kind`, `template`, `library`, `guest.os_family`, `disks`
            (`size_gb`, `storage_policy`), `nics` (`key`, `network`, `ipam`),
            `groups`, `segments`, `security_groups` with their `rules`,
            `awx_templates` (titles only), `bindings` (`network`, `groups`,
            `template`, `post_config` only) and `components` with the same
            and their `key`, `title`, `count` and `anti_affinity`; a
            composite's `kind`, `rollback_on_failure`, `on_error` and `steps`
            (`key`, `title`, `item`, `awx`, `workflow`, `rest`, `ask`, `wait`,
            `poll`, `signal`, `branch`, `notify`, `resource`, `for_each`,
            `when`, `undo`, `catch`, `parallel`), each binding in
            `with` reduced to the `steps.<key>` it names, of an `ask` only
            whether the requester or owner is asked, its timeout and its form's
            keys: no names, groups or texts, of a `poll`'s call only what a
            `rest` keeps, of a `branch` its `cases` (`title`, `when`, `steps`)
            and `else`, its steps as any step's, and of a `notify` only whether
            the requester or owner is told. CEL keeps what it reads, its string
            literals masked.
            Nothing else of the blueprint (guest settings, secrets, sizes,
            naming, placement, tags, variables). Absent for AWX and workflow
            items.

    UiSchema:
      type: object
      required: [layout, fields]
      properties:
        layout:
          type: object
          required: [kind, sections]
          properties:
            kind:
              type: string
              enum: [page, wizard, tabs]
              description: |
                How the sections show, in their order. `page`: all on one
                page. `wizard`: one section per page, with Back and Next,
                then a review of what was entered before submit; Next checks
                the page's fields first. `tabs`: one section per tab. A page
                or tab whose fields a `visible` rule all hides is left out.
                Presentation only: the server checks a request the same way
                whatever the layout.
            sections:
              type: array
              items: { $ref: "#/components/schemas/UiSection" }
        fields:
          type: object
          description: Presentation and behaviour per input, keyed by the input's name in `schema`.
          additionalProperties: { $ref: "#/components/schemas/UiField" }
        validations:
          type: array
          maxItems: 20
          description: |
            Checks of the whole form, in order, run on submit (and an
            approver's edits) once the inputs pass the form's own checks,
            and on the wizard's review step (`POST /requests/preview?validate=true`).
            Not on day-2 actions' forms.
          items: { $ref: "#/components/schemas/FormValidation" }

    FormValidation:
      type: object
      required: [key, kind]
      description: |
        A check of the whole form (ADR-0043). It passes, or refuses the
        request with a message, on the form or on fields; a validation
        that can't run (its service down, an expression that fails)
        refuses it too, saying so.

        `cel`: `params.check` is an expression over what form rules read.
        `true`, `null`, `""` or `{}` passes; `false` refuses with
        `message`; text refuses with that text; a map refuses with its
        messages, each on the input it names.

        `rest`: `params.url`, `method`, `body` and `secret` as a `rest`
        value source's, its inputs as `${inputs.x}`. A 2xx answer is read
        with JSONPath: `valid` (a boolean, `$.valid` unless given),
        `message` (`$.message`) and `errors` (`$.errors`: a map of input to
        message, or a list of `{field, message}`). It passes when `valid`
        is true, or, without `valid`, when the answer has no message and
        no errors. Any other answer refuses the request: the check
        couldn't run. Not cached unless `cache_seconds` says so.

        `library`: the form library's entry `name` at `version`, its
        parameters given in `params` as CEL. A message for a parameter
        shows on the input its expression reads alone (`inputs.x`).
      properties:
        key:
          type: string
          pattern: "^[A-Za-z][A-Za-z0-9_]{0,62}$"
          description: Names the validation in the form, its messages and the audit.
        title:
          type: string
          maxLength: 100
          description: What it checks, in a few words, for the designer.
        kind: { $ref: "#/components/schemas/ValueSourceKind" }
        name:
          type: string
          description: For `library`, the entry's key.
        version:
          type: integer
          minimum: 1
          description: For `library`, the entry's version.
        params:
          type: object
          additionalProperties: true
          description: As described above, for its kind.
        fields:
          type: array
          maxItems: 50
          items: { type: string }
          description: The inputs a message for no input shows on; on the form when none.
        message:
          type: string
          maxLength: 500
          description: What a refusal without its own message says.

    UiSection:
      type: object
      required: [key, title, fields]
      properties:
        key: { type: string }
        title: { type: string }
        description: { type: string }
        columns: { type: integer, minimum: 1, maximum: 4, default: 2 }
        fields:
          type: array
          description: Input names, in display order.
          items: { type: string }

    UiWidget:
      type: string
      enum:
        - text
        - textarea
        - number
        - slider
        - toggle
        - select
        - multiselect
        - segmented
        - radio_cards
        - checklist
        - search
        - tree
        - file
        - date
        - datetime
        - tags
        - key_value
        - datagrid
        - dual_list
        - object
        - secret
        - info
        - image
        - link
        - computed
        - vsphere_cluster
        - vsphere_datastore
        - vsphere_network
        - vsphere_template
        - vsphere_folder
        - vsphere_vm
        - ipam_subnet
        - ipam_address
        - dns_zone
        - awx_inventory
        - awx_credential
        - project
        - user
        - deployment

    UiField:
      type: object
      required: [widget, label]
      properties:
        widget: { $ref: "#/components/schemas/UiWidget" }
        label:
          type: string
          description: The field's label; a `link` field's link text.
        help:
          type: string
          description: Help under the field; an `info` field's text, an `image` field's caption.
        placeholder: { type: string }
        url:
          type: string
          maxLength: 2000
          description: >-
            An `image` field's picture or a `link` field's target: an
            `https://` or `http://` address, or a path on rvav's own site
            (`/...`); for an image, also `upload:<id>`, a picture uploaded
            with `POST /admin/catalog/images`. Other schemes, such as
            `javascript:`, are refused. Needed to publish. Image, link and
            info fields show and take no input.
          examples: ["https://wiki.corp.example/vm-sizes"]
        alt:
          type: string
          maxLength: 500
          description: >-
            An `image` field's text alternative, read out in its place to
            those who can't see it. Needed to publish.
        accept:
          type: array
          maxItems: 30
          items: { type: string, maxLength: 100 }
          description: >-
            A `file` field's types: extensions (`.pdf`), MIME types
            (`application/pdf`) or a family of them (`image/*`), among those
            rvav knows. A file's name must have one of them and its content
            must be what its extension says. Needed to publish.
          examples: [[".csv", "application/pdf", "image/*"]]
        max_size_mb:
          type: integer
          minimum: 1
          maximum: 25
          description: The largest file a `file` field takes, in MB (10 by default).
        options:
          type: array
          description: Static options. Ignored when `value_source` is set.
          items: { $ref: "#/components/schemas/Option" }
        value_source: { $ref: "#/components/schemas/ValueSource" }
        depends_on:
          type: array
          description: Inputs whose change re-resolves this field's value source and rules.
          items: { type: string }
        columns:
          type: array
          description: >-
            A table's (`datagrid`) columns, in order: each edits one property
            of the rows, whose type and checks are in the schema's `items`.
            An `object` field's sub-fields, in order: each edits one of the
            object's `properties`.
          items: { $ref: "#/components/schemas/UiColumn" }
        rules: { $ref: "#/components/schemas/UiRules" }
        secret:
          type: boolean
          description: >-
            Stored encrypted, never returned by the API, and kept out of the
            request's plan and workflow history (a `{"$secret": "<field>"}`
            marker stands for it there): given only to the AWX job at launch
            and to cloud-init user data. The `secret` widget makes a field
            secret too.
        expose_to_inventory:
          type: boolean
          description: Published as a host variable in the AWX dynamic inventory.
        approver_editable:
          type: boolean
          description: Approvers may change this input, within its schema, when they approve.

    UiColumn:
      type: object
      required: [key, label, widget]
      properties:
        key:
          type: string
          description: The property of each row, or of the object, it edits.
        label: { type: string }
        widget:
          type: string
          enum: [text, number, toggle, select]
        options:
          type: array
          description: A `select` column's choices.
          items: { $ref: "#/components/schemas/Option" }

    UiRules:
      type: object
      description: |
        CEL expressions over `inputs`, `project`, `user`, `environment` and
        `propgroup` (the constants of the property groups the item names).
        The server evaluates them on preview and submit and returns the
        results in `fields`; the UI shows those.

        A day-2 action's designed form (ADR-0050) also reads its target:
        `resource` (`id`, `type`, `name`, and for a VM `power_state`,
        `cpu_count`, `memory_gb`, `disk_gb`, `guest_os`, `os_family`, `fqdn`,
        `ip`, `moref`, `cluster`, `folder`, `tags` and `custom_properties`;
        for a deployment `os_family` and `vms`, each with `name`, `fqdn` and
        `ip`; for a custom resource, `type` `custom.<type key>`, its `key`
        and `properties`) and `deployment` (`id`, `name`, `description`,
        `owner_id`, `item`, the catalog item's slug). They are empty in
        request forms.
      properties:
        visible: { type: string, examples: ['inputs.environment != "prd"'] }
        required: { type: string }
        read_only: { type: string }
        value:
          type: string
          description: Computed value. The field becomes read-only.
        default:
          type: string
          description: |
            A default worked out from the other inputs: the field shows it
            and stays editable. It applies while the field has no value
            (its input is absent); once the requester changes the field, it
            keeps their value, whatever the inputs it reads become. On
            preview and submit, a request without the input gets the
            default, and `null` for the input means the requester emptied
            the field: it gets none. A read-only field takes its default.
            The rule doesn't see the field's own input; it sees the other
            default rules' results. Not with a `value` rule, an initial
            value, or a value source that gives the field its default.
          examples: ['inputs.app + "-" + environment']

    ValueSourceKind:
      type: string
      enum: [builtin, rest, cel, library]
      description: |
        `builtin`, `rest` and `cel` are defined where they are used;
        `library` names an entry of the form library (ADR-0043). A form
        library entry is `rest` or `cel`.

    ValueSource:
      type: object
      required: [kind]
      properties:
        kind: { $ref: "#/components/schemas/ValueSourceKind" }
        version:
          type: integer
          minimum: 1
          description: For `library`, the version of the entry `name` the field uses.
        name:
          type: string
          description: |
            For `library`: the key of a form library entry that is a
            source (ADR-0043); `params` gives its parameters.

            For `builtin`: `vsphere.clusters`, `vsphere.datastores`,
            `vsphere.networks`, `vsphere.templates`, `vsphere.folders`
            (the VM folders of the datacenters the project's placement
            uses in the environment, by path, each under its parent
            folder; checked on submit),
            `ipam.subnets`, `ipam.next_free_address`, `dns.zones`,
            `awx.inventories`, `awx.credentials`, `naming.preview`,
            `rvav.templates` and `rvav.sizes` (what is offered to the
            project and environment; ADR-0020), `nsx.segments`
            (`tier1` param), `nsx.tier1s`, `nsx.groups` (as `nsx:<ID>`)
            and `nsx.services` (ADR-0028; from the NSX Manager of the
            vCenter the `cluster` or `vcenter` param is in, else of every
            vCenter the project's placement uses in the environment;
            ADR-0062), and rvav's own records, which
            the `project`, `user`, `deployment` and `vsphere_vm` widgets
            always take their choices from: `rvav.projects` (those the
            requester may request in, by ID), `rvav.users` (people, by
            ID; `search` finds them by name or email, or one by ID),
            `rvav.deployments` (the project's, not deleted, by ID; the
            `item` param keeps one catalog item's, by slug) and
            `rvav.vms` (their VMs, by name; the `deployment` param keeps
            one deployment's). The server refuses, on submit, a value
            the requester couldn't have picked.
          examples: [vsphere.datastores]
        search:
          type: boolean
          description: |
            For `rest` and `cel`: the source finds options by the text the
            requester types in a `search` field, which its `url` or `body`
            reads as `${search}` and its expressions as `search`. Without
            it, rvav keeps the options whose value, label or detail
            contains the text. On submit, a `search` field's value must be
            one its source finds when searched for that value.
        params:
          type: object
          description: |
            Source parameters. String values may reference inputs, for example `${inputs.cluster}`.
            For `rest`: `url` (on a host REST value sources may call: Allowed hosts, or RVAV_REST_SOURCE_HOSTS), `method` (GET or POST), `body`,
            `secret` (a stored secret's name), `items` (JSONPath to the list), `value`, `label`,
            `meta` and `parent` (JSONPath in each item), `cache_seconds`. For `cel`: `options` (an
            expression giving a list of strings or of {value, label, meta, parent}) or `value`.
            For `library`: a CEL expression per parameter of the entry, over what form rules read and
            `search`, for example `{"environment": "inputs.environment"}`; the entry's templates read
            them as `${params.x}`, its expressions as `params.x`.

            On a field that takes one value rather than a choice (`text`,
            `textarea`, `number`, `slider`, `date`, `datetime`, `toggle`),
            a `rest`, `cel` or `library` source gives the field its default (see
            `UiRules.default`), as the input's type takes it: a text input
            takes a number as its digits. A `rest` source's is what `value`
            finds in the first item `items` finds (the answer's first item
            when it is a list, or the answer itself, without `items`); a
            `cel` source's is its `value`. On a `computed` field, it gives
            the field's value, which the server works out again on preview
            and submit. A source that fails gives no default. The field's
            `depends_on` names the inputs its source reads: those with a
            source are worked out first.
          additionalProperties: true

    Option:
      type: object
      required: [value, label]
      properties:
        value: { type: string }
        label: { type: string }
        meta:
          type: string
          description: Secondary text, for example `18.4 TB free`.
        description:
          type: string
          description: A longer explanation, shown under the option (checklists, radio cards).
        disabled: { type: boolean }
        disabled_reason: { type: string }
        parent:
          type: string
          description: |
            The value of the option this one sits under: a `tree` field
            shows the options as a hierarchy. An option whose parent is
            not among the options is at the top.

    FileRef:
      type: object
      description: |
        A file attached to a `file` field: the input's value, which AWX,
        a workflow and the events get in place of the content. Download
        the content with `GET /files/{id}`.
      required: [id, name, size, content_type, sha256]
      properties:
        id: { type: string, examples: [fil_7f3k2a9q] }
        name: { type: string, examples: [firewall-rules.csv] }
        size: { type: integer, format: int64, description: In bytes. }
        content_type: { type: string, examples: [text/csv] }
        sha256: { type: string, description: "The content's SHA-256, in hex." }

    FormImage:
      type: object
      description: An image uploaded for image fields.
      required: [id, name, size, content_type, url]
      properties:
        id: { type: string, examples: [img_4k8s1d2m] }
        name: { type: string, examples: [network-zones.png] }
        size: { type: integer, format: int64, description: In bytes. }
        content_type: { type: string, examples: [image/png] }
        url: { type: string, description: "What an image field's `url` takes to show it.", examples: ["upload:img_4k8s1d2m"] }

    FieldValuesQuery:
      type: object
      required: [version_id, project_id, field, inputs]
      properties:
        version_id: { type: string }
        project_id: { type: string }
        environment:
          $ref: "#/components/schemas/EnvironmentKey"
          description: |
            Target environment of the draft. Sources such as `vsphere.clusters`,
            `vsphere.networks` and `naming.preview` depend on it. A field whose
            `depends_on` lists `$environment` must be re-resolved when it changes.
        field: { type: string, description: Input name. }
        inputs:
          type: object
          description: |
            Current form values. An input left out takes the value the form
            starts with, as on a request (`RequestDraft.inputs`); one sent
            as `null` stays empty.
          additionalProperties: true
        search:
          type: string
          description: |
            Text typed in a `search` or `user` field: a source with
            `search` and `rvav.users` find by it; of other sources' options,
            those whose value, label or detail contains it.
        as_user_id:
          type: string
          description: |
            With `catalog.manage` only: resolve as this user would (the form
            designer's "preview as"), for any version of any item.

    FieldValues:
      type: object
      required: [field]
      properties:
        field: { type: string }
        options:
          type: array
          items: { $ref: "#/components/schemas/Option" }
        value:
          description: |
            For computed fields and sources such as `naming.preview` or
            `ipam.next_free_address`, and a `rest` or `cel` source's single
            value: a `computed` field's value, or another field's default.
        default:
          type: string
          description: Suggested option value when the current value is empty or no longer valid.
        cache_seconds:
          type: integer
          description: How long the client may reuse this answer for the same inputs.

    # ── Requests ──────────────────────────────────────────────────────────
    RequestDraft:
      type: object
      required: [catalog_item_id, version_id, project_id, environment, inputs]
      properties:
        catalog_item_id: { type: string }
        version_id:
          type: string
          description: |
            One of the item's requestable versions, whose form the request
            fills. Another is refused (422, `stale_version`).
        project_id: { type: string }
        environment: { $ref: "#/components/schemas/EnvironmentKey" }
        inputs:
          type: object
          additionalProperties: true
          description: |
            The form's values by input name: send the ones you choose. An
            input left out takes the value
            the form starts with (`RequestForm.initial_values`: the
            version's initial value, else its schema's `default`), else its
            field's default, from a `default` rule or a value source, as the
            web app shows the form (ADR-0055). `null` for an input with a
            default or a start value means it was emptied: it gets none.
            Submit and `previewRequest` fill the inputs in alike.
        count:
          type: integer
          minimum: 1
          maximum: 20
          default: 1
          description: Number of identical deployments to create.
        on_behalf_of:
          type: string
          description: User ID of the future owner. Needs `request.on_behalf` in the project (project admins).
        justification:
          type: string
          maxLength: 2000
          description: Shown to approvers.
        deployment_name:
          type: string
          maxLength: 80
          description: |
            What to call the deployment, instead of the name rvav gives (its
            VM's, or its item's and the request number). One line, unique
            among the project's deployments not deleted, whatever the case,
            and not a name the VM naming policy gives (its prefix and a
            number). A request that makes several deployments names them
            `<name> 1`, `<name> 2` and so on. Refused (422, `no_deployment`)
            for an item that makes none.
        deployment_description:
          type: string
          maxLength: 2000
          description: What the deployment is for, shown with it. Approvers read `justification`.
        lease_days:
          type: [integer, "null"]
          minimum: 1
          description: Null for the policy default, or no lease where the policy allows it.
        scheduled_at:
          type: string
          format: date-time
          description: Start later instead of now. Approval, if needed, still happens first.
        accept_warnings:
          type: boolean
          description: |
            Go on despite every warning of soft policies, whatever they are
            when the server checks (ADR-0045): for API clients and scripts.
            Without it or `accepted_warnings`, a request they warn about is
            refused (422) with the field `/accept_warnings` and the code
            `warning`, one error per warning, each with the `warning`. The
            warnings accepted are kept on the request and audited
            (`request.warnings.accept`).
        accepted_warnings:
          type: array
          maxItems: 100
          items: { type: string, maxLength: 64 }
          description: |
            The `id` of each warning the requester saw and goes on despite.
            When given, it decides, not `accept_warnings`: if the server
            finds a warning not in it, such as a policy added since the
            preview, the request is refused (422) at `/accept_warnings`,
            with every warning found. Send it empty to be told of any.

    SavedDraftWrite:
      type: object
      required: [draft]
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 120, description: "Shown in the list; the item's name when empty." }
        draft: { $ref: "#/components/schemas/RequestDraft" }
    SavedDraft:
      type: object
      required: [id, name, draft, catalog_item, project, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        draft: { $ref: "#/components/schemas/RequestDraft" }
        catalog_item:
          type: object
          required: [id, slug, name]
          properties:
            id: { type: string }
            slug: { type: string }
            name: { type: string }
        project: { $ref: "#/components/schemas/ProjectRef" }
        on_behalf_of:
          $ref: "#/components/schemas/UserRef"
          description: Who the draft's `on_behalf_of` is.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SavedDraftList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SavedDraft" }

    RequestPreview:
      type: object
      required: [valid, errors, quota, approval]
      properties:
        valid: { type: boolean }
        fields: { $ref: "#/components/schemas/FieldStates" }
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
        names:
          type: array
          description: VM names the naming policy would give, one per VM.
          items: { type: string }
        deployment_names:
          type: array
          description: The names the request's deployments take from `deployment_name`, when it gives one.
          items: { type: string }
        addresses:
          type: array
          description: "Next free IP addresses of its first component's first adapter, as a hint only: `components[0].nics[0].addresses`. Reserved as the VMs are built."
          items: { type: string }
        placement:
          type: object
          properties:
            cluster: { type: string }
            datastore: { type: string }
            folder: { type: string }
            network: { type: string }
            subnet: { type: string }
        quota:
          type: array
          items: { $ref: "#/components/schemas/QuotaImpact" }
        limits:
          type: array
          description: |
            The deployment limits that apply (ADR-0047). Absent when none
            does, or the request makes no deployment.
          items: { $ref: "#/components/schemas/DeploymentLimitLine" }
        approval: { $ref: "#/components/schemas/ApprovalPreview" }
        warnings:
          type: array
          description: What soft policies warn about; submitting needs their `id` in `accepted_warnings`, or `accept_warnings`.
          items: { $ref: "#/components/schemas/PolicyWarning" }
        lease: { $ref: "#/components/schemas/PreviewLease" }
        components:
          type: array
          description: |
            What each component of a VM item builds (ADR-0024), in its
            order; a single-VM item has one, `vm`. A composite has one
            per component of each of its VM steps, in the steps' order.
            Absent for AWX and workflow items, and composites without
            VM steps.
          items: { $ref: "#/components/schemas/PreviewComponent" }

    PreviewComponent:
      type: object
      required: [key, title, count, names, vcpu, memory_gb, storage_gb, disks, nics, anti_affinity]
      properties:
        key:
          type: string
          description: "The component's key; in a composite, `<step key>/<component key>` (`vm/vm` for a single-VM step `vm`)."
          examples: [web]
        title:
          type: string
          description: "Its title; in a composite, its step's (its item's name when the step has none), followed by ` · <component title>` for a multi-VM step's."
          examples: [Web servers]
        count: { type: integer, description: How many VMs it builds. }
        names:
          type: array
          description: The names its VMs would get.
          items: { type: string }
        depends_on:
          type: array
          description: "The components it is built after (ADR-0024), by their `key`: those its `depends_on` names and those its tags or cloud-init read."
          items: { type: string }
        vcpu: { type: integer, description: Per VM. }
        memory_gb: { type: integer, description: Per VM. }
        storage_gb: { type: integer, description: "Per VM, every disk." }
        nsx_groups:
          type: array
          description: "The NSX security groups its VMs join (ADR-0028), as labels to show, not keys: a group made for the deployment by its title (else its key) followed by \" (new)\"; an existing one by its NSX display name, else its ID."
          items: { type: string }
        os_family: { type: string, enum: [linux, windows] }
        template: { type: string }
        linked_clone: { type: boolean, description: "Its VMs are linked clones of the template's current snapshot (ADR-0037)." }
        placement: { $ref: "#/components/schemas/ComponentPlacement" }
        disks:
          type: array
          description: Every disk, the template's first.
          items:
            type: object
            required: [size_gb]
            properties:
              key: { type: string, description: "An added disk's key in the blueprint; none for the template's." }
              size_gb: { type: integer, description: "0 for the template's disk when the blueprint doesn't size it: it keeps the template's size." }
              datastore: { type: string }
              storage_policy: { type: string }
        nics:
          type: array
          description: Every network adapter, the template's first.
          items:
            type: object
            required: [key, network, ipam]
            properties:
              key: { type: string }
              network: { type: string }
              ipam:
                type: string
                enum: [efficientip, dhcp, ip_range]
                description: "Where its address comes from: EfficientIP, DHCP, or rvav's IP ranges of its network (ADR-0063)."
              subnet: { type: string }
              address: { type: string, description: "The next free address, as a hint only: the first of `addresses`." }
              addresses:
                type: array
                description: "The next free addresses, as a hint only. From IP ranges, one for each VM the component adds, none hinted twice in the request; rvav gives them as the VMs are built, so which VM gets which isn't known yet. From EfficientIP, its next free address alone."
                items: { type: string }
        tags:
          type: array
          items: { type: string }
        anti_affinity: { type: boolean, description: Its VMs are kept on separate hosts. }

    ComponentPlacement:
      type: object
      properties:
        vcenter: { type: string }
        cluster: { type: string }
        resource_pool: { type: string, description: "Its path below the cluster's root pool (ADR-0036); absent for the root pool." }
        hosts:
          type: array
          description: The hosts its VMs start on, when the rule, a binding or host tags narrow them (ADR-0036); absent for any of the cluster's.
          items: { type: string }
        datastore: { type: string }
        datastore_cluster:
          type: string
          description: "The datastore cluster `datastore` is in, when the rule or the blueprint names one (ADR-0036). With Storage DRS on, the VMs go to the datastore it recommends."
        folder: { type: string }
        storage_policy: { type: string }
        strategy:
          $ref: "#/components/schemas/PlacementStrategy"
          description: The strategy that chose the cluster; absent when it was bound.
        chosen:
          type: boolean
          description: rvav chose the cluster, a datastore or the network (they weren't given).
        constraints:
          type: array
          description: What its constraint tags chose or ruled out (ADR-0035), in the order they applied.
          items: { $ref: "#/components/schemas/PlacementConstraint" }
        image: { $ref: "#/components/schemas/PlacementImage" }

    PlacementImage:
      type: object
      description: "The catalogue template the VMs are cloned from, when the form chose one (ADR-0037): the component's `template` is its source in the placement's `vcenter`."
      required: [key, label, excluded]
      properties:
        key: { type: string }
        label: { type: string }
        excluded:
          type: array
          description: The vCenters of the clusters allowed here that it has no template in, or whose template vCenter doesn't have now. Their clusters were ruled out.
          items: { type: string }

    PlacementConstraint:
      type: object
      required: [kind, tag, negated, soft, met, excluded]
      properties:
        kind:
          type: string
          enum: [compute, storage, network]
          description: What it chooses, a cluster, a datastore or a network.
        tag: { type: string, description: "category/tag", examples: [rvav-tier/gold] }
        negated: { type: boolean, description: "It rules out what carries the tag (`!rvav-zone/dmz`)." }
        soft: { type: boolean, description: "It is preferred, and let go when nothing allowed meets it." }
        disk:
          type: integer
          description: Set for an added disk's own storage constraint, as its place in `disks` (the template's disk is 0).
        object: { type: string, description: "The cluster, datastore or network the VMs (or the disk) go to. Absent when none could be chosen." }
        met: { type: boolean, description: "`object` meets it. A soft constraint not met was let go." }
        excluded:
          type: array
          description: The allowed clusters, datastores or networks it ruled out (or passed over, for a soft one).
          items: { type: string }

    QuotaLevel:
      type: string
      description: |
        Whose use a quota counts (ADR-0047): the project's (`project`), the
        project's in one environment (`environment`), what the deployment's
        owner holds in the project (`project_user`), all of rvav's
        (`global`), or what the owner holds across rvav (`global_user`).
      enum: [project, environment, project_user, global, global_user]
      x-enum-varnames: [QuotaLevelProject, QuotaLevelEnvironment, QuotaLevelProjectUser, QuotaLevelGlobal, QuotaLevelGlobalUser]
    QuotaImpact:
      type: object
      required: [resource, level, used, adding, exceeds]
      properties:
        resource: { $ref: "#/components/schemas/QuotaResource" }
        level: { $ref: "#/components/schemas/QuotaLevel" }
        environment:
          $ref: "#/components/schemas/EnvironmentKey"
          description: The environment of an `environment` level; absent for the other levels.
        limit: { type: [integer, "null"] }
        used: { type: integer, description: Used plus reserved. }
        adding: { type: integer }
        exceeds: { type: boolean }
        enforcement: { type: string, enum: [hard, soft] }

    ApprovalPreview:
      type: object
      required: [required, policies]
      properties:
        required: { type: boolean }
        policies:
          type: array
          description: Matching approval policies, in the order their levels run.
          items:
            type: object
            required: [policy_id, name, reason, levels]
            properties:
              policy_id: { type: string }
              name: { type: string }
              reason:
                type: string
                description: Plain-language reason, for example `Production VM above 32 GB RAM`.
              levels:
                type: array
                items:
                  type: object
                  required: [approvers]
                  properties:
                    name: { type: string, examples: [Infrastructure leads] }
                    approvers:
                      type: array
                      items: { $ref: "#/components/schemas/UserRef" }
                    mode: { type: string, enum: [any, all], default: any }
        typical_wait_seconds:
          type: [integer, "null"]
          description: Median approval time for these policies over the last 30 days.

    RequestStatus:
      type: string
      enum: [pending_approval, scheduled, queued, running, succeeded, failed, rejected, cancelling, cancelled]

    RequestKind:
      type: string
      description: |
        `provision`: from the catalog. `day2`: an action on a deployment
        (ADR-0013). `update`: a deployment updated to its item's version and
        new inputs (ADR-0042).
      enum: [provision, day2, update]

    Request:
      type: object
      required: [id, number, kind, title, status, catalog_item, version, project, environment, requester, submitted_at, progress]
      properties:
        id: { type: string }
        number: { type: string, examples: [REQ-10491] }
        kind: { $ref: "#/components/schemas/RequestKind" }
        action:
          type: object
          description: The day-2 action this request runs; `update` for an update.
          required: [key, name]
          properties:
            key: { type: string, examples: [snapshot_create] }
            name: { type: string, examples: [Take a snapshot] }
        deployment_id:
          type: string
          description: The deployment a day-2 request or an update acts on.
        servicenow:
          description: Made from ServiceNow, for this requested item.
          $ref: "#/components/schemas/ServiceNowRef"
        resource:
          type: object
          description: The resource a day-2 request acts on, when it acts on one.
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        title:
          type: string
          description: For example `RHEL 9 server · web-dev-app007`.
        status: { $ref: "#/components/schemas/RequestStatus" }
        catalog_item:
          type: object
          required: [id, slug, name, type]
          properties:
            id: { type: string }
            slug: { type: string }
            name: { type: string }
            type: { $ref: "#/components/schemas/CatalogItemType" }
        version: { $ref: "#/components/schemas/CatalogItemVersionRef" }
        project: { $ref: "#/components/schemas/ProjectRef" }
        environment: { $ref: "#/components/schemas/EnvironmentKey" }
        requester: { $ref: "#/components/schemas/UserRef" }
        on_behalf_of: { $ref: "#/components/schemas/UserRef" }
        inputs:
          type: object
          description: Submitted inputs. Secret fields are replaced by `"••••"`.
          additionalProperties: true
        count: { type: integer }
        justification: { type: string }
        warnings:
          type: array
          description: The soft policies' warnings the requester accepted to go on.
          items: { $ref: "#/components/schemas/PolicyWarning" }
        submitted_at: { type: string, format: date-time }
        scheduled_at: { type: [string, "null"], format: date-time }
        schedule:
          type: object
          description: The recurring schedule that started it (ADR-0057), deleted since or not.
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        deployment_ids:
          type: array
          items: { type: string }
        current_step:
          oneOf:
            - type: object
              required: [id, title]
              properties:
                id: { type: string }
                title: { type: string }
            - type: "null"
        progress:
          type: object
          required: [done, total]
          properties:
            done: { type: integer }
            total: { type: integer }
        error:
          oneOf:
            - type: object
              required: [step_id, message]
              properties:
                step_id: { type: string }
                message: { type: string }
            - type: "null"

    ScheduleWrite:
      type: object
      required: [name, catalog_item_id, version_id, project_id, environment, inputs]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        catalog_item_id: { type: string }
        version_id:
          type: string
          description: |
            The version each run requests. Once it is no longer requestable,
            runs are refused (`stale_version`): delete the schedule and make
            another.
        project_id: { type: string }
        environment: { $ref: "#/components/schemas/EnvironmentKey" }
        inputs:
          type: object
          additionalProperties: true
          description: |
            The form's values, as `RequestDraft.inputs`: those left out take
            their default at each run. No value for a secret input.
        justification: { type: string, maxLength: 2000 }
        accept_warnings:
          type: boolean
          description: |
            Each run goes on despite the soft policies' warnings, as
            `RequestDraft.accept_warnings`. Without it, a run they warn
            about is refused.
        cron:
          type: string
          description: |
            When it runs, as five cron fields (minute, hour, day of month,
            month, day of week) in `timezone`, such as `0 2 * * 1-5` for
            2:00 on weekdays. Give this or `every_minutes`.
          examples: ["0 2 * * 1-5"]
        every_minutes:
          type: integer
          minimum: 5
          maximum: 44640
          description: Every so many minutes, from 5 to 31 days. Give this or `cron`.
        timezone:
          type: string
          default: UTC
          description: The IANA time zone `cron` is read in, such as `Europe/Zurich`.

    SchedulePause:
      type: object
      properties:
        note: { type: string, maxLength: 500, description: "Why it is paused, shown with it." }

    ScheduleRunOutcome:
      type: string
      description: |
        `started`: its request was submitted. `refused`: a policy, the quota,
        the owner's access or the form refused it, as they would a request.
        `skipped`: the run before hadn't finished. `failed`: rvav couldn't
        submit it.
      enum: [started, refused, skipped, failed]

    ScheduleRun:
      type: object
      required: [at, outcome]
      properties:
        at: { type: string, format: date-time }
        outcome: { $ref: "#/components/schemas/ScheduleRunOutcome" }
        reason: { type: string, description: "Why it was refused, skipped or failed." }
        request:
          type: object
          required: [id, number, status]
          properties:
            id: { type: string }
            number: { type: string }
            status: { $ref: "#/components/schemas/RequestStatus" }

    Schedule:
      type: object
      required: [id, name, catalog_item, version, project, environment, owner, inputs, timezone, paused, created_at, next_runs]
      properties:
        id: { type: string }
        name: { type: string }
        catalog_item:
          type: object
          required: [id, slug, name, type]
          properties:
            id: { type: string }
            slug: { type: string }
            name: { type: string }
            type: { $ref: "#/components/schemas/CatalogItemType" }
        version: { $ref: "#/components/schemas/CatalogItemVersionRef" }
        project: { $ref: "#/components/schemas/ProjectRef" }
        environment: { $ref: "#/components/schemas/EnvironmentKey" }
        owner: { $ref: "#/components/schemas/UserRef" }
        owner_seen_at:
          type: string
          format: date-time
          description: |
            When its owner last signed in or used an API token, if ever. A run
            has the groups the identity provider gave them at their last
            sign-in: once both this and the schedule's `created_at` are older
            than `RVAV_SCHEDULE_OWNER_IDLE_DAYS` (90 days unless set), its runs
            are skipped until they sign in again.
        inputs:
          type: object
          additionalProperties: true
        justification: { type: string }
        accept_warnings: { type: boolean }
        cron: { type: string }
        every_minutes: { type: integer }
        timezone: { type: string }
        paused: { type: boolean }
        paused_note: { type: string }
        created_at: { type: string, format: date-time }
        next_runs:
          type: array
          description: Its next times, from Temporal; none while paused, or when Temporal can't be reached.
          items: { type: string, format: date-time }
        last_run: { $ref: "#/components/schemas/ScheduleRun" }
        runs:
          type: array
          description: Its last 20 runs, the newest first, in `getSchedule` only.
          items: { $ref: "#/components/schemas/ScheduleRun" }

    ScheduleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Schedule" }

    RequestTopology:
      type: object
      properties:
        topology:
          type: object
          additionalProperties: true
          description: |
            The requested version's topology, as `RequestForm.topology`.
            Absent for AWX and workflow items, and for day-2 requests.

    RequestPage:
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Request" }

    ApprovalStatus:
      type: string
      description: "`waiting`: an earlier level is not decided yet. `pending`: waiting for a decision."
      enum: [waiting, pending, approved, rejected, cancelled]

    ApprovalSummary:
      type: object
      required: [id, request, project, environment, requester, submitted_at, level, reasons, status, overdue, can_decide]
      properties:
        id: { type: string }
        request:
          type: object
          required: [id, number, title, status]
          properties:
            id: { type: string }
            number: { type: string }
            title: { type: string }
            status: { $ref: "#/components/schemas/RequestStatus" }
        project: { $ref: "#/components/schemas/ProjectRef" }
        environment: { $ref: "#/components/schemas/EnvironmentKey" }
        requester: { $ref: "#/components/schemas/UserRef" }
        submitted_at: { type: string, format: date-time }
        level:
          type: object
          required: [index, count, name]
          properties:
            index: { type: integer, minimum: 1, description: "1 for the first level." }
            count: { type: integer, minimum: 1 }
            name: { type: string, examples: [Infrastructure leads] }
        reasons:
          type: array
          description: Plain-language reasons from the policies, for example `Production VM above 32 GB RAM`.
          items: { type: string }
        status: { $ref: "#/components/schemas/ApprovalStatus" }
        step_key:
          type: string
          description: |
            The composite step that waits for a person (ADR-0033), when this is
            one rather than an approval of the request: it is answered on the
            request's page.
        due_at:
          type: [string, "null"]
          format: date-time
          description: When the level times out. Null when it has no timeout or is decided.
        overdue: { type: boolean }
        escalated: { type: boolean }
        can_decide:
          type: boolean
          description: Whether the caller may approve or reject this level now.

    Approval:
      allOf:
        - $ref: "#/components/schemas/ApprovalSummary"
        - type: object
          required: [rules, facts, editable_fields, approvers, mode, votes, delegates]
          properties:
            rules:
              type: array
              description: The CEL conditions that matched, for approvers who want the detail.
              items: { type: string }
            justification: { type: string, description: "The requester's reason." }
            facts:
              type: array
              description: What will be created, in a few lines (size, placement, network, quota after).
              items:
                type: object
                required: [label, value]
                properties:
                  label: { type: string }
                  value: { type: string }
            editable_fields:
              type: array
              description: Inputs the caller may change when approving. Empty unless `can_decide`.
              items: { $ref: "#/components/schemas/ApprovalEditableField" }
            group:
              type: [string, "null"]
              description: OIDC group whose members may decide.
            approvers:
              type: array
              description: |
                Users who may decide: named, holding one of its roles in the
                project when it opened, the requester's manager, members of its
                groups seen so far, and delegates.
              items: { $ref: "#/components/schemas/UserRef" }
            roles:
              type: array
              description: The project roles it asks (ADR-0041); absent when it asks none.
              items: { $ref: "#/components/schemas/RoleRef" }
            manager:
              type: boolean
              description: It asks the requester's manager (ADR-0041).
            mode:
              type: string
              enum: [any, all]
              description: "`any`: one approval decides. `all`: every named approver must approve."
            votes:
              type: array
              items: { $ref: "#/components/schemas/ApprovalVote" }
            delegates:
              type: array
              items: { $ref: "#/components/schemas/UserRef" }
            on_timeout:
              type: [string, "null"]
              enum: [approve, reject, escalate, null]
            escalate_to:
              type: [array, "null"]
              items: { $ref: "#/components/schemas/UserRef" }
            decided_at: { type: [string, "null"], format: date-time }
            outcome:
              type: [string, "null"]
              description: "How the level ended, for example `Approved by Marc Keller`, or `Approved automatically: no answer within 48 h`."
            question:
              $ref: "#/components/schemas/ApprovalQuestion"

    ApprovalQuestion:
      type: object
      required: [form]
      description: |
        What a composite step that waits for a person asks (ADR-0033). Given
        to those it names and to those who see everything; absent for others,
        who only see that it waits for a person.
      properties:
        message: { type: string, description: "The step's fixed text." }
        form:
          type: array
          description: Its questions; empty, it asks to approve or reject.
          items: { $ref: "#/components/schemas/ApprovalQuestionField" }
        answer:
          type: [object, "null"]
          additionalProperties: true
          description: The answer it got. Null until then.

    ApprovalQuestionField:
      type: object
      required: [key, label, type]
      properties:
        key: { type: string, examples: [reason] }
        label: { type: string, examples: ["Why this size?"] }
        type: { type: string, enum: [string, number, boolean, choice] }
        required: { type: boolean }
        options:
          type: array
          description: What a `choice` may be.
          items: { type: string }
        default:
          description: Its value when left blank, or when the wait timed out and went on.

    ApprovalEditableField:
      type: object
      required: [field, label, value]
      properties:
        field: { type: string, examples: [size] }
        label: { type: string }
        value: { description: The current value. }
        options:
          type: array
          description: Allowed values, for enumerated fields.
          items: { $ref: "#/components/schemas/Option" }
        minimum: { type: number }
        maximum: { type: number }

    ApprovalVote:
      type: object
      required: [user, decision, decided_at, changes]
      properties:
        user: { $ref: "#/components/schemas/UserRef" }
        decision: { type: string, enum: [approve, reject] }
        comment: { type: string }
        changes:
          type: array
          description: Inputs the approver changed.
          items:
            type: object
            required: [field, label, from, to]
            properties:
              field: { type: string }
              label: { type: string }
              from: { description: Value before. }
              to: { description: Value after. }
        decided_at: { type: string, format: date-time }

    ApprovalDecision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, reject] }
        comment:
          type: string
          maxLength: 2000
          description: Sent to the requester. Required to reject.
        inputs:
          type: object
          additionalProperties: true
          description: New values for `approver_editable` fields only.
        answer:
          type: object
          additionalProperties: true
          description: |
            A composite step's form, answered (ADR-0033), with `decision`
            `approve`: checked against the step's form. Refused anywhere else.

    ApprovalDelegation:
      type: object
      required: [user_id]
      properties:
        user_id: { type: string }
        comment: { type: string, maxLength: 2000 }

    ApprovalPage:
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items, total]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/ApprovalSummary" }
            total:
              type: integer
              description: Number of approvals matching the filters, on all pages (the sidebar badge).

    Day2Action:
      type: object
      required: [key, name, group, enabled, destructive, approval]
      properties:
        key: { type: string, examples: [power_off, snapshot_create, delete] }
        name: { type: string, examples: [Power off] }
        group:
          type: string
          enum: [power, configuration, snapshots, automation, access, lifecycle]
          description: "`automation` holds the actions backed by AWX templates (ADR-0018)."
        resource_id:
          type: [string, "null"]
          description: The resource it acts on; null for actions on the whole deployment.
        resource_name: { type: string }
        enabled: { type: boolean }
        disabled_reason:
          type: string
          description: Why it can't run now, for example `The VM is already powered off.`
        destructive: { type: boolean }
        approval:
          type: object
          required: [required, reasons]
          properties:
            required: { type: boolean }
            reasons:
              type: array
              items: { type: string }
        confirm:
          type: object
          required: [message]
          properties:
            message: { type: string }
            type_to_confirm:
              type: string
              description: Text the user must type to confirm, for example the VM name.
        form: { $ref: "#/components/schemas/ActionForm" }
        warnings:
          type: array
          description: |
            What soft policies warn about before its inputs are known. It
            runs once the requester accepts them (`accepted_warnings`); its
            inputs may add some, such as a lease longer than allowed.
          items: { $ref: "#/components/schemas/PolicyWarning" }

    ActionForm:
      type: object
      required: [schema, ui_schema, initial_values]
      properties:
        schema:
          type: object
          description: JSON Schema of `inputs`.
          additionalProperties: true
        ui_schema: { $ref: "#/components/schemas/UiSchema" }
        initial_values:
          type: object
          description: |
            What the form starts with on its target: its initial values and,
            for an input without one, the `default` its schema gives. A run
            that leaves an input out gets this value (ADR-0055).
          additionalProperties: true
        designed:
          type: boolean
          description: |
            An administrator designed it (ADR-0050): its rules and value
            sources work as a request form's, so its field states come from
            `previewDeploymentAction` and its sources from
            `resolveDeploymentActionValues`. Absent for the other forms.

    Day2FormQuery:
      type: object
      required: [action, inputs]
      properties:
        action: { type: string }
        resource_id: { type: string, description: "The VM or the custom resource it runs on; absent for an action on the whole deployment." }
        inputs:
          type: object
          description: |
            The form's values so far. Those left out, and those sent as
            `null`, are worked out as on a run (`Day2Draft.inputs`).
          additionalProperties: true

    Day2FieldValuesQuery:
      type: object
      required: [action, field, inputs]
      properties:
        action: { type: string }
        resource_id: { type: string, description: "The VM or the custom resource it runs on; absent for an action on the whole deployment." }
        field: { type: string, description: Input name. }
        inputs:
          type: object
          description: |
            Current form values. An input left out takes the value the form
            starts with (`ActionForm.initial_values`); one sent as `null`
            stays empty.
          additionalProperties: true
        search: { type: string, description: "Text typed in a `search` or `user` field, as in `resolveFieldValues`." }

    Day2FormPreview:
      type: object
      required: [form, fields, errors]
      properties:
        form: { $ref: "#/components/schemas/ActionForm" }
        fields: { $ref: "#/components/schemas/FieldStates" }
        errors:
          type: array
          description: What a run with these inputs would be refused for, on the inputs (`/inputs/<name>`).
          items: { $ref: "#/components/schemas/FieldError" }

    Day2FormDefinition:
      type: object
      required: [form_schema, ui_schema, initial_values]
      properties:
        form_schema:
          type: object
          description: JSON Schema of the inputs, as a catalog item version's `form_schema`.
          additionalProperties: true
        ui_schema: { $ref: "#/components/schemas/UiSchema" }
        initial_values:
          type: object
          additionalProperties: true

    Day2FormDesign:
      type: object
      required: [action, name, kind, types, definition, revision, active, warnings]
      properties:
        action: { type: string, examples: [awx.install-monitoring-agent] }
        name: { type: string, examples: [Install monitoring agent] }
        kind:
          type: string
          enum: [awx, workflow]
          x-enum-varnames: [Day2FormAwx, Day2FormWorkflow]
          description: What runs it, an AWX template or a custom workflow.
        types:
          type: array
          description: What it runs on.
          items: { type: string, enum: [vsphere.vm, deployment] }
        definition: { $ref: "#/components/schemas/Day2FormDefinition" }
        revision:
          type: integer
          description: |
            Counts the saves; 0 before the first, when `definition` is the
            survey's or input schema's form, to start from.
        active:
          type: boolean
          description: The action asks for this form. Otherwise, it asks for its survey's or schema's.
        warnings:
          type: array
          description: |
            What the template's survey or the workflow's input schema asks
            for that this form doesn't give, or gives as another type: AWX
            or the workflow may refuse such a run.
          items: { type: string }
        updated_at: { type: string, format: date-time }
        updated_by: { $ref: "#/components/schemas/UserRef" }

    Day2FormWrite:
      type: object
      required: [definition]
      additionalProperties: false
      properties:
        definition: { $ref: "#/components/schemas/Day2FormDefinition" }
        base_revision:
          type: integer
          minimum: 0
          description: The revision the change was made on (0 for the first save); another save since is refused (409).
        active: { type: boolean, description: "Ask for this form from the next run. Unchanged when absent; a new form starts inactive." }

    Day2FormSummary:
      type: object
      required: [action, active, revision, updated_at]
      properties:
        action: { type: string }
        active: { type: boolean }
        revision: { type: integer }
        updated_at: { type: string, format: date-time }

    Day2FormList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Day2FormSummary" }

    Day2FormDesignerQuery:
      type: object
      required: [deployment_id, inputs]
      properties:
        deployment_id: { type: string }
        resource_id: { type: string, description: "The VM to preview on; absent for the whole deployment." }
        inputs:
          type: object
          additionalProperties: true

    Day2FormDesignerValuesQuery:
      type: object
      required: [deployment_id, field, inputs]
      properties:
        deployment_id: { type: string }
        resource_id: { type: string }
        field: { type: string }
        inputs:
          type: object
          additionalProperties: true
        search: { type: string }

    Day2Draft:
      type: object
      required: [action, inputs]
      properties:
        action: { type: string }
        resource_id: { type: string }
        inputs:
          type: object
          additionalProperties: true
          description: |
            The values of the action's form (`Day2Action.form`) by input
            name: send the ones you choose. An input left out takes the
            value the form starts with on the target
            (`ActionForm.initial_values`) and, in a designed form, the
            default its rules work out there, as `previewDeploymentAction`
            shows (ADR-0055). `null` for an input with a default or a start
            value means it was emptied: it gets none. An action without a
            form takes no inputs.
        justification: { type: string, maxLength: 2000 }
        accept_warnings:
          type: boolean
          description: |
            Go on despite every warning of soft policies, whatever they are
            when the server checks (ADR-0045): for API clients and scripts.
            Without it or `accepted_warnings`, a request they warn about is
            refused (422) with the field `/accept_warnings` and the code
            `warning`, one error per warning, each with the `warning`. The
            warnings accepted are kept on the request and audited
            (`request.warnings.accept`).
        accepted_warnings:
          type: array
          maxItems: 100
          items: { type: string, maxLength: 64 }
          description: |
            The `id` of each warning the requester saw and goes on despite.
            When given, it decides, not `accept_warnings`: if the server
            finds a warning not in it, such as a policy added since the
            preview, the request is refused (422) at `/accept_warnings`,
            with every warning found. Send it empty to be told of any.

    UpdateDraft:
      type: object
      required: [version_id, inputs]
      properties:
        version_id:
          type: string
          description: |
            The version to update to: one of the item's requestable versions
            (the newest by default), whose form `getRequestForm` gives. It
            may be the deployment's own, while it is requestable. Another is
            refused (422, `stale_version`).
        inputs:
          type: object
          additionalProperties: true
          description: |
            Every input: unlike a new request's, an input left out doesn't
            take the form's initial value (ADR-0055). The deployment's are in
            `getDeployment`. Secret fields are given again.
        justification: { type: string, maxLength: 2000 }
        accept_warnings:
          type: boolean
          description: |
            Go on despite every warning of soft policies, whatever they are
            when the server checks (ADR-0045): for API clients and scripts.
            Without it or `accepted_warnings`, a request they warn about is
            refused (422) with the field `/accept_warnings` and the code
            `warning`, one error per warning, each with the `warning`. The
            warnings accepted are kept on the request and audited
            (`request.warnings.accept`).
        accepted_warnings:
          type: array
          maxItems: 100
          items: { type: string, maxLength: 64 }
          description: |
            The `id` of each warning the requester saw and goes on despite.
            When given, it decides, not `accept_warnings`: if the server
            finds a warning not in it, such as a policy added since the
            preview, the request is refused (422) at `/accept_warnings`,
            with every warning found. Send it empty to be told of any.

    UpdatePreview:
      type: object
      required: [from_version, to_version, allowed, unchanged, changes, refused, errors, quota, approval]
      properties:
        from_version: { $ref: "#/components/schemas/CatalogItemVersionRef" }
        to_version: { $ref: "#/components/schemas/CatalogItemVersionRef" }
        allowed:
          type: boolean
          description: The caller may update the deployment now (its state and the day-2 policies).
        reason:
          type: string
          description: Why they can't, when `allowed` is false.
        unchanged:
          type: boolean
          description: >-
            The version and the inputs, as the rules leave them, are the deployment's, and it isn't failed.
            Submitting it is refused with `no_change`. A failed deployment's update with its own inputs builds
            what is missing and runs its jobs again.
        changes:
          type: array
          description: What the update does, in the order it runs.
          items: { $ref: "#/components/schemas/UpdateChange" }
        refused:
          type: array
          description: Changes rvav can't make in place, and why. An update with any is refused.
          items: { $ref: "#/components/schemas/UpdateRefusal" }
        fields: { $ref: "#/components/schemas/FieldStates" }
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
        quota:
          type: array
          description: |
            The net change at each quota level the update counts against
            (`level`): the project's, the environment's, the owner's and
            rvav's. `adding` is negative where the update frees more than
            it adds.
          items: { $ref: "#/components/schemas/QuotaImpact" }
        limits:
          type: array
          description: |
            The vCPU and memory limits of each deployment that apply
            (ADR-0047); the update goes over one only when it grows the
            deployment. Absent when none does.
          items: { $ref: "#/components/schemas/DeploymentLimitLine" }
        approval: { $ref: "#/components/schemas/ApprovalPreview" }
        warnings:
          type: array
          description: |
            What soft day-2 policies and soft deployment limits warn about;
            submitting needs their `id` in `accepted_warnings`, or
            `accept_warnings`.
          items: { $ref: "#/components/schemas/PolicyWarning" }

    UpdateChange:
      type: object
      required: [kind, title, destructive]
      properties:
        kind:
          type: string
          enum: [resize, disk_add, disk_extend, disk_remove, nic_add, nic_move, nic_remove, vm_add, vm_remove, job, resource_add,
            resource_update, resource_remove]
          description: "`resource_*` add, update or delete one of the deployment's custom resources (ADR-0056)."
        component:
          type: string
          description: The component's key; `vm` without components.
        vm:
          type: string
          description: The VM it changes. A VM added is named when the update is asked for.
        title: { type: string, examples: [Set 4 vCPU and 8 GB on web01] }
        detail: { type: string, examples: ["Was 2 vCPU and 4 GB. Restarts the VM: CPU hot add is off."] }
        destructive:
          type: boolean
          description: It deletes something (a disk and its data, an adapter, a VM, a custom resource).

    UpdateRefusal:
      type: object
      required: [reason]
      properties:
        component:
          type: string
          description: The component's key; `vm` without components.
        setting:
          type: string
          description: What changes, as the blueprint names it, for example `template` or `cluster`.
          examples: [template]
        reason: { type: string }

    ConsoleSession:
      type: object
      required: [vmrc_url]
      properties:
        vmrc_url:
          type: string
          description: Opens VMware Remote Console. Valid once, for a few minutes.
        web:
          type: object
          description: Present when the web console is configured.
          required: [url, expires_at, sdk_urls]
          properties:
            url:
              type: string
              description: Path of the console's WebSocket on rvav; open it with `wss://` on the same host.
              examples: [/api/v1/console/Zm9v]
            expires_at: { type: string, format: date-time }
            sdk_urls:
              type: array
              description: Scripts of VMware's HTML console client (WMKS) to load, in order, for example jQuery, jQuery UI and `wmks.min.js`.
              items: { type: string }

    SignalReceipt:
      type: object
      required: [step, received_at]
      properties:
        step: { type: string, description: "The key of the step that has it, such as `step:cab`." }
        received_at: { type: string, format: date-time }

    StepStatus:
      type: string
      enum: [pending, running, done, failed, skipped, cancelled]

    Step:
      type: object
      required: [id, key, title, status, children, has_log]
      properties:
        id: { type: string }
        key:
          type: string
          description: Stable step type, for example `ipam.reserve`, `vsphere.clone`, `awx.job`, `awx.task`.
        title: { type: string }
        detail: { type: string }
        system:
          type: string
          description: Who does the step; `rest` is a composite's REST call to another system, `person` its wait for a person, `wait` its wait for a time or a condition and `branch` its choice between sides (ADR-0033); `ad` is Active Directory (ADR-0064).
          enum: [rvav, policy, vcenter, efficientip, awx, nsx, rest, person, wait, branch, ad]
          x-enum-varnames: [StepSystemRvav, StepSystemPolicy, StepSystemVcenter, StepSystemEfficientip, StepSystemAwx, StepSystemNsx, StepSystemRest, StepSystemPerson, StepSystemWait, StepSystemBranch, StepSystemAd]
        status: { $ref: "#/components/schemas/StepStatus" }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        due_at:
          type: [string, "null"]
          format: date-time
          description: Until when a composite's wait for a time or a condition waits, its deadline for a condition (ADR-0033). A condition that ended has none.
        branch_case:
          type: [integer, "null"]
          description: The side a composite's branch took (ADR-0033), once it has chosen; 1 is its first case, 0 its `else` or, with no `else`, none of them.
        error: { type: string, description: Present when `status` is `failed`. }
        external_ref:
          type: object
          description: The object in the external system, for linking out.
          required: [kind, id]
          properties:
            kind:
              type: string
              enum: [awx_job, awx_workflow_job, awx_inventory_update, vcenter_task, vcenter_vm, ipam_address, dns_record]
            id: { type: string }
            url: { type: string, format: uri }
        has_log: { type: boolean }
        has_data:
          type: boolean
          description: True when the step recorded inputs or outputs, read with `/requests/{requestId}/steps/{stepId}/data` (ADR-0057).
        children:
          type: array
          description: For AWX jobs, one child per task.
          items: { $ref: "#/components/schemas/Step" }

    StepData:
      type: object
      required: [step_id, inputs, outputs, outputs_hidden]
      properties:
        step_id: { type: string }
        inputs:
          type: [object, "null"]
          additionalProperties: true
          description: What the step was given, as it ran with it; null when it records none.
        outputs:
          type: [object, "null"]
          additionalProperties: true
          description: What it gave later steps, as `steps.<key>` reads it; null before it finished, or when it gave nothing.
        outputs_hidden:
          type: boolean
          description: True when the outputs are a person's answer that this reader may not read.

    LogChunk:
      type: object
      required: [step_id, offset, next_offset, complete, lines]
      properties:
        step_id: { type: string }
        offset: { type: integer }
        next_offset: { type: integer }
        complete:
          type: boolean
          description: True when the step has finished and no more lines will come.
        lines:
          type: array
          items:
            type: object
            required: [n, text]
            properties:
              n: { type: integer, description: "Line number, from 0." }
              text: { type: string, description: "Plain text, ANSI codes removed." }
              kind:
                type: string
                description: Hint for colouring Ansible output.
                enum: [plain, header, ok, changed, failed, skipped, unreachable, recap]

    # ── Deployments ───────────────────────────────────────────────────────
    DeploymentStatus:
      type: string
      enum: [provisioning, ready, updating, failed, deleting, deleted]

    DeploymentStatusFilter:
      type: string
      description: |
        A deployment status, or `expired`: its lease has ended (its VMs are
        powered off and it waits for deletion), whatever its status.
      enum: [provisioning, ready, updating, failed, deleting, deleted, expired]

    DeploymentFacets:
      type: object
      required: [items, templates, environments]
      properties:
        items:
          type: array
          description: Catalog items, by name.
          items:
            type: object
            required: [id, slug, name]
            properties:
              id: { type: string }
              slug: { type: string }
              name: { type: string }
        templates:
          type: array
          description: The VM templates their VMs were cloned from, by name.
          items: { type: string }
        environments:
          type: array
          items: { $ref: "#/components/schemas/EnvironmentKey" }

    VmListItem:
      allOf:
        - $ref: "#/components/schemas/VmResource"
        - type: object
          required: [deployment, project, environment, addresses]
          properties:
            deployment:
              type: object
              required: [id, name, status]
              properties:
                id: { type: string }
                name: { type: string }
                status: { $ref: "#/components/schemas/DeploymentStatus" }
            project: { $ref: "#/components/schemas/ProjectRef" }
            environment: { $ref: "#/components/schemas/EnvironmentKey" }
            addresses:
              type: array
              description: |
                Its IPv4 and IPv6 addresses, each once: those rvav reserved
                for it first, then those VMware Tools reports.
              items: { type: string }

    VmPage:
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/VmListItem" }

    VmFacets:
      type: object
      required: [vcenters, networks]
      properties:
        vcenters:
          type: array
          description: The vCenters the VMs run in, by name, each with its clusters.
          items:
            type: object
            required: [name, clusters]
            properties:
              name: { type: string }
              clusters:
                type: array
                items: { type: string }
        networks:
          type: array
          description: The networks their adapters are on, by name.
          items: { type: string }

    ViewList:
      type: string
      description: The list a saved view is of.
      enum: [deployments, resources]
      x-enum-varnames: [ViewListDeployments, ViewListResources]

    SavedViewWrite:
      type: object
      required: [list, name, query]
      properties:
        list: { $ref: "#/components/schemas/ViewList" }
        name: { type: string, minLength: 1, maxLength: 60 }
        query:
          type: object
          description: |
            The list's address query, such as `{"status": "failed", "sort":
            "-lease_expires_at"}`: the page reads it back as its own.
          maxProperties: 20
          propertyNames: { maxLength: 40 }
          additionalProperties: { type: string, maxLength: 400 }

    SavedView:
      allOf:
        - $ref: "#/components/schemas/SavedViewWrite"
        - type: object
          required: [id, created_at, updated_at]
          properties:
            id: { type: string }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }

    SavedViewList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SavedView" }

    Deployment:
      type: object
      required: [id, name, description, status, project, environment, catalog_item, version, owner, created_at, lease, vm_count, vms_powered_on, sync_state]
      properties:
        id: { type: string }
        name:
          type: string
          description: Unique among the project's deployments not deleted.
        description:
          type: string
          description: What it is for, as given at request; empty when nobody gave one.
        status: { $ref: "#/components/schemas/DeploymentStatus" }
        project: { $ref: "#/components/schemas/ProjectRef" }
        environment: { $ref: "#/components/schemas/EnvironmentKey" }
        catalog_item:
          type: object
          required: [id, slug, name]
          properties:
            id: { type: string }
            slug: { type: string }
            name: { type: string }
        version: { $ref: "#/components/schemas/CatalogItemVersionRef" }
        owner: { $ref: "#/components/schemas/UserRef" }
        created_at: { type: string, format: date-time }
        created_by_request_id: { type: string }
        lease: { $ref: "#/components/schemas/Lease" }
        vm_count: { type: integer }
        vms_powered_on: { type: integer }
        primary_address:
          oneOf:
            - type: object
              required: [ip]
              properties:
                ip: { type: string }
                fqdn: { type: string }
            - type: "null"
        sync_state: { $ref: "#/components/schemas/SyncState" }

    Lease:
      type: object
      required: [expires_at]
      properties:
        expires_at:
          type: [string, "null"]
          format: date-time
          description: Null when the deployment does not expire.
        extensions_used: { type: integer }
        extensions_max:
          type: [integer, "null"]
          description: Extensions the owner may make without approval.
        max_days:
          type: [integer, "null"]
          description: The longest lease one may extend to without approval, in days from now.
        grace_days:
          type: integer
          description: Days between powering off at expiry and deleting.
        expired_at:
          type: [string, "null"]
          format: date-time
          description: When the lease's expiry powered the VMs off; the deployment is deleted after the grace period.
        deletes_at:
          type: [string, "null"]
          format: date-time
          description: When the deployment will be deleted, once its lease expired.
        expiry_action: { $ref: "#/components/schemas/LeaseExpiryAction" }
        enforcement:
          $ref: "#/components/schemas/PolicyEnforcement"
          description: |
            The enforcement of the lease policy that applies now, when the
            deployment expires. Soft: an extension beyond `max_days` or
            `extensions_max` warns the owner instead of asking for approval.
        policy:
          type: [string, "null"]
          description: |
            What sets the lease now, by name: the lease rule its request
            matched, the project's override (`Web Platform in
            Development`) or the environment's lease policy
            (`Development`). Absent without a lease policy (ADR-0048). When
            a project admin's rule matched, the deployment also keeps the
            administrators' rule that held it: its terms are the stricter
            of the two, and that rule's once the project admin's is gone.
        max_lifetime_days:
          type: [integer, "null"]
          description: How long the deployment may live in all, from its creation; absent for no limit.
        lifetime_ends_at:
          type: [string, "null"]
          format: date-time
          description: |
            Its creation plus `max_lifetime_days`: an extension past it
            needs approval, or warns when the policy is soft. Absent
            without a lifetime.

    SyncState:
      type: string
      description: |
        `drifted`: changed in vCenter outside rvav (size, disks, adapters'
        networks or power), until changed back or accepted. `missing`: no
        longer found in vCenter.
      enum: [in_sync, drifted, missing]

    DeploymentDetail:
      allOf:
        - $ref: "#/components/schemas/Deployment"
        - type: object
          required: [inputs, resources]
          properties:
            inputs:
              type: object
              description: Its inputs, from the request that created it or from its last update. Secret fields are replaced by `"••••"`.
              additionalProperties: true
            resources:
              type: array
              items: { $ref: "#/components/schemas/Resource" }
            remote_access:
              type: array
              description: The users people sign in to the VMs as, one per component that has one (ADR-0039).
              items: { $ref: "#/components/schemas/RemoteAccess" }
            generated_key:
              $ref: "#/components/schemas/GeneratedKey"
            servicenow:
              description: Made by a request from ServiceNow, for this requested item.
              $ref: "#/components/schemas/ServiceNowRef"

    RemoteAccess:
      description: The user a component's VMs were given to sign in as.
      type: object
      required: [component, kind, username]
      properties:
        component: { type: string, description: "The component's key; `vm` without components." }
        kind: { type: string, enum: [ssh_key, generated_key, password] }
        username: { type: string }
        fingerprint: { type: string, description: "The public key's SHA-256 fingerprint, as `ssh-keygen -l` prints it. Not with a password." }

    GeneratedKey:
      description: The key pair rvav made for the deployment. Its private key can be downloaded once, by the owner.
      type: object
      required: [username, fingerprint, available]
      properties:
        username: { type: string }
        fingerprint: { type: string }
        available: { type: boolean, description: rvav still has the private key. }
        downloaded_at: { type: string, format: date-time }
        downloaded_by: { $ref: "#/components/schemas/UserRef" }

    PrivateKey:
      description: A deployment's generated private key, which rvav no longer has.
      type: object
      required: [private_key, username, fingerprint]
      properties:
        private_key: { type: string, description: The private key in OpenSSH format. }
        username: { type: string }
        fingerprint: { type: string }

    DeploymentPage:
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Deployment" }

    Resource:
      oneOf:
        - $ref: "#/components/schemas/VmResource"
        - $ref: "#/components/schemas/IpAddressResource"
        - $ref: "#/components/schemas/DnsRecordResource"
        - $ref: "#/components/schemas/DrsRuleResource"
        - $ref: "#/components/schemas/SegmentResource"
        - $ref: "#/components/schemas/SubnetResource"
        - $ref: "#/components/schemas/SecurityGroupResource"
        - $ref: "#/components/schemas/FirewallRulesResource"
        - $ref: "#/components/schemas/GroupMembershipResource"
        - $ref: "#/components/schemas/AdComputerResource"
        - $ref: "#/components/schemas/CustomResource"
      discriminator:
        propertyName: type
        mapping:
          vsphere.vm: "#/components/schemas/VmResource"
          ipam.address: "#/components/schemas/IpAddressResource"
          dns.record: "#/components/schemas/DnsRecordResource"
          vsphere.drs_rule: "#/components/schemas/DrsRuleResource"
          nsx.segment: "#/components/schemas/SegmentResource"
          ipam.subnet: "#/components/schemas/SubnetResource"
          nsx.group: "#/components/schemas/SecurityGroupResource"
          nsx.policy: "#/components/schemas/FirewallRulesResource"
          nsx.membership: "#/components/schemas/GroupMembershipResource"
          ad.computer: "#/components/schemas/AdComputerResource"
          custom: "#/components/schemas/CustomResource"

    ResourceBase:
      type: object
      required: [id, type, name, sync_state]
      properties:
        id: { type: string }
        type: { type: string }
        name: { type: string }
        sync_state: { $ref: "#/components/schemas/SyncState" }

    VmResource:
      allOf:
        - $ref: "#/components/schemas/ResourceBase"
        - type: object
          required: [type, vm]
          properties:
            type: { const: vsphere.vm }
            vm: { $ref: "#/components/schemas/VmProperties" }
            drift:
              type: array
              description: |
                How the VM differs in vCenter from how rvav left it (its sync
                state is `drifted`): changed outside rvav. Absent when it
                doesn't.
              items: { $ref: "#/components/schemas/VmDrift" }

    VmPowerState:
      type: string
      enum: [on, off, suspended]

    ReportCounts:
      type: object
      required: [submitted, succeeded, failed, rejected, cancelled]
      properties:
        submitted: { type: integer }
        succeeded: { type: integer }
        failed: { type: integer }
        rejected: { type: integer }
        cancelled: { type: integer }
        success_rate:
          type: number
          description: Succeeded out of those that ran to an end (succeeded or failed), 0 to 1; absent when none did.

    ReportDurations:
      type: object
      required: [count]
      properties:
        count: { type: integer }
        p50_seconds: { type: number }
        p90_seconds: { type: number }
        average_seconds: { type: number }

    Report:
      type: object
      required: [from, to, interval, requests, provisioning, approvals, quota, leases]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        interval: { type: string, enum: [day, week, month] }
        requests: { $ref: "#/components/schemas/ReportRequests" }
        provisioning:
          allOf:
            - $ref: "#/components/schemas/ReportDurations"
          description: How long new deployments took to build, from start to end, for requests that succeeded.
        approvals: { $ref: "#/components/schemas/ReportApprovals" }
        quota:
          type: array
          description: Each project's usage now, project-wide and per environment with a limit.
          items: { $ref: "#/components/schemas/ReportQuotaLine" }
        leases:
          type: array
          description: Leases ending in the next 30 days, soonest first; the first 200.
          items: { $ref: "#/components/schemas/ReportLease" }

    ReportRequests:
      type: object
      required: [totals, over_time, by_item]
      properties:
        totals: { $ref: "#/components/schemas/ReportCounts" }
        over_time:
          type: array
          description: Every period from `from` to `to`, empty ones too.
          items: { $ref: "#/components/schemas/ReportPeriod" }
        by_item:
          type: array
          description: The items requested most, up to 10, with how long they took to build.
          items: { $ref: "#/components/schemas/ReportItem" }

    ReportPeriod:
      allOf:
        - $ref: "#/components/schemas/ReportCounts"
        - type: object
          required: [period]
          properties:
            period: { type: string, format: date, description: The period's first day. }

    ReportItem:
      allOf:
        - $ref: "#/components/schemas/ReportCounts"
        - type: object
          required: [item, provisioning]
          properties:
            item: { $ref: "#/components/schemas/CatalogItemRef" }
            provisioning: { $ref: "#/components/schemas/ReportDurations" }

    CatalogItemRef:
      type: object
      required: [id, slug, name]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }

    DeploymentRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }

    ReportApprovals:
      type: object
      required: [decided, approved, rejected, lead_time, pending]
      properties:
        decided: { type: integer }
        approved: { type: integer }
        rejected: { type: integer }
        lead_time:
          allOf:
            - $ref: "#/components/schemas/ReportDurations"
          description: From a level opening to its decision.
        pending: { type: integer, description: Levels waiting for a decision now. }
        oldest_pending_since: { type: string, format: date-time }

    ReportQuotaLine:
      type: object
      required: [project, resource, used]
      properties:
        project: { $ref: "#/components/schemas/ProjectRef" }
        environment: { type: string }
        resource: { $ref: "#/components/schemas/QuotaResource" }
        limit: { type: integer }
        used: { type: integer }

    ReportLease:
      type: object
      required: [deployment, project, environment, owner, expires_at]
      properties:
        deployment: { $ref: "#/components/schemas/DeploymentRef" }
        project: { $ref: "#/components/schemas/ProjectRef" }
        environment: { type: string }
        owner: { $ref: "#/components/schemas/UserRef" }
        expires_at: { type: string, format: date-time }

    OnboardingVm:
      type: object
      required: [vcenter, moref, name, power_state, cpu_count, memory_mb]
      properties:
        vcenter: { type: string, examples: [vc01.corp.example] }
        moref: { type: string, examples: [vm-2207] }
        instance_uuid: { type: string }
        name: { type: string }
        power_state: { $ref: "#/components/schemas/VmPowerState" }
        guest_os: { type: string }
        cpu_count: { type: integer }
        memory_mb: { type: integer }
        cluster: { type: string }
        host: { type: string }
        ip_address: { type: string }
        hostname: { type: string, description: "The guest's host name, as VMware Tools reports it." }
        folder: { type: string, description: "Its VM folder's path." }
        tags: { type: array, items: { type: string }, description: "Its vSphere tags, as category/tag." }

    OnboardingVmPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/OnboardingVm" }
        total: { type: integer, description: How many VMs match the filters. }
        next_cursor: { type: string }

    OnboardingVmRef:
      type: object
      required: [vcenter, moref]
      properties:
        vcenter: { type: string }
        moref: { type: string }
        prevent_delete:
          type: boolean
          description: |
            Keeps the VM from being deleted, as a blueprint's
            `prevent_delete` does (ADR-0038): the deployment's Delete is
            refused and names it until an administrator runs the
            deployment's Allow deletion. The vRA import sets it for the VMs
            vRA keeps from deletion (`preventDelete`).

    OnboardingDraft:
      type: object
      required: [vms, project_id, environment, owner_id, catalog_item_id]
      properties:
        vms:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: "#/components/schemas/OnboardingVmRef" }
        project_id: { type: string }
        environment: { type: string }
        owner_id: { type: string, description: "A member of the project, who owns the deployments." }
        catalog_item_id:
          type: string
          description: |
            The VM item the deployments are of (its current version): it
            gives them their OS family and day-2 actions.
        lease_days:
          type: integer
          minimum: 1
          description: Without it, the lease policy's default for the project and environment.
        deployment_name:
          type: string
          maxLength: 63
          description: |
            All the VMs in one deployment of this name. Without it, each VM
            is a deployment of its own, named after it.
        component:
          type: string
          description: |
            The component of the item's blueprint the VMs are VMs of. Needed
            when it has more than one; a blueprint without components has
            none.
        inputs:
          type: object
          additionalProperties: true
          description: |
            Inputs of the item's form recorded on the deployments, so that
            their first update compares with them rather than the form's
            defaults. Fields of the form only, and no secret ones. An input
            that sets the component's count is set to its VMs.

    OnboardingIntoDraft:
      type: object
      required: [deployment_id, vms]
      properties:
        deployment_id: { type: string, description: "A deployment of a VM item, ready, that no request runs on." }
        vms:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: "#/components/schemas/OnboardingVmRef" }
        component:
          type: string
          description: The component of the deployment's blueprint they join. Needed when it has more than one.

    OnboardingFilter:
      type: object
      description: |
        Which VMs of the inventory a plan matches. Every criterion given
        must match, and a plan has at least one.
      properties:
        q: { type: string, maxLength: 200, description: "Part of the VM's name, address or guest host name." }
        vcenter: { type: string }
        cluster: { type: string }
        power_state: { $ref: "#/components/schemas/VmPowerState" }
        folder: { type: string, maxLength: 500, description: "A VM folder's path: VMs in it and in the folders below it." }
        tag: { type: string, maxLength: 200, description: "A vSphere tag, as category/tag." }

    OnboardingTarget:
      type: object
      required: [project_id]
      description: |
        Where a plan's VMs go. Into an existing deployment (`deployment_id`)
        they take its environment, owner, item and lease, so those aren't
        given. Otherwise `environment`, `owner_id` and `catalog_item_id`
        are, as for a one-off adoption: each VM its own deployment, or all
        in one deployment of `deployment_name`, made by the first run and
        added to by the next ones.
      properties:
        project_id: { type: string }
        deployment_id: { type: string, description: An existing deployment of the project. }
        environment: { type: string }
        owner_id: { type: string }
        catalog_item_id: { type: string }
        lease_days: { type: integer, minimum: 1 }
        deployment_name: { type: string, maxLength: 63 }
        component: { type: string }
        inputs: { type: object, additionalProperties: true }

    OnboardingPlanWrite:
      type: object
      required: [name, filter, target]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 500 }
        filter: { $ref: "#/components/schemas/OnboardingFilter" }
        target: { $ref: "#/components/schemas/OnboardingTarget" }
        every_hours:
          type: integer
          minimum: 1
          maximum: 168
          description: Runs on its own every so many hours. Without it, the plan runs by hand only.

    OnboardingPlan:
      type: object
      required: [id, name, description, filter, target, matching, running, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        filter: { $ref: "#/components/schemas/OnboardingFilter" }
        target: { $ref: "#/components/schemas/OnboardingTarget" }
        every_hours: { type: integer }
        next_run_at: { type: string, format: date-time, description: When its schedule runs it next. }
        deployment:
          allOf: [{ $ref: "#/components/schemas/DeploymentRef" }]
          description: The deployment its VMs go into, the existing one or the one its first run made.
        matching: { type: integer, description: How many VMs that no deployment has its filter matches now. }
        running: { type: boolean, description: A run of it goes on. }
        last_run: { $ref: "#/components/schemas/OnboardingRun" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        updated_by: { $ref: "#/components/schemas/UserRef" }

    OnboardingPlanList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/OnboardingPlan" }

    OnboardingRun:
      type: object
      required: [id, plan_id, plan_name, trigger, status, started_at, adopted, skipped, failed]
      properties:
        id: { type: string }
        plan_id: { type: string }
        plan_name: { type: string }
        trigger:
          type: string
          enum: [manual, schedule]
        started_by: { $ref: "#/components/schemas/UserRef" }
        status:
          type: string
          enum: [running, succeeded, partial, failed]
          description: |
            `partial`: some VMs couldn't be adopted, said per VM. `failed`:
            the run couldn't go on, said in `error`.
        error: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        adopted: { type: integer }
        skipped: { type: integer }
        failed: { type: integer }
        vms:
          type: array
          description: What the run did to each VM its filter matched; on a single run only.
          items: { $ref: "#/components/schemas/OnboardingRunVm" }

    OnboardingRunList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/OnboardingRun" }

    OnboardingRunVm:
      type: object
      required: [vcenter, moref, name, outcome, code, reason]
      properties:
        vcenter: { type: string }
        moref: { type: string }
        name: { type: string }
        outcome:
          type: string
          enum: [adopted, skipped, failed]
        code:
          type: string
          description: |
            Why: `managed` (a deployment has it), `building` (a request is
            building it), `not_found`, `taken` (its address or DNS records
            belong to a deployment), `no_fit`, `busy` (the deployment it
            joins isn't ready), `upstream`. Empty for an adopted VM.
        reason: { type: string }
        deployment: { $ref: "#/components/schemas/DeploymentRef" }

    OnboardingResult:
      type: object
      required: [deployments]
      properties:
        deployments:
          type: array
          items:
            type: object
            required: [id, name, vms, addresses, records]
            properties:
              id: { type: string }
              name: { type: string }
              vms: { type: array, items: { type: string } }
              addresses: { type: integer, description: Addresses found in EfficientIP. }
              records: { type: integer, description: DNS records found in EfficientIP. }

    VraImportStatus:
      type: object
      required: [configured]
      properties:
        configured: { type: boolean, description: rvav can read vRA itself (RVAV_VRA_URL is set). }
        url: { type: string, description: The vRA rvav reads. }
        snapshot:
          description: The estate last read; none yet.
          oneOf:
            - $ref: "#/components/schemas/VraSnapshot"
            - type: "null"
    VraSnapshot:
      type: object
      required: [id, read_at, source, created_at, counts]
      properties:
        id: { type: string }
        read_at: { type: string, format: date-time, description: When vRA was read. }
        source: { type: string, enum: [vra, file], description: "Read from vRA by rvav, or from vra-export's file." }
        url: { type: string, description: The vRA it was read from. }
        created_at: { type: string, format: date-time }
        created_by: { type: string, description: Who read it. }
        counts:
          type: object
          required: [projects, templates, catalog_items, deployments, policies, subscriptions, vro_workflows, vro_actions]
          properties:
            projects: { type: integer }
            templates: { type: integer }
            catalog_items: { type: integer }
            deployments: { type: integer }
            policies: { type: integer }
            subscriptions: { type: integer }
            vro_workflows: { type: integer }
            vro_actions: { type: integer }
    VraNote:
      type: object
      required: [level, where, text]
      properties:
        level: { type: string, enum: [info, warning, unmapped], description: How it was mapped; mapped but to check; left out. }
        where: { type: string, description: The part of the vRA object it is about. }
        text: { type: string }
    VraProjectMapping:
      type: object
      required: [rvav_project_id]
      additionalProperties: false
      properties:
        rvav_project_id: { type: [string, "null"], description: "Null clears the mapping: it maps by name then." }
        stays_in_vra: { type: boolean, default: false, description: "Keep it in vRA, even if rvav has a project of its name (rvav_project_id null)." }
    VraPlan:
      type: object
      required: [snapshot, projects, templates, property_groups, form_library, items, deployments, policies, triage, summary, cutover]
      properties:
        snapshot: { $ref: "#/components/schemas/VraSnapshot" }
        summary:
          type: object
          required: [templates_create, property_groups_create, form_library_create, items_create, items_update, items_unchanged, items_blocked, shares_add, deployments_adopt, deployments_adopted, deployments_skipped]
          properties:
            templates_create: { type: integer, description: "Catalogue templates to make of vRA's image mappings (ADR-0037)." }
            property_groups_create: { type: integer, description: "Property groups to make of vRA's (ADR-0038)." }
            form_library_create: { type: integer, description: "Form library entries to make of the vRO actions custom forms use (ADR-0043)." }
            items_create: { type: integer }
            items_update: { type: integer }
            items_unchanged: { type: integer }
            items_blocked: { type: integer, description: "Skipped, or in conflict with rvav." }
            shares_add: { type: integer, description: "Shares to add: an item offered to one more project." }
            deployments_adopt: { type: integer }
            deployments_adopted: { type: integer }
            deployments_skipped: { type: integer }
        projects:
          type: array
          items: { $ref: "#/components/schemas/VraProjectPlan" }
        templates:
          type: array
          items: { $ref: "#/components/schemas/VraTemplatePlan" }
        property_groups:
          type: array
          items: { $ref: "#/components/schemas/VraPropertyGroupPlan" }
        form_library:
          type: array
          items: { $ref: "#/components/schemas/VraFormLibraryPlan" }
        items:
          type: array
          items: { $ref: "#/components/schemas/VraItemPlan" }
        deployments:
          type: array
          items: { $ref: "#/components/schemas/VraDeploymentPlan" }
        policies:
          type: array
          items: { $ref: "#/components/schemas/VraPolicyPlan" }
        triage: { $ref: "#/components/schemas/VroTriage" }
        cutover: { $ref: "#/components/schemas/VraCutover" }
    VraCutover:
      type: object
      required: [projects, moved, total, deployments_left, switch_off]
      properties:
        projects:
          type: array
          items: { $ref: "#/components/schemas/VraCutoverProject" }
        moved: { type: integer, description: vRA projects marked moved. }
        total: { type: integer }
        deployments_left: { type: array, items: { type: string }, description: vRA's deployments not adopted. }
        switch_off: { type: boolean, description: "Every project moved and every deployment adopted: vRA can be switched off." }
    VraCutoverProject:
      type: object
      required: [vra_id, name, ready, checks]
      properties:
        vra_id: { type: string }
        name: { type: string }
        rvav_project_id: { type: string }
        rvav_project_name: { type: string }
        moved_at: { type: string, format: date-time }
        moved_by: { type: string }
        note: { type: string }
        ready: { type: boolean, description: "Mapped, its items published in rvav and shared with it." }
        checks:
          type: array
          items: { $ref: "#/components/schemas/VraCheck" }
    VraCheck:
      type: object
      required: [key, label, state, detail]
      properties:
        key: { type: string }
        label: { type: string }
        state: { type: string, description: "ok (done), warn (to do, or gone wrong), todo (not yet) or manual (people check it)." }
        detail: { type: string }
    VraCutoverWrite:
      type: object
      required: [moved]
      additionalProperties: false
      properties:
        moved: { type: boolean }
        note: { type: string, maxLength: 500 }
    VraProjectPlan:
      type: object
      required: [vra_id, name, how, items, deployments, deployment_sharing]
      properties:
        vra_id: { type: string }
        name: { type: string }
        rvav_project_id: { type: string }
        rvav_project_name: { type: string }
        how: { type: string, enum: [mapped, same_name, stays, none], description: "Mapped by an administrator, by the same name, kept in vRA by an administrator, or not at all." }
        items: { type: integer, description: Catalog items shared with it in vRA. }
        deployments: { type: integer }
        placement_policy: { type: string, description: "vRA's placement policy: DEFAULT, SPREAD or SPREAD_MEMORY." }
        ad_ou:
          type: string
          description: |
            The OU vRA's Active Directory integration gives the project's
            computer objects, relative to its base DN, for an administrator
            to give the rvav project (the import writes none; ADR-0064).
        ad_blueprint_ou: { type: boolean, description: "vRA lets the project's templates choose their OU." }
        ad_none: { type: boolean, description: "vRA makes no computer object for the project's machines." }
        strategy:
          $ref: "#/components/schemas/PlacementStrategy"
          description: |
            The placement rule strategy that places as the placement policy
            does, for an administrator to set on the rvav project's rules
            (the import writes none). Absent when rvav has none.
        properties_add:
          type: object
          additionalProperties: { type: string }
          description: |
            The vRA project's custom properties the rvav project lacks, which
            importing the catalog adds to it (ADR-0038). A property the rvav
            project has keeps its value.
        properties_unmapped:
          type: array
          items: { type: string }
          description: "The vRA project's custom properties rvav can't take: a name or value it refuses, or no room left."
        deployment_sharing:
          $ref: "#/components/schemas/DeploymentSharing"
          description: |
            What vRA's Deployment sharing (`sharedResources`, on when absent)
            becomes: `all_members` when on, `owner_only` when off. The import
            doesn't change the rvav project's; an administrator or its project
            admin sets it in the project's settings (ADR-0045).
        rvav_deployment_sharing:
          $ref: "#/components/schemas/DeploymentSharing"
          description: The rvav project's, when it maps to one.
    VraPropertyGroupPlan:
      type: object
      description: |
        The rvav property group a vRA property group becomes (ADR-0038):
        its inputs, or its constants. The items whose templates name it
        name it at `version`.
      required: [vra_id, name, key, label, type, action, version, inputs, constants, notes]
      properties:
        vra_id: { type: string }
        name: { type: string, description: "vRA's name, as its templates name it." }
        key: { type: string }
        label: { type: string }
        type: { type: string, enum: [input, constant] }
        action:
          type: string
          enum: [create, unchanged, differs]
          description: |
            What the import does: make the group; nothing, as rvav's is what
            vRA's gives; nothing, as rvav has another group of that key (the
            import never changes one).
        version: { type: integer, description: "The version the items name: the one the import makes, or rvav's latest." }
        inputs:
          type: array
          items: { $ref: "#/components/schemas/PropertyGroupInput" }
        constants:
          type: object
          additionalProperties: true
        notes:
          type: array
          items: { $ref: "#/components/schemas/VraNote" }
    VraFormLibraryPlan:
      type: object
      description: |
        The form library entry a vRO action becomes (ADR-0043), when a
        custom form takes its choices or a field's default from it and its
        script makes one GET to a URL the import can read: a REST value
        source, the action's inputs the URL reads its parameters. The
        fields that use the action name the entry at `version`.
      required: [vro_action, key, name, action, version, parameters, notes]
      properties:
        vro_action: { type: string, description: "The action as forms name it: module/name." }
        key: { type: string }
        name: { type: string }
        action:
          type: string
          enum: [create, unchanged, differs, skip]
          description: |
            What the import does: make the entry; nothing, as rvav's is
            what the action gives; nothing, as rvav has another entry of
            that key (the import never changes one); nothing, as the action
            can't be one (`notes` say why: its fields keep a note naming
            it).
        version: { type: integer, description: "The version the items name: the one the import makes, or rvav's latest; 0 when skipped." }
        url: { type: string, description: "The entry's URL, its parameters as ${params.x}." }
        parameters:
          type: array
          items: { type: string }
          description: The action's inputs the URL reads, the entry's parameters.
        notes:
          type: array
          items: { $ref: "#/components/schemas/VraNote" }
    VraTemplatePlan:
      type: object
      description: |
        The catalogue template an image name of vRA's image profiles becomes
        (ADR-0037): a source in each region's vCenter rvav manages, the
        first region's cloud-init and constraints (compute).
      required: [image, key, label, os_family, action, sources, user_data, constraints, notes]
      properties:
        image: { type: string, description: vRA's image name. }
        key: { type: string }
        label: { type: string }
        os_family: { type: string, enum: [linux, windows] }
        action:
          type: string
          enum: [create, unchanged, differs, skip]
          description: |
            What the import does: make the template; nothing, as rvav's is
            what the mappings give; nothing, as rvav has another template of
            that key (the import never changes one); nothing, as no mapping
            is in a vCenter rvav manages.
        sources:
          type: array
          items:
            type: object
            required: [vcenter, template]
            properties:
              vcenter: { type: string, description: "A name of GET /admin/vcenters; empty for the vCenter integration's." }
              template: { type: string }
        user_data: { type: string }
        constraints: { type: array, items: { type: string } }
        notes:
          type: array
          items: { $ref: "#/components/schemas/VraNote" }
    VraItemPlan:
      type: object
      required: [blueprint_id, name, slug, status, action, notes, share_add, share_unmapped]
      properties:
        blueprint_id: { type: string }
        name: { type: string }
        slug: { type: string }
        status: { type: string, enum: [complete, partial, skipped], description: How much of the template maps. }
        action:
          type: string
          enum: [create, update, unchanged, conflict, skip]
          description: |
            What the import does: create the item; give it a new draft (what
            the template maps to changed); nothing; nothing, because rvav has
            something in the way (`reason`); nothing, as nothing maps.
        reason: { type: string, description: Why it is in conflict. }
        version: { type: string, description: The vRA version imported. }
        rvav_item_id: { type: string }
        notes:
          type: array
          items: { $ref: "#/components/schemas/VraNote" }
        share_add: { type: array, items: { type: string }, description: rvav projects (IDs) it would be shared with. }
        share_unmapped: { type: array, items: { type: string }, description: vRA projects it is shared with that map to no rvav project. }
        share_audiences:
          type: array
          items: { $ref: "#/components/schemas/CatalogProjectAudience" }
          description: |
            Who may request it in the projects of `share_add` that vRA's
            content sharing shares it with chosen users, groups or roles in;
            all their members in the others.
    VraDeploymentPlan:
      type: object
      required: [vra_id, name, vra_project, owner, status, notes]
      properties:
        vra_id: { type: string }
        name: { type: string }
        vra_project: { type: string }
        owner: { type: string, description: Its owner in vRA (an email). }
        rvav_name: { type: string, description: "Its name in rvav: vRA's, in lower case with other characters as dashes." }
        status: { type: string, enum: [adopt, adopted, skipped, failed] }
        notes:
          type: array
          items: { $ref: "#/components/schemas/VraNote" }
        project_id: { type: string }
        environment: { type: string }
        owner_id: { type: string }
        catalog_item_id: { type: string }
        lease_days: { type: integer }
        vms:
          type: array
          items:
            type: object
            required: [vcenter, moref, name]
            properties:
              vcenter: { type: string }
              moref: { type: string }
              name: { type: string }
              prevent_delete:
                type: boolean
                description: |
                  Kept from deletion. Before adoption, because vRA keeps it
                  from deletion (its cloud template's `preventDelete`), which
                  adoption keeps; once adopted, because rvav still does
                  (until an administrator runs the deployment's Allow
                  deletion).
        deployments: { type: array, items: { type: string }, description: "The rvav deployments it became, once adopted." }
    VraPolicyPlan:
      type: object
      required: [vra_id, name, type, becomes, notes]
      properties:
        vra_id: { type: string }
        name: { type: string }
        type: { type: string, description: "approval, lease, day2, quota, limit or other." }
        vra_project: { type: string, description: The vRA project it applies to; all when empty. }
        becomes: { type: string, description: The rvav setting an administrator sets for it; the import doesn't change policies. }
        enforcement:
          $ref: "#/components/schemas/PolicyEnforcement"
          description: |
            The rvav policy's enforcement, from vRA's `enforcementType`, where
            rvav's has one: a lease policy, a day-2 policy with the effect
            approval, a quota's limits or a deployment limit policy
            (ADR-0047). Absent for the others; the notes say why (ADR-0045).
        notes:
          type: array
          items: { $ref: "#/components/schemas/VraNote" }
    VraImportRequest:
      type: object
      additionalProperties: false
      properties:
        catalog: { type: boolean, default: true, description: Import catalog items and their sharing. }
        deployments: { type: boolean, default: false, description: Adopt deployments. }
        projects:
          type: array
          items: { type: string }
          description: "Only these vRA projects: sharing with them and their deployments (items are made for all). Every project when absent."
    VraImportResult:
      type: object
      required: [templates_created, property_groups_created, form_library_created, projects_updated, created, updated, shared, adopted, failed, plan]
      properties:
        templates_created: { type: array, items: { type: string }, description: "Catalogue templates made (their keys)." }
        property_groups_created: { type: array, items: { type: string }, description: "Property groups made (their keys)." }
        form_library_created: { type: array, items: { type: string }, description: "Form library entries made (their keys)." }
        projects_updated: { type: array, items: { type: string }, description: "rvav projects given vRA's custom properties (their names)." }
        created: { type: array, items: { type: string }, description: Items made (their names). }
        updated: { type: array, items: { type: string }, description: Items given a new draft. }
        shared: { type: integer, description: "Shares added: an item offered to one more project." }
        adopted: { type: array, items: { type: string }, description: Deployments adopted. }
        failed:
          type: array
          items:
            type: object
            required: [name, reason]
            properties:
              name: { type: string }
              reason: { type: string }
        plan: { $ref: "#/components/schemas/VraPlan" }
    VroTriage:
      type: object
      required: [read_at, items, groups, library]
      properties:
        read_at: { type: string, format: date-time }
        groups: { type: object, additionalProperties: { type: integer }, description: "Items per group, A to D." }
        library: { type: integer, description: "vRO's own workflows and actions, left out." }
        steps:
          type: object
          additionalProperties: { type: integer }
          description: "For each composite step kind rvav may still add (after D2: wait for an event), the workflows to keep that would use it. A kind D2 built is only in a workflow's own steps."
        items:
          type: array
          items: { $ref: "#/components/schemas/VroTriageItem" }
    VroTriageItem:
      type: object
      required: [kind, id, name, used_by, runs, systems, group, becomes, reasons]
      properties:
        kind: { type: string, description: "workflow, action or abx_action." }
        id: { type: string }
        name: { type: string }
        category: { type: string, description: "A workflow's folder, an action's module." }
        inputs:
          type: array
          items:
            type: object
            required: [name, type]
            properties:
              name: { type: string }
              type: { type: string }
              description: { type: string }
        used_by:
          type: array
          items:
            type: object
            required: [kind, name]
            properties:
              kind: { type: string, description: "catalog_item, subscription, day2_action, form_field, workflow or action." }
              name: { type: string }
              detail: { type: string }
              disabled: { type: boolean }
        runs: { type: integer }
        last_run: { type: string, format: date-time }
        systems: { type: array, items: { type: string }, description: "What it reaches - vCenter, Active Directory, REST..." }
        group: { type: string, description: "Suggested: A native in rvav, B AWX, C custom workflow, D retire." }
        becomes: { type: string }
        reasons: { type: array, items: { type: string } }
        steps:
          type: array
          items: { type: string }
          description: "A workflow's steps, rebuilt as a composite item: rvav steps, AWX job, the step kinds D2 built, and those rvav may still add."

    VmDrift:
      type: object
      required: [property, label]
      properties:
        property:
          type: string
          enum: [power_state, cpu_count, memory_mb, disk, nic, tag]
          description: "tag: the VM's tags of one category, its label."
        label:
          type: string
          description: What differs, as people call it.
          examples: [Memory, Hard disk 2, Network adapter 1, backup tags]
        rvav:
          type: string
          description: As rvav left it; absent for a disk or adapter added outside rvav, or a tag category the VM had none of.
          examples: [8 GB]
        vcenter:
          type: string
          description: As it is in vCenter; absent for a disk or adapter removed outside rvav.
          examples: [16 GB]

    VmDisk:
      type: object
      required: [label, capacity_gb]
      properties:
        label: { type: string, examples: [Hard disk 1] }
        capacity_gb: { type: integer }
        datastore: { type: string }
        file:
          type: string
          description: The disk's file in vCenter. Removing a disk names it by its file, as vCenter numbers the labels again.
          examples: ["[vsan-01] web-dev-api004/web-dev-api004_1.vmdk"]
        provisioning: { $ref: "#/components/schemas/DiskProvisioning" }
        linked:
          type: boolean
          description: A child of its template's disk, as a linked clone's first disk is (ADR-0037). It can't be extended.
        key:
          type: integer
          description: vCenter's device key for the disk, which stays the same while the disk is on the VM.
        blueprint_disk:
          type: integer
          minimum: 0
          description: >-
            Which of its blueprint's disks this is: 0 for the first disk, 1 for the first extra disk, and so on
            (ADR-0042), in the version the deployment has. rvav records it when it builds the VM or an update
            adds the disk, and an update that succeeds records the place the disk has in its new version.
            Absent on a disk a day-2 action added, on an onboarded VM, and on a VM built before rvav recorded it.
        blueprint_disk_key:
          type: string
          description: >-
            The `key` its blueprint gives the extra disk this is (ADR-0052), recorded with `blueprint_disk`.
            Absent when the blueprint gives it none.
          examples: [data]

    VmNic:
      type: object
      required: [network]
      properties:
        label: { type: string, examples: [Network adapter 1] }
        network: { type: string }
        mac: { type: string }
        ip_addresses:
          type: array
          items: { type: string }
        dhcp:
          type: boolean
          description: >-
            Whether rvav left its address to DHCP (true) or gave it a fixed one (false), as the VM was built
            (ADR-0039). Absent when rvav doesn't know: an onboarded VM, or a template's adapter after its first.
        key:
          type: integer
          description: vCenter's device key for the adapter, which stays the same while the adapter is on the VM.
        blueprint_nic:
          type: string
          description: >-
            Which of its blueprint's adapters this is: `nic1` for the first adapter, else the `key` of the
            blueprint's adapter (ADR-0042). rvav records it when it builds the VM or an update adds the adapter.
            Absent on an adapter a day-2 action added, on a template's adapters after its first, on an onboarded
            VM, and on a VM built before rvav recorded it.
          examples: [backup]

    DiskProvisioning:
      type: string
      enum: [thin, thick_lazy_zeroed, thick_eager_zeroed]
      description: How a disk is provisioned (ADR-0036). Absent on a VM's disk that isn't a flat file, an RDM say.

    VmProperties:
      type: object
      required: [moref, instance_uuid, vcenter, power_state, guest_state, cpu_count, memory_mb, disks, nics]
      properties:
        moref: { type: string, examples: [vm-48217] }
        instance_uuid: { type: string, format: uuid }
        vcenter: { type: string, examples: [vc01.corp.example] }
        power_state: { $ref: "#/components/schemas/VmPowerState" }
        guest_state: { type: string, enum: [running, not_running, unknown] }
        guest_os: { type: string }
        cpu_count: { type: integer }
        memory_mb: { type: integer }
        disks:
          type: array
          items: { $ref: "#/components/schemas/VmDisk" }
        nics:
          type: array
          items: { $ref: "#/components/schemas/VmNic" }
        cpu_hot_add: { type: boolean, description: CPUs can be added while the VM runs. }
        memory_hot_add: { type: boolean, description: Memory can be added while the VM runs. }
        snapshots:
          type: array
          items:
            type: object
            required: [name, created_at]
            properties:
              name: { type: string }
              description: { type: string }
              created_at: { type: string, format: date-time }
        iso:
          type: string
          description: The ISO image mounted in the CD-ROM drive, for example `[nfs-iso] rhel-9.4.iso`.
        tags:
          type: array
          items: { type: string }
          description: The VM's vSphere tags, as category/tag; absent until rvav has read them.
          examples: [[backup/daily, app/shop]]
        fqdn: { type: string }
        cluster: { type: string }
        host: { type: string }
        resource_pool:
          type: string
          description: Its resource pool's path below its cluster's root pool, for example `rvav/dev`. Absent in the root pool.
        folder: { type: string }
        template: { type: string }
        component:
          type: string
          description: The blueprint component the VM belongs to (ADR-0024), for example `web`; `vm` for a single-VM item.
        custom_properties:
          type: object
          additionalProperties: { type: string }
          description: >-
            The custom properties it was built with: its project's, with its blueprint's and component's over them
            (ADR-0038), as vSphere custom attributes have them. A property that reads a secret input is `"••••"`.
            Absent for a VM built without any, or before rvav recorded them.
        vsphere_url:
          type: string
          format: uri
          description: >-
            The VM in the vSphere Client, from its vCenter's host and instance UUID. Absent until the inventory sync
            has read its vCenter.
          examples: ["https://vc01.corp.example/ui/app/vm;nav=h/urn:vmomi:VirtualMachine:vm-48217:6f1c2a5e-0b8d-4c1e-9d2f-3a4b5c6d7e8f/summary"]
        dhcp:
          type: boolean
          description: >-
            Its first adapter gets its address from DHCP (ADR-0039): rvav reserved no address and made no DNS
            records for it. The address is the first of `nics[0].ip_addresses`, once VMware Tools reports it.
        snapshot_count: { type: integer }
        usage:
          type: object
          description: Quick stats from vCenter, refreshed at each full read of the inventory (every 2 minutes by default).
          properties:
            cpu_pct: { type: number }
            memory_pct: { type: number }
            sampled_at: { type: string, format: date-time }

    IpAddressResource:
      allOf:
        - $ref: "#/components/schemas/ResourceBase"
        - type: object
          required: [type, address, subnet]
          properties:
            type: { const: ipam.address }
            address: { type: string }
            subnet: { type: string, examples: [10.21.10.0/24] }
            efficientip_id: { type: string }

    DnsRecordResource:
      allOf:
        - $ref: "#/components/schemas/ResourceBase"
        - type: object
          required: [type, fqdn, record_type, value]
          properties:
            type: { const: dns.record }
            fqdn: { type: string }
            record_type: { type: string, enum: [A, AAAA, PTR, CNAME] }
            value: { type: string }
            zone: { type: string }

    SegmentResource:
      description: "An NSX segment made for the deployment (ADR-0028): its VMs' network, deleted with it."
      allOf:
        - $ref: "#/components/schemas/ResourceBase"
        - type: object
          required: [type, segment]
          properties:
            type: { const: nsx.segment }
            segment:
              type: object
              required: [id, tier1, subnet, gateway]
              properties:
                id: { type: string, description: Its NSX ID. }
                tier1: { type: string }
                subnet: { type: string }
                gateway: { type: string }
    SecurityGroupResource:
      description: "An NSX security group made for the deployment (ADR-0028): the VMs carrying its tag, deleted with it."
      allOf:
        - $ref: "#/components/schemas/ResourceBase"
        - type: object
          required: [type, group]
          properties:
            type: { const: nsx.group }
            group:
              type: object
              required: [id]
              properties:
                id: { type: string, description: Its NSX ID. }
                key: { type: string, description: "The blueprint's key of the group; none for a group adopted from vRA." }
                title: { type: string }
    FirewallRulesResource:
      description: "The NSX security policy of the firewall rules into the deployment's groups (ADR-0028)."
      allOf:
        - $ref: "#/components/schemas/ResourceBase"
        - type: object
          required: [type, rules]
          properties:
            type: { const: nsx.policy }
            rules:
              type: array
              items: { $ref: "#/components/schemas/FirewallRule" }
    FirewallRule:
      description: A distributed firewall rule into one of the deployment's groups.
      type: object
      required: [id, from, to, services, action]
      properties:
        id: { type: string }
        from: { type: array, items: { type: string }, description: "Group IDs, or ANY." }
        to: { type: array, items: { type: string }, description: "Group IDs, or ANY (a rule adopted from vRA may let traffic out of a group)." }
        scope: { type: array, items: { type: string }, description: "The groups it is enforced on (applied to); none: everywhere." }
        services: { type: array, items: { type: string }, description: "NSX service IDs, or ANY." }
        action: { type: string, enum: [ALLOW, DROP, REJECT] }
    AdComputerResource:
      description: "A VM's computer object in Active Directory (ADR-0064): made before the VM is cloned, deleted after it."
      allOf:
        - $ref: "#/components/schemas/ResourceBase"
        - type: object
          required: [type, computer]
          properties:
            type: { const: ad.computer }
            computer:
              type: object
              required: [vm, dn, sam_account_name, groups]
              properties:
                vm: { type: string, description: The VM's name. }
                dn: { type: string, examples: ["CN=WEB-DEV-WEB01,OU=Web,OU=Servers,DC=corp,DC=example"] }
                sam_account_name: { type: string, examples: [WEB-DEV-WEB01$] }
                dns_host_name: { type: string, examples: [web-dev-web01.corp.example] }
                groups:
                  type: array
                  description: The DNs of the groups it was added to.
                  items: { type: string }
    GroupMembershipResource:
      description: "The NSX security groups a VM of the deployment is in, by the tags rvav set on it (ADR-0028)."
      allOf:
        - $ref: "#/components/schemas/ResourceBase"
        - type: object
          required: [type, membership]
          properties:
            type: { const: nsx.membership }
            membership:
              type: object
              required: [vm, groups]
              properties:
                vm: { type: string }
                groups:
                  type: array
                  items: { $ref: "#/components/schemas/GroupRef" }
                missing:
                  type: array
                  description: "Tags rvav set that the VM no longer has in NSX (drift): scope|tag."
                  items: { type: string }
                out_of:
                  type: array
                  description: The groups those missing tags take the VM out of, their firewall rules no longer applying to it.
                  items: { $ref: "#/components/schemas/GroupRef" }
    CustomResource:
      description: |
        A resource of a custom resource type (ADR-0056): the type's custom
        workflow or AWX template made it, and deletes it with the deployment.
      allOf:
        - $ref: "#/components/schemas/ResourceBase"
        - type: object
          required: [type, resource_type, key, properties]
          properties:
            type: { const: custom }
            resource_type:
              type: object
              required: [key, title]
              properties:
                key: { type: string, examples: [load-balancer] }
                title: { type: string, examples: [Load balancer] }
            key:
              type: string
              description: "Its key in the blueprint (`resources[].key`), or the key of the composite step that made it."
              examples: [lb]
            properties:
              type: object
              description: What its create returned, or its last update or read.
              additionalProperties: true
            property_titles:
              type: object
              description: The titles the type's property schema gives its properties.
              additionalProperties: { type: string }
            creating:
              type: boolean
              description: |
                Its create is running, or failed part way: what it made, if
                anything, isn't known, and `properties` is empty. A rollback
                or the deployment's deletion runs the type's delete with
                `resource.creating` true, the create's inputs and no
                properties.
    GroupRef:
      description: An NSX security group, by its ID and name.
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    SubnetResource:
      description: "The subnet carved from an EfficientIP block for an NSX segment made for the deployment (ADR-0028)."
      allOf:
        - $ref: "#/components/schemas/ResourceBase"
        - type: object
          required: [type, subnet]
          properties:
            type: { const: ipam.subnet }
            subnet:
              type: object
              required: [cidr, block]
              properties:
                cidr: { type: string }
                block: { type: string }
                efficientip_id: { type: string }
    DrsRuleResource:
      description: A DRS rule keeping a component's VMs on separate hosts (ADR-0024).
      allOf:
        - $ref: "#/components/schemas/ResourceBase"
        - type: object
          required: [type, rule]
          properties:
            type: { const: vsphere.drs_rule }
            rule:
              type: object
              required: [kind, cluster, vcenter, component, vms]
              properties:
                kind: { type: string, enum: [vm_anti_affinity] }
                cluster: { type: string }
                vcenter: { type: string }
                component: { type: string }
                vms:
                  type: array
                  description: The names of the VMs it keeps apart.
                  items: { type: string }

    # ── Events ────────────────────────────────────────────────────────────
    Event:
      oneOf:
        - $ref: "#/components/schemas/RequestUpdatedEvent"
        - $ref: "#/components/schemas/RequestStepEvent"
        - $ref: "#/components/schemas/RequestLogEvent"
        - $ref: "#/components/schemas/DeploymentUpdatedEvent"
        - $ref: "#/components/schemas/ResourceUpdatedEvent"
        - $ref: "#/components/schemas/NotificationEvent"
        - $ref: "#/components/schemas/ApprovalUpdatedEvent"
        - $ref: "#/components/schemas/ControlEvent"
      discriminator:
        propertyName: type
        mapping:
          request.updated: "#/components/schemas/RequestUpdatedEvent"
          request.step: "#/components/schemas/RequestStepEvent"
          request.log: "#/components/schemas/RequestLogEvent"
          deployment.updated: "#/components/schemas/DeploymentUpdatedEvent"
          resource.updated: "#/components/schemas/ResourceUpdatedEvent"
          notification: "#/components/schemas/NotificationEvent"
          approval.updated: "#/components/schemas/ApprovalUpdatedEvent"
          heartbeat: "#/components/schemas/ControlEvent"
          resync: "#/components/schemas/ControlEvent"

    EventBase:
      type: object
      required: [id, type, at]
      properties:
        id: { type: string, description: Same as the SSE `id`. }
        type: { type: string }
        at: { type: string, format: date-time }

    RequestUpdatedEvent:
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [type, data]
          properties:
            type: { const: request.updated }
            data: { $ref: "#/components/schemas/Request" }

    RequestStepEvent:
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [type, data]
          properties:
            type: { const: request.step }
            data:
              type: object
              required: [request_id, step]
              properties:
                request_id: { type: string }
                parent_step_id: { type: [string, "null"] }
                step: { $ref: "#/components/schemas/Step" }

    RequestLogEvent:
      description: New log lines are available. Fetch them with `getStepLog` from your last offset.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [type, data]
          properties:
            type: { const: request.log }
            data:
              type: object
              required: [request_id, step_id, next_offset]
              properties:
                request_id: { type: string }
                step_id: { type: string }
                next_offset: { type: integer }

    DeploymentUpdatedEvent:
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [type, data]
          properties:
            type: { const: deployment.updated }
            data: { $ref: "#/components/schemas/Deployment" }

    ResourceUpdatedEvent:
      description: A resource changed, for example a power state or IP reported by vCenter.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [type, data]
          properties:
            type: { const: resource.updated }
            data:
              type: object
              required: [deployment_id, resource]
              properties:
                deployment_id: { type: string }
                resource: { $ref: "#/components/schemas/Resource" }

    NotificationEvent:
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [type, data]
          properties:
            type: { const: notification }
            data:
              type: object
              required: [id, title, level]
              properties:
                id: { type: string }
                title: { type: string }
                body: { type: string }
                level: { type: string, enum: [info, success, warning, error] }
                link:
                  type: string
                  description: App path to open, for example `/requests/REQ-10491`.

    ApprovalUpdatedEvent:
      description: An approval the receiver may decide was opened, decided or changed. Refetch it.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [type, data]
          properties:
            type: { const: approval.updated }
            data:
              type: object
              required: [approval_id, request_id, status]
              properties:
                approval_id: { type: string }
                request_id: { type: string }
                status: { $ref: "#/components/schemas/ApprovalStatus" }

    ControlEvent:
      description: "`heartbeat` keeps the connection open. `resync` means missed events were dropped: refetch."
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [type]
          properties:
            type: { type: string, enum: [heartbeat, resync] }

    # ── Administration (S9, ADR-0020) ─────────────────────────────────────
    UserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/UserRef" }
    AdminProject:
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          required: [archived, created_at, members, deployments, properties]
          properties:
            properties: { $ref: "#/components/schemas/CustomProperties" }
            archived: { type: boolean }
            archived_at: { type: string, format: date-time }
            created_at: { type: string, format: date-time }
            members: { type: integer, description: "Members, direct or through a group." }
            deployments: { type: integer, description: Deployments not deleted. }
    AdminProjectList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminProject" }
    AdminProjectCreate:
      type: object
      required: [code, name, environments]
      additionalProperties: false
      properties:
        code: { type: string, pattern: "^[a-z][a-z0-9]{1,7}$", description: In VM names; it can't change later. }
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 500 }
        cost_center: { type: string, maxLength: 40 }
        environments:
          type: array
          items: { $ref: "#/components/schemas/EnvironmentKey" }
        properties: { $ref: "#/components/schemas/CustomProperties" }
        project_admins:
          type: array
          description: |
            Users made project admins of it, the caller too when named:
            `project.create` is enough, whatever roles the caller may give.
          items: { type: string }
    AdminProjectUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 500 }
        cost_center: { type: string, maxLength: 40 }
        environments:
          type: array
          items: { $ref: "#/components/schemas/EnvironmentKey" }
        properties:
          $ref: "#/components/schemas/CustomProperties"
          description: All of the project's custom properties, replacing those it has.
        archived: { type: boolean }
    CustomProperties:
      type: object
      description: |
        Custom properties: each of the project's VMs gets them as vSphere
        custom attributes and in its notes, and bindings read them as
        `project.properties.<key>`. Keys are letters, digits, `.`, `_` and
        `-`, starting with a letter.
      maxProperties: 50
      additionalProperties: { type: string, maxLength: 512 }
    ProjectMember:
      type: object
      required: [user, role, roles, direct, direct_roles, groups]
      properties:
        user: { $ref: "#/components/schemas/UserRef" }
        role:
          description: The strongest built-in role they hold here; null when they hold only custom ones.
          oneOf:
            - $ref: "#/components/schemas/ProjectRole"
            - type: "null"
        roles:
          type: array
          description: Every role they hold here, and where it comes from.
          items: { $ref: "#/components/schemas/ProjectMemberRole" }
        direct:
          type: boolean
          description: A member of the project itself (else only through groups).
        direct_role:
          description: The strongest built-in role among `direct_roles`.
          $ref: "#/components/schemas/ProjectRole"
        direct_roles:
          type: array
          description: The keys of the roles given to them in the project themselves.
          items: { type: string }
        groups:
          type: array
          description: OIDC groups that make them a member, at their last sign-in.
          items: { type: string }
    ProjectMemberRole:
      type: object
      required: [key, name, direct, groups]
      properties:
        key: { type: string }
        name: { type: string }
        direct:
          type: boolean
          description: Given to them in the project themselves.
        groups:
          type: array
          description: The OIDC groups that give it to them here.
          items: { type: string }
    ProjectMemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ProjectMember" }
    ProjectMemberWrite:
      type: object
      additionalProperties: false
      description: "`roles`, or `role` alone (the same as `roles` with it only)."
      properties:
        role:
          type: string
          description: A role's key, such as member.
        roles:
          type: array
          minItems: 1
          description: The keys of the roles they hold in the project themselves, exactly.
          items: { type: string }
    GroupMapping:
      type: object
      required: [id, oidc_group, role]
      properties:
        id: { type: string }
        oidc_group: { type: string }
        project:
          oneOf:
            - $ref: "#/components/schemas/ProjectRef"
            - type: "null"
        role:
          type: string
          description: The role's key.
        role_name: { type: string }
        users:
          type: integer
          description: Users in the group at their last sign-in.
    GroupMappingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GroupMapping" }
    GroupMappingWrite:
      type: object
      required: [oidc_group, role]
      additionalProperties: false
      properties:
        oidc_group: { type: string, minLength: 1, maxLength: 200 }
        project_id: { type: string }
        role:
          type: string
          description: |
            A role's key, built-in or custom. Without a project for a role
            that can be given for all of rvav (admin, catalog-admin, auditor,
            or a custom one); with one for a role that can be given in a
            project (project-admin, member, viewer, supervisor, or a custom one
            holding no permission for all of rvav only).
    # ── Roles and permissions (A1, ADR-0034) ──────────────────────────────
    Permission:
      type: string
      description: |
        A permission's stable identifier: one of the catalogue (`project.see`,
        `policies.manage`), or a day-2 one, `day2.<group>` or
        `day2.<group>:<action>`.
      examples: [project.see, day2.power:power_on]
    PermissionInfo:
      type: object
      required: [id, scope, area, summary]
      properties:
        id: { $ref: "#/components/schemas/Permission" }
        scope:
          type: string
          enum: [project, rvav]
          description: "`project`: given in a project, or for all of rvav; `rvav`: for all of rvav only."
        area: { type: string, description: Groups permissions in the role editor. }
        summary: { type: string, description: What it allows. }
    PermissionCatalogue:
      type: object
      required: [items, day2]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PermissionInfo" }
        day2:
          type: array
          description: The day-2 groups, each with the actions known now; they are given in a project, or for all of rvav.
          items: { $ref: "#/components/schemas/Day2PermissionGroup" }
    Day2PermissionGroup:
      type: object
      required: [group, permission, actions]
      properties:
        group: { type: string, examples: [power] }
        permission: { $ref: "#/components/schemas/Permission" }
        actions:
          type: array
          items:
            type: object
            required: [key, name, permission]
            properties:
              key: { type: string }
              name: { type: string }
              permission: { $ref: "#/components/schemas/Permission" }
    RoleRef:
      type: object
      required: [key, name]
      properties:
        key: { type: string }
        name: { type: string }
    RoleScope:
      type: string
      enum: [project, rvav, any]
      description: |
        Where the role may be given: in a project (the built-in project-admin,
        member, viewer and supervisor), for all of rvav (the other built-in roles, and a
        role holding a permission given that way only), or either.
    Role:
      type: object
      required: [key, name, description, permissions, built_in, scope, holders, policies]
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
        built_in:
          type: boolean
          description: One of rvav's roles, which can't be changed or deleted.
        scope: { $ref: "#/components/schemas/RoleScope" }
        holders:
          type: integer
          description: Its assignments to users and group mappings, in projects and for all of rvav.
        policies:
          type: array
          description: The day-2 policies whose roles name it, and the approval and day-2 policies whose levels do.
          items: { type: string }
    RoleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Role" }
    RoleCreate:
      type: object
      required: [key, name, permissions]
      additionalProperties: false
      properties:
        key:
          type: string
          pattern: "^[a-z][a-z0-9-]{1,40}$"
          description: Fixed once made; none of the built-in roles' keys, nor owner or new.
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 1000 }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
    RoleUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 1000 }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
    RoleAssignment:
      type: object
      required: [user, role, fixed]
      properties:
        id:
          type: string
          description: To take it away by; none when rvav set it.
        user: { $ref: "#/components/schemas/UserRef" }
        role: { $ref: "#/components/schemas/RoleRef" }
        fixed:
          type: boolean
          description: rvav set it itself (the local administrator's, the system users', the seed's); it can't be taken away.
        created_at: { type: string, format: date-time }
    RoleAssignmentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RoleAssignment" }
    RoleAssignmentWrite:
      type: object
      required: [user_id, role]
      additionalProperties: false
      properties:
        user_id: { type: string }
        role: { type: string, description: The key of a role that can be given for all of rvav. }
    AssignableRole:
      type: object
      required: [key, name, description, permissions, built_in]
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
        built_in: { type: boolean }
    AssignableRoleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AssignableRole" }
    AccessGrant:
      type: object
      required: [role, given, through]
      description: A role a user holds, and where it comes from.
      properties:
        role: { $ref: "#/components/schemas/RoleRef" }
        given:
          type: string
          enum: [project, rvav]
          description: Given in the project, or for all of rvav.
        through:
          type: string
          enum: [user, group, rvav]
          description: |
            `user`: given to them; `group`: through a group mapping; `rvav`:
            set by rvav itself (`user` for everyone signed in, the local
            administrator's, the system users' and the seed's).
        group:
          type: string
          description: The group of the identity provider, when through one.
    AccessPermission:
      type: object
      required: [id, held, granted_by]
      properties:
        id: { $ref: "#/components/schemas/Permission" }
        held: { type: boolean }
        granted_by:
          type: array
          description: |
            The roles granting it here; empty when none does. `approval.project`
            counts from a role given in the project only.
          items: { $ref: "#/components/schemas/AccessGrant" }
    AccessExplanation:
      type: object
      required: [user, project, groups, roles, permissions]
      properties:
        user: { $ref: "#/components/schemas/UserRef" }
        project:
          description: The project asked about; null for all of rvav.
          oneOf:
            - $ref: "#/components/schemas/ProjectRef"
            - type: "null"
        groups:
          type: array
          description: Their groups of the identity provider, at their last sign-in.
          items: { type: string }
        roles:
          type: array
          description: The roles that count here, those given for all of rvav included.
          items: { $ref: "#/components/schemas/AccessGrant" }
        permissions:
          type: array
          description: Every permission of the catalogue, in its order, then the day-2 permissions held.
          items: { $ref: "#/components/schemas/AccessPermission" }
    AdminEnvironment:
      allOf:
        - $ref: "#/components/schemas/Environment"
        - type: object
          required: [snapshot_max_count]
          properties:
            snapshot_max_count: { type: integer, minimum: 0, description: Snapshots kept per VM. }
            snapshot_max_age_days:
              type: [integer, "null"]
              minimum: 1
              description: Snapshots older are deleted; null keeps them.
            tag_categories:
              $ref: "#/components/schemas/EnvironmentTagCategories"
            projects: { type: integer, readOnly: true, description: Projects that deploy to it. }
            deployments: { type: integer, readOnly: true, description: "Deployments in it, not deleted." }
    AdminEnvironmentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminEnvironment" }
    AdminEnvironmentUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        production: { type: boolean }
        order: { type: integer }
        snapshot_max_count: { type: integer, minimum: 0 }
        snapshot_max_age_days: { type: integer, minimum: 0, description: 0 keeps snapshots of any age. }
        tag_categories:
          $ref: "#/components/schemas/EnvironmentTagCategories"
    EnvironmentTagCategories:
      type: array
      uniqueItems: true
      maxItems: 50
      items: { type: string, minLength: 1, maxLength: 80 }
      description: >-
        The vSphere tag categories whose tags the users of its VMs may change, with the day-2 action Edit tags;
        none when empty.
      examples: [[backup]]
    PlacementRule:
      type: object
      required: [id, project, environment, priority, clusters, datastores, networks, folder, cluster_tags, datastore_tags, storage_policy, vcenter,
        resource_pool, hosts, datastore_cluster, strategy]
      properties:
        id: { type: string }
        project: { $ref: "#/components/schemas/ProjectRef" }
        environment: { $ref: "#/components/schemas/EnvironmentKey" }
        priority: { type: integer, description: Lower first. }
        clusters:
          type: array
          description: Cluster names; `*` matches any text (GVA-DEV-*). `resource_pool` names a pool within them.
          items: { type: string }
        resource_pool:
          type: string
          description: "The resource pool VMs go to in each cluster, by its path below the cluster's root pool (ADR-0036); a cluster without it isn't used. Empty for the root pool."
          examples: [rvav/dev]
        hosts:
          type: array
          description: "Host name patterns (ADR-0036): VMs start on the connected hosts out of maintenance that match. Empty for any of the cluster's."
          items: { type: string }
        datastores:
          type: array
          description: Datastore names; `*` matches any text.
          items: { type: string }
        datastore_cluster:
          type: string
          description: "A datastore cluster whose datastores the rule allows, narrowed by `datastores` and `datastore_tags` when they're given (ADR-0036); empty for none."
        strategy: { $ref: "#/components/schemas/PlacementStrategy" }
        networks:
          type: array
          items: { type: string }
        folder: { type: string, examples: [/GVA/vm/rvav/web/dev] }
        cluster_tags:
          type: array
          description: vSphere tags (`category/tag`) a cluster must carry, all of them.
          items: { type: string }
        datastore_tags:
          type: array
          items: { type: string }
        storage_policy:
          type: string
          description: The storage policy (SPBM) of VMs placed by the rule, unless their blueprint names one (ADR-0024); empty for none.
        segments:
          description: "NSX segments made for a deployment placed by the rule (ADR-0028); none when it makes none."
          oneOf:
            - $ref: "#/components/schemas/PlacementSegments"
            - type: "null"
        vcenter:
          type: string
          description: The vCenter its clusters are in; empty for any (ADR-0024). Needed when a cluster's name is in two vCenters.
    PlacementRuleWrite:
      type: object
      required: [project_id, environment, clusters, datastores, networks, folder]
      additionalProperties: false
      properties:
        project_id: { type: string }
        environment: { $ref: "#/components/schemas/EnvironmentKey" }
        priority: { type: integer, default: 100 }
        clusters: { type: array, items: { type: string } }
        datastores: { type: array, items: { type: string } }
        networks: { type: array, items: { type: string } }
        folder: { type: string }
        cluster_tags: { type: array, items: { type: string } }
        datastore_tags: { type: array, items: { type: string } }
        storage_policy: { type: string }
        vcenter: { type: string }
        resource_pool: { type: string }
        hosts: { type: array, items: { type: string } }
        datastore_cluster: { type: string }
        strategy: { $ref: "#/components/schemas/PlacementStrategy" }
        segments:
          oneOf:
            - $ref: "#/components/schemas/PlacementSegments"
            - type: "null"
    PlacementStrategy:
      type: string
      enum: [most_free_memory, binpack, spread]
      default: most_free_memory
      description: |
        How rvav chooses among the clusters the rules and constraints leave
        when a blueprint doesn't bind one (ADR-0036): the most free memory;
        binpack, the least free memory that still has room for the VMs; or
        spread, the fewest VMs of rvav's deployments.
    PlacementSegments:
      type: object
      required: [tier1, ip_block, prefix_length, dns_zone]
      additionalProperties: false
      properties:
        tier1: { type: string, description: "The ID of the Tier-1 gateway they connect to.", examples: [t1-gva-dev] }
        ip_block: { type: string, description: "The EfficientIP block their subnets are carved from: its name or range.", examples: [nsx-gva-dev] }
        prefix_length: { type: integer, minimum: 16, maximum: 29, description: "Each segment's subnet size.", examples: [26] }
        dns_zone: { type: string, description: "The DNS zone of the VMs on them.", examples: [corp.example] }
        dns_servers: { type: array, items: { type: string } }
    PlacementRuleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PlacementRule" }
    AdPlacementWrite:
      type: object
      required: [ou]
      additionalProperties: false
      description: |
        Where a VM's computer object goes (ADR-0064). The row for its
        project and environment applies, else its project's in any
        environment, else its environment's in any project, else the row
        for any project in any environment; none, and no object is made.
      properties:
        project_id:
          type: [string, "null"]
          description: The project; none for every project.
        environment:
          description: The environment; none for every environment.
          oneOf:
            - $ref: "#/components/schemas/EnvironmentKey"
            - type: "null"
        ou:
          type: string
          description: The OU's DN, or a DN relative to the integration's base DN.
          examples: ["OU=Servers,OU=Web", "OU=Servers,DC=corp,DC=example"]
        groups:
          type: array
          items: { type: string }
          description: The groups the objects join, by DN or relative to the base DN.
          examples: [["CN=Web servers,OU=Groups"]]
        allow_blueprint_ou:
          type: boolean
          default: false
          description: A blueprint's active_directory (an OU of its own, or none) counts; otherwise it is ignored.
    AdPlacement:
      type: object
      required: [id, project_id, environment, ou, ou_dn, groups, allow_blueprint_ou, updated_at]
      properties:
        id: { type: string }
        project_id: { type: [string, "null"] }
        project_name: { type: string }
        environment:
          oneOf:
            - $ref: "#/components/schemas/EnvironmentKey"
            - type: "null"
        ou: { type: string, description: As given. }
        ou_dn:
          type: string
          description: The OU's DN under the base DN; the OU as given while the integration has no base DN.
        groups: { type: array, items: { type: string } }
        allow_blueprint_ou: { type: boolean }
        updated_at: { type: string, format: date-time }
    AdPlacementList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdPlacement" }
    PlacementPreview:
      type: object
      required: [clusters, datastores, networks, folder, problems]
      properties:
        clusters:
          type: array
          items: { $ref: "#/components/schemas/PreviewCluster" }
        datastores:
          type: array
          items: { $ref: "#/components/schemas/PreviewDatastore" }
        networks:
          type: array
          items: { $ref: "#/components/schemas/PreviewNetwork" }
        folder: { type: string }
        problems:
          type: array
          description: What stops a request here, for example a network with no subnet.
          items: { type: string }
    PreviewCluster:
      type: object
      required: [name, hosts, tags]
      properties:
        name: { type: string }
        hosts: { type: integer, description: Those its rule allows VMs on. }
        tags: { type: array, items: { type: string } }
        resource_pool: { type: string, description: The pool its rule puts VMs in; absent for the root pool. }
        strategy: { $ref: "#/components/schemas/PlacementStrategy" }
    PreviewDatastore:
      type: object
      required: [name, free_gb, clusters, tags]
      properties:
        name: { type: string }
        free_gb: { type: integer }
        clusters: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string } }
    PreviewNetwork:
      type: object
      required: [name, clusters, tags]
      properties:
        name: { type: string }
        clusters: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string } }
        subnet: { type: string, description: Empty when no mapping gives it a subnet. }
        dns_zone: { type: string }
        source: { type: string, enum: [manual, efficientip, nsx, rvav], description: "nsx: the port group of an NSX segment rvav made for a deployment (ADR-0028). rvav: addresses come from rvav's IP ranges (ADR-0063)." }
    NetworkMapping:
      type: object
      required: [network, subnet, gateway, dns_zone, dns_servers, source]
      properties:
        network: { type: string }
        subnet: { type: string, examples: [10.31.10.0/24] }
        gateway: { type: string }
        dns_zone: { type: string }
        dns_servers: { type: array, items: { type: string } }
        source:
          type: string
          enum: [manual, efficientip, nsx, rvav]
          description: "nsx: the port group of an NSX segment rvav made for a deployment, mapped to the subnet carved for it (ADR-0028); it goes with the deployment, and can't be changed by hand. rvav: the network has IP ranges in `vcenter` (ADR-0063): its VMs there take their addresses from them, not from EfficientIP, and rvav writes no DNS record for them; change it under `/admin/ip-ranges`."
        subnet_name: { type: string, description: The subnet's name in EfficientIP. }
        vcenter: { type: string, description: "The vCenter whose network has IP ranges, for source rvav; absent for the others, which apply to the network in every vCenter." }
        synced_at: { type: string, format: date-time }
        subnet6:
          type: string
          examples: ["2001:db8:310::/64"]
          description: "The network's IPv6 subnet in EfficientIP, for VMs whose blueprint says `ipv6: true` (ADR-0039): from an IPv6 subnet's `vsphere_network` class parameter, or set by hand. Absent when it has none."
        gateway6: { type: string, description: The IPv6 subnet's gateway. }
    NetworkMappingWrite:
      type: object
      required: [subnet, gateway, dns_zone]
      additionalProperties: false
      properties:
        subnet: { type: string }
        gateway: { type: string }
        dns_zone: { type: string }
        dns_servers: { type: array, items: { type: string } }
        subnet6: { type: string, description: "An IPv6 subnet in EfficientIP (ADR-0039), with `gateway6`; empty or absent for none." }
        gateway6: { type: string }
    IpRange:
      type: object
      required: [id, name, vcenter, network, cidr, start_address, end_address, gateway, dns_servers, dns_search_domains,
        dns_domain, excluded, size, used, taken, free, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string, examples: [Lab apps] }
        description: { type: string }
        vcenter: { type: string, description: The vCenter the network is in., examples: [vc01.corp.example] }
        network: { type: string, description: "The port group, or an NSX segment's port group.", examples: [dvpg-lab-vl510] }
        cidr: { type: string, description: The network's IPv4 subnet., examples: [10.51.0.0/24] }
        start_address: { type: string, examples: [10.51.0.10] }
        end_address: { type: string, examples: [10.51.0.200] }
        gateway: { type: string, examples: [10.51.0.1] }
        dns_servers: { type: array, items: { type: string } }
        dns_search_domains:
          type: array
          items: { type: string }
          description: The domains the guest searches, after its own DNS domain.
        dns_domain:
          type: string
          description: "The domain VMs on the network are named in (their FQDN); empty: the blueprint's guest domain. rvav writes no DNS record in it."
        excluded:
          type: array
          items: { type: string }
          description: Addresses never handed out, each one address or a span such as 10.51.0.50-10.51.0.59.
        size: { type: integer, description: "The addresses the range can hand out: its exclusions, the gateway, and the subnet's network and broadcast addresses left out." }
        used: { type: integer, description: The addresses the range gave VMs. }
        taken:
          type: integer
          description: "The addresses of the range it didn't give that it skips: those EfficientIP gave a deployment's VMs, those
            vCenter reports for its VMs, and its DNS servers."
        free: { type: integer, description: "`size`, less `used` and `taken`." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    IpRangeWrite:
      type: object
      required: [name, vcenter, network, cidr, start_address, end_address, gateway]
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        vcenter: { type: string }
        network: { type: string }
        cidr: { type: string }
        start_address: { type: string }
        end_address: { type: string }
        gateway: { type: string }
        dns_servers: { type: array, items: { type: string }, description: "Not addresses the range gives: exclude them." }
        dns_search_domains: { type: array, items: { type: string } }
        dns_domain: { type: string, description: Without a final dot., examples: [lab.corp.example] }
        excluded:
          type: array
          items: { type: string }
          description: "Each one address, or two joined by a dash, the first lower, as the range returns them: 10.51.0.12, or
            10.51.0.50-10.51.0.59, never 10.51.0.12-10.51.0.12."
    IpRangeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/IpRange" }
    IpAllocation:
      type: object
      required: [address, hostname, allocated_at]
      properties:
        address: { type: string, examples: [10.51.0.10] }
        hostname: { type: string, description: The VM's name. }
        fqdn: { type: string }
        adapter: { type: string, description: "The adapter's key in the blueprint; absent for the VM's first." }
        deployment_id: { type: string }
        deployment_name: { type: string }
        request_id: { type: string }
        allocated_at: { type: string, format: date-time }
    IpAllocationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/IpAllocation" }
    NetworkMappingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/NetworkMapping" }
    VsphereInventory:
      type: object
      required: [clusters, datastores, networks, hosts, resource_pools, datastore_clusters, tag_categories]
      properties:
        clusters:
          type: array
          items: { $ref: "#/components/schemas/InventoryCluster" }
        tag_categories:
          type: array
          items: { $ref: "#/components/schemas/InventoryTagCategory" }
        datastores:
          type: array
          items: { $ref: "#/components/schemas/InventoryDatastore" }
        networks:
          type: array
          items: { $ref: "#/components/schemas/InventoryNetwork" }
        hosts:
          type: array
          items: { $ref: "#/components/schemas/InventoryHost" }
        resource_pools:
          type: array
          items: { $ref: "#/components/schemas/InventoryResourcePool" }
        datastore_clusters:
          type: array
          items: { $ref: "#/components/schemas/InventoryDatastoreCluster" }
    InventoryTagCategory:
      type: object
      description: A vCenter's tag category VMs can take, and its tags.
      required: [vcenter, name, single, tags]
      properties:
        vcenter: { type: string }
        name: { type: string, examples: [backup] }
        single: { type: boolean, description: A VM takes one tag of it at most. }
        tags: { type: array, items: { type: string }, examples: [[daily, weekly]] }
    InventoryHost:
      type: object
      description: A cluster's ESXi host (ADR-0036).
      required: [vcenter, name, cluster, state, memory_free_gb, memory_total_gb, tags]
      properties:
        vcenter: { type: string }
        name: { type: string }
        cluster: { type: string }
        state:
          type: string
          enum: [connected, maintenance, disconnected]
          description: Only a connected host out of maintenance takes new VMs.
        memory_free_gb: { type: integer }
        memory_total_gb: { type: integer }
        tags: { type: array, items: { type: string }, description: "category/tag" }
    InventoryResourcePool:
      type: object
      description: A cluster's resource pool below its root one (ADR-0036).
      required: [vcenter, cluster, path, cpu_limit_mhz, memory_limit_gb, tags]
      properties:
        vcenter: { type: string }
        cluster: { type: string }
        path:
          type: string
          description: Where it is below the cluster's root pool, as a placement rule names it.
          examples: [rvav/dev]
        cpu_limit_mhz: { type: [integer, "null"], description: Null for no limit. }
        memory_limit_gb: { type: [integer, "null"], description: Null for no limit. }
        tags: { type: array, items: { type: string } }
    InventoryDatastoreCluster:
      type: object
      description: A datastore cluster (storage pod) and its datastores (ADR-0036).
      required: [vcenter, name, datastores, free_gb, capacity_gb, sdrs, tags]
      properties:
        vcenter: { type: string }
        name: { type: string }
        datastores: { type: array, items: { type: string } }
        free_gb: { type: integer }
        capacity_gb: { type: integer }
        sdrs: { type: boolean, description: "Storage DRS is on: rvav asks it which datastore a VM goes to." }
        tags: { type: array, items: { type: string } }
    InventoryCluster:
      type: object
      required: [vcenter, name, hosts, memory_free_gb, memory_reserved_gb, tags]
      properties:
        vcenter: { type: string }
        name: { type: string }
        hosts: { type: integer }
        memory_free_gb: { type: integer, description: "What vCenter last said is free." }
        memory_reserved_gb:
          type: integer
          description: >-
            Of that free memory, what the VMs of requests not built yet hold:
            placement counts it as taken (ADR-0036).
        tags: { type: array, items: { type: string }, description: "category/tag" }
    InventoryDatastore:
      type: object
      required: [vcenter, name, free_gb, capacity_gb, clusters, tags]
      properties:
        vcenter: { type: string }
        name: { type: string }
        free_gb: { type: integer }
        capacity_gb: { type: integer }
        clusters: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string } }
    InventoryNetwork:
      type: object
      required: [vcenter, name, clusters, tags]
      properties:
        vcenter: { type: string }
        name: { type: string }
        clusters: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string } }
    Offer:
      type: object
      description: Where something is offered; a null project or environment means all.
      properties:
        project_id: { type: [string, "null"] }
        environment:
          oneOf:
            - $ref: "#/components/schemas/EnvironmentKey"
            - type: "null"
    VmTemplate:
      type: object
      required: [key, label, sources, os_family, customization, description, user_data, constraints, linked_clone, cloudbase_init, offers]
      properties:
        key: { type: string, pattern: "^[a-z][a-z0-9-]{1,40}$" }
        label: { type: string, examples: [RHEL 9.4] }
        sources:
          type: array
          description: "Where it is, one per vCenter (ADR-0037). Placement chooses the vCenter and the cluster among the vCenters it has a source in; the VMs are cloned from that vCenter's."
          items: { $ref: "#/components/schemas/VmTemplateSource" }
        os_family: { type: string, enum: [linux, windows] }
        customization:
          type: string
          description: "A vCenter customization specification's name, the base of the guest customization (ADR-0024); when empty, rvav's own (hostname, network, time zone)."
        description: { type: string }
        user_data:
          type: string
          description: "User data of its own, a Go template as a blueprint's (ADR-0037): merged with the blueprint's. Its Linux VMs are then configured by cloud-init; a Windows template's needs `cloudbase_init`. Empty for none."
        constraints: { $ref: "#/components/schemas/TemplateConstraints" }
        linked_clone:
          type: boolean
          description: "Its VMs are linked clones of the vCenter template's current snapshot, unless the blueprint says otherwise (ADR-0037). Not for content library items."
        cloudbase_init:
          type: boolean
          description: "A Windows template with cloudbase-init and its VMware GuestInfo service: rvav gives its VMs their name, addresses, user and user data through guestinfo instead of a vCenter customization (ADR-0039). Not with `customization`."
        offers:
          type: array
          items: { $ref: "#/components/schemas/Offer" }
    TemplateConstraints:
      type: object
      required: [compute, storage, network]
      additionalProperties: false
      description: "Constraint tags its VMs get on top of the blueprint's (ADR-0035, ADR-0037): `[!]category/tag[:hard|:soft]`, without `${...}`."
      properties:
        compute: { type: array, maxItems: 20, items: { type: string, minLength: 1 }, examples: [[rvav-os/rhel9]] }
        storage: { type: array, maxItems: 20, items: { type: string, minLength: 1 } }
        network: { type: array, maxItems: 20, items: { type: string, minLength: 1 } }
    VmTemplateSource:
      type: object
      required: [vcenter, template, content_library]
      properties:
        vcenter:
          type: string
          description: "The vCenter: the vCenter integration's, or one added in vCenters (ADR-0024)."
          examples: [vc01.corp.example]
        template:
          type: string
          description: A template's name in that vCenter, or an item's name in `content_library`.
          examples: [tpl-rhel9.4-2026.10]
        content_library:
          type: string
          description: A content library of that vCenter whose item (VM template or OVF) `template` is (ADR-0024); empty for a VM template.
        in_inventory: { type: boolean, readOnly: true, description: That vCenter has it now. }
    VmTemplateSourceWrite:
      type: object
      required: [vcenter, template]
      additionalProperties: false
      properties:
        vcenter: { type: string, description: "A vCenter's name; empty for the vCenter integration's." }
        template: { type: string, minLength: 1 }
        content_library: { type: string }
    VmTemplateWrite:
      type: object
      required: [key, label, sources, os_family]
      additionalProperties: false
      properties:
        key: { type: string, pattern: "^[a-z][a-z0-9-]{1,40}$" }
        label: { type: string, minLength: 1, maxLength: 80 }
        sources:
          type: array
          maxItems: 50
          description: One per vCenter.
          items: { $ref: "#/components/schemas/VmTemplateSourceWrite" }
        os_family: { type: string, enum: [linux, windows] }
        customization: { type: string }
        description: { type: string, maxLength: 500 }
        user_data: { type: string, maxLength: 65536 }
        constraints: { $ref: "#/components/schemas/TemplateConstraints" }
        linked_clone: { type: boolean }
        cloudbase_init: { type: boolean }
        offers: { type: array, items: { $ref: "#/components/schemas/Offer" } }
    VmTemplateList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/VmTemplate" }
    SizePreset:
      type: object
      required: [key, label, vcpu, memory_gb, disk_gb, offers]
      properties:
        key: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9-]{0,15}$", examples: [M] }
        label: { type: string, examples: [Medium] }
        vcpu: { type: integer, minimum: 1, maximum: 128 }
        memory_gb: { type: integer, minimum: 1, maximum: 2048 }
        disk_gb: { type: integer, minimum: 1, maximum: 65536 }
        offers: { type: array, items: { $ref: "#/components/schemas/Offer" } }
    SizePresetWrite:
      type: object
      required: [key, label, vcpu, memory_gb, disk_gb]
      additionalProperties: false
      properties:
        key: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9-]{0,15}$" }
        label: { type: string, minLength: 1, maxLength: 40 }
        vcpu: { type: integer, minimum: 1, maximum: 128 }
        memory_gb: { type: integer, minimum: 1, maximum: 2048 }
        disk_gb: { type: integer, minimum: 1, maximum: 65536 }
        offers: { type: array, items: { $ref: "#/components/schemas/Offer" } }
    SizePresetList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SizePreset" }
    NamingPolicy:
      type: object
      required: [id, name, template, counter, start, increment, offers]
      properties:
        id: { type: string }
        name: { type: string }
        template:
          type: string
          description: |
            `{project}`, `{environment}`, `{role}` (an input), `{seq:03}` (the
            counter, zero-padded) and any input as `{inputs.x}`.
          examples: ["{project}-{environment}-{role}{seq:03}"]
        counter:
          type: string
          enum: [prefix, policy]
          description: One counter per name prefix (web-dev-app), or one for everything the policy names.
        start:
          type: integer
          description: |
            The counter's first value. A counter in use goes on from its last
            value, and jumps to `start` when it is behind it.
        increment:
          type: integer
          description: How much the counter moves from one name to the next.
        offers:
          type: array
          description: Where it applies; the most specific one wins (project and environment, project, environment, all).
          items: { $ref: "#/components/schemas/Offer" }
    NamingPolicyWrite:
      type: object
      required: [name, template]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        template: { type: string, minLength: 1, maxLength: 120 }
        counter: { type: string, enum: [prefix, policy], default: prefix }
        start: { type: integer, minimum: 0, maximum: 999999999, default: 1 }
        increment: { type: integer, minimum: 1, maximum: 1000, default: 1 }
        offers: { type: array, items: { $ref: "#/components/schemas/Offer" } }
    NamingPolicyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/NamingPolicy" }
    NamingPreviewQuery:
      type: object
      required: [template, project_id, environment]
      additionalProperties: false
