          $ref: "#/components/schemas/PolicyEnforcement"
          description: |
            Hard (when absent) refuses what goes over a limit. Soft warns
            the requester, who may go on by accepting the warning.
        deployments_per_user:
          type: [integer, "null"]
          minimum: 0
          description: |
            How many deployments each user may own in the project: those
