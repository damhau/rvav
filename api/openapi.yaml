          items: { $ref: "#/components/schemas/UserRef" }
    Day2PolicyWrite:
      type: object
      required: [name, effect]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        reason: { type: string }
        priority: { type: integer, default: 100 }
        actions:
          type: array
          description: Action keys or patterns (delete, snapshot_*, awx.*, *).
          items: { type: string }
        roles:
          type: array
          description: owner, viewer, member, project-admin, supervisor, admin, or a custom role's key; empty for anyone.
          items: { type: string }
        condition: { type: string, default: "true" }
        effect: { type: string, enum: [allow, deny, approval] }
        levels: { type: array, items: { $ref: "#/components/schemas/ApprovalLevel" } }
        project_id: { type: [string, "null"] }
        enabled: { type: boolean, default: true }
        enforcement:
          $ref: "#/components/schemas/PolicyEnforcement"
          description: |
            Hard (when absent) denies or asks for approval. Soft, for a deny
            or an approval policy only, warns the requester, who may go on.
            A soft global policy doesn't win over a project's (ADR-0045).
    Day2Policy:
      allOf:
        - $ref: "#/components/schemas/Day2PolicyWrite"
        - type: object
          required: [id, priority, actions, roles, condition, enabled, reason, set_by_admin]
          properties:
            id: { type: string }
            set_by_admin:
              type: boolean
              description: |
                An administrator (`policies.manage`) wrote it last: a
                project's admins read it but don't change or remove it
                (ADR-0045). False for a project admin's own.
    Day2PolicyList:
      type: object
      required: [items, level_roles, policy_roles, users]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Day2Policy" }
        level_roles:
          type: array
          description: The roles a level may name, those given in projects.
          items: { $ref: "#/components/schemas/RoleRef" }
        policy_roles:
          type: array
          description: |
            The roles a policy's `roles` may name, with their names: the
