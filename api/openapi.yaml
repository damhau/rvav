        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      operationId: createLeaseRule
      summary: Add a lease rule
      description: |
        A global rule needs `policies.manage`. A project's, that or
        `project.policies.manage` in the project (project admins): a
        project admin's rule can't give more than the environment's lease,
        or the project's override an administrator set, each refused with
        the code `looser` (ADR-0048); where neither gives a lease, any
        lease is stricter, soft or hard. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeaseRuleWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeaseRule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /admin/lease-rules/{id}:
    parameters:
      - { $ref: "#/components/parameters/IdPath" }
    put:
      tags: [admin]
      operationId: updateLeaseRule
      summary: Change a lease rule
      description: |
        As adding one; a project's rule an administrator set
        (`set_by_admin`) is refused (403) to its project admins. Audited.
