  /admin/lease-policies:
    get:
      tags: [admin]
      operationId: listLeasePolicies
      summary: Lease policies per environment, and projects' overrides
      description: |
        With `policies.read`, every policy. With `project.policies.manage`
        in projects (project admins), the global policies and those of
        these projects (ADR-0045).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeasePolicyList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [admin]
      operationId: setLeasePolicy
      summary: Set an environment's lease policy, or a project's override of it
      description: |
        An environment's policy needs `policies.manage`. A project's
        override, that or `project.policies.manage` in the project: a
        project admin's override can't give more than the environment's
        lease (more days, more extensions or grace days, no lease, a
        gentler end), each refused with the code `looser` (ADR-0045), and
        can't replace an override an administrator set (403). Where the
        environment gives no lease, its deployments don't expire: any
        lease is stricter, soft or hard. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeasePolicy" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeasePolicy" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [admin]
      operationId: deleteLeasePolicy
      summary: Remove a project's override (an environment's own policy stays)
      description: |
        `policies.manage`, or `project.policies.manage` in the project for
        an override a project admin set.
      parameters:
        - name: environment
          in: query
          required: true
          schema: { $ref: "#/components/schemas/EnvironmentKey" }
        - { $ref: "#/components/parameters/ProjectIdQueryRequired" }
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

